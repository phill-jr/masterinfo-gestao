/* ── tags ─────────────────────────────────────────────────────────
   Texto livre. A cor sai do próprio nome, então a mesma tag tem
   sempre a mesma cor sem ninguém precisar escolher. */
const CORES_TAG = ['#6366f1','#10b981','#f59e0b','#ec4899','#06b6d4','#8b5cf6','#ef4444','#14b8a6'];
function corTag(t) {
  let h = 0;
  for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return CORES_TAG[h % CORES_TAG.length];
}
const leTags = txt => {
  const l = String(txt || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
  return l.length ? [...new Set(l)] : null;
};
const chipsTags = tags => !tags?.length ? '' :
  `<div class="tags">${tags.map(t => {
    const c = corTag(t);
    return `<span style="color:${c};background:${c}22;border-color:${c}44">${esc(t)}</span>`;
  }).join('')}</div>`;
/* ── painel de métricas ───────────────────────────────────────────
   Cada cartão é uma linha de metricas_painel. Em vez de campo de
   fórmula livre — que parece flexível e falha calado — a métrica é
   montada por partes: o que medir, em que período, filtrando o quê.
   O alcance é o mesmo e o sistema consegue validar. */
const TIPOS_METRICA = {
  percentual: { t:'% concluído',        d:'Quanto do previsto foi fechado' },
  abertas:    { t:'Em aberto',          d:'Quantas ainda faltam' },
  previstas:  { t:'Previstas',          d:'Quantas existem no período' },
  concluidas: { t:'Concluídas',         d:'Quantas foram fechadas' },
  atrasadas:  { t:'Atrasadas',          d:'Passaram do prazo e não fecharam' },
  dia_pico:   { t:'Dia mais carregado', d:'Onde a semana concentra' },
  sequencia:  { t:'Sequência',          d:'Dias seguidos fechando 100%' }
};

function calculaMetrica(m, ocorrencias) {
  const ehRotina = a => !!a.acao_modelo_id || a.origem === 'recorrencia';
  const base = ocorrencias.filter(a =>
    a.status !== 'cancelada' &&
    (m.escopo !== 'minha' || !eu || a.responsavel_id === eu.id) &&
    (m.natureza === 'tudo' || (m.natureza === 'rotina') === ehRotina(a)) &&
    (!m.setor_id || a.setor_id === m.setor_id) &&
    (!m.tag || (a.tags || []).includes(m.tag)));

  const ini = m.periodo === 'hoje' ? hoje()
            : m.periodo === 'semana' ? seg() : hoje().slice(0, 8) + '01';
  const fim = m.periodo === 'hoje' ? hoje()
            : m.periodo === 'semana'
              ? new Date(new Date(seg() + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10)
              : new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).toISOString().slice(0, 10);
  const dentro = base.filter(a => a.prazo >= ini && a.prazo <= fim);
  const feitas = dentro.filter(a => a.status === 'concluida');

  switch (m.tipo) {
    case 'percentual':
      return { valor: dentro.length ? Math.round(100 * feitas.length / dentro.length) : null,
               sufixo: '%', rodape: `${feitas.length} de ${dentro.length}` };
    case 'abertas':
      return { valor: dentro.length - feitas.length, rodape: `de ${dentro.length} previstas` };
    case 'previstas':  return { valor: dentro.length };
    case 'concluidas': return { valor: feitas.length, rodape: `de ${dentro.length}` };
    case 'atrasadas': {
      const at = base.filter(a => a.status !== 'concluida' && a.prazo < hoje());
      return { valor: at.length, invertido: true,
               rodape: at.length ? 'a mais antiga: ' + dt(at.map(a => a.prazo).sort()[0]) : 'nada vencido' };
    }
    case 'dia_pico': {
      const porDia = ORDEM_SEMANA.map(d => ({ d,
        n: dentro.filter(a => new Date(a.prazo + 'T12:00:00').getDay() === d).length }));
      const topo = porDia.reduce((a, b) => b.n > a.n ? b : a, porDia[0]);
      return { texto: topo.n ? NOME_DIA[topo.d] : '—', rodape: `${topo.n} tarefa(s)` };
    }
    case 'sequencia': {
      let n = 0;
      for (let i = 0; i < 60; i++) {
        const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
        const doDia = base.filter(a => a.prazo === d);
        if (!doDia.length) continue;
        if (doDia.every(a => a.status === 'concluida')) n++; else break;
      }
      return { valor: n, rodape: n === 1 ? 'dia' : 'dias' };
    }
  }
  return { valor: null };
}

function painelMetricas(ocorrencias) {
  const ativas = cache.metricas.filter(m => m.ativo);
  if (!cache.temMetricas) return '';
  if (!ativas.length) return `<div class="card"><div class="cb sm2">
    Nenhuma métrica ativa. Escolha o que acompanhar em
    <b>Configurações → Painel</b>.</div></div>`;

  return `<div class="tiles stg">${ativas.map(m => {
    const r = calculaMetrica(m, ocorrencias);
    const v = r.texto ?? (r.valor == null ? '—' : r.valor + (r.sufixo || ''));
    let cls = '';
    if (m.meta != null && r.valor != null) {
      const bate = r.invertido ? r.valor <= m.meta : r.valor >= m.meta;
      cls = bate ? 'ok' : (r.invertido ? 'bad' : r.valor >= m.meta * 0.6 ? 'warn' : 'bad');
    } else if (r.invertido && r.valor > 0) cls = 'warn';
    return `<div class="tile ${cls}">
      <div class="ic">${ico(m.icone || 'check', 18)}</div>
      <div class="n" style="${r.texto ? 'font-size:22px' : ''}">${esc(v)}</div>
      <div class="l">${esc(m.nome)}</div>
      <div class="h">${esc(r.rodape || '')}${m.meta != null ? ` · meta ${m.meta}${r.sufixo || ''}` : ''}</div>
      ${m.meta != null && r.valor != null && !r.invertido ? `<div class="bar" style="margin-top:9px">
        <i class="${cls}" style="width:${Math.min(100, 100 * r.valor / m.meta)}%"></i></div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

/* ── calendário das rotinas ───────────────────────────────────────
   Mesma regra de recorrência que o banco usa para gerar o dia. Se as
   duas divergirem, o calendário vira ficção. */
function caiNoDia(m, iso) {
  const d = new Date(iso + 'T12:00:00'), dow = d.getDay(), dia = d.getDate();
  switch (m.recorrencia) {
    case 'diaria':     return true;
    case 'dias_uteis': return dow >= 1 && dow <= 5;
    case 'semanal':    return (m.recorrencia_dias || []).includes(dow);
    case 'quinzenal':
      if (!m.recorrencia_inicio || iso < m.recorrencia_inicio) return false;
      return Math.round((d - new Date(m.recorrencia_inicio + 'T12:00:00')) / 864e5) % 14 === 0;
    case 'mensal': {
      const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      return dia === Math.min(m.recorrencia_dia_mes || 1, ultimo);
    }
  }
  return false;
}

let _calModelos = [];

function calendario(modelos, mesRef) {
  _calModelos = modelos;
  const hj = hoje();
  const [ano, mes] = (mesRef || hj.slice(0, 7)).split('-').map(Number);
  const primeiro = new Date(ano, mes - 1, 1);
  const ultimo   = new Date(ano, mes, 0).getDate();
  // Segunda como primeiro dia da semana
  const desloca  = (primeiro.getDay() + 6) % 7;
  const iso = d => `${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  const passo = n => {
    const d = new Date(ano, mes - 1 + n, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}`;
  };
  const titulo = primeiro.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });

  const celulas = [];
  for (let i = 0; i < desloca; i++) celulas.push('<div class="cel fora"></div>');
  for (let d = 1; d <= ultimo; d++) {
    const data = iso(d);
    const doDia = modelos.filter(m => caiNoDia(m, data))
      .sort((a, b) => (a.hora || '99') > (b.hora || '99') ? 1 : -1);
    const fds = [0, 6].includes(new Date(data + 'T12:00:00').getDay());
    celulas.push(`<div class="cel ${data === hj ? 'hoje' : ''} ${fds ? 'fds' : ''} ${doDia.length ? 'temAlgo' : ''}"
      ${doDia.length ? `data-act="dia" data-d="${data}"` : ''}>
      <div class="num">${d}${data === hj ? '<span>hoje</span>' : ''}</div>
      ${doDia.slice(0, 3).map(m => `<div class="ev" title="${esc(m.titulo)}">
        ${m.hora ? `<b>${hm(m.hora)}</b> ` : ''}${esc(m.titulo)}</div>`).join('')}
      ${doDia.length > 3 ? `<div class="mais">+${doDia.length - 3}</div>` : ''}</div>`);
  }

  return `<div class="card"><div class="ch">
      <button class="ib" data-act="mes" data-v="${passo(-1)}">${ico('arrowL',16)}</button>
      <h3 style="min-width:190px;text-align:center">${titulo[0].toUpperCase() + titulo.slice(1)}</h3>
      <button class="ib" data-act="mes" data-v="${passo(1)}">${ico('arrowR',16)}</button>
      <div class="push">
        <button class="btn sm ghost" data-act="mes" data-v="${hj.slice(0,7)}">Hoje</button></div></div>
    <div class="cb">
      <div class="cal">
        ${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(n => `<div class="cab">${n}</div>`).join('')}
        ${celulas.join('')}
      </div>
      <div class="sm2" style="margin-top:12px">Mostra onde cada rotina cai, incluindo as mensais e as
        quinzenais. Clique num dia para ver a lista completa.</div>
    </div></div>`;
}

function detalheDoDia(data) {
  const lista = _calModelos.filter(m => caiNoDia(m, data))
    .sort((a, b) => (a.hora || '99') > (b.hora || '99') ? 1 : -1);
  const d = new Date(data + 'T12:00:00');
  const t = d.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
  modal({
    titulo: t[0].toUpperCase() + t.slice(1), ok: 'Fechar', largura: 460,
    onOk: () => true,
    corpo: lista.map(m => `<div style="display:flex;gap:12px;align-items:flex-start;
        padding:11px 0;border-bottom:1px solid var(--line)">
        <span class="pill ${m.hora ? 'ac' : 'dim'}" style="min-width:56px;justify-content:center">
          ${m.hora ? hm(m.hora) : '—'}</span>
        <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px">${esc(m.titulo)}</div>
          <div class="sm2">${esc(nomeUser(m.responsavel_id))}${
            m.canal_id ? ' · ' + esc(nomeCanal(m.canal_id)) : ''}</div>
          ${chipsTags(m.tags)}</div></div>`).join('')
      || '<p class="sm2">Nada previsto.</p>'
  });
}

/* ── Rotina semanal ───────────────────────────────────────────────
   Uma tela só para a rotina, em quatro alturas de voo:

     Semana      as tarefas dos sete dias, para marcar
     Dia         a fila de hoje, com progresso e sequência
     Rotinas     os moldes que geram tudo isso
     Calendário  o mês, onde as mensais aparecem

   Antes eram duas telas: o Checklist marcava e a Rotina semanal
   planejava. Na prática ninguém separa as duas coisas — você olha a
   semana e já quer marcar o que saiu. O kanban por isso mostra
   TAREFA, não modelo: modelo não se marca, e um quadradinho que não
   marca nada é pior do que não ter quadradinho. Onde o dia ainda não
   foi gerado entra a previsão tracejada — a pergunta "como é a minha
   quinta-feira?" continua respondida. */
R.rotinaSemanal = {
  label: 'Rotina semanal', curto: 'Rotina semanal', icone: 'cal', titulo: 'Rotina semanal',
  filtro: { vista:'semana', quem:'minha', rec:'tudo', tag:'',
            periodo:'hoje', data:null, semana:null, mes:null },
  async dados() {
    const f = R.rotinaSemanal.filtro;
    const janela = new Date(Date.now() - 59 * 864e5).toISOString().slice(0, 10);
    /* A semana anda para trás. Se a que está aberta for mais antiga
       que a janela padrão, a busca começa nela — senão o bloco viria
       vazio e pareceria que a semana não teve nada. */
    const de = f.semana && f.semana < janela ? f.semana : janela;
    const [modelos, acoes, pends] = await Promise.all([
      /* Inclusive as pausadas: elas não geram mais nada, mas são quem
         sabe dizer de qual frequência veio a tarefa antiga. */
      q('acoes', x => x.neq('recorrencia', 'nenhuma')),
      q('acoes', x => x.eq('recorrencia', 'nenhuma').not('prazo', 'is', null).gte('prazo', de).order('prazo')),
      /* Pendências da semana: têm semana_de e não têm dia. Vivem na
         faixa horizontal do topo, fora dos blocos. */
      cache.temSemana
        ? q('acoes', x => x.eq('recorrencia', 'nenhuma').not('semana_de', 'is', null).gte('semana_de', de).order('created_at'))
        : Promise.resolve(null)
    ]);
    return { modelos, acoes, pends };
  },
  render({ modelos, acoes, pends }) {
    const f = R.rotinaSemanal.filtro;
    if (f.quem === 'minha' && !eu) f.quem = 'todos';
    if (f.periodo === 'dia' && !f.data) f.data = hoje();
    const hojeDia = new Date().getDay();

    /* "De quem": além de minhas/do time, quem tem liderados pode olhar
       só a semana deles — é a visão de acompanhamento do líder. */
    const liderados = cache.temAcesso && eu
      ? cache.usuarios.filter(u => u.ativo && u.lider_id === eu.id) : [];
    const idsLiderados = new Set(liderados.map(u => u.id));
    if (f.quem === 'liderados' && !liderados.length) f.quem = 'minha';
    /* Além de minha/liderados/todos, f.quem pode ser o id de uma
       pessoa (opção do admin). Filtro persistido apontando para quem
       saiu do time volta para "minhas" em vez de mostrar o vazio. */
    if (!['minha', 'liderados', 'todos'].includes(f.quem)
        && !cache.usuarios.some(u => u.id === f.quem && u.ativo)) f.quem = 'minha';
    const casaQuem = id =>
        f.quem === 'minha'     ? (!eu || id === eu.id)
      : f.quem === 'liderados' ? idsLiderados.has(id)
      : f.quem === 'todos'     ? true
      : id === f.quem;

    // Veio de uma rotina recorrente, ou apareceu solta no dia?
    const ehRotina = a => !!a.acao_modelo_id || a.origem === 'recorrencia';

    /* A tarefa guarda só o id do modelo; a frequência mora no modelo.
       Sem esse mapa, "só as semanais" seria impossível de filtrar. */
    const freqDo = {};
    modelos.forEach(m => { freqDo[m.id] = m.recorrencia; });
    const freq = a => a.acao_modelo_id ? freqDo[a.acao_modelo_id] || null : null;
    const casaRec = a =>
        f.rec === 'tudo'    ? true
      : f.rec === 'pontual' ? !ehRotina(a)
      : f.rec === 'rotina'  ? ehRotina(a)
      : freq(a) === f.rec;
    // Mesmo filtro, aplicado no modelo — é o que a previsão usa
    const casaRecModelo = m =>
        f.rec === 'pontual' ? false
      : (f.rec === 'tudo' || f.rec === 'rotina') ? true
      : m.recorrencia === f.rec;

    const meuModelo = m => casaQuem(m.responsavel_id) &&
                           (!f.tag || (m.tags || []).includes(f.tag));

    // Só as ativas planejam a semana; as pausadas ficam para o histórico
    const ativas   = modelos.filter(m => m.status === 'aberta' && meuModelo(m));
    const semanais = ativas.filter(m => diasDaRotina(m));
    const mensais  = ativas.filter(m => !diasDaRotina(m));

    const minhas = acoes.filter(a =>
      casaQuem(a.responsavel_id) &&
      (!f.tag || (a.tags || []).includes(f.tag)) &&
      casaRec(a) &&
      a.status !== 'cancelada');

    // Pendências da semana passam pelos mesmos filtros das tarefas
    const pendsVivas = (pends || []).filter(a =>
      casaQuem(a.responsavel_id) &&
      (!f.tag || (a.tags || []).includes(f.tag)) &&
      casaRec(a) &&
      a.status !== 'cancelada');

    const tagsUsadas = [...new Set([...minhas, ...ativas].flatMap(x => x.tags || []))].sort();
    const ordena = l => l.sort((a, b) =>
      emMinuto(a.hora) - emMinuto(b.hora) || (a.titulo > b.titulo ? 1 : -1));

    /* ── topo comum às quatro visões ───────────────────────────── */
    const topo = `<div class="head"><div><h2>Rotina semanal</h2>
        <div class="sub">A rotina e o que já saiu dela, na mesma tela.
          Marque na semana, planeje nas rotinas.</div></div>
        <div class="push">
          ${dd('Visão', 'vista', [
            { v:'semana',     t:'Semana',     i:'grid',    d:'As tarefas dos sete dias, para marcar' },
            { v:'dia',        t:'Dia',        i:'check',   d:'A fila de hoje, com progresso e sequência' },
            { v:'rotinas',    t:'Rotinas',    i:'refresh', d:'Os moldes que geram as tarefas' },
            { v:'calendario', t:'Calendário', i:'cal',     d:'O mês inteiro, com as mensais' }
          ], f.vista)}
          ${dd(null, 'gerar-quando', [
            { v:'hoje',   t:'Hoje',            i:'clock' },
            { v:'amanha', t:'Amanhã',          i:'arrowR', d:'Deixar o dia seguinte pronto' },
            { v:'semana', t:'Esta semana',     i:'cal',    d:'De segunda a domingo' },
            { v:'prox',   t:'Próximos 7 dias', i:'refresh' },
            { v:'dia',    t:'O dia escolhido', i:'target', d:'Usa a data do filtro' }
          ], '', { fixo:'Gerar rotinas', icone:'zap' })}
          <button class="btn ghost" data-act="nova">${ico('refresh',15)}Rotina</button>
          <button class="btn pontual" data-act="nova-pontual">${ico('zap',15)}Tarefa pontual</button>
        </div></div>

      <div class="filtros">
        ${f.vista === 'dia' ? dd('Período', 'periodo', [
          { v:'hoje', t:'Hoje', i:'clock' },
          { v:'semana', t:'Esta semana', i:'cal' },
          { v:'mes', t:'Este mês', i:'chart' },
          { v:'dia', t:'Um dia específico', i:'cal', d:'Ver com antecedência como vai ser' }
        ], f.periodo) : ''}
        ${f.vista === 'dia' && f.periodo === 'dia' ? `<input type="date" data-act="escolhe-data"
          value="${esc(f.data || hoje())}" style="width:auto;font-weight:600">
          <span class="pill ${f.data === hoje() ? 'ac' : f.data > hoje() ? 'info' : 'dim'}">${
            f.data === hoje() ? 'hoje'
            : f.data > hoje() ? 'daqui a ' + Math.round((new Date(f.data + 'T12:00:00') - new Date(hoje() + 'T12:00:00')) / 864e5) + ' dia(s)'
            : 'passado'}</span>` : ''}
        ${dd('De quem', 'quem', [
          { v:'minha', t:'Minhas', i:'user' },
          ...(liderados.length ? [{ v:'liderados', t:'Dos meus liderados', i:'users',
            d: liderados.map(u => u.nome.split(' ')[0]).slice(0, 4).join(', ')
               + (liderados.length > 4 ? '…' : '') }] : []),
          { v:'todos', t:'Do time', i:'users' },
          /* Admin enxerga e alimenta a semana de qualquer pessoa: as
             tarefas criadas com o filtro ativo já nascem no nome dela. */
          ...(ehAdmin() ? cache.usuarios.filter(u => u.ativo && u.id !== eu?.id)
            .map(u => ({ v:u.id, t:u.nome, i:'user' })) : [])
        ], f.quem)}
        ${dd('Recorrência', 'rec', [
          { v:'tudo',       t:'Rotina e pontual', i:'grid' },
          { v:'rotina',     t:'Só rotina',        i:'refresh', d:'Qualquer frequência' },
          { v:'pontual',    t:'Só pontual',       i:'zap',     d:'O que não veio de rotina' },
          { v:'diaria',     t:'Todo dia',         i:'clock' },
          { v:'dias_uteis', t:'Dias úteis',       i:'cal',     d:'Segunda a sexta' },
          { v:'semanal',    t:'Semanal',          i:'cal',     d:'Nos dias fixos da rotina' },
          { v:'quinzenal',  t:'Quinzenal',        i:'refresh' },
          { v:'mensal',     t:'Mensal',           i:'chart' }
        ], f.rec)}
        ${cache.temTags && tagsUsadas.length ? dd('Tag', 'tag',
          [{ v:'', t:'Todas as tags' }, ...tagsUsadas.map(t => ({ v:t, t }))], f.tag) : ''}
      </div>

      ${!cache.temHora ? `<div class="card"><div class="cb"><div class="err" style="display:block">
        O campo de horário ainda não existe no banco — as rotinas aparecem sem hora.
        Para ligar, rode <b>CORRECAO-05.sql</b> (é uma linha só).</div></div></div>` : ''}`;

    /* Cartão de tarefa dos blocos: o quadradinho na frente é o que
       diferencia esta tela da antiga — aqui se marca, não só se olha. */
    const cartaoTarefa = a => {
      const feito = a.status === 'concluida';
      const rot = ehRotina(a);
      return `<div class="k tarefa ${feito ? 'feito' : ''} ${rot ? '' : 'pt'}"
        data-act="editar-tarefa" data-id="${a.id}" title="Clique para editar">
        <button class="tick ${rot ? '' : 'pt'} ${feito ? 'done' : ''}" data-act="virar" data-id="${a.id}"
          data-v="${feito ? 'aberta' : 'concluida'}"
          title="${feito ? 'Desmarcar' : 'Marcar como feita'}">${ico('check', 12)}</button>
        <div class="g"><div class="t">${esc(a.titulo)}</div>
          <div class="m">${a.hora ? hm(a.hora) + ' · ' : ''}${esc(nomeUser(a.responsavel_id))}${
            a.canal_id ? ' · ' + esc(nomeCanal(a.canal_id)) : ''}</div>
          ${a.prazo < hoje() && !feito ? '<span class="pill bad" style="margin-top:5px">atrasada</span>' : ''}
        </div>
        <button class="del" data-act="excluir-tarefa" data-id="${a.id}"
          data-t="${esc(a.titulo)}" title="Excluir">${ico('trash', 12)}</button></div>`;
    };

    /* Cartão da pendência de semana: mesma anatomia, deitado na faixa.
       Não tem dia — por isso o metadado mostra a pessoa, não a hora. */
    const cartaoPend = a => {
      const feito = a.status === 'concluida';
      return `<div class="k tarefa pend ${feito ? 'feito' : ''}"
        data-act="editar-pendencia" data-id="${a.id}" title="Clique para editar">
        <button class="tick pt ${feito ? 'done' : ''}" data-act="virar" data-id="${a.id}"
          data-v="${feito ? 'aberta' : 'concluida'}"
          title="${feito ? 'Desmarcar' : 'Marcar como feita'}">${ico('check', 12)}</button>
        <div class="g"><div class="t">${esc(a.titulo)}</div>
          <div class="m">${esc(nomeUser(a.responsavel_id))}${
            a.canal_id ? ' · ' + esc(nomeCanal(a.canal_id)) : ''}</div></div>
        <button class="del" data-act="excluir-tarefa" data-id="${a.id}"
          data-t="${esc(a.titulo)}" title="Excluir">${ico('trash', 12)}</button></div>`;
    };

    /* ═══ VISÃO SEMANA — os sete blocos, com check ═══════════════ */
    if (f.vista === 'semana') {
      const base = f.semana || seg();
      const diaISO = n => new Date(new Date(base + 'T12:00:00').getTime() + n * 864e5)
        .toISOString().slice(0, 10);
      const diasSem = [...Array(7)].map((_, i) => diaISO(i));
      const daSemana = minhas.filter(a => a.prazo >= diasSem[0] && a.prazo <= diasSem[6]);
      const okSem = daSemana.filter(a => a.status === 'concluida').length;
      const atrasSem = daSemana.filter(a => a.status !== 'concluida' && a.prazo < hoje()).length;
      const ehEsta = base === seg();

      const doBloco = d => ordena(daSemana.filter(a => a.prazo === d));
      // Dia ainda não gerado: mostra o que as rotinas vão criar ali
      const prevBloco = d => ativas
        .filter(m => caiNoDia(m, d) && casaRecModelo(m))
        .sort((a, b) => emMinuto(a.hora) - emMinuto(b.hora));

      const colunas = diasSem.map(d => {
        const lst = doBloco(d);
        const ok = lst.filter(a => a.status === 'concluida').length;
        const dow = new Date(d + 'T12:00:00').getDay();
        const prev = lst.length ? [] : prevBloco(d);
        return `<div class="col ${d === hoje() ? 'hoje' : ''} ${dow === 0 || dow === 6 ? 'fds' : ''}">
          <h4 data-act="abrir-dia" data-d="${d}" style="cursor:pointer" title="Abrir este dia">
            ${NOME_DIA[dow].slice(0, 3)} ${dt(d)}
            ${d === hoje() ? '<span class="agora">hoje</span>' : ''}
            <span>${lst.length ? ok + '/' + lst.length : prev.length ? '~' + prev.length : '0'}</span></h4>
          <div class="carga"><i style="width:${lst.length ? Math.round(100 * ok / lst.length) : 0}%"></i></div>
          ${lst.length ? lst.map(cartaoTarefa).join('')
            : prev.length ? `${prev.map(m => `<div class="k prev tarefa">
                  <button class="tick" data-act="checar-previsto" data-d="${d}" data-m="${m.id}"
                    style="border-style:dashed" title="Marcar como feita — cria o dia antes">${ico('check', 12)}</button>
                  <div class="g"><div class="t">${esc(m.titulo)}</div>
                    <div class="m">${m.hora ? hm(m.hora) + ' · ' : ''}prevista</div></div></div>`).join('')}
                <button class="btn sm ghost bl" data-act="gerar-um-dia" data-d="${d}">${ico('zap',13)}Gerar o dia</button>`
            : `<div class="livre">${dow === 0 || dow === 6 ? 'folga' : 'dia livre'}</div>`}
          <button class="btn sm ghost bl" data-act="nova-no-dia" data-d="${d}">${ico('plus',13)}Tarefa</button>
        </div>`;
      }).join('');

      return topo + `
        ${cache.temMetricas ? painelMetricas(acoes) + `<div class="sm2" style="margin:-8px 0 20px">
          Estes números são configuráveis em
          <b data-act="ir-painel" style="cursor:pointer;color:var(--ac)">Configurações › Painel</b>.</div>` : ''}

        <div class="card"><div class="ch">
          <button class="ib" data-act="sem-passo" data-v="-1" title="Semana anterior">${ico('arrowL',16)}</button>
          <h3 style="min-width:200px;text-align:center">${dt(diasSem[0])} a ${dt(diasSem[6])}</h3>
          <button class="ib" data-act="sem-passo" data-v="1" title="Próxima semana">${ico('arrowR',16)}</button>
          <div class="push">
            <span class="pill ${daSemana.length && okSem === daSemana.length ? 'ok' : 'dim'}">${okSem}/${daSemana.length} feitas</span>
            ${atrasSem ? `<span class="pill bad">${atrasSem} atrasada(s)</span>` : ''}
            ${ehEsta ? '<span class="pill ac">semana atual</span>'
              : `<button class="btn sm ghost" data-act="sem-passo" data-v="0">Esta semana</button>`}
            <button class="btn sm" data-act="gerar-esta-semana">${ico('zap',13)}Gerar a semana</button>
          </div></div></div>

        ${(() => {
          /* ── Pendências da semana: a faixa horizontal ─────────────
             O que é DESTA semana mas não tem dia certo fica aqui em
             cima, deitado; os blocos verticais embaixo seguem sendo o
             dia a dia. Marcar um dia na pendência move o cartão para o
             bloco — o caminho natural de planejar e depois agendar. */
          if (!cache.temSemana) return `<div class="sm2" style="margin-bottom:14px">
            Pendências da semana (tarefas sem dia certo) precisam do banco atualizado —
            rode <b>CORRECAO-16.sql</b> uma vez.</div>`;
          const daPend = pendsVivas.filter(a => a.semana_de === base);
          const okPend = daPend.filter(a => a.status === 'concluida').length;
          return `<div class="card pendsem"><div class="ch">
            <h3>Pendências da semana</h3>
            <span class="pill dim">sem dia certo</span>
            <div class="push">
              ${daPend.length ? `<span class="pill ${okPend === daPend.length ? 'ok' : 'dim'}">${okPend}/${daPend.length} feitas</span>` : ''}
              <button class="btn sm" data-act="nova-pendencia">${ico('plus',13)}Pendência</button>
            </div></div>
            ${daPend.length ? `<div class="pends">${daPend.map(cartaoPend).join('')}</div>`
              : `<div class="cb sm2" style="padding-top:0">Nada pendurado nesta semana.
                 Pendência é o que precisa sair <b>até domingo</b>, mas ainda não tem dia marcado —
                 quando ganhar um dia, o cartão desce para o bloco.</div>`}
          </div>`;
        })()}

        <div class="semana">${colunas}</div>

        <div class="legenda" style="margin-top:12px;border:0;background:none;padding:0">
          <b><i style="background:var(--ac)"></i> Rotina — se repete</b>
          <b><i style="background:var(--pt)"></i> Pontual — só naquele dia</b>
          <b><i style="background:transparent;border:1px dashed var(--line2)"></i>
            Prevista — o dia ainda não foi gerado</b>
        </div>
        <div class="sm2" style="margin-top:8px">Clique no <b>nome do dia</b> para abrir o bloco inteiro,
          no <b>cartão</b> para editar a tarefa (dá para mudar de dia ali mesmo) e no
          <b>quadradinho</b> para marcar como feita.</div>`;
    }

    /* ═══ VISÃO DIA — a fila, o anel e a sequência ═══════════════ */
    if (f.vista === 'dia') {
      const ini = f.periodo === 'dia' ? f.data
                : f.periodo === 'hoje' ? hoje()
                : f.periodo === 'semana' ? seg()
                : hoje().slice(0, 8) + '01';
      const fim = f.periodo === 'dia' ? f.data
                : f.periodo === 'hoje' ? hoje()
                : f.periodo === 'semana' ? new Date(new Date(seg() + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10)
                : new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).toISOString().slice(0, 10);

      const lista = minhas.filter(a => a.prazo >= ini && a.prazo <= fim);

      /* Dia escolhido que ainda não foi gerado: em vez de tela vazia,
         calcula a partir das rotinas o que VAI cair ali. É previsão,
         não tarefa — por isso não dá para marcar. */
      const previsao = f.periodo === 'dia' && !lista.length
        ? ativas.filter(m => caiNoDia(m, f.data) && casaRecModelo(m))
            .sort((a, b) => emMinuto(a.hora) - emMinuto(b.hora))
        : [];
      const feitas = lista.filter(a => a.status === 'concluida');
      const pct = lista.length ? Math.round(100 * feitas.length / lista.length) : null;

      // Últimos 14 dias: constância só aparece na sequência
      const dias14 = [...Array(14)].map((_, i) => {
        const d = new Date(Date.now() - (13 - i) * 864e5).toISOString().slice(0, 10);
        const doDia = minhas.filter(a => a.prazo === d);
        const ok = doDia.filter(a => a.status === 'concluida').length;
        return { d, total: doDia.length, ok, pct: doDia.length ? Math.round(100 * ok / doDia.length) : null };
      });

      /* Sequência de dias fechados em 100%, de trás para frente. Dia
         sem nada previsto não conta nem a favor nem contra. */
      let streak = 0;
      for (let i = dias14.length - 1; i >= 0; i--) {
        if (dias14[i].total === 0) continue;
        if (dias14[i].pct === 100) streak++; else break;
      }
      const atrasadas = lista.filter(a => a.status !== 'concluida' && a.prazo < hoje());
      const porDia = f.periodo === 'hoje' || f.periodo === 'dia';

      const item = a => {
        const feito = a.status === 'concluida';
        const rot = ehRotina(a);
        return `<div class="tl-item ${rot ? 'rotina' : 'pontual'} ${feito ? 'feito' : ''}">
          <div class="tl-hora ${a.hora ? '' : 'vazia'}">${a.hora ? hm(a.hora) : 'sem hora'}</div>
          <div class="tl-rail"><span class="pt"></span></div>
          <div class="tl-corpo">
            <button class="tick ${rot ? '' : 'pt'} ${feito ? 'done' : ''}" data-act="virar" data-id="${a.id}"
              data-v="${feito ? 'aberta' : 'concluida'}">${ico('check', 12)}</button>
            <div class="g">
              <div class="t">${esc(a.titulo)}</div>
              <div class="m">${!porDia ? dt(a.prazo) + ' · ' : ''}${
                esc(nomeUser(a.responsavel_id))}${
                a.setor_id ? ' · ' + esc(nomeSetor(a.setor_id)) : ''}${
                a.canal_id ? ' · ' + esc(nomeCanal(a.canal_id)) : ''}</div>
              ${chipsTags(a.tags)}
            </div>
            ${a.prazo < hoje() && !feito ? '<span class="pill bad">atrasada</span>' : ''}
            ${feito && a.concluida_em ? `<span class="sm2">✓ ${hora(a.concluida_em)}</span>` : ''}
            <div class="tl-act">
              <button class="btn sm ghost" data-act="editar-tarefa" data-id="${a.id}" title="Editar">${ico('edit',13)}</button>
              <button class="btn sm ghost" data-act="excluir-tarefa" data-id="${a.id}"
                data-t="${esc(a.titulo)}" title="Excluir">${ico('trash',13)}</button>
            </div>
          </div></div>`;
      };

      // No dia, agrupa por turno; em período maior, agrupa por data
      const grupos = {};
      if (porDia) {
        const turno = a => {
          if (!a.hora) return '4. Sem horário';
          const h = +hm(a.hora).slice(0, 2);
          return h < 12 ? '1. Manhã' : h < 18 ? '2. Tarde' : '3. Noite';
        };
        lista.forEach(a => { (grupos[turno(a)] ||= []).push(a); });
      } else {
        lista.forEach(a => { (grupos[a.prazo] ||= []).push(a); });
      }
      Object.values(grupos).forEach(ordena);
      const chaves = Object.keys(grupos).sort();
      if (!porDia) chaves.reverse();
      const rotuloGrupo = k => porDia ? k.slice(3)
        : (k === hoje() ? 'Hoje · ' : '') + new Date(k + 'T12:00:00')
            .toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'2-digit' });

      const raio = 52, volta = 2 * Math.PI * raio;

      return topo + `
      ${previsao.length ? `
        <div class="card"><div class="ch">
          <h3>${(() => { const d = new Date(f.data + 'T12:00:00')
              .toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
            return d[0].toUpperCase() + d.slice(1); })()}</h3>
          <span class="pill info">previsão</span>
          <div class="push"><button class="btn" data-act="gerar-dia">${ico('zap',15)}Gerar este dia</button></div></div>
        <div class="cb" style="padding-bottom:4px"><p class="sm2">
          As tarefas deste dia ainda não foram criadas. Isto é o que as suas rotinas
          <b>vão gerar</b>. Marcar uma delas cria o dia inteiro primeiro — as outras nascem
          em aberto, como se você tivesse clicado em "Gerar este dia".</p></div>
        ${previsao.map(m => `<div class="tl-item rotina previsto">
          <div class="tl-hora ${m.hora ? '' : 'vazia'}">${m.hora ? hm(m.hora) : 'sem hora'}</div>
          <div class="tl-rail"><span class="pt"></span></div>
          <div class="tl-corpo">
            <button class="tick" data-act="checar-previsto" data-d="${f.data}" data-m="${m.id}"
              style="border-style:dashed" title="Marcar como feita — cria o dia antes">${ico('check', 12)}</button>
            <div class="g"><div class="t">${esc(m.titulo)}</div>
              <div class="m">${esc(nomeUser(m.responsavel_id))}${
                m.setor_id ? ' · ' + esc(nomeSetor(m.setor_id)) : ''}</div>
              ${chipsTags(m.tags)}</div>
            <span class="pill dim">prevista</span></div></div>`).join('')}
        </div>` : `
      <div class="progresso">
        <div class="anel">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="${raio}" class="tr"/>
            <circle cx="60" cy="60" r="${raio}" class="fr ${pct === 100 ? 'cheio' : ''}"
              style="stroke-dasharray:${volta};stroke-dashoffset:${volta * (1 - (pct || 0) / 100)}"/>
          </svg>
          <div class="mid"><div class="p">${pct == null ? '—' : pct + '%'}</div>
            <div class="s">${feitas.length}/${lista.length}</div></div>
        </div>
        <div class="lado">
          <div class="linha"><div><div class="lb">Sequência</div>
            <div class="ds">Dias seguidos fechando 100%</div></div>
            <div class="v ${streak >= 3 ? 'ok' : ''}">${streak}${streak === 1 ? ' dia' : ' dias'}</div></div>
          <div class="linha"><div><div class="lb">Em aberto</div>
            <div class="ds">${atrasadas.length ? atrasadas.length + ' com prazo vencido' : 'nada atrasado'}</div></div>
            <div class="v ${atrasadas.length ? 'bad' : ''}">${lista.length - feitas.length}</div></div>
          <div class="heat">
            <div class="lb" style="margin-bottom:8px">Últimos 14 dias</div>
            <div class="grade">${dias14.map(x => `<span title="${dtl(x.d)} — ${
              x.total ? x.ok + '/' + x.total : 'nada previsto'}"
              class="${x.total === 0 ? 'vazio' : x.pct === 100 ? 'cheio' : x.pct >= 50 ? 'meio' : 'pouco'}"></span>`).join('')}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="ch"><h3>${f.periodo === 'hoje' ? 'A rotina de hoje'
          : f.periodo === 'semana' ? 'Esta semana'
          : f.periodo === 'mes' ? 'Este mês'
          : (() => { const d = new Date(f.data + 'T12:00:00')
              .toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
             return d[0].toUpperCase() + d.slice(1); })()}</h3>
          <span class="push sm2">${lista.length} item(ns)</span></div>
        <div class="legenda">
          <b><i style="background:var(--ac)"></i> Rotina — se repete</b>
          <b><i style="background:var(--pt)"></i> Pontual — só naquele dia</b>
          <span style="margin-left:auto">${lista.filter(ehRotina).length} rotina(s) ·
            ${lista.filter(a => !ehRotina(a)).length} pontual(is)</span></div>
        ${lista.length ? chaves.map(k => `
          <div class="grupo">${rotuloGrupo(k)}
            <span>${grupos[k].filter(a => a.status === 'concluida').length}/${grupos[k].length}</span></div>
          ${grupos[k].map(item).join('')}`).join('')
        : vazio('check',
            f.periodo === 'hoje' ? 'Nada previsto para hoje'
            : f.periodo === 'dia' ? 'Nenhuma rotina cai neste dia'
            : 'Nada neste período',
            'Se você já tem rotinas cadastradas, clique em "Gerar rotinas". Se não tem, comece criando uma.',
            { act:'gerar', label:'Gerar hoje' })}
      </div>`}`;
    }

    /* ═══ VISÃO ROTINAS — os moldes ══════════════════════════════ */
    if (f.vista === 'rotinas') {
      const doDia = d => semanais.filter(m => diasDaRotina(m).includes(d))
        .sort((a, b) => emMinuto(a.hora) - emMinuto(b.hora));
      const carga = ORDEM_SEMANA.map(d => doDia(d).length);
      const maxCarga = Math.max(...carga);
      const diaPico = ORDEM_SEMANA[carga.indexOf(maxCarga)];
      // Só os dias úteis: sábado vazio não é desequilíbrio
      const uteis = [1,2,3,4,5].map(d => doDia(d).length);
      const desequilibrio = Math.max(...uteis) - Math.min(...uteis);

      return topo + `
        ${semanais.length || mensais.length ? `
        <div class="tiles stg">
          <div class="tile"><div class="ic">${ico('refresh',18)}</div><div class="n">${semanais.length}</div>
            <div class="l">Rotinas na semana</div></div>
          <div class="tile ok"><div class="ic">${ico('clock',18)}</div>
            <div class="n">${doDia(hojeDia).length}</div><div class="l">Caem hoje</div></div>
          <div class="tile ${desequilibrio > 4 ? 'warn' : ''}"><div class="ic">${ico('chart',18)}</div>
            <div class="n" style="font-size:22px">${NOME_DIA[diaPico]}</div>
            <div class="l">Dia mais carregado</div><div class="h">${maxCarga} rotina(s)</div></div>
          <div class="tile"><div class="ic">${ico('cal',18)}</div>
            <div class="n">${mensais.length}</div><div class="l">Mensais</div></div>
        </div>

        <div class="card"><div class="ch"><h3>Todas as rotinas</h3>
          <span class="push sm2">${semanais.length + mensais.length} no total</span></div>
          <div class="t-scroll"><table><thead><tr>
            <th>Rotina</th><th>Setor</th><th>Dias de execução</th><th>Hora</th>
            <th>Responsável</th><th>Canal</th><th>Tags</th><th></th>
          </tr></thead><tbody>${[...semanais, ...mensais]
            .sort((a, b) => emMinuto(a.hora) - emMinuto(b.hora) || (a.titulo > b.titulo ? 1 : -1))
            .map(m => `<tr>
              <td><b>${esc(m.titulo)}</b>${m.recorrencia === 'quinzenal'
                ? ' <span class="pill info">quinzenal</span>' : ''}</td>
              <td>${m.setor_id
                ? `<span class="pill" style="color:${corSetor(m.setor_id)};background:${corSetor(m.setor_id)}22">${esc(nomeSetor(m.setor_id))}</span>`
                : '<span class="mut">—</span>'}</td>
              <td>${reguaDias(m)}</td>
              <td class="mut">${m.hora ? '<b style="color:var(--txt)">' + hm(m.hora) + '</b>' : '—'}</td>
              <td class="mut">${esc(nomeUser(m.responsavel_id))}</td>
              <td class="mut">${m.canal_id ? esc(nomeCanal(m.canal_id)) : '—'}</td>
              <td>${chipsTags(m.tags) || '<span class="mut">—</span>'}</td>
              <td class="act">
                <button class="btn sm ghost" data-act="editar-rotina" data-id="${m.id}" title="Editar">${ico('edit',13)}</button>
                <button class="btn sm ghost" data-act="dup-rotina" data-id="${m.id}" title="Duplicar">${ico('copy',13)}</button>
                <button class="btn sm ghost" data-act="del-rotina" data-id="${m.id}" data-t="${esc(m.titulo)}" title="Excluir">${ico('trash',13)}</button>
              </td>
            </tr>`).join('')}</tbody></table></div>
          <div class="cb sm2" style="border-top:1px solid var(--line)">
            Rotina é molde: ela nunca aparece na fila do dia. Quem aparece são as tarefas que
            ela gera — e é nelas que você dá o check, na visão <b>Semana</b>.</div></div>`
        : `<div class="card">${vazio('cal',
            f.quem === 'minha' ? 'Sua semana está vazia' : 'Nenhuma rotina cadastrada',
            f.quem === 'minha'
              ? 'Nenhuma rotina recorrente está no seu nome. Crie uma, ou veja a do time inteiro no filtro acima.'
              : 'Cadastre o que se repete toda semana e ele aparece aqui, distribuído por dia.',
            { act:'nova', label:'Criar rotina' })}</div>`}`;
    }

    /* ═══ VISÃO CALENDÁRIO — o mês ═══════════════════════════════ */
    return topo + calendario(ativas, f.mes) + (mensais.length ? `
      <div class="card" style="margin-top:20px">
        <div class="ch"><h3>Rotinas mensais</h3>
          <span class="push sm2">não caem num dia fixo da semana</span></div>
        ${mensais.map(m => `<div class="row" data-act="editar-rotina" data-id="${m.id}" style="cursor:pointer">
          <span class="pill ac">dia ${m.recorrencia_dia_mes}</span>
          <div class="g"><div class="t">${esc(m.titulo)}</div>
            <div class="m">${esc(nomeUser(m.responsavel_id))}${
              m.canal_id ? ' · ' + esc(nomeCanal(m.canal_id)) : ''}</div></div>
          ${m.hora ? `<span class="pill dim">${hm(m.hora)}</span>` : ''}</div>`).join('')}
      </div>` : '');
  },
  acoes: {
    /* ── filtros e navegação ─────────────────────────────────── */
    vista(b)   { R.rotinaSemanal.filtro.vista = b.dataset.v; pinta(); },
    quem(b)    { R.rotinaSemanal.filtro.quem = b.dataset.v; pinta(); },
    rec(b)     { R.rotinaSemanal.filtro.rec = b.dataset.v; pinta(); },
    tag(b)     { R.rotinaSemanal.filtro.tag = b.dataset.v; pinta(); },
    periodo(b) { R.rotinaSemanal.filtro.periodo = b.dataset.v; pinta(); },
    mes(b)     { R.rotinaSemanal.filtro.mes = b.dataset.v; pinta(); },
    dia(b)     { detalheDoDia(b.dataset.d); },
    'escolhe-data'(el) { R.rotinaSemanal.filtro.data = el.value || hoje(); pinta(); },
    'ir-painel'() { abaCfg = 'painel'; vai('config'); },
    /* Zero volta para a semana corrente — é o botão que tira você de
       uma semana antiga sem contar cliques. */
    'sem-passo'(b) {
      const f = R.rotinaSemanal.filtro, n = +b.dataset.v;
      f.semana = n === 0 ? seg()
        : new Date(new Date((f.semana || seg()) + 'T12:00:00').getTime() + n * 7 * 864e5)
            .toISOString().slice(0, 10);
      pinta();
    },
    // Do bloco para o dia: mesma tela, período de um dia só
    'abrir-dia'(b) {
      const f = R.rotinaSemanal.filtro;
      f.vista = 'dia'; f.periodo = 'dia'; f.data = b.dataset.d;
      pinta();
    },

    /* ── criar ───────────────────────────────────────────────── */
    nova() { R.acoes.acoes.modelo(); },
    'nova-pontual'() { formPontual(); },
    'nova-no-dia'(b) { formPontual(b.dataset.d); },
    'nova-pendencia'() { formPendencia(R.rotinaSemanal.filtro.semana || seg()); },
    async 'editar-pendencia'(b) {
      const [a] = await q('acoes', x => x.eq('id', b.dataset.id));
      if (a) formPendencia(a.semana_de, a);
    },

    /* ── gerar as ocorrências ────────────────────────────────── */
    async 'gerar-quando'(b) {
      const f = R.rotinaSemanal.filtro;
      const mais = n => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);
      const faixas = {
        hoje:   [hoje(), hoje()],
        amanha: [mais(1), mais(1)],
        semana: [seg(), new Date(new Date(seg() + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10)],
        prox:   [hoje(), mais(6)],
        dia:    [f.data || hoje(), f.data || hoje()]
      };
      const [de, ate] = faixas[b.dataset.v] || faixas.hoje;
      if (!await geraPeriodo(de, ate)) return;
      // Leva a tela para onde você acabou de gerar
      if (b.dataset.v === 'amanha') { f.vista = 'dia'; f.periodo = 'dia'; f.data = mais(1); }
      else if (b.dataset.v === 'semana' || b.dataset.v === 'prox') { f.vista = 'semana'; f.semana = seg(); }
      pinta();
    },
    async 'gerar-um-dia'(b) { if (await geraPeriodo(b.dataset.d, b.dataset.d)) pinta(); },
    /* Marcar o que ainda é previsão. A tarefa não existe no banco, então
       não dá para gravar nela: primeiro o dia é gerado (o mesmo botão
       "Gerar o dia", só que implícito) e aí a ocorrência recém-nascida
       daquela rotina é que recebe o check. Sem isso, fechar a segunda de
       manhã exigia dois cliques em lugares diferentes. */
    async 'checar-previsto'(b) {
      const d = b.dataset.d, modelo = b.dataset.m;
      b.classList.add('done');
      if (!await geraPeriodo(d, d)) return pinta();
      const [a] = await q('acoes', x => x.eq('acao_modelo_id', modelo).eq('prazo', d).limit(1));
      if (!a) { toast('O dia foi gerado, mas esta rotina não caiu nele.', { tipo:'info' }); return pinta(); }
      if (await grava('acoes', { status:'concluida' }, a.id)) {
        toast('Feita.', { desfazer: async () => { await grava('acoes', { status:'aberta' }, a.id); pinta(); } });
      }
      pinta();
    },
    async 'gerar-dia'() {
      const d = R.rotinaSemanal.filtro.data || hoje();
      if (await geraPeriodo(d, d)) pinta();
    },
    async 'gerar-esta-semana'() {
      const de = R.rotinaSemanal.filtro.semana || seg();
      const ate = new Date(new Date(de + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10);
      if (await geraPeriodo(de, ate)) pinta();
    },
    async gerar() { if (await geraPeriodo(hoje(), hoje())) pinta(); },

    /* ── marcar e mexer nas tarefas ──────────────────────────── */
    async virar(b) {
      const novo = b.dataset.v;
      b.classList.toggle('done', novo === 'concluida');   // resposta imediata
      await grava('acoes', { status: novo }, b.dataset.id);
      pinta();
    },
    /* Editar a ocorrência, não o modelo: mexer aqui muda só este dia.
       Trocar a data move a tarefa de bloco, que é como se remaneja a
       semana sem desfazer a rotina que a gerou. */
    async 'editar-tarefa'(b) {
      const [a] = await q('acoes', x => x.eq('id', b.dataset.id));
      if (!a) return;
      form(`Tarefa · ${a.titulo}`, [
        { k:'titulo', label:'O que precisa ser feito', req:true, value:a.titulo },
        { k:'descricao', label:'Detalhes', type:'textarea', value:a.descricao },
        { k:'prazo', label:'Em que dia', type:'date', value:a.prazo,
          hint:'Mudar a data move a tarefa para outro bloco da semana.' },
        ...(cache.temHora ? [{ k:'hora', label:'Horário', type:'time', value:a.hora ? hm(a.hora) : '',
          hint:'Vazio = sem hora marcada; a tarefa cai no fim do dia.' }] : []),
        { k:'responsavel_id', label:'Responsável', type:'select', value:a.responsavel_id, opts:optUsuarios() },
        ...(cache.temSetores ? [{ k:'setor_id', label:'Setor', type:'select', value:a.setor_id, opts:optSetores() }] : []),
        { k:'canal_id', label:'Canal', type:'select', value:a.canal_id, opts:optCanais() },
        ...(cache.temTags ? [{ k:'_tags', label:'Tags', value:(a.tags || []).join(', '),
          ph:'comercial, prospecção', hint:'Separadas por vírgula.' }] : []),
        { k:'status', label:'Situação', type:'select', value:a.status, opts:[
          { v:'aberta', t:'Em aberto' }, { v:'em_andamento', t:'Em andamento' },
          { v:'concluida', t:'Concluída' }] },
        { k:'urgente', type:'checkbox', label:'Urgente', cap:'Urgente — fura a fila', value:a.urgente },
        ...(cache.temSemana && !a.acao_modelo_id ? [{ k:'_soltar', type:'checkbox', label:'Semana',
          cap:'Tirar do dia — vira pendência da semana, sem dia certo' }] : [])
      ], d => {
        if (cache.temTags) { d.tags = leTags(d._tags); delete d._tags; }
        if (d._soltar) {
          // A âncora é a segunda-feira da semana do prazo que a tarefa tinha
          const ref = new Date((d.prazo || hoje()) + 'T12:00:00');
          const seg2 = new Date(ref.getTime() - ((ref.getDay() + 6) % 7) * 864e5)
            .toISOString().slice(0, 10);
          d.prazo = null; d.hora = null; d.semana_de = seg2;
        }
        delete d._soltar;
        return grava('acoes', d, a.id);
      });
    },
    'excluir-tarefa'(b) {
      confirma('Excluir tarefa',
        `<p>"${esc(b.dataset.t)}" sai da semana.</p>
         <p class="sm2" style="margin-top:10px">Se ela veio de uma rotina, a rotina continua ativa —
         a tarefa volta no próximo dia previsto. Para tirar de vez, pause a rotina em
         <b>Ações e rotinas</b>.</p>`,
        async () => { const ok = await apaga('acoes', b.dataset.id); if (ok) toast('Tarefa excluída.'); return ok; });
    },

    /* ── mexer nos moldes ────────────────────────────────────── */
    async 'dup-rotina'(b) {
      const [r] = await q('acoes', x => x.eq('id', b.dataset.id));
      if (!r) return;
      const { id, created_at, updated_at, concluida_em, ...copia } = r;
      copia.titulo = r.titulo + ' (cópia)';
      form('Duplicar rotina', [
        { k:'titulo', label:'Título', req:true, value:copia.titulo },
        ...(cache.temSetores ? [{ k:'setor_id', label:'Setor', type:'select', value:copia.setor_id, opts:optSetores() }] : []),
        { k:'responsavel_id', label:'Responsável', type:'select', value:copia.responsavel_id, opts:optUsuarios() },
        ...(cache.temHora ? [{ k:'hora', label:'Horário', type:'time', value:copia.hora ? hm(copia.hora) : '' }] : [])
      ], d => grava('acoes', { ...copia, ...d }), 'Duplicar');
    },
    'del-rotina'(b) {
      confirma('Excluir rotina',
        `<p>"${esc(b.dataset.t)}" sai da grade. As tarefas que ela já gerou nos dias anteriores
         <b>também são apagadas</b>, junto com o histórico de cumprimento.</p>
         <p class="sm2" style="margin-top:10px">Se quiser só tirar da rotina sem perder o histórico,
         use <b>Pausar</b> na tela Ações e rotinas.</p>`,
        async () => { const ok = await apaga('acoes', b.dataset.id); if (ok) toast('Rotina excluída.'); return ok; },
        { palavra: 'EXCLUIR' });
    },
    async 'editar-rotina'(b) {
      const [m] = await q('acoes', x => x.eq('id', b.dataset.id));
      if (!m) return;
      form(`Rotina · ${m.titulo}`, [
        { k:'titulo', label:'Título', req:true, value:m.titulo },
        ...(cache.temHora ? [{ k:'hora', label:'Horário', type:'time', value:m.hora ? hm(m.hora) : '',
          hint:'Deixe vazio se não tem hora marcada.' }] : []),
        { k:'responsavel_id', label:'Responsável', type:'select', value:m.responsavel_id, opts:optUsuarios() },
        ...(cache.temSetores ? [{ k:'setor_id', label:'Setor', type:'select', value:m.setor_id, opts:optSetores() }] : []),
        { k:'canal_id', label:'Canal', type:'select', value:m.canal_id, opts:optCanais() },
        { k:'_dias', label:'Dias da semana', value:(diasDaRotina(m) || []).join(','),
          hint:'0=dom, 1=seg … 6=sáb. Muda a rotina para semanal nesses dias.' }
      ], d => {
        const dias = String(d._dias || '').split(',').map(x => parseInt(x, 10))
          .filter(n => n >= 0 && n <= 6);
        delete d._dias;
        if (dias.length) {
          // 5 dias úteis ou 7 dias têm recorrência própria, mais legível
          const util = [1,2,3,4,5].every(x => dias.includes(x)) && dias.length === 5;
          const todos = dias.length === 7;
          d.recorrencia = todos ? 'diaria' : util ? 'dias_uteis' : 'semanal';
          d.recorrencia_dias = d.recorrencia === 'semanal' ? dias : null;
        }
        return grava('acoes', d, m.id);
      });
    }
  }
};

/* Gerar é sempre a mesma chamada; o que muda é a faixa de datas.
   Devolve false quando o banco recusa, para quem chamou não repintar
   a tela em cima de um erro. */
async function geraPeriodo(de, ate) {
  const { data, error } = await sb.rpc('gerar_acoes_do_periodo', { p_de: de, p_ate: ate });
  if (error) {
    toast(/function|does not exist/i.test(error.message)
      ? 'A geração por período ainda não existe no banco (correção 07).' : error.message, { tipo:'bad' });
    return false;
  }
  const quando = de === ate ? dt(de) : `${dt(de)} a ${dt(ate)}`;
  toast(data ? `${data} tarefa(s) criada(s) — ${quando}.` : `Nada novo a gerar em ${quando}.`,
    { tipo: data ? 'ok' : 'info' });
  return true;
}
/* ── Rotinas do time ──────────────────────────────────────────────
   Mesmas rotinas da tela de Ações, mas olhadas pela ótica de quem
   executa: quem carrega o quê e quem está cumprindo. */
R.rotinasTime = {
  label: 'Rotinas do time', curto: 'Rotinas do time', icone: 'refresh', titulo: 'Rotinas do time',
  async dados() {
    const desde = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
    const [modelos, ocor] = await Promise.all([
      q('acoes', x => x.neq('recorrencia', 'nenhuma').order('titulo')),
      q('acoes', x => x.not('acao_modelo_id', 'is', null).gte('prazo', desde))
    ]);
    return { modelos, ocor };
  },
  render({ modelos, ocor }) {
    const porModelo = {};
    ocor.forEach(o => {
      const m = (porModelo[o.acao_modelo_id] ||= { total: 0, feitas: 0 });
      m.total++; if (o.status === 'concluida') m.feitas++;
    });

    const rec = m => m.recorrencia === 'semanal'
        ? (m.recorrencia_dias || []).map(d => DIAS[d]).join(', ')
      : m.recorrencia === 'mensal'    ? `dia ${m.recorrencia_dia_mes}`
      : m.recorrencia === 'quinzenal' ? 'a cada 14 dias'
      : m.recorrencia.replace('_', ' ');

    // Agrupa por pessoa; quem não tem dono cai em "Sem responsável"
    const grupos = {};
    modelos.forEach(m => { (grupos[m.responsavel_id || 'sem'] ||= []).push(m); });

    const geral = Object.values(porModelo).reduce((a, x) =>
      ({ t: a.t + x.total, f: a.f + x.feitas }), { t: 0, f: 0 });
    const pctGeral = geral.t ? Math.round(100 * geral.f / geral.t) : null;

    const bloco = (chave, lista) => {
      const u = cache.usuarios.find(x => x.id === chave);
      const soma = lista.reduce((a, m) => {
        const p = porModelo[m.id] || { total:0, feitas:0 };
        return { t: a.t + p.total, f: a.f + p.feitas };
      }, { t:0, f:0 });
      const pct = soma.t ? Math.round(100 * soma.f / soma.t) : null;
      const cls = pct == null ? '' : pct >= 80 ? 'ok' : pct >= 50 ? 'warn' : 'bad';

      return `<div class="card"><div class="ch">
          ${u ? avatar(u, 30) : `<div class="av" style="width:30px;height:30px">?</div>`}
          <div><h3>${esc(u?.nome || 'Sem responsável')}</h3>
            <div class="sm2">${esc(u?.cargo || 'ninguém assumiu estas rotinas')}</div></div>
          <div class="push" style="align-items:center">
            <span class="sm2">${lista.length} rotina(s)</span>
            ${pct == null ? '<span class="pill dim">sem histórico</span>' : `
              <div style="text-align:right"><div class="bar" style="width:110px">
                <i class="${cls}" style="width:${pct}%"></i></div>
                <div class="sm2" style="margin-top:3px">${pct}% cumprida (30d)</div></div>`}
          </div></div>
        <div class="t-scroll"><table><thead><tr>
          <th>Rotina</th><th>Dias</th><th>Canal</th><th class="num">Geradas</th>
          <th class="num">Concluídas</th><th>Cumprimento</th><th>Estado</th><th></th>
        </tr></thead><tbody>${lista.map(m => {
          const p = porModelo[m.id] || { total:0, feitas:0 };
          const pc2 = p.total ? Math.round(100 * p.feitas / p.total) : null;
          const c2 = pc2 == null ? '' : pc2 >= 80 ? 'ok' : pc2 >= 50 ? 'warn' : 'bad';
          return `<tr><td><b>${esc(m.titulo)}</b>${m.hora ? `<div class="sm2">${hm(m.hora)}</div>` : ''}</td>
            <td>${reguaDias(m)}</td>
            <td class="mut">${esc(nomeCanal(m.canal_id))}</td>
            <td class="num">${p.total}</td><td class="num">${p.feitas}</td>
            <td>${pc2 == null ? '<span class="mut">—</span>'
              : `<div class="bar" style="max-width:120px"><i class="${c2}" style="width:${pc2}%"></i></div>`}</td>
            <td><span class="pill ${m.status === 'aberta' ? 'ok' : 'dim'}">${m.status === 'aberta' ? 'ativa' : 'pausada'}</span></td>
            <td class="act">
              <button class="btn sm ghost" data-act="dono" data-id="${m.id}" title="Trocar responsável">${ico('users',13)}</button>
              <button class="btn sm ghost" data-act="pausar" data-id="${m.id}" data-v="${m.status === 'aberta' ? 'cancelada' : 'aberta'}">${m.status === 'aberta' ? 'Pausar' : 'Ativar'}</button>
            </td></tr>`;
        }).join('')}</tbody></table></div></div>`;
    };

    const ordem = Object.keys(grupos).sort((a, b) =>
      a === 'sem' ? 1 : b === 'sem' ? -1 : (nomeUser(a) > nomeUser(b) ? 1 : -1));

    return `<div class="head"><div><h2>Rotinas do time</h2>
        <div class="sub">Quem carrega o quê, e quem está cumprindo. Cumprimento dos últimos 30 dias.</div></div>
        <div class="push"><button class="btn" data-act="nova">${ico('plus',15)}Nova rotina</button></div></div>
      ${modelos.length ? `
        <div class="tiles stg">
          <div class="tile"><div class="ic">${ico('refresh',18)}</div><div class="n">${modelos.length}</div>
            <div class="l">Rotinas ativas</div></div>
          <div class="tile"><div class="ic">${ico('users',18)}</div>
            <div class="n">${Object.keys(grupos).filter(k => k !== 'sem').length}</div>
            <div class="l">Pessoas com rotina</div></div>
          <div class="tile ${pctGeral != null && pctGeral < 50 ? 'bad' : pctGeral != null && pctGeral < 80 ? 'warn' : 'ok'}">
            <div class="ic">${ico('check',18)}</div><div class="n">${pctGeral == null ? '—' : pctGeral + '%'}</div>
            <div class="l">Cumprimento geral</div><div class="h">${geral.f} de ${geral.t} ocorrências</div></div>
          <div class="tile ${grupos.sem ? 'warn' : ''}"><div class="ic">${ico('alert',18)}</div>
            <div class="n">${grupos.sem?.length || 0}</div><div class="l">Sem responsável</div></div>
        </div>
        ${ordem.map(k => bloco(k, grupos[k])).join('')}`
      : `<div class="card">${vazio('refresh', 'Nenhuma rotina cadastrada',
          'Cadastre o que se repete toda semana e o sistema passa a criar as tarefas sozinho, todo dia.',
          { act:'nova', label:'Criar rotina' })}</div>`}`;
  },
  acoes: {
    nova() { R.acoes.acoes.modelo(); },
    async pausar(b) { if (await grava('acoes', { status: b.dataset.v }, b.dataset.id)) { toast('Atualizado.'); pinta(); } },
    async dono(b) {
      const [r] = await q('acoes', x => x.eq('id', b.dataset.id));
      if (!r) return;
      form(`Responsável por "${r.titulo}"`, [
        { k:'responsavel_id', label:'Quem executa', type:'select', value:r.responsavel_id, opts:optUsuarios() }
      ], d => grava('acoes', d, r.id), 'Trocar');
    }
  }
};

/* ── Horários ─────────────────────────────────────────────────────
   Escala semanal. Dia sem linha no banco = folga. */
const SEMANA = [[1,'Segunda'],[2,'Terça'],[3,'Quarta'],[4,'Quinta'],[5,'Sexta'],[6,'Sábado'],[0,'Domingo']];
const hm = t => (t || '').slice(0, 5);
/* Minutos desde a meia-noite. Sem hora devolve um valor alto de
   propósito: a tarefa cai no fim do dia em vez de fingir madrugada. */
const emMinuto = t => {
  if (!t) return 99999;
  const [h, m] = hm(t).split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
};
const minutosDia = h => {
  const [a, b] = [hm(h.entrada), hm(h.saida)].map(x => {
    const [H, M] = x.split(':').map(Number); return H * 60 + M;
  });
  return Math.max(0, b - a - (h.intervalo_min || 0));
};
const hhmm = min => `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}`;

R.horarios = {

          <th class="num">Semana</th><th></th></tr></thead>
        <tbody>${pessoas.map(p => {

          return `<tr>
            <td><div style="display:flex;align-items:center;gap:10px">${avatar(p, 28)}

                  h.intervalo_min ? `<div class="sm2">${h.intervalo_min}min almoço</div>` : ''}`
                  : '<span style="opacity:.4">folga</span>'}</td>`;
            }).join('')}
            <td class="num"><b>${total ? hhmm(total) : '—'}</b></td>
            <td class="act"><button class="btn sm ghost" data-act="edit" data-id="${p.id}">${ico('edit',13)}</button></td>
          </tr>`;
        }).join('')}</tbody></table></div></div>`
      : `<div class="card">${vazio('users', 'Time vazio',

async function formHorario(usuarioId) {
  const atuais = usuarioId ? await q('horarios', x => x.eq('usuario_id', usuarioId)) : [];
  const base = atuais[0];
  form('Definir horário', [
    { k:'usuario_id', label:'Pessoa', type:'select', req:true, value:usuarioId,
      opts:cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome })) },
    { k:'_dias', label:'Dias de trabalho', req:true,
      value: atuais.length ? atuais.map(h => h.dia_semana).sort().join(',') : '1,2,3,4,5',
      hint:'0=dom, 1=seg … 6=sáb, separados por vírgula. Os dias que você NÃO listar viram folga.' },
    { k:'entrada', label:'Entrada', type:'time', req:true, value: base ? hm(base.entrada) : '08:00' },
    { k:'saida', label:'Saída', type:'time', req:true, value: base ? hm(base.saida) : '18:00' },
    { k:'intervalo_min', label:'Intervalo (minutos)', type:'number', value: base?.intervalo_min ?? 60,
      hint:'Descontado do total de horas da semana.' },
    { k:'observacao', label:'Observação', value: base?.observacao }
  ], async d => {
    const dias = String(d._dias || '').split(',').map(s => parseInt(s, 10))
      .filter(n => n >= 0 && n <= 6);
    if (!dias.length) { toast('Informe ao menos um dia.', { tipo:'bad' }); return false; }
    if (d.saida <= d.entrada) { toast('A saída precisa ser depois da entrada.', { tipo:'bad' }); return false; }
    // Regrava a semana inteira: o que não foi listado deixa de existir.
    await sb.from('horarios').delete().eq('usuario_id', d.usuario_id);
    const { error } = await sb.from('horarios').insert(dias.map(dia => ({
      usuario_id: d.usuario_id, dia_semana: dia, entrada: d.entrada, saida: d.saida,
      intervalo_min: d.intervalo_min ?? 0, observacao: d.observacao
    })));
    if (error) { toast(error.message, { tipo:'bad' }); return false; }
    toast('Horário salvo.');
    return true;
  });
}

function fechaCiclo(id, nome, status) {
  const aprovado = status === 'aprovado';
  confirma(aprovado ? 'Aprovar ciclo' : 'Ciclo não aprovado',
    `<p>${aprovado
      ? `A prova de <b>${esc(nome)}</b> foi cumprida. O ciclo é encerrado como aprovado e a recompensa passa a valer.`
      : `A prova de <b>${esc(nome)}</b> não foi cumprida. O ciclo encerra sem aprovação — o próximo pode repetir o mesmo objetivo.`}</p>
     <p class="sm2" style="margin-top:10px">Um feedback de avaliação é registrado junto, para não ficar decisão sem conversa.</p>`,
    async () => {
      const [c] = await q('pdi', x => x.eq('id', id));
      if (!await grava('pdi', { status, avaliado_em: hoje() }, id)) return false;
      await grava('feedbacks', {
        usuario_id: c?.usuario_id, autor_id: eu?.id || null, data: hoje(),
        tipo: 'avaliacao_ciclo',
        notas: `Ciclo de PDI ${aprovado ? 'aprovado' : 'não aprovado'}. Objetivo: ${c?.objetivo || ''}`
      });
      toast(aprovado ? 'Ciclo aprovado.' : 'Ciclo encerrado sem aprovação.');
      return true;
    }, { perigo: !aprovado });
}

/* ═══════════════════════════════════════════════════════════════════
   ONBOARDING E TREINAMENTOS
   ═══════════════════════════════════════════════════════════════════
   Quatro telas em cima das tabelas de CORRECAO-13.sql:

     onbTrilhas     os blocos por setor, e dentro deles a trilha
                    aberta, o leitor de aula e a prova
     onbMinha       só o que é meu, para não precisar caçar
     onbAcompanhar  o painel de quem conduz
     treinamentos   a biblioteca de HTML

   A navegação dentro de onbTrilhas é estado de módulo, não rota: a
   trilha aberta, a aula aberta e a prova aberta são três variáveis
   aqui embaixo. Virou assim porque o menu lateral tem um item só
   ("Trilhas") e três níveis de profundidade — colocar cada nível na
   URL encheria o histórico do navegador de passos intermediários que
   ninguém quer revisitar com o botão voltar. */

/* Markdown suficiente para uma aula: títulos, listas, tabela, citação,
   negrito e link. Não é um parser completo e nem tenta ser — o dia que
   uma aula precisar de mais que isso, ela é um treinamento em HTML. */
function md(txt) {
  if (!txt) return '';
  const linha = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const ls = String(txt).replace(/\r/g, '').split('\n');
  const out = [];
  const eTab  = l => /^\s*\|.*\|\s*$/.test(l);
  const eBlo  = l => /^(#{1,3}\s|>\s?|\s*[-*]\s|\s*\d+\.\s|---+\s*$)/.test(l) || eTab(l);
  let i = 0;

  while (i < ls.length) {
    const l = ls[i];
    if (!l.trim()) { i++; continue; }

    let m;
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))) {
      out.push(`<h${m[1].length + 2}>${linha(m[2])}</h${m[1].length + 2}>`); i++; continue;
    }
    if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue; }

    if (/^>\s?/.test(l)) {
      const b = [];
      while (i < ls.length && /^>\s?/.test(ls[i])) b.push(ls[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${linha(b.join(' '))}</blockquote>`); continue;
    }

    if (eTab(l)) {
      const b = [];
      while (i < ls.length && eTab(ls[i])) b.push(ls[i++]);
      const cels = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const corpo = b.slice(b[1] && /^[\s|:-]+$/.test(b[1]) ? 2 : 1);
      out.push(`<div class="t-scroll"><table><thead><tr>${
        cels(b[0]).map(c => `<th>${linha(c)}</th>`).join('')}</tr></thead><tbody>${
        corpo.map(r => `<tr>${cels(r).map(c => `<td>${linha(c)}</td>`).join('')}</tr>`).join('')
        }</tbody></table></div>`);
      continue;
    }

    if (/^\s*[-*]\s+/.test(l)) {
      const b = [];
      while (i < ls.length && /^\s*[-*]\s+/.test(ls[i])) b.push(ls[i++].replace(/^\s*[-*]\s+/, ''));
      out.push(`<ul>${b.map(x => `<li>${linha(x)}</li>`).join('')}</ul>`); continue;
    }
    if (/^\s*\d+\.\s+/.test(l)) {
      const b = [];
      while (i < ls.length && /^\s*\d+\.\s+/.test(ls[i])) b.push(ls[i++].replace(/^\s*\d+\.\s+/, ''));
      out.push(`<ol>${b.map(x => `<li>${linha(x)}</li>`).join('')}</ol>`); continue;
    }

    const b = [];
    while (i < ls.length && ls[i].trim() && !eBlo(ls[i])) b.push(ls[i++]);
    out.push(`<p>${linha(b.join(' '))}</p>`);
  }
  return out.join('');
}

    [mat] = await q('v_onb_matriculas', x => x.eq('trilha_id', id).eq('usuario_id', eu.id));
    if (mat) {
      feitas = new Set((await q('onb_progresso', x => x.eq('matricula_id', mat.id))).map(p => p.aula_id));
    }
    if (provas.length) {
      tents = await q('onb_tentativas', x => x.eq('usuario_id', eu.id)
        .in('prova_id', provas.map(p => p.id)).order('feita_em', { ascending: false }));
    }
  }
  return { t, modulos, aulas, provas, mat, feitas, tents };
}

/* A prova vem SEM o gabarito: o select nomeia as colunas em vez de
   pedir `*`. Quem corrige é o banco (função onb_corrigir), então a
   resposta certa não precisa passar por aqui — e não passa. */
async function onbCarregaProva(id) {
  const [[p], questoes] = await Promise.all([
    q('onb_provas',   x => x.eq('id', id)),
    q('onb_questoes', x => x.eq('prova_id', id).order('ordem'))
  ]);
  const qids = questoes.map(x => x.id);
  let alts = [];
  if (qids.length) {
    const r = await sb.from('onb_alternativas')
      .select('id,questao_id,texto,ordem').in('questao_id', qids).order('ordem');
    alts = r.data || [];
  }
  const tents = eu
    ? await q('onb_tentativas', x => x.eq('usuario_id', eu.id).eq('prova_id', id)
        .order('feita_em', { ascending: false })) : [];

  /* Embaralha uma vez só, na carga. Embaralhar a cada render faria as
     alternativas dançarem embaixo do dedo a cada clique. */
  if (!onbOrdem) {
    const mistura = a => p?.embaralhar ? a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]) : a;
    onbOrdem = { q: mistura(qids), a: {} };
    qids.forEach(qid => onbOrdem.a[qid] = mistura(alts.filter(x => x.questao_id === qid).map(x => x.id)));
  }
  return { p, questoes, alts, tents };
}

R.onbTrilhas = {
  label: 'Trilhas', curto: 'Trilhas', icone: 'book', titulo: 'Onboarding',

  async dados() {
    if (onbProva) return { modo: 'prova',  ...(await onbCarregaProva(onbProva)) };
    if (onbSel) {
      const d = await onbCarregaTrilha(onbSel);
      return onbAula
        ? { modo: 'aula', ...d, aula: d.aulas.find(a => a.id === onbAula),
            trein: await onbAbreTreino(d.aulas.find(a => a.id === onbAula)) }
        : { modo: 'trilha', ...d };
    }
    const [trilhas, minhas, painel] = await Promise.all([
      qOpcional('v_onb_trilhas', x => x.eq('ativo', true)),
      eu ? qOpcional('v_onb_matriculas', x => x.eq('usuario_id', eu.id)) : Promise.resolve([]),
      qOpcional('v_onb_painel')
    ]);
    /* Sem as tabelas, a tela explica como criá-las em vez de despejar
       o erro do PostgREST em cima de quem só queria ver a trilha. */
    if (trilhas === null) return { modo: 'semSql' };
    trilhas.sort((a, b) => (a.setor_ordem ?? -1) - (b.setor_ordem ?? -1) || a.ordem - b.ordem
                        || a.nome.localeCompare(b.nome));
    return { modo: 'hub', trilhas, minhas: minhas || [], k: (painel || [])[0] || {} };
  },

  render(d) {
    if (d.modo === 'semSql') return `<div class="head"><div><h2>Onboarding</h2>
        <div class="sub">Trilhas por setor, com aulas e provas.</div></div></div>
      ${avisoSql('As tabelas do onboarding ainda não existem neste banco.', 'sql/CORRECAO-13.sql')}`;
    if (d.modo === 'prova')  return onbTelaProva(d);
    if (d.modo === 'aula')   return onbTelaAula(d);
    if (d.modo === 'trilha') return onbTelaTrilha(d);
    return onbTelaHub(d);
  },

  acoes: {
    /* navegação */
    abrir(b)   { onbSel = b.dataset.id; onbAula = null; onbProva = null; pinta(); },
    aula(b)    { onbAula = b.dataset.id; onbProva = null; pinta(); },
    prova(b)   { onbProva = b.dataset.id; onbAula = null;
                 onbResp = {}; onbResultado = null; onbOrdem = null; onbQz = 0; pinta(); },
    'volta-hub'()    { onbVolta('hub'); },
    'volta-trilha'() { onbVolta('trilha'); },

    /* aluno */
    async comecar(b) {
      const id = await onbMatricular(b.dataset.id);
      if (id) { toast('Trilha iniciada. Bom começo.'); pinta(); }
    },
    async concluir(b) {
      const { mat, aula } = b.dataset;
      if (!mat) return toast('Você precisa começar a trilha antes de marcar aula.', { tipo: 'info' });
      const { error } = await sb.from('onb_progresso').insert({ matricula_id: mat, aula_id: aula });
      if (error && !/duplicate|unique/i.test(error.message)) return toast(error.message, { tipo: 'bad' });
      toast('Aula concluída.');
      if (b.dataset.prox) onbAula = b.dataset.prox; else onbAula = null;
      pinta();
    },
    async desfazer(b) {
      await sb.from('onb_progresso').delete()
        .eq('matricula_id', b.dataset.mat).eq('aula_id', b.dataset.aula);
      pinta();
    },

    /* prova — uma questão por tela, revisão no fim */
    /* Marcar não redesenha a tela: só troca as classes e destrava o
       avançar. Redesenhar faria a página piscar e voltar ao topo a
       cada clique numa alternativa. */
    alt(b) {
      onbResp[b.dataset.q] = b.dataset.a;
      b.parentElement.querySelectorAll('.alt').forEach(x => x.classList.toggle('on', x === b));
      const av = $('#wzAv'); if (av) av.disabled = false;
    },
    'qz-avanca'() { onbQz++; pinta(); },
    'qz-volta'()  { onbQz = Math.max(0, onbQz - 1); pinta(); },
    'qz-pula'()   { onbQz++; pinta(); },
    'qz-ir'(b)    { onbQz = Number(b.dataset.i); pinta(); },
    enviar(b) {
      const faltam = Number(b.dataset.total) - Object.keys(onbResp).length;
      if (faltam > 0) {
        return confirma('Entregar assim mesmo?',
          `<p>Faltam <b>${faltam}</b> questão(ões) sem resposta. Questão em branco conta como errada.</p>`,
          onbEnviaProva, { perigo: false });
      }
      onbEnviaProva();
    },
    refazer() { onbResp = {}; onbResultado = null; onbOrdem = null; onbQz = 0; pinta(); },

    /* edição */
    'nova-trilha'()  { formTrilha(); },
    'edit-trilha'(b) { q('onb_trilhas', x => x.eq('id', b.dataset.id)).then(([r]) => r && formTrilha(r)); },
    'novo-modulo'(b) { formModulo(null, b.dataset.trilha); },
    'edit-modulo'(b) { q('onb_modulos', x => x.eq('id', b.dataset.id)).then(([r]) => r && formModulo(r)); },
    'nova-aula'(b)   { formAula(null, b.dataset.modulo); },
    'edit-aula'(b)   { q('onb_aulas', x => x.eq('id', b.dataset.id)).then(([r]) => r && formAula(r)); },
    'nova-prova'(b)  { formProva(null, b.dataset.trilha, b.dataset.modulo || null); },
    'edit-prova'(b)  { q('onb_provas', x => x.eq('id', b.dataset.id)).then(([r]) => r && formProva(r)); },
    'questoes'(b)    { onbEditorQuestoes(b.dataset.id); },
    'del-aula'(b) {
      confirma('Excluir aula', '<p>A aula sai da trilha e o registro de quem já a concluiu vai junto.</p>',
        () => apaga('onb_aulas', b.dataset.id));
    },
    'del-modulo'(b) {
      confirma('Excluir módulo', '<p>As aulas e a prova deste módulo vão junto.</p>',
        () => apaga('onb_modulos', b.dataset.id));
    },
    'del-trilha'(b) {
      confirma('Excluir trilha',
        '<p>Módulos, aulas, provas e o progresso de todo mundo nesta trilha vão junto.</p>',
        async () => { const ok = await apaga('onb_trilhas', b.dataset.id); if (ok) onbSel = null; return ok; },
        { palavra: 'excluir' });
    },
    matricular(b) { onbFormMatricula(b.dataset.trilha); }
  }
};

async function onbMatricular(trilhaId, usuarioId) {
  const { data, error } = await sb.rpc('onb_matricular',
    { p_trilha_id: trilhaId, p_usuario_id: usuarioId || null });
  if (error) { toast(error.message, { tipo: 'bad' }); return null; }
  return data;
}

async function onbEnviaProva() {
  const { data, error } = await sb.rpc('onb_corrigir',
    { p_prova_id: onbProva, p_respostas: onbResp });
  if (error) { toast(error.message, { tipo: 'bad' }); return false; }
  onbResultado = data;
  toast(data.aprovado ? `Aprovado com ${data.nota}%.` : `Nota ${data.nota}%. Não passou desta vez.`,
    { tipo: data.aprovado ? 'ok' : 'warn' });
  pinta();
  return true;
}

/* O HTML do treinamento só é buscado quando a aula que aponta para ele
   é aberta. A listagem usa a view v_onb_treinamentos, que não traz a
   coluna — trinta cartões não podem arrastar um megabyte de markup. */
async function onbAbreTreino(aula) {
  if (!aula?.treinamento_id) return null;
  const [t] = await q('onb_treinamentos', x => x.eq('id', aula.treinamento_id));
  return t || null;
}

/* ── tela: blocos por setor ──────────────────────────────────────── */
function onbTelaHub({ trilhas, minhas, k }) {
  const meu = {}; minhas.forEach(m => meu[m.trilha_id] = m);

  const grupos = [];
  const pega = (id, nome, ordem) => {
    let g = grupos.find(x => x.k === id);
    if (!g) grupos.push(g = { k: id, nome, ordem, itens: [] });
    return g;
  };
  trilhas.forEach(t => pega(t.setor_id || '', t.setor || 'Toda a empresa', t.setor_ordem ?? -1).itens.push(t));
  cache.setores.filter(s => s.ativo).forEach(s => pega(s.id, s.nome, s.ordem ?? 99));
  grupos.sort((a, b) => a.ordem - b.ordem);

  const linha = t => {
    const m = meu[t.id];
    const pct = m ? m.pct : null;
    return `<button class="tl" data-act="abrir" data-id="${t.id}">
      <div class="g"><div class="t">${esc(t.nome)}</div>
        <div class="m">${t.aulas} aula${t.aulas === 1 ? '' : 's'}${
          t.provas ? ` · ${t.provas} prova${t.provas === 1 ? '' : 's'}` : ''}${
          t.duracao_dias ? ` · ${t.duracao_dias} dias` : t.minutos ? ` · ${onbDur(t.minutos)}` : ''}${
          t.matriculados ? ` · ${t.matriculados} matriculado${t.matriculados === 1 ? '' : 's'}` : ''}</div></div>
      ${m ? (m.status === 'concluida'
              ? `<span class="pill ok">${ico('check',11)} concluída</span>`
              : `<div class="bar" style="width:64px"><i style="width:${pct}%"></i></div>
                 <span class="sm2" style="min-width:32px;text-align:right">${pct}%</span>`)
          : ''}
      <span class="cv">${ico('chevron', 16)}</span></button>`;
  };

  const bloco = g => {
    const cor = g.k ? corSetor(g.k) : null;
    const icone = g.itens[0]?.icone || (g.k ? 'users' : 'star');
    return `<div class="setb"${cor ? ` style="--tone:${cor};--tin:${cor}1e"` : ''}>
      <div class="sh"><div class="ic">${ico(icone, 19)}</div>
        <div style="flex:1;min-width:0"><h3>${esc(g.nome)}</h3>
          <div class="s">${g.itens.length
            ? `${g.itens.length} trilha${g.itens.length === 1 ? '' : 's'}`
            : 'sem trilha ainda'}</div></div></div>
      ${g.itens.length ? g.itens.map(linha).join('')
        : `<div class="vz">Este setor ainda não tem trilha. Crie uma e ela aparece aqui para todo mundo do setor.</div>`}
    </div>`;
  };

  const emAndamento = minhas.filter(m => m.status === 'em_andamento');

  return `<div class="head"><div><h2>Onboarding</h2>
      <div class="sub">Cada setor tem a sua trilha. Clique no bloco para entrar.</div></div>
      <div class="push">
        <button class="btn ghost" data-act="matricular">${ico('users',15)}Matricular alguém</button>
        <button class="btn" data-act="nova-trilha">${ico('plus',15)}Nova trilha</button></div></div>

    <div class="tiles stg">
      <div class="tile"><div class="ic">${ico('book',18)}</div><div class="n">${k.trilhas ?? 0}</div>
        <div class="l">Trilhas ativas</div></div>
      <div class="tile"><div class="ic">${ico('users',18)}</div><div class="n">${k.em_andamento ?? 0}</div>
        <div class="l">Em andamento</div></div>
      <div class="tile ok"><div class="ic">${ico('medal',18)}</div><div class="n">${k.concluidas ?? 0}</div>
        <div class="l">Concluídas</div></div>
      <div class="tile ${k.parados ? 'warn' : ''}"><div class="ic">${ico('clock',18)}</div>
        <div class="n">${k.parados ?? 0}</div><div class="l">Parados há 7 dias ou mais</div></div>
    </div>

    ${emAndamento.length ? `<div class="card"><div class="ch">
        <h3>Onde você parou</h3><div class="push"><span class="sm2">${emAndamento.length} em andamento</span></div></div>
      ${emAndamento.map(m => `<div class="row">
        <div class="g"><div class="t">${esc(m.trilha)}</div>
          <div class="m">${esc(m.setor || 'Toda a empresa')} · ${m.aulas_feitas} de ${m.aulas_total} aulas${
            m.provas_total ? ` · ${m.provas_ok} de ${m.provas_total} provas` : ''}</div></div>
        <div class="bar" style="width:96px"><i style="width:${m.pct}%"></i></div>

/* ── tela: uma trilha ────────────────────────────────────────────── */
function onbTelaTrilha({ t, modulos, aulas, provas, mat, feitas, tents }) {
  if (!t) return `<div class="card">${vazio('alert', 'Trilha não encontrada',
    'Ela pode ter sido excluída enquanto esta tela estava aberta.')}</div>`;

  const melhor = {};
  tents.forEach(x => { const m = melhor[x.prova_id]; if (!m || x.nota > m.nota) melhor[x.prova_id] = x; });
  const feitasPorProva = {};
  tents.forEach(x => feitasPorProva[x.prova_id] = (feitasPorProva[x.prova_id] || 0) + 1);

  const linhaProva = p => {
    const b = melhor[p.id], n = feitasPorProva[p.id] || 0;
    const esgotou = p.tentativas_max > 0 && n >= p.tentativas_max && !b?.aprovado;
    return `<div class="aulal prova">
      <span class="tick ${b?.aprovado ? 'done' : ''}" style="cursor:default">${ico('check',12)}</span>
      <div class="g" data-act="prova" data-id="${p.id}">
