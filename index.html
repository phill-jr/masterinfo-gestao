            <button class="ib" data-act="editar" data-id="${n.id}" title="Editar">${ico('edit',14)}</button>
            <button class="ib" data-act="excluir" data-id="${n.id}" title="Excluir">${ico('trash',14)}</button>
          </span></div></div>`;
    };

    return `<div class="head"><div><h2>Anotações</h2>
        <div class="sub">O que você observa e esquece: sobre o time, ideias, decisões de reunião.</div></div>
        <div class="push"><button class="btn ghost" data-act="csv">${ico('down',15)}Exportar</button></div></div>

      <div class="captura" id="captura">
        <textarea id="nova-nota" placeholder="Escreva aqui. Ex.: Erika travou na objeção de preço — retomar no 1 a 1 de sexta.
Pode colar um print direto com Ctrl + V."></textarea>
        ${r.anexos.length ? `<div class="anexos">${r.anexos.map((a, i) => `
          <div class="anexo" data-act="ver-rascunho" data-i="${i}">
            ${a.previa ? `<img src="${esc(a.previa)}" alt="">` : ''}
            ${a.subindo ? '<span class="carregando">enviando…</span>' : ''}
            <span class="x" data-act="tira-rascunho" data-i="${i}">${ico('x',12)}</span>
          </div>`).join('')}</div>` : ''}
        <div class="pe">
          <button class="ib" data-act="anexar" title="Anexar imagem">${ico('down',17)}</button>
          ${dd('Tipo', 'rasc-cat', Object.entries(CATEG_NOTA).map(([v, o]) => ({ v, t:o.t, i:o.i })), r.categoria)}
          ${dd('Sobre', 'rasc-pessoa', [{ v:'', t:'Ninguém específico' },
            ...cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome, i:'user' }))], r.pessoa)}
          <button class="btn" data-act="salvar">${ico('check',15)}Salvar</button>
          <span class="dica">Ctrl + Enter salva</span>
        </div></div>

      <div class="filtros">
        ${dd('Tipo', 'fcat', [{ v:'', t:'Todos os tipos' },
          ...Object.entries(CATEG_NOTA).map(([v, o]) => ({ v, t:o.t, i:o.i }))], f.categoria)}
        ${dd('Sobre', 'fpessoa', [{ v:'', t:'Todo mundo' },
          ...cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome, i:'user' }))], f.pessoa)}
        <input data-act="fbusca" value="${esc(f.busca)}" placeholder="Buscar no texto…"
          style="width:auto;min-width:200px">
        <span class="sm2">${lista.length} de ${notas.length}</span>
      </div>

      ${fixas.length ? `<div class="grupo" style="border-radius:var(--r);margin-bottom:12px">
          ${ico('star',12)} Fixadas<span>${fixas.length}</span></div>
        <div class="notas" style="margin-bottom:24px">${fixas.map(cartao).join('')}</div>` : ''}

      ${soltas.length ? `<div class="notas">${soltas.map(cartao).join('')}</div>`
        : (!fixas.length ? `<div class="card">${vazio('edit',
            notas.length ? 'Nada com esse filtro' : 'Nenhuma anotação ainda',
            'Use a caixa acima. Anotação sobre alguém aparece junto na hora do feedback — é ali que ela vale ouro.')}</div>` : '')}`;
  },
  acoes: {
    'rasc-cat'(b)    { R.anotacoes.rascunho.categoria = b.dataset.v; pinta(); },
    'rasc-pessoa'(b) { R.anotacoes.rascunho.pessoa = b.dataset.v; pinta(); },
    fcat(b)    { R.anotacoes.filtro.categoria = b.dataset.v; pinta(); },
    fpessoa(b) { R.anotacoes.filtro.pessoa = b.dataset.v; pinta(); },
    fbusca(el) { R.anotacoes.filtro.busca = el.value; pinta(); },
    expandir(b) {
      const c = b.previousElementSibling;
      c.classList.toggle('cheio');
      b.textContent = c.classList.contains('cheio') ? 'Ver menos' : 'Ver tudo';
    },
    async salvar() {
      const el = $('#nova-nota');
      const texto = (el?.value || '').trim();
      const r = R.anotacoes.rascunho;
      if (!texto && !r.anexos.length) return toast('Escreva algo ou anexe uma imagem.', { tipo:'info' });
      if (r.anexos.some(a => a.subindo)) return toast('Espere as imagens terminarem de subir.', { tipo:'info' });

      const ok = await grava('anotacoes', {
        conteudo: texto || '(imagem)', categoria: r.categoria,
        usuario_id: r.pessoa || null, autor_id: eu?.id || null,
        anexos: r.anexos.filter(a => a.path).map(a => ({
          path: a.path, nome: a.nome, tipo: a.tipo, tamanho: a.tamanho }))
      });
      if (!ok) return;
      el.value = '';
      r.anexos = [];
      toast('Anotação salva.');
      pinta();
    },
    anexar() { escolheAnexos(); },
    ver(b) { abreImagem(b.dataset.u); },
    'ver-rascunho'(b) {
      const a = R.anotacoes.rascunho.anexos[+b.dataset.i];
      if (a?.previa) abreImagem(a.previa);
    },
    'tira-rascunho'(b) {
      R.anotacoes.rascunho.anexos.splice(+b.dataset.i, 1);
      pinta();
    },
    async fixar(b) {
      if (await grava('anotacoes', { fixada: b.dataset.v === '1' }, b.dataset.id)) pinta();
    },
    async editar(b) {
      const [n] = await q('anotacoes', x => x.eq('id', b.dataset.id));
      if (!n) return;
      form('Editar anotação', [
        { k:'titulo', label:'Título', value:n.titulo, ph:'Opcional' },
        { k:'conteudo', label:'Anotação', type:'textarea', req:true, value:n.conteudo },
        { k:'categoria', label:'Tipo', type:'select', value:n.categoria,
          opts:Object.entries(CATEG_NOTA).map(([v, o]) => ({ v, t:o.t })) },
        { k:'usuario_id', label:'Sobre quem', type:'select', value:n.usuario_id,
          opts:[{ v:'', t:'Ninguém específico' },
            ...cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome }))] }
      ], d => grava('anotacoes', d, n.id));
    },
    excluir(b) {
      confirma('Excluir anotação', '<p>A anotação some. Não dá para desfazer.</p>',
        () => apaga('anotacoes', b.dataset.id));
    },
    async csv() {
      const ns = await q('anotacoes', x => x.order('created_at', { ascending: false }));
      csv('anotacoes', ns.map(n => ({
        data: n.created_at.slice(0, 10),
        tipo: CATEG_NOTA[n.categoria]?.t || n.categoria,
        sobre: n.usuario_id ? nomeUser(n.usuario_id) : '',
        autor: n.autor_id ? nomeUser(n.autor_id) : '',
        titulo: n.titulo || '',
        anotacao: (n.conteudo || '').replace(/\n/g, ' ')
      })));
    }
  },
  pos() {
    const el = $('#nova-nota');
    if (!el) return;
    el.onkeydown = e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); R.anotacoes.acoes.salvar(); }
    };
    // Cresce conforme escreve, em vez de virar caixinha com rolagem
    el.oninput = () => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };

    // Colar print direto da tela é o caminho mais curto que existe
    el.onpaste = e => {
      const arquivos = [...(e.clipboardData?.items || [])]
        .filter(i => i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
      if (arquivos.length) { e.preventDefault(); recebeAnexos(arquivos); }
    };

    const cap = $('#captura');
    if (cap) {
      cap.ondragover = e => { e.preventDefault(); cap.style.borderColor = 'var(--ac)'; };
      cap.ondragleave = () => { cap.style.borderColor = ''; };
      cap.ondrop = e => {
        e.preventDefault(); cap.style.borderColor = '';
        const arquivos = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/'));
        if (arquivos.length) recebeAnexos(arquivos);
      };
    }
  }
};

function escolheAnexos() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = () => recebeAnexos([...inp.files]);
  inp.click();
}

/* Mostra a miniatura na hora e sobe em segundo plano: esperar upload
   para ver o que colou é o tipo de espera que faz desistir da nota. */
async function recebeAnexos(arquivos) {
  const r = R.anotacoes.rascunho;
  const novos = arquivos.slice(0, 6).map(f => ({ nome: f.name || 'print', subindo: true, arquivo: f }));
  r.anexos.push(...novos);
  novos.forEach(a => {
    const fr = new FileReader();
    fr.onload = () => { a.previa = fr.result; pinta(); };
    fr.readAsDataURL(a.arquivo);
  });
  pinta();

  for (const a of novos) {
    try {
      const meta = await subirAnexo(a.arquivo);
      Object.assign(a, meta, { subindo: false });
    } catch (e) {
      a.subindo = false; a.erro = true;
      toast('Falha ao anexar: ' + e.message, { tipo:'bad' });
    }
    pinta();
  }
}

/* ── Dicionário da Casa ───────────────────────────────────────────
   Todo lugar tem um dialeto próprio: sigla de processo, apelido de
   plano, nome de etapa. Quem está há três anos acha óbvio; quem
   entrou ontem nunca ouviu. Enquanto isso não está escrito, cada
   dúvida vira interrupção de um veterano — e a resposta muda
   conforme quem responde.

   Os dois campos que ninguém escreve e todo vendedor precisa são o
   `cliente_chama` e o `explicar_ao_cliente`: o cliente não usa o
   termo interno, então o verbete tem que servir dos dois lados.

   A tabela vem de sql/vendedores-01-dicionario.sql. Enquanto ela não
   existir, a tela avisa em vez de quebrar (qOpcional devolve null). */
const CATEG_TERMO = {
  tecnico:   { t:'Técnico / rede', c:'info', i:'zap'    },
  produto:   { t:'Produto',        c:'ac',   i:'star'   },
  processo:  { t:'Processo',       c:'warn', i:'refresh'},
  comercial: { t:'Comercial',      c:'ok',   i:'money'  },
  cultura:   { t:'Cultura',        c:'dim',  i:'users'  }
};

R.dicionario = {
  label: 'Dicionário', curto: 'Dicionário', icone: 'help', titulo: 'Dicionário da Casa',
  filtro: { categoria: '', nivel: '', status: '', busca: '' },
  async dados() {
    const [termos, lacunas] = await Promise.all([
      qOpcional('vd_termos', x => x.order('termo')),
      qOpcional('vd_buscas_sem_resultado', x => x.eq('resolvido', false).order('created_at', { ascending: false }).limit(30))
    ]);
    return { termos, lacunas: lacunas || [] };
  },
  render({ termos, lacunas }) {
    if (termos === null) return `<div class="head"><div><h2>Dicionário da Casa</h2>
        <div class="sub">O vocabulário interno da empresa, escrito uma vez.</div></div></div>
      <div class="card"><div class="cb"><div class="err" style="display:block">
        A tabela <b>vd_termos</b> ainda não existe neste banco.<br>
        Rode <b>sql/vendedores-01-dicionario.sql</b> no SQL Editor do Supabase e recarregue esta tela.
      </div></div></div>`;

    const f = R.dicionario.filtro;
    const termo = f.busca.trim().toLowerCase();
    const bate = t => !termo
      || (t.termo || '').toLowerCase().includes(termo)
      || (t.sinonimos || '').toLowerCase().includes(termo)
      || (t.explicacao || '').toLowerCase().includes(termo)
      || (t.cliente_chama || '').toLowerCase().includes(termo);

    const lista = termos.filter(t =>
      (!f.categoria || t.categoria === f.categoria) &&
      (!f.nivel     || t.nivel === f.nivel) &&
      (!f.status    || t.status === f.status) &&
      bate(t));

    const publicados = termos.filter(t => t.status === 'publicado').length;
    const rascunhos  = termos.filter(t => t.status === 'rascunho').length;

    const cartao = t => {
      const cat = CATEG_TERMO[t.categoria] || CATEG_TERMO.tecnico;
      const vencido = t.revisado_em && (Date.now() - new Date(t.revisado_em + 'T12:00:00')) > 1000 * 60 * 60 * 24 * 183;
      return `<div class="nota ${t.status === 'publicado' ? 'fixa' : ''}">
        <div class="topo">
          <span class="pill ${cat.c}">${ico(cat.i, 11)} ${cat.t}</span>
          ${t.nivel === 'avancado' ? '<span class="pill dim">avançado</span>' : ''}
          ${t.status !== 'publicado' ? `<span class="pill warn">${esc(t.status)}</span>` : ''}
          ${vencido ? `<span class="pill warn" title="Sem revisão há mais de 6 meses">${ico('clock',11)} revisar</span>` : ''}
        </div>
        <h4>${esc(t.termo)}</h4>
        ${t.sinonimos ? `<div class="sm2" style="margin:-4px 0 8px">também: ${esc(t.sinonimos)}</div>` : ''}
        <div class="corpo">${esc(t.explicacao)}</div>
        ${t.cliente_chama ? `<div class="corpo" style="margin-top:8px"><b>O cliente chama de:</b> ${esc(t.cliente_chama)}</div>` : ''}
        ${t.explicar_ao_cliente ? `<div class="corpo" style="margin-top:8px"><b>Como explicar:</b> "${esc(t.explicar_ao_cliente)}"</div>` : ''}
        ${t.cuidado ? `<div class="corpo" style="margin-top:8px;color:var(--warn,inherit)"><b>Cuidado:</b> ${esc(t.cuidado)}</div>` : ''}
        <div class="rodape">
          ${t.autor_id ? esc(nomeUser(t.autor_id).split(' ')[0]) + ' · ' : ''}${t.revisado_em ? 'revisado ' + dtl(t.revisado_em) : 'sem revisão'}
          <span class="fer">
            <button class="ib" data-act="publicar" data-id="${t.id}" data-v="${t.status === 'publicado' ? 'rascunho' : 'publicado'}"
              title="${t.status === 'publicado' ? 'Voltar para rascunho' : 'Publicar'}">${ico('check',14)}</button>
            <button class="ib" data-act="editar" data-id="${t.id}" title="Editar">${ico('edit',14)}</button>
            <button class="ib" data-act="excluir" data-id="${t.id}" data-t="${esc(t.termo)}" title="Excluir">${ico('trash',14)}</button>
          </span></div></div>`;
    };

    return `<div class="head"><div><h2>Dicionário da Casa</h2>
        <div class="sub">O vocabulário interno da empresa, escrito uma vez — para quem entrou ontem não precisar adivinhar.</div></div>
        <div class="push">
          <button class="btn ghost" data-act="csv">${ico('down',15)}Exportar</button>
          <button class="btn" data-act="novo">${ico('plus',15)}Novo termo</button></div></div>

      <div class="filtros">
        ${dd('Tipo', 'fcat', [{ v:'', t:'Todos os tipos' },
          ...Object.entries(CATEG_TERMO).map(([v, o]) => ({ v, t:o.t, i:o.i }))], f.categoria)}
        ${dd('Nível', 'fnivel', [{ v:'', t:'Todos os níveis' },
          { v:'basico', t:'Básico' }, { v:'avancado', t:'Avançado' }], f.nivel)}
        ${dd('Status', 'fstatus', [{ v:'', t:'Todos' },
          { v:'publicado', t:'Publicados' }, { v:'rascunho', t:'Rascunhos' },
          { v:'arquivado', t:'Arquivados' }], f.status)}
        <input data-act="fbusca" value="${esc(f.busca)}" placeholder="Buscar termo, sinônimo ou explicação…"
          style="width:auto;min-width:240px">
        <span class="sm2">${lista.length} de ${termos.length} · ${publicados} publicados${rascunhos ? ` · ${rascunhos} em rascunho` : ''}</span>
      </div>

      ${lista.length ? `<div class="notas">${lista.map(cartao).join('')}</div>`
        : `<div class="card">${termo
            ? vazio('search', `Ninguém escreveu "${f.busca.trim()}" ainda`,
                'Registre a busca: essa lista é o melhor roteiro do que escrever em seguida, porque veio de dúvida real.',
                { act:'registra-lacuna', label:'Registrar o que faltou' })
            : vazio('help', 'Nenhum termo cadastrado',
                'Comece pelos 40 termos que um cliente ou um novato já pediu para explicar. Ordene por frequência de uso, não por importância.',
                { act:'novo', label:'Novo termo' })}</div>`}

      ${lacunas.length ? `<div class="grupo" style="border-radius:var(--r);margin:24px 0 12px">
          ${ico('alert',12)} Procuraram e não acharam<span>${lacunas.length}</span></div>
        <div class="card"><div class="t-scroll"><table><thead><tr>
          <th>Buscaram por</th><th>Quem</th><th>Quando</th><th></th>
        </tr></thead><tbody>${lacunas.map(l => `<tr>
          <td><b>${esc(l.texto)}</b></td>
          <td class="mut">${l.usuario_id ? esc(nomeUser(l.usuario_id)) : '—'}</td>
          <td class="mut">${dtl(l.created_at.slice(0,10))}</td>
          <td class="act">
            <button class="btn sm ghost" data-act="escrever" data-t="${esc(l.texto)}" data-id="${l.id}">${ico('plus',13)}Escrever</button>
            <button class="btn sm ghost" data-act="resolver" data-id="${l.id}" title="Marcar como resolvido">${ico('check',13)}</button>
          </td></tr>`).join('')}</tbody></table></div></div>` : ''}`;
  },
  acoes: {
    fcat(b)    { R.dicionario.filtro.categoria = b.dataset.v; pinta(); },
    fnivel(b)  { R.dicionario.filtro.nivel = b.dataset.v; pinta(); },
    fstatus(b) { R.dicionario.filtro.status = b.dataset.v; pinta(); },
    fbusca(el) { R.dicionario.filtro.busca = el.value; pinta(); },
    novo: () => formTermo(),
    async editar(b) { const [r] = await q('vd_termos', x => x.eq('id', b.dataset.id)); if (r) formTermo(r); },
    async publicar(b) {
      const virar = b.dataset.v;
      if (await grava('vd_termos',
            { status: virar, revisado_em: virar === 'publicado' ? hoje() : null }, b.dataset.id)) {
        toast(virar === 'publicado' ? 'Termo publicado.' : 'Voltou para rascunho.');
        await pinta();
      }
    },
    excluir(b) {
      confirma('Excluir termo', `"${esc(b.dataset.t)}" será removido do dicionário.`,
        () => apaga('vd_termos', b.dataset.id));
    },
    async 'registra-lacuna'() {
      const texto = R.dicionario.filtro.busca.trim();
      if (!texto) return;
      const { error } = await sb.from('vd_buscas_sem_resultado')
        .insert({ texto, usuario_id: eu?.id || null });
      if (error) return toast(error.message, { tipo: 'bad' });
      toast('Registrado. Vai aparecer na lista do que falta escrever.');
      await pinta();
    },
    escrever(b) { formTermo({ termo: b.dataset.t }, b.dataset.id); },
    async resolver(b) {
      const { error } = await sb.from('vd_buscas_sem_resultado')
        .update({ resolvido: true }).eq('id', b.dataset.id);
      if (error) return toast(error.message, { tipo: 'bad' });
      await pinta();
    },
    csv() {
      csv('dicionario', (R.dicionario._ultimo || []).map(t => ({
        termo: t.termo, sinonimos: t.sinonimos, categoria: t.categoria, nivel: t.nivel,
        explicacao: t.explicacao, cliente_chama: t.cliente_chama,
        explicar_ao_cliente: t.explicar_ao_cliente, cuidado: t.cuidado, status: t.status
      })));
    }
  },
  pos({ termos }) { R.dicionario._ultimo = termos || []; }
};

/* `lacunaId` fecha o ciclo: escreveu o verbete que faltava, a busca
   que originou ele sai da lista de pendências sozinha. */
function formTermo(row, lacunaId) {
  form(row?.id ? 'Editar termo' : 'Novo termo', [
    { k:'termo', label:'Termo', req:true, value:row?.termo, ph:'Como se fala aqui dentro' },
    { k:'sinonimos', label:'Também chamado de', value:row?.sinonimos,
      hint:'Siglas, apelidos e erros comuns de escrita, separados por vírgula. É o que faz achar quando digitam errado.' },
    { k:'categoria', label:'Tipo', type:'select', value:row?.categoria || 'tecnico',
      opts:Object.entries(CATEG_TERMO).map(([v, o]) => ({ v, t:o.t })) },
    { k:'nivel', label:'Nível', type:'select', value:row?.nivel || 'basico',
      opts:[{ v:'basico', t:'Básico — todo vendedor precisa saber na 1ª semana' },
            { v:'avancado', t:'Avançado' }] },
    { k:'explicacao', label:'Explicação curta', req:true, type:'textarea', value:row?.explicacao,
      ph:'Duas ou três frases, sem usar outro jargão dentro.' },
    { k:'cliente_chama', label:'Como o cliente chama isso', type:'textarea', value:row?.cliente_chama,
      ph:'O cliente quase nunca usa o termo interno.' },
    { k:'explicar_ao_cliente', label:'Como explicar para o cliente', type:'textarea', value:row?.explicar_ao_cliente,
      ph:'A frase pronta, do jeito que dá para falar numa ligação.' },
    { k:'cuidado', label:'Cuidado / erro comum', type:'textarea', value:row?.cuidado,
      ph:'O que o novato erra aqui — e o que acontece quando erra.' },
    { k:'status', label:'Status', type:'select', value:row?.status || 'rascunho',
      opts:[{ v:'rascunho', t:'Rascunho' }, { v:'publicado', t:'Publicado' },
            { v:'arquivado', t:'Arquivado' }] }
  ], async d => {
    if (!row?.id) d.autor_id = eu?.id || null;
    if (d.status === 'publicado') d.revisado_em = hoje();
    const ok = await grava('vd_termos', d, row?.id);
    if (ok && lacunaId) await sb.from('vd_buscas_sem_resultado').update({ resolvido: true }).eq('id', lacunaId);
    return ok;
  });
}

/* ── Feedback ─────────────────────────────────────────────────────
   Histórico completo. A tela de PDI mostra o último; aqui está tudo,
   porque padrão só aparece quando você olha a sequência. */
const TIPOS_FB = {
  um_a_um:        { t:'1 a 1',              cor:'info', ic:'users' },
  corretivo:      { t:'Corretivo',          cor:'warn', ic:'alert' },
  reconhecimento: { t:'Reconhecimento',     cor:'ok',   ic:'star'  },
  avaliacao_ciclo:{ t:'Avaliação de ciclo', cor:'ac',   ic:'check' }
};

R.feedbacks = {
  label: 'Feedback', curto: 'Feedback', icone: 'inbox', titulo: 'Feedback',
  filtro: { pessoa: '', tipo: '' },
  async dados() {
    return { fbs: await q('feedbacks', x => x.order('data', { ascending: false }).limit(400)) };
  },
  render({ fbs }) {
    const f = R.feedbacks.filtro;
    const lista = fbs.filter(x =>
      (!f.pessoa || x.usuario_id === f.pessoa) && (!f.tipo || x.tipo === f.tipo));

    const pessoas = cache.usuarios.filter(u => u.ativo);
    const ultimo = {};
    fbs.forEach(x => { if (!ultimo[x.usuario_id]) ultimo[x.usuario_id] = x; });
    const diasDe = u => ultimo[u.id]
      ? Math.floor((new Date() - new Date(ultimo[u.id].data + 'T12:00:00')) / 864e5) : null;

    // Quem está esperando há mais tempo aparece primeiro — é a fila real
    const fila = [...pessoas].sort((a, b) => {
      const da = diasDe(a), db = diasDe(b);
      if (da == null) return -1; if (db == null) return 1;
      return db - da;
    });
    const atrasados = pessoas.filter(u => { const d = diasDe(u); return d == null || d > 30; });
    const esteMes = fbs.filter(x => x.data >= hoje().slice(0, 8) + '01').length;

    // Agrupa por mês para a linha do tempo
    const meses = {};
    lista.forEach(x => { (meses[x.data.slice(0, 7)] ||= []).push(x); });
    const rotuloMes = m => {
      const d = new Date(m + '-15T12:00:00');
      const s = d.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
      return s[0].toUpperCase() + s.slice(1);
    };

    return `<div class="head"><div><h2>Feedback</h2>
        <div class="sub">Todo o histórico. Padrão de comportamento só aparece na sequência, não num registro solto.</div></div>
        <div class="push">
          <button class="btn ghost" data-act="csv">${ico('down',15)}CSV</button>
          <button class="btn" data-act="novo">${ico('plus',15)}Registrar feedback</button></div></div>

      ${pessoas.length ? `
      <div class="tiles stg">
        <div class="tile ${atrasados.length ? 'bad' : 'ok'}"><div class="ic">${ico('alert',18)}</div>
          <div class="n">${atrasados.length}</div><div class="l">Esperando há mais de 30 dias</div>
          <div class="h">${atrasados.slice(0,3).map(u => u.nome.split(' ')[0]).join(', ') || 'ninguém'}</div></div>
        <div class="tile"><div class="ic">${ico('inbox',18)}</div><div class="n">${esteMes}</div>
          <div class="l">Registrados neste mês</div></div>
        <div class="tile"><div class="ic">${ico('star',18)}</div>
          <div class="n">${fbs.filter(x => x.tipo === 'reconhecimento').length}</div>
          <div class="l">Reconhecimentos</div></div>
        <div class="tile"><div class="ic">${ico('alert',18)}</div>
          <div class="n">${fbs.filter(x => x.tipo === 'corretivo').length}</div>
          <div class="l">Corretivos</div></div>
      </div>

      <div class="card"><div class="ch"><h3>Fila — quem está esperando</h3>
        <span class="push sm2">clique para registrar</span></div>
        <div class="t-scroll"><table><thead><tr>
          <th>Pessoa</th><th>Último feedback</th><th>Tipo</th><th>Silêncio</th><th></th>
        </tr></thead><tbody>${fila.map(u => {
          const d = diasDe(u), lastf = ultimo[u.id];
          const cor = d == null ? 'bad' : d > 30 ? 'bad' : d > 15 ? 'warn' : 'ok';
          return `<tr>
            <td><div style="display:flex;align-items:center;gap:10px">${avatar(u, 28)}
              <div><b>${esc(u.nome)}</b><div class="sm2">${esc(u.cargo || '—')}</div></div></div></td>
            <td class="mut">${lastf ? dtl(lastf.data) : 'nunca'}</td>
            <td>${lastf ? `<span class="pill ${TIPOS_FB[lastf.tipo]?.cor || 'dim'}">${TIPOS_FB[lastf.tipo]?.t || lastf.tipo}</span>` : '—'}</td>
            <td><span class="pill ${cor}">${d == null ? 'nunca' : d + ' dias'}</span></td>
            <td class="act"><button class="btn sm" data-act="novo" data-u="${u.id}">Registrar</button></td>
          </tr>`;
        }).join('')}</tbody></table></div></div>` : ''}

      <div class="card"><div class="ch"><h3>Histórico</h3>
        <div class="push">
          <select data-act="fpessoa" style="width:auto;min-width:160px">
            <option value="">Todas as pessoas</option>
            ${pessoas.map(u => `<option value="${u.id}"${f.pessoa===u.id?' selected':''}>${esc(u.nome)}</option>`).join('')}
          </select>
          <select data-act="ftipo" style="width:auto;min-width:150px">
            <option value="">Todos os tipos</option>
            ${Object.entries(TIPOS_FB).map(([k,v]) => `<option value="${k}"${f.tipo===k?' selected':''}>${v.t}</option>`).join('')}
          </select>
          <span class="sm2">${lista.length} registro(s)</span></div></div>
        ${lista.length ? Object.keys(meses).sort().reverse().map(m => `
          <div style="padding:14px 18px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
                      color:var(--dim);font-weight:700;background:var(--surface2)">${rotuloMes(m)}</div>
          ${meses[m].map(x => {
            const u = cache.usuarios.find(y => y.id === x.usuario_id);
            const tp = TIPOS_FB[x.tipo] || { t:x.tipo, cor:'dim', ic:'inbox' };
            return `<div class="row" style="align-items:flex-start">
              ${avatar(u, 32, '?')}
              <div class="g"><div class="t">${esc(u?.nome || 'Pessoa removida')}
                  <span class="pill ${tp.cor}" style="margin-left:6px">${tp.t}</span></div>
                <div class="m">${dtl(x.data)}${x.autor_id ? ' · por ' + esc(nomeUser(x.autor_id)) : ''}</div>
                ${x.notas ? `<div style="margin-top:7px;font-size:13px;color:var(--txt2);
                    white-space:pre-wrap;line-height:1.55">${esc(x.notas)}</div>`
                  : '<div class="sm2" style="margin-top:6px;font-style:italic">Sem notas — registro sem conteúdo não ajuda ninguém depois.</div>'}</div>
              <button class="btn sm ghost" data-act="editar" data-id="${x.id}">${ico('edit',13)}</button>
              <button class="btn sm ghost" data-act="excluir" data-id="${x.id}">${ico('trash',13)}</button>
            </div>`;
          }).join('')}`).join('')
        : vazio('inbox', 'Nenhum feedback com esse filtro',
            'Feedback que não é registrado vira memória, e memória some. Comece por quem está há mais tempo sem conversa.',
            { act:'novo', label:'Registrar feedback' })}</div>`;
  },
  acoes: {
    novo(b) { formFeedback(null, b?.dataset.u); },
    async editar(b) { const [r] = await q('feedbacks', x => x.eq('id', b.dataset.id)); if (r) formFeedback(r); },
    excluir(b) {
      confirma('Excluir feedback', 'O registro sai do histórico. Não dá para desfazer.',
        () => apaga('feedbacks', b.dataset.id));
    },
    fpessoa(b) { R.feedbacks.filtro.pessoa = b.value; pinta(); },
    ftipo(b)   { R.feedbacks.filtro.tipo   = b.value; pinta(); },
    async csv() {
      const fbs = await q('feedbacks', x => x.order('data', { ascending: false }));
      csv('feedbacks', fbs.map(x => ({
        data: x.data, pessoa: nomeUser(x.usuario_id), tipo: TIPOS_FB[x.tipo]?.t || x.tipo,
        autor: x.autor_id ? nomeUser(x.autor_id) : '', notas: (x.notas || '').replace(/\n/g, ' ')
      })));
    }
  }
};

function formFeedback(row, usuarioId) {
  form(row ? 'Editar feedback' : 'Registrar feedback', [
    { k:'usuario_id', label:'Pessoa', type:'select', req:true, value:row?.usuario_id || usuarioId,
      opts:cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome })) },
    { k:'data', label:'Data', type:'date', value:row?.data || hoje() },
    { k:'tipo', label:'Tipo', type:'select', value:row?.tipo || 'um_a_um',
      opts:Object.entries(TIPOS_FB).map(([v, o]) => ({ v, t:o.t })) },
    { k:'notas', label:'Notas', type:'textarea', value:row?.notas,
      ph:'O que foi dito, o que a pessoa respondeu e o que ficou combinado.',
      hint:'Escreva o combinado. É o que você vai querer reler no próximo ciclo.' }
  ], d => { if (!row) d.autor_id = eu?.id || null; return grava('feedbacks', d, row?.id); });
}

    accent(b) { visual.accent = b.dataset.v; visual.accent_hex = null; aplicaVisual(); pinta(); },

        fr.onload = () => { visual[campo] = fr.result; aplicaVisual(); pinta();

      };

    },

      confirma('Restaurar identidade padrão',
        'Volta à logo oficial da MasterInfo, ao laranja e ao grafismo aurora. Só é aplicado depois de salvar.',
        () => { visual = { ...VISUAL_PADRAO }; aplicaVisual(); return true; }, { perigo:false });
    },
    async 'salva-visual'() {
      visual.nome_sistema = ($('#iv-nome')?.value || '').trim() || 'MasterInfo';
      visual.subtitulo    = ($('#iv-sub')?.value || '').trim() || null;
      const { id, updated_at, ...campos } = visual;
      const { error } = await sb.from('config_visual').update(campos).eq('id', 1);
      if (error) return toast(error.message, { tipo:'bad' });
      aplicaVisual(); montaShell();
      toast('Identidade visual salva para todo o time.');
    },
    obon() { pref.ob = true; savePref(); toast('Checklist reativado.'); pinta(); },

    'novo-canal': () => formCanal(),

    /* ── acesso e login ──────────────────────────────────────────── */
    'novo-convite': () => formConvite(),
    'convidar-pessoa'(b) { formConvite(cache.usuarios.find(u => u.id === b.dataset.id)); },
    async 'copia-convite'(b) {
      const texto = `Você foi convidado para o sistema de gestão da MasterInfo.

1. Abra: ${location.origin + location.pathname}
2. Clique em "Primeiro acesso? Criar conta"
3. Use exatamente este e-mail: ${b.dataset.e}
4. Crie sua senha e pronto.`;
      try { await navigator.clipboard.writeText(texto); toast('Mensagem copiada. Cole no WhatsApp.'); }
      catch { modal({ titulo:'Copie a mensagem', ok:'Fechar', onOk:() => true,
        corpo:`<textarea style="min-height:170px">${esc(texto)}</textarea>` }); }
    },
    'revoga-convite'(b) {
      confirma('Revogar convite',
        `O convite de <b>${esc(b.dataset.e)}</b> deixa de valer. Se a pessoa ainda não se cadastrou, não vai conseguir.`,
        async () => { const ok = await apaga('convites', b.dataset.id); if (ok) listaConvites(); return ok; });
    },
    'trocar-senha': () => form('Trocar minha senha', [
      { k:'senha', label:'Nova senha', type:'password', req:true, hint:'Mínimo de 6 caracteres.' },
      { k:'senha2', label:'Repita a nova senha', type:'password', req:true }
    ], async d => {
      if (d.senha.length < 6) { toast('A senha precisa ter ao menos 6 caracteres.', { tipo:'bad' }); return false; }
      if (d.senha !== d.senha2) { toast('As duas senhas não são iguais.', { tipo:'bad' }); return false; }
      const { error } = await sb.auth.updateUser({ password: d.senha });
      if (error) { toast(error.message, { tipo:'bad' }); return false; }
      toast('Senha alterada.');
      return true;
    }, 'Trocar'),

    /* ── setores ─────────────────────────────────────────────────── */
    'novo-setor': () => formSetor(),
    async 'edit-setor'(b) { const [r] = await q('setores', x => x.eq('id', b.dataset.id)); if (r) formSetor(r); },
    async 'dup-setor'(b) {
      const [r] = await q('setores', x => x.eq('id', b.dataset.id));
      if (!r) return;
      const { id, created_at, updated_at, ...copia } = r;

    'del-setor'(b) {

        `<p>As rotinas deste setor <b>não</b> são apagadas — apenas ficam sem setor.</p>
         <p class="sm2" style="margin-top:10px">Para tirar da lista mantendo o histórico,

        async () => { const ok = await apaga('setores', b.dataset.id);
          if (ok) { await recarregaBase(); toast('Setor excluído.'); } return ok; });

    async 'ver-metrica'(b) {
      const m = cache.metricas.find(x => x.id === b.dataset.id);
      if (await grava('metricas_painel', { ativo: !m.ativo }, m.id)) { await recarregaBase(); pinta(); }
    },
    'del-metrica'(b) {

    /* ── cargos ──────────────────────────────────────────────────── */
    'novo-cargo': () => formCargo(),
    async 'edit-cargo'(b) { const [r] = await q('cargos', x => x.eq('id', b.dataset.id)); if (r) formCargo(r); },

      if (!r) return;
      const { id, created_at, updated_at, ...copia } = r;

      csv('cargos', cache.cargos.map(g => ({

    async 'edit-canal'(b) { const [r] = await q('canais_venda', x => x.eq('id', b.dataset.id)); if (r) formCanal(r); },

    /* Duplicar: copia tudo menos a identidade e o nome, que é único.
       Abre o formulário para você ajustar antes de salvar. */
    async 'dup-canal'(b) {
      const [r] = await q('canais_venda', x => x.eq('id', b.dataset.id));
      if (!r) return;
      const { id, created_at, updated_at, ...copia } = r;
      copia.nome = nomeLivre(r.nome, cache.canais.map(c => c.nome));
      formCanal(copia, true);
    },

    /* Excluir: antes de perguntar, conta o que vai junto. Metas e
       lançamentos financeiros são apagados em cascata; o resto só
       perde o vínculo com o canal. */
    async 'del-canal'(b) {
      const id = b.dataset.id, nome = b.dataset.t;
      const [metas, fin, acoes, camp, cont, fun, pess] = await Promise.all([
        conta('metas','canal_id',id),          conta('financeiro_mkt','canal_id',id),
        conta('acoes','canal_id',id),          conta('campanhas','canal_id',id),
        conta('producao_conteudo','canal_id',id), conta('funil','canal_id',id),
        conta('usuarios','canal_principal_id',id)
      ]);
      const cascata = metas + fin;
      const solta = acoes + camp + cont + fun + pess;
      const linha = (n, t) => n ? `<li>${n} ${t}</li>` : '';

      confirma(`Excluir "${nome}"`, `
        ${cascata ? `<p style="color:var(--bad);font-weight:600;margin-bottom:8px">
            Isto apaga junto, sem volta:</p>
          <ul style="margin:0 0 14px 18px;color:var(--bad)">
            ${linha(metas,'meta(s)')}${linha(fin,'lançamento(s) financeiro(s)')}</ul>` : ''}
        ${solta ? `<p style="margin-bottom:8px">Estes registros <b>não</b> são apagados — apenas ficam sem canal:</p>
          <ul style="margin:0 0 14px 18px;color:var(--txt2)">
            ${linha(acoes,'ação(ões)')}${linha(camp,'campanha(s)')}${linha(cont,'conteúdo(s)')}
            ${linha(fun,'registro(s) de funil')}${linha(pess,'pessoa(s) com este canal principal')}</ul>` : ''}
        ${!cascata && !solta ? '<p>Nada depende deste canal. Pode excluir tranquilo.</p>' : ''}
        <p class="sm2">Se a ideia é só tirar da frente sem perder histórico, edite o canal e desmarque
          <b>Ativo</b> — ele some das listas e mantém tudo.</p>`,
        async () => {
          const ok = await apaga('canais_venda', id);
          if (ok) { await recarregaBase(); toast(`Canal "${nome}" excluído.`); }
          return ok;
        },
        cascata ? { palavra: 'EXCLUIR' } : {});
    },
    async 'csv-user'() { csv('usuarios', cache.usuarios); },
    async 'csv-canal'() { csv('canais', cache.canais); },
    /* ── perfil ──────────────────────────────────────────────────── */
    'perfil-foto'() {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        try {
          eu.foto = await fotoQuadrada(f);
          if (await grava('usuarios', { foto: eu.foto }, eu.id)) {
            await recarregaBase(); eu = cache.usuarios.find(u => u.id === eu.id);
            toast('Foto atualizada.'); montaShell();
          }
        } catch (e) { toast(e.message, { tipo:'bad' }); }
      };
      inp.click();
    },
    async 'perfil-sem-foto'() {
      if (await grava('usuarios', { foto: null }, eu.id)) {
        eu.foto = null; await recarregaBase(); eu = cache.usuarios.find(u => u.id === eu.id);
        toast('Foto removida.'); montaShell();
      }
    },
    async 'salva-perfil'() {
      const nome = ($('#pf-nome')?.value || '').trim();
      if (!nome) return toast('O nome não pode ficar vazio.', { tipo:'bad' });
      const dados = { nome, canal_principal_id: $('#pf-canal')?.value || null };
      const cg = $('#pf-cargo')?.value || null;
      if (cache.temCargos) dados.cargo_id = cg; else dados.cargo = cg;
      if (!await grava('usuarios', dados, eu.id)) return;
      await recarregaBase();
      eu = cache.usuarios.find(u => u.id === eu.id);
      toast('Perfil salvo.'); montaShell();
    },
    'criar-perfil'() {
      const sugestao = (sessao?.user?.email || '').split('@')[0]
        .split(/[^a-zA-ZÀ-ÿ]+/).filter(Boolean)
        .map(p => p[0].toUpperCase() + p.slice(1)).join(' ');
      form('Criar meu perfil', [
        { k:'nome', label:'Nome', req:true, value:sugestao },
        campoCargo(null),
        { k:'canal_principal_id', label:'Canal principal', type:'select', opts:optCanais() }
      ], async d => {
        d.auth_user_id = sessao.user.id;
        if (!await grava('usuarios', d)) return false;
        await recarregaBase();
        eu = cache.usuarios.find(u => u.auth_user_id === sessao.user.id) || null;
        toast('Perfil criado.'); montaShell();
        return true;
      }, 'Criar');
    },

    vincular() {
      form('Vincular meu login', [
        { k:'usuario_id', label:'Eu sou', type:'select', req:true,
          opts:cache.usuarios.map(u => ({ v:u.id, t:u.nome })),
          hint:'Liga o login à pessoa, para os feedbacks saírem com sua autoria.' }
      ], async d => {
        const ok = await grava('usuarios', { auth_user_id: sessao.user.id }, d.usuario_id);
        if (ok) { eu = cache.usuarios.find(u => u.id === d.usuario_id); toast('Login vinculado.'); montaShell(); }
        return ok;
      }, 'Vincular');
    },
    limpar() {
      confirma('Limpar preferências locais',
        'Tema, densidade e a conexão salvos <b>neste navegador</b> serão apagados. Nenhum dado do banco é tocado.',
        () => { LS.del(CFG_KEY); LS.del(PREF_KEY); location.reload(); return true; },
        { palavra: 'LIMPAR' });
    },
    sair() { sb.auth.signOut().then(() => location.reload()); }
  }
};

/* ── leitura de texto ─────────────────────────────────────────────
   Extrato de banco brasileiro vem tanto em UTF-8 quanto em Latin-1.
   Tenta o primeiro em modo estrito; se estourar, é o segundo. */
function finDecodifica(buffer) {
  const bytes = new Uint8Array(buffer);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
  catch { return new TextDecoder('windows-1252').decode(bytes); }
}

const finNorm = s => String(s ?? '').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();

/* Valor em formato brasileiro, americano ou com C/D no fim.
   "1.234,56" · "-50,00" · "R$ 12,90" · "(80,00)" · "35,00 D" */
function finValor(bruto) {
  let t = String(bruto ?? '').replace(/[\s\u00a0]/g, '').replace(/r\$/ig, '');
  if (!t) return null;
  const neg = /^\(.*\)$/.test(t) || t.includes('-') || /d$/i.test(t);
  t = t.replace(/[()]/g, '').replace(/[^0-9.,]/g, '');
  if (!t) return null;
  if (t.includes(',') && t.includes('.')) {
    t = t.lastIndexOf(',') > t.lastIndexOf('.')
      ? t.replace(/\./g, '').replace(',', '.')     // 1.234,56
      : t.replace(/,/g, '');                        // 1,234.56
  } else if (t.includes(',')) {
    t = t.replace(',', '.');
  } else if (/\.\d{3}$/.test(t)) {
    t = t.replace(/\./g, '');                       // 1.234 é milhar, não decimal
  }
  const n = Number(t);
  if (!isFinite(n)) return null;
  return neg ? -Math.abs(n) : n;
}

/* dd/mm/aaaa · aaaa-mm-dd · aaaammdd */
function finData(bruto) {
  const t = String(bruto ?? '').trim();
  let m = t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m) {
    const ano = m[3].length === 2 ? '20' + m[3] : m[3];
    return `${ano}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  }
  m = t.match(/^(\d{8})$/);
  if (m) return `${t.slice(0, 4)}-${t.slice(4, 6)}-${t.slice(6, 8)}`;
  return null;
}

/* ── OFX ──────────────────────────────────────────────────────────
   OFX 1.x é SGML: as tags de valor abrem e não fecham. Por isso o
   campo é lido até a quebra de linha ou a próxima tag, e não com
   um par <x>…</x>. O bloco <STMTTRN> esse sim fecha, nas duas
   versões — é ele que delimita cada lançamento. */
function finLeOFX(txt) {
  const campo = (bloco, tag) => {
    const m = bloco.match(new RegExp('<' + tag + '>([^<\\r\\n]*)', 'i'));
    return m ? m[1].trim() : '';
  };
  const blocos = txt.match(/<STMTTRN>[\s\S]*?<\/STMTTRN>/gi) || [];
  const itens = blocos.map(b => {
    const d = campo(b, 'DTPOSTED').replace(/[^0-9]/g, '').slice(0, 8);
    const nome = campo(b, 'NAME'), memo = campo(b, 'MEMO');
    const desc = [nome, memo].filter(Boolean)
      .filter((v, i, a) => a.findIndex(x => finNorm(x) === finNorm(v)) === i).join(' · ');
    return {
      data: d.length === 8 ? `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}` : null,
      valor: finValor(campo(b, 'TRNAMT')),
      descricao: desc || campo(b, 'TRNTYPE') || 'Lançamento',
      fitid: campo(b, 'FITID') || null
    };
  }).filter(i => i.data && i.valor != null);
  return { itens, conta: campo(txt, 'ACCTID'), banco: campo(txt, 'ORG') };
}

/* ── CSV ────────────────────────────────────────────────────────── */
function finLeCSV(txt) {
  const t = txt.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const primeira = t.split('\n').find(l => l.trim()) || '';
  const del = [';', ',', '\t']
    .map(d => [d, primeira.split(d).length])
    .sort((a, b) => b[1] - a[1])[0][0];

  const linhas = []; let cel = '', linha = [], aspas = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (aspas) {
      if (c === '"') { if (t[i + 1] === '"') { cel += '"'; i++; } else aspas = false; }
      else cel += c;
    } else if (c === '"') aspas = true;
    else if (c === del) { linha.push(cel.trim()); cel = ''; }
    else if (c === '\n') { linha.push(cel.trim()); linhas.push(linha); linha = []; cel = ''; }
    else cel += c;
  }
  if (cel || linha.length) { linha.push(cel.trim()); linhas.push(linha); }
  return linhas.filter(l => l.some(c => c !== ''));
}

/* Adivinha quais colunas são data, descrição e valor. Primeiro pelo
   cabeçalho; se ele não ajudar, pelo conteúdo — a coluna em que
   quase tudo vira data é a data, e assim por diante. */
function finAdivinhaColunas(linhas) {
  const cab = linhas[0] || [];
  const corpo = linhas.slice(1, 40);
  const n = Math.max(...linhas.map(l => l.length));
  const acha = re => cab.findIndex(c => re.test(finNorm(c)));

  let iData  = acha(/^(data|date|dt)( |$)|data lancamento|data mov/);
  let iDesc  = acha(/desc|histor|lancamento|estabelec|memo|titulo|detalhe|operacao/);
  let iValor = acha(/^valor|^amount|^montante|^quantia/);
  const iSaida = acha(/debito|saida|despesa/);
  const iEntra = acha(/credito|entrada|recebimento/);

  /* "Valor débito" não é a coluna única de valor — é metade de um
     par. Sem isso o extrato do Itaú e do Bradesco entraria com todo
     mundo positivo. */
  if (iValor >= 0 && /debito|credito|saida|entrada/.test(finNorm(cab[iValor]))) iValor = -1;
  const separadas = iValor < 0 && iSaida >= 0 && iEntra >= 0;

  const taxa = (col, fn) => {
    const vals = corpo.map(l => l[col]).filter(v => v !== undefined && v !== '');
    if (!vals.length) return 0;
    return vals.filter(v => fn(v) != null).length / vals.length;
  };
  if (iData < 0)  { let melhor = -1, top = .6;
    for (let c = 0; c < n; c++) { const p = taxa(c, finData); if (p > top) { top = p; melhor = c; } }
    iData = melhor; }
  if (iValor < 0 && !separadas) { let melhor = -1, top = .6;
    for (let c = 0; c < n; c++) { if (c === iData) continue;
      const p = taxa(c, finValor); if (p > top) { top = p; melhor = c; } }
    iValor = melhor; }
  if (iDesc < 0)  { let melhor = -1, top = 0;
    for (let c = 0; c < n; c++) { if (c === iData || c === iValor) continue;
      const m = corpo.reduce((a, l) => a + String(l[c] || '').length, 0);
      if (m > top) { top = m; melhor = c; } }
    iDesc = melhor; }

  /* Cabeçalho é a linha cuja coluna de data não tem data dentro.
     Testar "alguma célula não é data" pegaria qualquer linha, já que
     descrição nunca é data — e comeria o primeiro lançamento dos
     arquivos que vêm sem cabeçalho. */
  const cabecalho = iData >= 0
    ? finData(cab[iData]) == null
    : !cab.some(c => finData(c) != null);

  return { data:iData, desc:iDesc, valor:separadas ? -1 : iValor,
           saida:separadas ? iSaida : -1, entrada:separadas ? iEntra : -1,
           cabecalho };
}

function finMontaCSV(linhas, mapa, inverter) {
  const corpo = mapa.cabecalho ? linhas.slice(1) : linhas;
  return corpo.map(l => {
    const data = finData(l[mapa.data]);
    let valor = null;
    if (mapa.valor >= 0) valor = finValor(l[mapa.valor]);
    else {
      const s = Math.abs(finValor(l[mapa.saida]) || 0), e = Math.abs(finValor(l[mapa.entrada]) || 0);
      if (s || e) valor = e - s;
    }
    if (!data || valor == null || valor === 0) return null;
    return {
      data, valor: inverter ? -valor : valor,
      descricao: String(l[mapa.desc] ?? '').replace(/\s+/g, ' ').trim() || 'Lançamento',
      fitid: null
    };
  }).filter(Boolean);
}

/* ── PDF ──────────────────────────────────────────────────────────
   Extrato em PDF não tem colunas de verdade: tem texto solto com
   coordenadas. Por isso a leitura aqui é geométrica, e não por
   expressão regular em cima da linha inteira — número colado em
   número é justamente onde o regex erra e some com o saldo ou com o
   valor. Junta-se o texto por altura (y) para formar a linha, e as
   colunas de dinheiro saem do agrupamento das bordas direitas (x),
   que é onde banco nenhum foge: valor é sempre alinhado à direita.

   O pdf.js só é baixado quando um PDF é solto — quem manda OFX não
   paga o megabyte da biblioteca. */
let pdfjsPromessa = null;
function finCarregaPDFjs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsPromessa) return pdfjsPromessa;
  const BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
  pdfjsPromessa = new Promise((ok, erro) => {
    const s = document.createElement('script');
    s.src = BASE + 'pdf.min.js';
    s.onload = () => {
      if (!window.pdfjsLib) { pdfjsPromessa = null; return erro(new Error('O leitor de PDF carregou mas não se registrou.')); }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = BASE + 'pdf.worker.min.js';
      ok(window.pdfjsLib);
    };
    s.onerror = () => { pdfjsPromessa = null;
      erro(new Error('Não deu para baixar o leitor de PDF. Confira a conexão e tente de novo.')); };
    document.head.appendChild(s);
  });
  return pdfjsPromessa;
}

/* Dinheiro no padrão brasileiro: sempre duas casas depois da
   vírgula. Aceita R$, parênteses, sinal e o D/C de débito e crédito
   que alguns bancos grudam no fim. */
const RE_DINHEIRO = /^[-+]?\(?\s*(?:r\$)?\s*(?:\d{1,3}(?:\.\d{3})+|\d+),\d{2}\)?\s*[dc]?$/i;
const finEhDinheiro = t => RE_DINHEIRO.test(String(t ?? '').trim());

const FIN_MESES = { jan:1, fev:2, mar:3, abr:4, mai:5, jun:6,
                    jul:7, ago:8, set:9, out:10, nov:11, dez:12 };

/* Data no começo da linha. Devolve também quantos tokens consumiu,
   porque "05 AGO" às vezes vem partido em dois pelo pdf.js. */
function finDataDaLinha(tokens) {
  const t0 = String(tokens[0]?.t ?? '').trim(), t1 = String(tokens[1]?.t ?? '').trim();
  const ano4 = a => a == null ? null : (String(a).length === 2 ? 2000 + Number(a) : Number(a));

  let m = t0.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/);
  if (m) return { dia:+m[1], mes:+m[2], ano:ano4(m[3]), usou:1 };

  m = t0.match(/^(\d{1,2})\s+([a-zà-ú]{3,})\.?(?:\s+(\d{2,4}))?$/i);
  if (m && FIN_MESES[finNorm(m[2]).slice(0, 3)])
    return { dia:+m[1], mes:FIN_MESES[finNorm(m[2]).slice(0, 3)], ano:ano4(m[3]), usou:1 };

  if (/^\d{1,2}$/.test(t0) && FIN_MESES[finNorm(t1).slice(0, 3)])
    return { dia:+t0, mes:FIN_MESES[finNorm(t1).slice(0, 3)], ano:null, usou:2 };

  return null;
}

/* Junta pedaços vizinhos num token só: o pdf.js entrega o texto
   picado por mudança de fonte, e "1.234,56" costuma vir em cacos. */
function finTokensDaLinha(itens) {
  const out = [];
  for (const i of itens) {
    const u = out[out.length - 1];
    if (u && i.x - (u.x + u.w) < 2.6) { u.t += i.t; u.w = (i.x + i.w) - u.x; }
    else out.push({ x:i.x, w:i.w, t:i.t });
  }
  return out.map(t => ({ x:t.x, w:t.w, dir:t.x + t.w, t:String(t.t).replace(/\s+/g, ' ').trim() }))
            .filter(t => t.t);
}

async function finLePDF(buffer, senha) {
  const pdfjs = await finCarregaPDFjs();
  /* Cópia, não view: o pdf.js transfere o buffer para o worker e o
     original fica destacado. Sem isso, a segunda tentativa — a que
     vai com a senha — estouraria em cima de um buffer morto. */
  const doc = await pdfjs.getDocument({
    data: new Uint8Array(buffer.slice(0)), password: senha || undefined,
    isEvalSupported: false, disableFontFace: true
  }).promise;

  const paginas = doc.numPages;
  const linhas = []; let bruto = '';
  for (let p = 1; p <= paginas; p++) {
    const conteudo = await (await doc.getPage(p)).getTextContent();
    const itens = conteudo.items
      .filter(i => i.str && i.str.trim())
      .map(i => ({ x:i.transform[4], y:i.transform[5], w:i.width || 0, t:i.str }));

    const porY = [];
    itens.forEach(i => {
      const l = porY.find(l => Math.abs(l.y - i.y) <= 2.5);
      if (l) l.itens.push(i); else porY.push({ y:i.y, pagina:p, itens:[i] });
    });
    porY.sort((a, b) => b.y - a.y);           // no PDF, y cresce para cima
    porY.forEach(l => {
      l.itens.sort((a, b) => a.x - b.x);
      l.tokens = finTokensDaLinha(l.itens);
      l.texto = l.tokens.map(t => t.t).join(' ');
      delete l.itens;
      bruto += l.texto + '\n';
      linhas.push(l);
    });
  }
  doc.destroy?.();
  return { linhas, bruto, paginas };
}

/* Colunas de dinheiro pela borda direita dos números. Cluster com
   menos de duas ocorrências é ruído (um total no rodapé, um número
   solto no cabeçalho) e não vira coluna. */
function finColunasPDF(linhas) {
  const xs = [];
  linhas.forEach(l => l.tokens.forEach(t => { if (finEhDinheiro(t.t)) xs.push(t.dir); }));
  if (!xs.length) return [];
  xs.sort((a, b) => a - b);
  const grupos = [];
  xs.forEach(x => {
    const g = grupos[grupos.length - 1];
    if (g && x - g.fim <= 14) { g.fim = x; g.n++; g.soma += x; }
    else grupos.push({ ini:x, fim:x, n:1, soma:x });
  });
  return grupos.filter(g => g.n >= 2)
    .map((g, i) => ({ i, centro:g.soma / g.n, ini:g.ini - 9, fim:g.fim + 9, n:g.n }));
}

const finAnoProvavel = bruto => {
  const achados = String(bruto).match(/\b(20\d{2})\b/g) || [];
  if (!achados.length) return new Date().getFullYear();
  const conta = {};
  achados.forEach(a => conta[a] = (conta[a] || 0) + 1);
  return Number(Object.entries(conta).sort((a, b) => b[1] - a[1])[0][0]);
};

/* Amostra de cada coluna, para a tela poder mostrar "é esta?" em vez
   de pedir que o usuário adivinhe qual número é o valor. */
function finAmostraColuna(linhas, col) {
  const v = [];
  for (const l of linhas) {
    for (const t of l.tokens)
      if (finEhDinheiro(t.t) && t.dir >= col.ini && t.dir <= col.fim) { v.push(t.t); break; }
    if (v.length >= 3) break;
  }
  return v;
}

function finMontaPDF(imp) {
  const { linhas, colunas, mapa, inverter } = imp;
  const naCol = (l, ci) => {
    if (ci < 0 || !colunas[ci]) return null;
    const c = colunas[ci];
    for (const t of l.tokens)
      if (finEhDinheiro(t.t) && t.dir >= c.ini && t.dir <= c.fim) return finValor(t.t);
    return null;
  };

  const brutos = [];
  let ano = mapa.ano, mesAnterior = null;
  for (const l of linhas) {
    const d = finDataDaLinha(l.tokens);
    if (!d) continue;

    let valor = null;
    if (mapa.valor >= 0) valor = naCol(l, mapa.valor);
    else {
      const s = Math.abs(naCol(l, mapa.saida) || 0), e = Math.abs(naCol(l, mapa.entrada) || 0);
      if (s || e) valor = e - s;
    }
    if (valor == null || valor === 0) continue;

    /* Extrato que só traz dia/mês vira ano errado na virada. Se o mês
       cai de repente (dezembro → janeiro), é ano novo. */
    if (d.ano) ano = d.ano;
    else if (mesAnterior != null && d.mes < mesAnterior - 6) ano++;
    mesAnterior = d.mes;

    const desc = l.tokens.slice(d.usou)
      .filter(t => !finEhDinheiro(t.t))
      .map(t => t.t).join(' ').replace(/\s+/g, ' ').trim();

    brutos.push({
      data: `${ano}-${String(d.mes).padStart(2, '0')}-${String(d.dia).padStart(2, '0')}`,
      valor: inverter ? -valor : valor,
      descricao: desc || 'Lançamento', fitid: null
    });
  }
  return brutos;
}

function finCategoriza(descricao, valor) {
  const t = ' ' + finNorm(descricao) + ' ';
  for (const r of fin.regras) {
    const p = finNorm(r.padrao);
    if (p && t.includes(p)) return r.categoria_id;
  }
  for (const s of FIN_SEMENTES) {
    if (s.p.some(p => t.includes(p))) {
      const id = finCatId(s.c);
      if (id) return id;
    }
  }
  return finCatId(valor > 0 ? 'Outras receitas' : 'Sem categoria');
}

/* ── digital do lançamento ────────────────────────────────────────
   Quando o banco manda FITID, ele é a digital: identificador do
   próprio banco, melhor que qualquer coisa que a gente monte.
   Sem FITID, a digital é conta+data+valor+descrição — e a contagem
   por ocorrência resolve o caso legítimo de dois cafés iguais no
   mesmo dia, que não podem virar um só. */
const finBaseImpressao = (it, conta) =>
  it.fitid ? `fit|${conta || '-'}|${it.fitid}`
           : [conta || '-', it.data, Number(it.valor).toFixed(2), finNorm(it.descricao).slice(0, 60)].join('|');

async function finPreparaItens(itens, conta_id) {
  const datas = itens.map(i => i.data).sort();
  const existentes = new Set();
  if (datas.length) {
    const antigos = await q('fin_lancamentos', x =>
      x.gte('data', datas[0]).lte('data', datas[datas.length - 1]));
    antigos.forEach(a => existentes.add(a.impressao));
  }
  const vistos = new Map();
  return itens.map(it => {
    const base = finBaseImpressao(it, conta_id);
    const n = vistos.get(base) || 0; vistos.set(base, n + 1);
    const impressao = n ? `${base}#${n}` : base;
    const duplicado = existentes.has(impressao);
    return { ...it, impressao, duplicado, usar: !duplicado,
             categoria_id: finCategoriza(it.descricao, it.valor) };
  });
}

async function finSemeiaCategorias(silencioso) {
  const faltam = FIN_CATS_PADRAO.filter(c => !finCatId(c.nome));
  if (!faltam.length) { if (!silencioso) toast('As categorias padrão já existem.', { tipo:'info' }); return; }
  const { error } = await sb.from('fin_categorias').insert(faltam);
  if (error) return toast(error.message, { tipo:'bad' });
  await finBase();
  toast(`${faltam.length} categoria(s) criada(s). Ajuste em Categorias.`, { tipo:'info' });
}

/* ── contas do mês ────────────────────────────────────────────────
   Transferência não é gasto nem receita: PIX entre contas suas e
   pagamento de fatura só mudariam o dinheiro de lugar e inflariam
   os dois lados. Fica fora de toda soma. */
function finResumo(linhas) {
  const val = l => Number(l.valor) || 0;
  const uteis = linhas.filter(l => !l.ignorado && finGrupo(l.categoria_id) !== 'transferencia');
  const entradas = uteis.filter(l => val(l) > 0), saidas = uteis.filter(l => val(l) < 0);
  const soma = ls => ls.reduce((a, l) => a + val(l), 0);
  const entrou = soma(entradas), saiu = -soma(saidas);
  const ess = -soma(saidas.filter(l => finCat(l.categoria_id)?.essencial));
  const inv = -soma(saidas.filter(l => finGrupo(l.categoria_id) === 'investimento'));
  return { entrou, saiu, sobrou: entrou - saiu, essencial: ess,
           cortavel: saiu - ess - inv, investido: inv,
           qtd: uteis.length, saidas };
}

function finPorCategoria(linhas) {
  const mapa = new Map();
  linhas.filter(l => !l.ignorado && Number(l.valor) < 0
                  && finGrupo(l.categoria_id) !== 'transferencia')
    .forEach(l => {
      const k = l.categoria_id || 'sem';
      const a = mapa.get(k) || { id:l.categoria_id, total:0, n:0 };
      a.total += -Number(l.valor); a.n++; mapa.set(k, a);
    });
  return [...mapa.values()].sort((a, b) => b.total - a.total);
}

const finProxMes = mes => {
  const [a, m] = mes.split('-').map(Number);
  return m === 12 ? `${a + 1}-01-01` : `${a}-${String(m + 1).padStart(2, '0')}-01`;
};
const finMesAnterior = mes => {
  const [a, m] = mes.split('-').map(Number);
  return m === 1 ? `${a - 1}-12` : `${a}-${String(m - 1).padStart(2, '0')}`;
};
function finOptMeses(n = 24) {
  const out = [], d = new Date();
  for (let i = 0; i < n; i++) {
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    const v = `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}`;
    const t = m.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
    out.push({ v, t: t[0].toUpperCase() + t.slice(1) });
  }
  return out;
}
const finLancsDoMes = mes => q('fin_lancamentos', x =>
  x.gte('data', mes + '-01').lt('data', finProxMes(mes)).order('data', { ascending:false }));

      finLancsDoMes(fin.mes), finLancsDoMes(finMesAnterior(fin.mes))
    ]);
    const filtra = ls => fin.conta ? ls.filter(l => l.conta_id === fin.conta) : ls;
    return { mes: filtra(mes), ant: filtra(ant) };
  },

    if (d.sem) return finSemBanco();
    const { mes, ant } = d;
    const r = finResumo(mes), ra = finResumo(ant);
    const cats = finPorCategoria(mes), catsAnt = finPorCategoria(ant);
    const antPorCat = new Map(catsAnt.map(c => [c.id || 'sem', c.total]));
    const maior = cats[0]?.total || 1;

    const varia = (agora, antes) => {
      if (!antes) return null;
      return (agora - antes) / antes * 100;
    };
    const setaVar = v => v == null ? ''
      : `<span style="color:${v > 0 ? 'var(--bad)' : 'var(--ok)'}">${v > 0 ? '▲' : '▼'} ${pc(Math.abs(v))}</span>`;

    const semCat = mes.filter(l => !l.categoria_id || finNomeCat(l.categoria_id) === 'Sem categoria').length;

    const subiu = cats.filter(c => antPorCat.get(c.id || 'sem') > 0)
      .map(c => ({ ...c, dif: c.total - antPorCat.get(c.id || 'sem') }))
      .sort((a, b) => b.dif - a.dif)[0];

    const alertas = [
      ...estourou.map(c => ({ cor:'bad', t:`${finNomeCat(c.id)} passou do teto`,

    return `<div class="head">

          <button class="btn ghost" data-act="lancamentos">${ico('filter',15)}Lançamentos</button>

        <div class="tile ${r.sobrou >= 0 ? 'ok' : 'bad'}"><div class="ic">${ico('money',18)}</div>

        <div class="tile warn"><div class="ic">${ico('zap',18)}</div><div class="n">${brl(r.cortavel)}</div>
          <div class="l">Dá para cortar</div>
          <div class="h">essenciais ${brl(r.essencial)}${r.investido ? ` · investido ${brl(r.investido)}` : ''}</div></div>
      </div>

      ${alertas.length ? `<div class="card" style="margin-bottom:18px">
        <div class="ch"><h3>${ico('alert',15)} O que salta aos olhos</h3></div>
        ${alertas.map(a => `<div class="row">
          <span class="pill ${a.cor}">${a.t}</span>
          <div class="g"><div class="m">${esc(a.s)}</div></div></div>`).join('')}</div>` : ''}

      <div class="g2">
        <div class="card">
          <div class="ch"><h3>Em que você está gastando</h3>

          ${cats.length ? cats.map(linhaCat).join('')

        </div>
        <div class="card">
          <div class="ch"><h3>Maiores saídas do mês</h3></div>

/* Depois de corrigir uma categoria, oferece transformar a correção
   em regra. É o que faz o sistema parar de errar no mesmo lugar —
   e o que dispensa qualquer IA para categorizar extrato. */
function finOfereceRegra(lanc, categoriaId) {
  const palavras = finNorm(lanc.descricao).split(' ')
    .filter(p => p.length > 3 && !/^\d+$/.test(p));
  const sugestao = palavras.slice(0, 2).join(' ') || finNorm(lanc.descricao).slice(0, 20);
  const ja = fin.regras.find(r => finNorm(r.padrao) === sugestao);

  modal({
    titulo: 'Guardar essa correção?', ok: 'Criar regra', largura: 480,
    corpo: `<div style="color:var(--txt2);font-size:13.5px;line-height:1.6;margin-bottom:16px">
        Todo lançamento cuja descrição contenha o trecho abaixo passa a cair em
        <b>${esc(finNomeCat(categoriaId))}</b> sozinho.</div>
      <div><label>Trecho procurado</label>
        <input data-p value="${esc(sugestao)}">
        <div class="hint">Comparado sem acento e sem maiúscula. Original: "${esc(lanc.descricao)}"</div></div>
      <div class="chk" style="margin-top:14px"><input type="checkbox" data-retro checked>
        <label>Aplicar também nos lançamentos que já estão aqui</label></div>
      ${ja ? `<div class="hint" style="margin-top:10px;color:var(--warn)">
        Já existe uma regra com esse trecho — ela será atualizada.</div>` : ''}`,
    onOk: async mask => {
      const padrao = mask.querySelector('[data-p]').value.trim();
      const retro = mask.querySelector('[data-retro]').checked;
      if (!padrao) { const e = mask.querySelector('.err');
        e.textContent = 'Escreva o trecho.'; e.hidden = false; return false; }

      const { error } = await sb.from('fin_regras')
        .upsert({ padrao, categoria_id: categoriaId, prioridade: 10, origem: 'aprendida' },
                { onConflict: 'dono,padrao' });
      if (error) { toast(error.message, { tipo:'bad' }); return false; }

      let tocados = 0;
      if (retro) {
        /* Filtro em JS, não `.neq` no banco: em SQL, `categoria_id <>
           x` é nulo quando a coluna é nula, então os lançamentos sem
           categoria — justamente os que mais precisam da regra —
           ficariam de fora. */
        const todos = await q('fin_lancamentos', x => x.limit(5000));
        const alvo = todos.filter(l => l.categoria_id !== categoriaId
          && finNorm(l.descricao).includes(finNorm(padrao)));
        if (alvo.length) {
          const { error: e2 } = await sb.from('fin_lancamentos')
            .update({ categoria_id: categoriaId }).in('id', alvo.map(l => l.id));
          if (e2) toast(e2.message, { tipo:'bad' }); else tocados = alvo.length;
        }
      }
      await finBase();
      toast(tocados ? `Regra criada e aplicada em ${tocados} lançamento(s).` : 'Regra criada.');
      await pinta();
      return true;
    }
  });
  /* Fechar sem criar a regra não desfaz nada: a categoria daquele
     lançamento já foi trocada. */
  setTimeout(() => {
    const b = $('.mask .btn.ghost');
    if (b) { b.textContent = 'Só neste'; b.onclick = () => { $('.mask')?.remove(); pinta(); }; }
  }, 10);
}

function formFinLancamento(row) {

    { k:'data', label:'Data', type:'date', req:true, value:row?.data || hoje() },

function finEscolheArquivo() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.ofx,.csv,.txt,.pdf,text/csv,application/pdf,application/x-ofx';
  inp.onchange = () => { if (inp.files[0]) finLeArquivo(inp.files[0]); };
  inp.click();
}

const finEhPDF = (file, buffer) =>
  /\.pdf$/i.test(file.name) || file.type === 'application/pdf' ||
  String.fromCharCode(...new Uint8Array(buffer).slice(0, 5)) === '%PDF-';

async function finLeArquivo(file, senha) {
  const buffer = await file.arrayBuffer();
  fin.imp = { nome: file.name, conta_id: fin.contas[0]?.id || '', inverter: false, lendo: true };

  if (finEhPDF(file, buffer)) { await finLeArquivoPDF(file, buffer, senha); return; }

  const texto = finDecodifica(buffer);
  fin.imp.lendo = false;
  if (/\.ofx$/i.test(file.name) || /<STMTTRN>/i.test(texto)) {
    const { itens, conta } = finLeOFX(texto);
    fin.imp.tipo = 'ofx'; fin.imp.contaOFX = conta; fin.imp.brutos = itens;
  } else {
    const linhas = finLeCSV(texto);
    if (!linhas.length) { fin.imp.erro = 'O arquivo está vazio ou não é um CSV.'; return pinta(); }
    fin.imp.tipo = 'csv'; fin.imp.linhas = linhas;
    fin.imp.mapa = finAdivinhaColunas(linhas);
    fin.imp.brutos = finMontaCSV(linhas, fin.imp.mapa, false);
  }
  await finRecalcula();
}

async function finLeArquivoPDF(file, buffer, senha) {
  fin.imp.tipo = 'pdf';
  pinta();                                   // mostra "lendo o PDF…" enquanto o pdf.js baixa
  let lido;
  try {
    lido = await finLePDF(buffer, senha);
  } catch (e) {
    fin.imp.lendo = false;
    /* Extrato de banco costuma vir travado com CPF ou data de
       nascimento. Vale pedir a senha em vez de dizer "deu erro". */
    if (e?.name === 'PasswordException') { finPedeSenhaPDF(file, buffer); return; }
    fin.imp.erro = 'Não deu para abrir esse PDF: ' + (e?.message || e);
    return pinta();
  }
  fin.imp.lendo = false;

  if (lido.bruto.trim().length < 40) {
    fin.imp.erro = 'Esse PDF não tem texto dentro — é imagem digitalizada, e daí não há o que ler. '
      + 'Peça no banco a versão OFX ou CSV do mesmo extrato.';
    return pinta();
  }

  const colunas = finColunasPDF(lido.linhas);
  if (!colunas.length) {
    fin.imp.erro = 'Li o texto do PDF mas não achei nenhuma coluna de valores nele. '
      + 'Confirme que é o extrato, e não o comprovante ou o informe de rendimentos.';
    fin.imp.linhas = lido.linhas; fin.imp.paginas = lido.paginas;
    return pinta();
  }

  /* A última coluna quase sempre é o saldo corrente, não o valor do
     lançamento — por isso a penúltima é o palpite. */
  const valorProvavel = colunas.length > 1 ? colunas.length - 2 : 0;
  const temAnoNoTexto = lido.linhas.some(l => finDataDaLinha(l.tokens)?.ano);

  Object.assign(fin.imp, {
    linhas: lido.linhas, colunas, paginas: lido.paginas, precisaAno: !temAnoNoTexto,
    mapa: { valor: valorProvavel, saida:-1, entrada:-1, ano: finAnoProvavel(lido.bruto) }
  });
  fin.imp.brutos = finMontaPDF(fin.imp);
  await finRecalcula();
}

function finPedeSenhaPDF(file, buffer) {
  modal({
    titulo: 'Esse PDF está com senha', ok: 'Abrir', largura: 440,
    corpo: `<div style="color:var(--txt2);font-size:13.5px;line-height:1.6;margin-bottom:15px">
        Banco costuma travar o extrato com os primeiros dígitos do CPF ou a data de nascimento.
        A senha é usada só para abrir o arquivo aqui no navegador — ela não é guardada nem enviada.</div>
      <div><label>Senha do arquivo</label><input type="password" data-s autocomplete="off"></div>`,
    onOk: async mask => {
      const senha = mask.querySelector('[data-s]').value;
      if (!senha) { const e = mask.querySelector('.err');
        e.textContent = 'Digite a senha.'; e.hidden = false; return false; }
      await finLeArquivoPDF(file, buffer, senha);
      return true;
    }
  });
}

/* Ordenado do mais recente para o mais antigo, como o extrato. */
async function finRecalcula() {
  const brutos = [...(fin.imp.brutos || [])].sort((a, b) => b.data.localeCompare(a.data));
  fin.imp.itens = await finPreparaItens(brutos, fin.imp.conta_id);
  await pinta();
}
async function finRemontaCSV() {
  fin.imp.brutos = finMontaCSV(fin.imp.linhas, fin.imp.mapa, fin.imp.inverter);
  await finRecalcula();
}
async function finRemontaPDF() {
  fin.imp.brutos = finMontaPDF(fin.imp);
  await finRecalcula();
}

function formFinConta(row) {
  form(row ? 'Editar conta' : 'Nova conta', [
    { k:'nome', label:'Nome', req:true, value:row?.nome, ph:'Ex.: Nubank pessoal' },
    { k:'tipo', label:'Tipo', type:'select', value:row?.tipo || 'corrente', opts:[
      { v:'corrente', t:'Conta corrente' }, { v:'poupanca', t:'Poupança' },
      { v:'cartao', t:'Cartão de crédito' }, { v:'dinheiro', t:'Dinheiro' },
      { v:'investimento', t:'Investimento' }] },
    { k:'instituicao', label:'Banco', value:row?.instituicao, ph:'Ex.: Nubank' },
    { k:'ativa', type:'checkbox', label:'Ativa', cap:'Ativa', value: row ? row.ativa : true }
  ], async d => {
    const ok = await grava('fin_contas', d, row?.id);
    if (ok) { await finBase(); if (fin.imp && !fin.imp.conta_id) {
      fin.imp.conta_id = fin.contas.find(c => c.nome === d.nome)?.id || ''; await finRecalcula(); } }
    return ok;
  });
}

/* ───────────────────────── CATEGORIAS E REGRAS ───────────────────────── */

let cmdAberto = false;
async function palette() {
  if (cmdAberto) return;
  cmdAberto = true;
  const el = document.createElement('div');
  el.className = 'cmdk';
  el.innerHTML = `<div class="box">
    <div class="ci">${ico('search', 18)}<input placeholder="Buscar ou executar…" autofocus></div>
    <div class="cl"></div>
    <div class="cf"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>↵</kbd> abrir</span><span><kbd>esc</kbd> fechar</span></div></div>`;
  document.body.appendChild(el);

  const acoesRapidas = [
    /* Separado por modo porque "Financeiro" existe dos dois lados —
       o do marketing e o seu. Sem o grupo, viram dois itens iguais. */
    ...Object.entries(R).map(([k, r]) => ({
      g: modoDaRota(k) === 'pessoal' ? 'Gestão Pessoal' : 'Navegar',
      t: r.label, ic: r.icone, run: () => vai(k) })),
    { g:'Ações', t:'Nova ação', ic:'plus', sc:'N', run:() => formAcao() },
    { g:'Ações', t:'Nova rotina recorrente', ic:'refresh', run:() => R.acoes.acoes.modelo() },
    { g:'Ações', t:'Gerar rotinas de hoje', ic:'zap', run:() => R.inicio.acoes.gerar() },
    { g:'Ações', t:'Gerar a semana inteira', ic:'cal', run:() => R.inicio.acoes['gerar-semana']() },
    { g:'Ações', t:'Nova campanha', ic:'target', run:() => formCampanha() },
    { g:'Ações', t:'Registrar feedback', ic:'users', run:() => R.time.acoes.fb() },
    { g:'Sistema', t:`Tema ${pref.theme === 'dark' ? 'claro' : 'escuro'}`, ic:pref.theme === 'dark' ? 'sun' : 'moon',
      run:() => { pref.theme = pref.theme === 'dark' ? 'light' : 'dark'; savePref(); montaShell(); } },
    { g:'Sistema', t:'Recarregar dados', ic:'refresh', sc:'R', run:() => { recarregaBase().then(pinta); } },
    { g:'Sistema', t:'Sair da conta', ic:'out', run:() => sb.auth.signOut().then(() => location.reload()) }
  ];

  let registros = [];
  Promise.all([
    q('acoes', x => x.eq('recorrencia', 'nenhuma').order('created_at', { ascending:false }).limit(120)),
    q('campanhas'), q('producao_conteudo', x => x.limit(120))
  ]).then(([a, c, p]) => {
    registros = [
      ...a.map(r => ({ g:'Ações', t:r.titulo, ic:'check', run:() => { vai('acoes'); setTimeout(() => formAcao(r), 260); } })),
      ...c.map(r => ({ g:'Campanhas', t:r.nome, ic:'target', run:() => { vai('campanhas'); setTimeout(() => formCampanha(r), 260); } })),
      ...p.map(r => ({ g:'Conteúdo', t:r.titulo, ic:'film', run:() => vai('producao') })),
      ...cache.usuarios.map(r => ({ g:'Time', t:r.nome, ic:'user', run:() => vai('time') })),
      ...cache.canais.map(r => ({ g:'Canais', t:r.nome, ic:'target', run:() => { vai('config'); abaCfg = 'time'; } }))
    ];
    desenha();
  });

  const inp = el.querySelector('input'), lista = el.querySelector('.cl');
  let sel = 0, atuais = [];

  function desenha() {
    const termo = inp.value.trim().toLowerCase();
    const base = termo ? [...acoesRapidas, ...registros] : acoesRapidas;
    atuais = (termo ? base.filter(i => i.t.toLowerCase().includes(termo)) : base).slice(0, 40);
    sel = Math.min(sel, Math.max(0, atuais.length - 1));
    if (!atuais.length) { lista.innerHTML = `<div class="empty" style="padding:34px"><p>Nada encontrado para "${esc(inp.value)}".</p></div>`; return; }
    let html = '', gAtual = null;
    atuais.forEach((i, n) => {
      if (i.g !== gAtual) { gAtual = i.g; html += `<div class="sec">${esc(i.g)}</div>`; }
      html += `<div class="it ${n === sel ? 'sel' : ''}" data-n="${n}">${ico(i.ic || 'arrowR', 16)}
        <span>${esc(i.t)}</span>${i.sc ? `<span class="sc"><kbd>${i.sc}</kbd></span>` : ''}</div>`;
    });
    lista.innerHTML = html;
    lista.querySelector('.it.sel')?.scrollIntoView({ block:'nearest' });
  }
  function fecha() { el.remove(); cmdAberto = false; document.removeEventListener('keydown', kd, true); }
  function roda(i) { fecha(); i?.run(); }
  function kd(e) {
    if (e.key === 'Escape') { e.preventDefault(); fecha(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % atuais.length; desenha(); }
    else if (e.key === 'ArrowUp')   { e.preventDefault(); sel = (sel - 1 + atuais.length) % atuais.length; desenha(); }
    else if (e.key === 'Enter')     { e.preventDefault(); roda(atuais[sel]); }
  }
  document.addEventListener('keydown', kd, true);
  inp.oninput = () => { sel = 0; desenha(); };
  lista.onclick = e => { const it = e.target.closest('.it'); if (it) roda(atuais[+it.dataset.n]); };
  el.onclick = e => { if (e.target === el) fecha(); };
  desenha(); inp.focus();
}

/* ── seletor em menu ──────────────────────────────────────────────
   `dd()` desenha o botão; o clique é interceptado na delegação da
   view e abre a lista vertical. */
function dd(rotulo, act, opcoes, atual, extra = {}) {
  const sel = opcoes.find(o => String(o.v) === String(atual ?? '')) || opcoes[0];
  // `fixo` transforma o seletor em botão de ação: o rótulo não muda
  const texto = extra.fixo || (sel ? sel.t : '—');
  return `<button class="dd ${extra.cls || ''}" data-act="dd" data-alvo="${esc(act)}"
    data-atual="${esc(atual ?? '')}" data-opts='${esc(JSON.stringify(opcoes))}'>
    ${extra.icone ? ico(extra.icone, 15) : ''}
    ${rotulo ? `<span class="rot">${esc(rotulo)}</span>` : ''}
    <b>${esc(texto)}</b><span class="cv">${ico('chevron', 13)}</span></button>`;
}

function abreSeletor(botao) {
  let opcoes = [];
  try { opcoes = JSON.parse(botao.dataset.opts); } catch { return; }
  const atual = botao.dataset.atual, act = botao.dataset.alvo;
  botao.classList.add('aberto');

  const alvo = popover(botao, `<div class="pl">${opcoes.map(o => `
    <div class="mi ${String(o.v) === String(atual) ? 'on' : ''}" data-v="${esc(o.v)}">
      ${o.i ? ico(o.i, 16) : ''}
      <div class="txt">${esc(o.t)}${o.d ? `<div class="sub2">${esc(o.d)}</div>` : ''}</div>
      ${String(o.v) === String(atual) ? ico('check', 14) : ''}</div>`).join('')}</div>`, 'menu');

  const fechar = () => botao.classList.remove('aberto');
  new MutationObserver((_, obs) => {
    if (!document.body.contains(alvo)) { fechar(); obs.disconnect(); }
  }).observe(document.body, { childList: true });

  alvo.onclick = e => {
    const mi = e.target.closest('.mi'); if (!mi) return;
    alvo.remove(); fechar();
    R[rota].acoes?.[act]?.({ dataset: { v: mi.dataset.v, act } });
  };
}

/* ═══════════════════════════════════════════════════════════════════
   POPOVERS
   ═══════════════════════════════════════════════════════════════════ */
function popover(ancora, html, classe = '') {
  $$('.pop').forEach(p => p.remove());
  const p = document.createElement('div');
  p.className = 'pop ' + classe; p.innerHTML = html;
  document.body.appendChild(p);
  const r = ancora.getBoundingClientRect();
  p.style.top = (r.bottom + 8) + 'px';
  p.style.left = Math.max(10, Math.min(r.right - p.offsetWidth, innerWidth - p.offsetWidth - 10)) + 'px';
  const fora = e => { if (!p.contains(e.target) && !ancora.contains(e.target)) { p.remove(); document.removeEventListener('mousedown', fora); } };
  setTimeout(() => document.addEventListener('mousedown', fora), 0);
  return p;
}

function vai(r, a = null) {
  if (!R[r]) return;
  rota = r; area = a;
  location.hash = (a ? a + '/' : '') + r;
  if (a && !pref.abertos.includes(a)) { pref.abertos.push(a); savePref(); }
  montaShell();
}

/* Troca o menu inteiro. Cai na tela inicial do modo, e não na
   última visitada: entrar no Pessoal é para ver o dinheiro, não
   para reencontrar onde você parou. */
function trocaModo(m) {
  if (MODOS[m] && pref.modo !== m) vai(MODOS[m].inicio);

function elo(k, a) {
  const ativo = rota === k && area === a;
