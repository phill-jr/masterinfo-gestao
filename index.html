  ...fin.cats.map(c => ({ v:c.id, t:c.nome, i:c.icone || 'money' }))];

/* ── leitura de texto ─────────────────────────────────────────────
   Extrato de banco brasileiro vem tanto em UTF-8 quanto em Latin-1.
   Tenta o primeiro em modo estrito; se estourar, é o segundo. */
function finDecodifica(buffer) {
  const bytes = new Uint8Array(buffer);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
  catch { return new TextDecoder('windows-1252').decode(bytes); }
}

const finNorm = s => String(s ?? '').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();

/* Valor em formato brasileiro, americano ou com C/D no fim.
   "1.234,56" · "-50,00" · "R$ 12,90" · "(80,00)" · "35,00 D" */
function finValor(bruto) {
  let t = String(bruto ?? '').replace(/[\s\u00a0]/g, '').replace(/r\$/ig, '');
  if (!t) return null;
  const neg = /^\(.*\)$/.test(t) || t.includes('-') || /d$/i.test(t);
  t = t.replace(/[()]/g, '').replace(/[^0-9.,]/g, '');
  if (!t) return null;
  if (t.includes(',') && t.includes('.')) {
    t = t.lastIndexOf(',') > t.lastIndexOf('.')
      ? t.replace(/\./g, '').replace(',', '.')     // 1.234,56
      : t.replace(/,/g, '');                        // 1,234.56
  } else if (t.includes(',')) {
    t = t.replace(',', '.');
  } else if (/\.\d{3}$/.test(t)) {
    t = t.replace(/\./g, '');                       // 1.234 é milhar, não decimal
  }
  const n = Number(t);
  if (!isFinite(n)) return null;
  return neg ? -Math.abs(n) : n;
}

/* dd/mm/aaaa · aaaa-mm-dd · aaaammdd */
function finData(bruto) {
  const t = String(bruto ?? '').trim();
  let m = t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m) {
    const ano = m[3].length === 2 ? '20' + m[3] : m[3];
    return `${ano}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  }
  m = t.match(/^(\d{8})$/);
  if (m) return `${t.slice(0, 4)}-${t.slice(4, 6)}-${t.slice(6, 8)}`;
  return null;
}

/* ── OFX ──────────────────────────────────────────────────────────
   OFX 1.x é SGML: as tags de valor abrem e não fecham. Por isso o
   campo é lido até a quebra de linha ou a próxima tag, e não com
   um par <x>…</x>. O bloco <STMTTRN> esse sim fecha, nas duas
   versões — é ele que delimita cada lançamento. */
function finLeOFX(txt) {
  const campo = (bloco, tag) => {
    const m = bloco.match(new RegExp('<' + tag + '>([^<\\r\\n]*)', 'i'));
    return m ? m[1].trim() : '';
  };
  const blocos = txt.match(/<STMTTRN>[\s\S]*?<\/STMTTRN>/gi) || [];
  const itens = blocos.map(b => {
    const d = campo(b, 'DTPOSTED').replace(/[^0-9]/g, '').slice(0, 8);
    const nome = campo(b, 'NAME'), memo = campo(b, 'MEMO');
    const desc = [nome, memo].filter(Boolean)
      .filter((v, i, a) => a.findIndex(x => finNorm(x) === finNorm(v)) === i).join(' · ');
    return {
      data: d.length === 8 ? `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}` : null,
      valor: finValor(campo(b, 'TRNAMT')),
      descricao: desc || campo(b, 'TRNTYPE') || 'Lançamento',
      fitid: campo(b, 'FITID') || null
    };
  }).filter(i => i.data && i.valor != null);
  return { itens, conta: campo(txt, 'ACCTID'), banco: campo(txt, 'ORG') };
}

/* ── CSV ────────────────────────────────────────────────────────── */
function finLeCSV(txt) {
  const t = txt.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const primeira = t.split('\n').find(l => l.trim()) || '';
  const del = [';', ',', '\t']
    .map(d => [d, primeira.split(d).length])
    .sort((a, b) => b[1] - a[1])[0][0];

  const linhas = []; let cel = '', linha = [], aspas = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (aspas) {
      if (c === '"') { if (t[i + 1] === '"') { cel += '"'; i++; } else aspas = false; }
      else cel += c;
    } else if (c === '"') aspas = true;
    else if (c === del) { linha.push(cel.trim()); cel = ''; }
    else if (c === '\n') { linha.push(cel.trim()); linhas.push(linha); linha = []; cel = ''; }
    else cel += c;
  }
  if (cel || linha.length) { linha.push(cel.trim()); linhas.push(linha); }
  return linhas.filter(l => l.some(c => c !== ''));
}

/* Adivinha quais colunas são data, descrição e valor. Primeiro pelo
   cabeçalho; se ele não ajudar, pelo conteúdo — a coluna em que
   quase tudo vira data é a data, e assim por diante. */
function finAdivinhaColunas(linhas) {
  const cab = linhas[0] || [];
  const corpo = linhas.slice(1, 40);
  const n = Math.max(...linhas.map(l => l.length));
  const acha = re => cab.findIndex(c => re.test(finNorm(c)));

  let iData  = acha(/^(data|date|dt)( |$)|data lancamento|data mov/);
  let iDesc  = acha(/desc|histor|lancamento|estabelec|memo|titulo|detalhe|operacao/);
  let iValor = acha(/^valor|^amount|^montante|^quantia/);
  const iSaida = acha(/debito|saida|despesa/);
  const iEntra = acha(/credito|entrada|recebimento/);

  /* "Valor débito" não é a coluna única de valor — é metade de um
     par. Sem isso o extrato do Itaú e do Bradesco entraria com todo
     mundo positivo. */
  if (iValor >= 0 && /debito|credito|saida|entrada/.test(finNorm(cab[iValor]))) iValor = -1;
  const separadas = iValor < 0 && iSaida >= 0 && iEntra >= 0;

  const taxa = (col, fn) => {
    const vals = corpo.map(l => l[col]).filter(v => v !== undefined && v !== '');
    if (!vals.length) return 0;
    return vals.filter(v => fn(v) != null).length / vals.length;
  };
  if (iData < 0)  { let melhor = -1, top = .6;
    for (let c = 0; c < n; c++) { const p = taxa(c, finData); if (p > top) { top = p; melhor = c; } }
    iData = melhor; }
  if (iValor < 0 && !separadas) { let melhor = -1, top = .6;
    for (let c = 0; c < n; c++) { if (c === iData) continue;
      const p = taxa(c, finValor); if (p > top) { top = p; melhor = c; } }
    iValor = melhor; }
  if (iDesc < 0)  { let melhor = -1, top = 0;
    for (let c = 0; c < n; c++) { if (c === iData || c === iValor) continue;
      const m = corpo.reduce((a, l) => a + String(l[c] || '').length, 0);
      if (m > top) { top = m; melhor = c; } }
    iDesc = melhor; }

  /* Cabeçalho é a linha cuja coluna de data não tem data dentro.
     Testar "alguma célula não é data" pegaria qualquer linha, já que
     descrição nunca é data — e comeria o primeiro lançamento dos
     arquivos que vêm sem cabeçalho. */
  const cabecalho = iData >= 0
    ? finData(cab[iData]) == null
    : !cab.some(c => finData(c) != null);

  return { data:iData, desc:iDesc, valor:separadas ? -1 : iValor,
           saida:separadas ? iSaida : -1, entrada:separadas ? iEntra : -1,
           cabecalho };
}

function finMontaCSV(linhas, mapa, inverter) {
  const corpo = mapa.cabecalho ? linhas.slice(1) : linhas;
  return corpo.map(l => {
    const data = finData(l[mapa.data]);
    let valor = null;
    if (mapa.valor >= 0) valor = finValor(l[mapa.valor]);
    else {
      const s = Math.abs(finValor(l[mapa.saida]) || 0), e = Math.abs(finValor(l[mapa.entrada]) || 0);
      if (s || e) valor = e - s;
    }
    if (!data || valor == null || valor === 0) return null;
    return {
      data, valor: inverter ? -valor : valor,
      descricao: String(l[mapa.desc] ?? '').replace(/\s+/g, ' ').trim() || 'Lançamento',
      fitid: null
    };
  }).filter(Boolean);
}

/* ── PDF ──────────────────────────────────────────────────────────
   Extrato em PDF não tem colunas de verdade: tem texto solto com
   coordenadas. Por isso a leitura aqui é geométrica, e não por
   expressão regular em cima da linha inteira — número colado em
   número é justamente onde o regex erra e some com o saldo ou com o
   valor. Junta-se o texto por altura (y) para formar a linha, e as
   colunas de dinheiro saem do agrupamento das bordas direitas (x),
   que é onde banco nenhum foge: valor é sempre alinhado à direita.

   O pdf.js só é baixado quando um PDF é solto — quem manda OFX não
   paga o megabyte da biblioteca. */
let pdfjsPromessa = null;
function finCarregaPDFjs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsPromessa) return pdfjsPromessa;
  const BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
  pdfjsPromessa = new Promise((ok, erro) => {
    const s = document.createElement('script');
    s.src = BASE + 'pdf.min.js';
    s.onload = () => {
      if (!window.pdfjsLib) { pdfjsPromessa = null; return erro(new Error('O leitor de PDF carregou mas não se registrou.')); }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = BASE + 'pdf.worker.min.js';
      ok(window.pdfjsLib);
    };
    s.onerror = () => { pdfjsPromessa = null;
      erro(new Error('Não deu para baixar o leitor de PDF. Confira a conexão e tente de novo.')); };
    document.head.appendChild(s);
  });
  return pdfjsPromessa;
}

/* Dinheiro no padrão brasileiro: sempre duas casas depois da
   vírgula. Aceita R$, parênteses, sinal e o D/C de débito e crédito
   que alguns bancos grudam no fim. */
const RE_DINHEIRO = /^[-+]?\(?\s*(?:r\$)?\s*(?:\d{1,3}(?:\.\d{3})+|\d+),\d{2}\)?\s*[dc]?$/i;
const finEhDinheiro = t => RE_DINHEIRO.test(String(t ?? '').trim());

const FIN_MESES = { jan:1, fev:2, mar:3, abr:4, mai:5, jun:6,
                    jul:7, ago:8, set:9, out:10, nov:11, dez:12 };

/* Data no começo da linha. Devolve também quantos tokens consumiu,
   porque "05 AGO" às vezes vem partido em dois pelo pdf.js. */
function finDataDaLinha(tokens) {
  const t0 = String(tokens[0]?.t ?? '').trim(), t1 = String(tokens[1]?.t ?? '').trim();
  const ano4 = a => a == null ? null : (String(a).length === 2 ? 2000 + Number(a) : Number(a));

  let m = t0.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/);
  if (m) return { dia:+m[1], mes:+m[2], ano:ano4(m[3]), usou:1 };

  m = t0.match(/^(\d{1,2})\s+([a-zà-ú]{3,})\.?(?:\s+(\d{2,4}))?$/i);
  if (m && FIN_MESES[finNorm(m[2]).slice(0, 3)])
    return { dia:+m[1], mes:FIN_MESES[finNorm(m[2]).slice(0, 3)], ano:ano4(m[3]), usou:1 };

  if (/^\d{1,2}$/.test(t0) && FIN_MESES[finNorm(t1).slice(0, 3)])
    return { dia:+t0, mes:FIN_MESES[finNorm(t1).slice(0, 3)], ano:null, usou:2 };

  return null;
}

/* Junta pedaços vizinhos num token só: o pdf.js entrega o texto
   picado por mudança de fonte, e "1.234,56" costuma vir em cacos. */
function finTokensDaLinha(itens) {
  const out = [];
  for (const i of itens) {
    const u = out[out.length - 1];
    if (u && i.x - (u.x + u.w) < 2.6) { u.t += i.t; u.w = (i.x + i.w) - u.x; }
    else out.push({ x:i.x, w:i.w, t:i.t });
  }
  return out.map(t => ({ x:t.x, w:t.w, dir:t.x + t.w, t:String(t.t).replace(/\s+/g, ' ').trim() }))
            .filter(t => t.t);
}

async function finLePDF(buffer, senha) {
  const pdfjs = await finCarregaPDFjs();
  /* Cópia, não view: o pdf.js transfere o buffer para o worker e o
     original fica destacado. Sem isso, a segunda tentativa — a que
     vai com a senha — estouraria em cima de um buffer morto. */
  const doc = await pdfjs.getDocument({
    data: new Uint8Array(buffer.slice(0)), password: senha || undefined,
    isEvalSupported: false, disableFontFace: true
  }).promise;

  const paginas = doc.numPages;
  const linhas = []; let bruto = '';
  for (let p = 1; p <= paginas; p++) {
    const conteudo = await (await doc.getPage(p)).getTextContent();
    const itens = conteudo.items
      .filter(i => i.str && i.str.trim())
      .map(i => ({ x:i.transform[4], y:i.transform[5], w:i.width || 0, t:i.str }));

    const porY = [];
    itens.forEach(i => {
      const l = porY.find(l => Math.abs(l.y - i.y) <= 2.5);
      if (l) l.itens.push(i); else porY.push({ y:i.y, pagina:p, itens:[i] });
    });
    porY.sort((a, b) => b.y - a.y);           // no PDF, y cresce para cima
    porY.forEach(l => {
      l.itens.sort((a, b) => a.x - b.x);
      l.tokens = finTokensDaLinha(l.itens);
      l.texto = l.tokens.map(t => t.t).join(' ');
      delete l.itens;
      bruto += l.texto + '\n';
      linhas.push(l);
    });
  }
  doc.destroy?.();
  return { linhas, bruto, paginas };
}

/* Colunas de dinheiro pela borda direita dos números. Cluster com
   menos de duas ocorrências é ruído (um total no rodapé, um número
   solto no cabeçalho) e não vira coluna. */
function finColunasPDF(linhas) {
  const xs = [];
  linhas.forEach(l => l.tokens.forEach(t => { if (finEhDinheiro(t.t)) xs.push(t.dir); }));
  if (!xs.length) return [];
  xs.sort((a, b) => a - b);
  const grupos = [];
  xs.forEach(x => {
    const g = grupos[grupos.length - 1];
    if (g && x - g.fim <= 14) { g.fim = x; g.n++; g.soma += x; }
    else grupos.push({ ini:x, fim:x, n:1, soma:x });
  });
  return grupos.filter(g => g.n >= 2)
    .map((g, i) => ({ i, centro:g.soma / g.n, ini:g.ini - 9, fim:g.fim + 9, n:g.n }));
}

const finAnoProvavel = bruto => {
  const achados = String(bruto).match(/\b(20\d{2})\b/g) || [];
  if (!achados.length) return new Date().getFullYear();
  const conta = {};
  achados.forEach(a => conta[a] = (conta[a] || 0) + 1);
  return Number(Object.entries(conta).sort((a, b) => b[1] - a[1])[0][0]);
};

/* Amostra de cada coluna, para a tela poder mostrar "é esta?" em vez
   de pedir que o usuário adivinhe qual número é o valor. */
function finAmostraColuna(linhas, col) {
  const v = [];
  for (const l of linhas) {
    for (const t of l.tokens)
      if (finEhDinheiro(t.t) && t.dir >= col.ini && t.dir <= col.fim) { v.push(t.t); break; }
    if (v.length >= 3) break;
  }
  return v;
}

function finMontaPDF(imp) {
  const { linhas, colunas, mapa, inverter } = imp;
  const naCol = (l, ci) => {
    if (ci < 0 || !colunas[ci]) return null;
    const c = colunas[ci];
    for (const t of l.tokens)
      if (finEhDinheiro(t.t) && t.dir >= c.ini && t.dir <= c.fim) return finValor(t.t);
    return null;
  };

  const brutos = [];
  let ano = mapa.ano, mesAnterior = null;
  for (const l of linhas) {
    const d = finDataDaLinha(l.tokens);
    if (!d) continue;

    let valor = null;
    if (mapa.valor >= 0) valor = naCol(l, mapa.valor);
    else {
      const s = Math.abs(naCol(l, mapa.saida) || 0), e = Math.abs(naCol(l, mapa.entrada) || 0);
      if (s || e) valor = e - s;
    }
    if (valor == null || valor === 0) continue;

    /* Extrato que só traz dia/mês vira ano errado na virada. Se o mês
       cai de repente (dezembro → janeiro), é ano novo. */
    if (d.ano) ano = d.ano;
    else if (mesAnterior != null && d.mes < mesAnterior - 6) ano++;
    mesAnterior = d.mes;

    const desc = l.tokens.slice(d.usou)
      .filter(t => !finEhDinheiro(t.t))
      .map(t => t.t).join(' ').replace(/\s+/g, ' ').trim();

    brutos.push({
      data: `${ano}-${String(d.mes).padStart(2, '0')}-${String(d.dia).padStart(2, '0')}`,
      valor: inverter ? -valor : valor,
      descricao: desc || 'Lançamento', fitid: null
    });
  }
  return brutos;
}

/* ── categorização ────────────────────────────────────────────────
   Regra do usuário sempre vence a semente. É isso que faz o sistema
   ficar mais certo com o uso em vez de repetir o mesmo erro. */
const FIN_SEMENTES = [
  { c:'Fatura do cartão', p:['pagamento de fatura','pagto fatura','pgto fatura','pagamento fatura','fatura cartao','pagamento cartao de credito'] },
  { c:'Investimentos',    p:['aplicacao','resgate','cdb','tesouro direto','nu invest','xp investimentos','rico investimentos','clear corretora','btg pactual','easynvest','avenue','binance','mercado bitcoin','previdencia','rendimento','poupanca'] },

function finCategoriza(descricao, valor) {
  const t = ' ' + finNorm(descricao) + ' ';
  for (const r of fin.regras) {
    const p = finNorm(r.padrao);
    if (p && t.includes(p)) return r.categoria_id;
  }
  for (const s of FIN_SEMENTES) {
    if (s.p.some(p => t.includes(p))) {
      const id = finCatId(s.c);
      if (id) return id;
    }
  }
  return finCatId(valor > 0 ? 'Outras receitas' : 'Sem categoria');
}

/* ── digital do lançamento ────────────────────────────────────────
   Quando o banco manda FITID, ele é a digital: identificador do
   próprio banco, melhor que qualquer coisa que a gente monte.
   Sem FITID, a digital é conta+data+valor+descrição — e a contagem
   por ocorrência resolve o caso legítimo de dois cafés iguais no
   mesmo dia, que não podem virar um só. */
const finBaseImpressao = (it, conta) =>
  it.fitid ? `fit|${conta || '-'}|${it.fitid}`
           : [conta || '-', it.data, Number(it.valor).toFixed(2), finNorm(it.descricao).slice(0, 60)].join('|');

async function finPreparaItens(itens, conta_id) {
  const datas = itens.map(i => i.data).sort();
  const existentes = new Set();
  if (datas.length) {
    const antigos = await q('fin_lancamentos', x =>
      x.gte('data', datas[0]).lte('data', datas[datas.length - 1]));
    antigos.forEach(a => existentes.add(a.impressao));
  }
  const vistos = new Map();
  return itens.map(it => {
    const base = finBaseImpressao(it, conta_id);
    const n = vistos.get(base) || 0; vistos.set(base, n + 1);
    const impressao = n ? `${base}#${n}` : base;
    const duplicado = existentes.has(impressao);
    return { ...it, impressao, duplicado, usar: !duplicado,
             categoria_id: finCategoriza(it.descricao, it.valor) };
  });
}

/* ── contas do mês ────────────────────────────────────────────────
   Transferência não é gasto nem receita: PIX entre contas suas e
   pagamento de fatura só mudariam o dinheiro de lugar e inflariam
   os dois lados. Fica fora de toda soma. */
function finResumo(linhas) {
  const val = l => Number(l.valor) || 0;
  const uteis = linhas.filter(l => !l.ignorado && finGrupo(l.categoria_id) !== 'transferencia');
  const entradas = uteis.filter(l => val(l) > 0), saidas = uteis.filter(l => val(l) < 0);
  const soma = ls => ls.reduce((a, l) => a + val(l), 0);
  const entrou = soma(entradas), saiu = -soma(saidas);
  const ess = -soma(saidas.filter(l => finCat(l.categoria_id)?.essencial));
  const inv = -soma(saidas.filter(l => finGrupo(l.categoria_id) === 'investimento'));
  return { entrou, saiu, sobrou: entrou - saiu, essencial: ess,
           cortavel: saiu - ess - inv, investido: inv,
           qtd: uteis.length, saidas };
}

function finPorCategoria(linhas) {
  const mapa = new Map();
  linhas.filter(l => !l.ignorado && Number(l.valor) < 0
                  && finGrupo(l.categoria_id) !== 'transferencia')
    .forEach(l => {
      const k = l.categoria_id || 'sem';
      const a = mapa.get(k) || { id:l.categoria_id, total:0, n:0 };
      a.total += -Number(l.valor); a.n++; mapa.set(k, a);
    });
  return [...mapa.values()].sort((a, b) => b.total - a.total);
}

const finProxMes = mes => {
  const [a, m] = mes.split('-').map(Number);
  return m === 12 ? `${a + 1}-01-01` : `${a}-${String(m + 1).padStart(2, '0')}-01`;
};
const finMesAnterior = mes => {
  const [a, m] = mes.split('-').map(Number);
  return m === 1 ? `${a - 1}-12` : `${a}-${String(m - 1).padStart(2, '0')}`;
};
function finOptMeses(n = 24) {
  const out = [], d = new Date();
  for (let i = 0; i < n; i++) {
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    const v = `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}`;
    const t = m.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
    out.push({ v, t: t[0].toUpperCase() + t.slice(1) });
  }
  return out;
}
const finLancsDoMes = mes => q('fin_lancamentos', x =>
  x.gte('data', mes + '-01').lt('data', finProxMes(mes)).order('data', { ascending:false }));

/* Cartão que abre o painel logo depois de importar: diz o que acabou
   de entrar, para a pessoa não cair numa tela cheia de número sem
   saber qual parte é do arquivo que ela mandou agora.

   Vive só na memória — fecha no botão, na próxima importação, ou
   quando a página recarrega. Não vai para o banco de propósito: é
   recado de um instante, e recado que persiste vira sujeira. */
function finCartaoImport() {
  const u = fin.ultimo; if (!u) return '';
  return `<div class="card" style="border-color:var(--ac)">
    <div class="ch"><h3>${ico('check',15)} ${num(u.n)} lançamento(s) importado(s)</h3>

        : ' · nada ficou sem categoria'}.
      ${u.semCat ? 'Cada correção que você fizer vira regra e não erra de novo.' : ''}
    </div></div>`;
}

R.finPainel = {

    await finBase();
    if (!fin.temBanco) return { sem:true };
    const [mes, ant] = await Promise.all([
      finLancsDoMes(fin.mes), finLancsDoMes(finMesAnterior(fin.mes))
    ]);
    const filtra = ls => fin.conta ? ls.filter(l => l.conta_id === fin.conta) : ls;
    return { mes: filtra(mes), ant: filtra(ant) };
  },
  render(d) {
    if (d.sem) return finSemBanco();
    const { mes, ant } = d;
    const r = finResumo(mes), ra = finResumo(ant);
    const cats = finPorCategoria(mes), catsAnt = finPorCategoria(ant);
    const antPorCat = new Map(catsAnt.map(c => [c.id || 'sem', c.total]));
    const maior = cats[0]?.total || 1;

    const varia = (agora, antes) => {
      if (!antes) return null;
      return (agora - antes) / antes * 100;
    };
    const setaVar = v => v == null ? ''
      : `<span style="color:${v > 0 ? 'var(--bad)' : 'var(--ok)'}">${v > 0 ? '▲' : '▼'} ${pc(Math.abs(v))}</span>`;

    const filtros = `<div class="filtros">
      ${dd('Mês', 'mes', finOptMeses(), fin.mes, { icone:'cal' })}
      ${dd('Conta', 'conta', [{ v:'', t:'Todas as contas' },
        ...fin.contas.map(c => ({ v:c.id, t:c.nome, i:'db' }))], fin.conta)}
      <span class="sm2">${r.qtd} lançamento(s)</span></div>`;

    if (!mes.length) return `<div class="head"><div><h2>Meu dinheiro</h2>
        <div class="sub">Privado. Nem quem administra o sistema enxerga esta tela.</div></div>
        <div class="push"><button class="btn" data-act="importar">${ico('down',15)}Mandar extrato</button></div></div>
      ${filtros}
      <div class="card">${vazio('money', 'Nenhum lançamento neste mês',
        'Mande o extrato em OFX ou CSV e o sistema separa sozinho onde o dinheiro foi.',
        { act:'importar', label:'Mandar extrato' })}</div>`;

    const semCat = mes.filter(l => !l.categoria_id || finNomeCat(l.categoria_id) === 'Sem categoria').length;
    const estourou = cats.filter(c => { const cc = finCat(c.id); return cc?.orcamento && c.total > Number(cc.orcamento); });
    const subiu = cats.filter(c => antPorCat.get(c.id || 'sem') > 0)
      .map(c => ({ ...c, dif: c.total - antPorCat.get(c.id || 'sem') }))
      .sort((a, b) => b.dif - a.dif)[0];

    const alertas = [

/* Depois de corrigir uma categoria, oferece transformar a correção
   em regra. É o que faz o sistema parar de errar no mesmo lugar —
   e o que dispensa qualquer IA para categorizar extrato. */
function finOfereceRegra(lanc, categoriaId) {
  const palavras = finNorm(lanc.descricao).split(' ')
    .filter(p => p.length > 3 && !/^\d+$/.test(p));
  const sugestao = palavras.slice(0, 2).join(' ') || finNorm(lanc.descricao).slice(0, 20);
  const ja = fin.regras.find(r => finNorm(r.padrao) === sugestao);

  modal({
    titulo: 'Guardar essa correção?', ok: 'Criar regra', largura: 480,
    corpo: `<div style="color:var(--txt2);font-size:13.5px;line-height:1.6;margin-bottom:16px">
        Todo lançamento cuja descrição contenha o trecho abaixo passa a cair em
        <b>${esc(finNomeCat(categoriaId))}</b> sozinho.</div>
      <div><label>Trecho procurado</label>
        <input data-p value="${esc(sugestao)}">
        <div class="hint">Comparado sem acento e sem maiúscula. Original: "${esc(lanc.descricao)}"</div></div>
      <div class="chk" style="margin-top:14px"><input type="checkbox" data-retro checked>
        <label>Aplicar também nos lançamentos que já estão aqui</label></div>
      ${ja ? `<div class="hint" style="margin-top:10px;color:var(--warn)">
        Já existe uma regra com esse trecho — ela será atualizada.</div>` : ''}`,
    onOk: async mask => {
      const padrao = mask.querySelector('[data-p]').value.trim();
      const retro = mask.querySelector('[data-retro]').checked;
      if (!padrao) { const e = mask.querySelector('.err');
        e.textContent = 'Escreva o trecho.'; e.hidden = false; return false; }

      const { error } = await sb.from('fin_regras')
        .upsert({ padrao, categoria_id: categoriaId, prioridade: 10, origem: 'aprendida' },
                { onConflict: 'dono,padrao' });
      if (error) { toast(error.message, { tipo:'bad' }); return false; }

      let tocados = 0;
      if (retro) {
        /* Filtro em JS, não `.neq` no banco: em SQL, `categoria_id <>
           x` é nulo quando a coluna é nula, então os lançamentos sem
           categoria — justamente os que mais precisam da regra —
           ficariam de fora. */
        const todos = await q('fin_lancamentos', x => x.limit(5000));
        const alvo = todos.filter(l => l.categoria_id !== categoriaId
          && finNorm(l.descricao).includes(finNorm(padrao)));
        if (alvo.length) {
          const { error: e2 } = await sb.from('fin_lancamentos')
            .update({ categoria_id: categoriaId }).in('id', alvo.map(l => l.id));
          if (e2) toast(e2.message, { tipo:'bad' }); else tocados = alvo.length;
        }
      }
      await finBase();
      toast(tocados ? `Regra criada e aplicada em ${tocados} lançamento(s).` : 'Regra criada.');
      await pinta();
      return true;
    }
  });
  /* Fechar sem criar a regra não desfaz nada: a categoria daquele
     lançamento já foi trocada. */
  setTimeout(() => {
    const b = $('.mask .btn.ghost');
    if (b) { b.textContent = 'Só neste'; b.onclick = () => { $('.mask')?.remove(); pinta(); }; }
  }, 10);
}

function formFinLancamento(row) {
  form(row ? 'Editar lançamento' : 'Novo lançamento', [
    { k:'data', label:'Data', type:'date', req:true, value:row?.data || hoje() },
    { k:'descricao', label:'Descrição', req:true, value:row?.descricao, ph:'Ex.: Almoço com o time' },
    { k:'valor', label:'Valor (R$)', type:'number', step:'0.01', req:true, value:row?.valor,
      hint:'Negativo é saída, positivo é entrada. Um gasto de 80 reais é -80.' },
    { k:'categoria_id', label:'Categoria', type:'select', value:row?.categoria_id, opts:optFinCats() },
    { k:'conta_id', label:'Conta', type:'select', value:row?.conta_id,
      opts:[{ v:'', t:'— sem conta —' }, ...fin.contas.map(c => ({ v:c.id, t:c.nome }))] },
    { k:'observacao', label:'Observação', type:'textarea', value:row?.observacao },
    { k:'ignorado', type:'checkbox', label:'Ignorado', cap:'Não contar nas somas', value:row?.ignorado || false }
  ], async d => {
    if (!d.valor) { toast('O valor não pode ser zero.', { tipo:'bad' }); return false; }
    if (row) return grava('fin_lancamentos', d, row.id);
    d.origem = 'manual';
    d.impressao = `manual|${d.data}|${Number(d.valor).toFixed(2)}|${finNorm(d.descricao).slice(0, 60)}|${Date.now()}`;
    return grava('fin_lancamentos', d);
  });
}

/* ───────────────────────── IMPORTAR EXTRATO ───────────────────────── */
/* ── dashboard do extrato ─────────────────────────────────────────
   O extrato já chegava categorizado, mas a prévia só mostrava a
   lista: para saber em que o dinheiro foi era preciso gravar antes e
   depois ir ao painel. Aqui a conta aparece antes de gravar — e, por
   ser antes, corrigir uma categoria conserta o número na hora em vez
   de virar retrabalho depois.

   Soma só o que está marcado. Desmarcar uma linha redesenha o bloco:
   é isso que faz a prévia ser uma decisão, e não uma formalidade. */
function finDashImport(itens) {
  const marcados = itens.filter(i => i.usar);
  const ehTransf = i => finGrupo(i.categoria_id) === 'transferencia';
  const semCat  = marcados.filter(i => !i.categoria_id || finNomeCat(i.categoria_id) === 'Sem categoria');
  const saidas  = marcados.filter(i => i.valor < 0 && !ehTransf(i));
  const entradas= marcados.filter(i => i.valor > 0 && !ehTransf(i));
  const transf  = marcados.filter(ehTransf);

  const soma = ls => ls.reduce((a, i) => a + Math.abs(Number(i.valor) || 0), 0);
  const saiu = soma(saidas), entrou = soma(entradas);
  const essencial = soma(saidas.filter(i => finCat(i.categoria_id)?.essencial));
  const investido = soma(saidas.filter(i => finGrupo(i.categoria_id) === 'investimento'));

  const mapa = new Map();
  saidas.forEach(i => {
    const k = i.categoria_id || 'sem';
    const a = mapa.get(k) || { id:i.categoria_id, total:0, n:0 };
    a.total += Math.abs(Number(i.valor)); a.n++; mapa.set(k, a);
  });
  const cats = [...mapa.values()].sort((a, b) => b.total - a.total);
  const maior = cats[0]?.total || 1;
  const parte = t => saiu ? t / saiu * 100 : 0;

  const cabeca = `<div class="ch"><h3>${ico('chart',15)} Onde esse extrato foi parar</h3>
    <div class="push">
      ${semCat.length
        ? `<span class="pill warn">${semCat.length} sem categoria</span>
           <button class="btn sm ghost" data-act="so-sem">${
             fin.imp?.soSem ? 'Ver todos' : 'Resolver agora'}</button>`
        : `<span class="pill ok">${ico('check',12)} tudo categorizado</span>`}
    </div></div>`;

  if (!marcados.length) return `<div class="card" id="fdash">${cabeca}
    <div class="cb">${vazio('inbox', 'Nada marcado',
      'Marque as linhas que devem entrar e o resumo se desenha aqui.')}</div></div>`;

  if (!cats.length) return `<div class="card" id="fdash">${cabeca}
    <div class="cb" style="color:var(--txt2);font-size:13.5px">
      Nenhuma saída neste arquivo — só ${entradas.length} entrada(s), somando
      <b style="color:var(--ok)">${brl(entrou)}</b>.</div></div>`;

  return `<div class="card" id="fdash">${cabeca}
    <div class="cb">
      <div class="fnums">
        <div><div class="n" style="color:var(--bad)">${brl(saiu)}</div>
          <div class="l">Saiu em ${cats.length} categoria(s)</div></div>
        <div><div class="n" style="color:var(--ok)">${brl(entrou)}</div>
          <div class="l">Entrou</div></div>
        <div><div class="n">${brl(essencial)}</div>
          <div class="l">Essencial · ${pc(parte(essencial))} do que saiu</div></div>
        <div><div class="n" style="color:var(--warn)">${brl(saiu - essencial - investido)}</div>
          <div class="l">Dá para cortar${investido ? ` · investido ${brl(investido)}` : ''}</div></div>
      </div>

      <div class="fstack">${cats.map(c =>
        `<i style="flex:${c.total};background:${esc(finCor(c.id))}"
            title="${esc(finNomeCat(c.id))} — ${brl(c.total)}"></i>`).join('')}</div>
      <div class="fleg">${cats.slice(0, 6).map(c =>
        `<span><span class="fdot" style="background:${esc(finCor(c.id))}"></span>
          ${esc(finNomeCat(c.id))} <b>${pc(parte(c.total))}</b></span>`).join('')}
        ${cats.length > 6 ? `<span class="sm2">+${cats.length - 6} categoria(s)</span>` : ''}</div>
    </div>

    ${cats.map(c => {
      const cc = finCat(c.id);
      return `<div class="fgasto">
        <div class="g">
          <div class="t"><span class="fdot" style="background:${esc(finCor(c.id))}"></span>
            ${esc(finNomeCat(c.id))}
            ${cc?.essencial ? '<span class="pill dim">essencial</span>' : ''}
            ${!c.id || finNomeCat(c.id) === 'Sem categoria'
              ? '<span class="pill warn">definir</span>' : ''}</div>
          <div class="bar"><i style="width:${Math.max(2, c.total / maior * 100)}%;
            background:${esc(finCor(c.id))}"></i></div>
          <div class="m">${c.n} lançamento(s) · ${pc(parte(c.total))} do que saiu</div>
        </div>
        <div class="v"><b>${brl(c.total)}</b></div>
      </div>`;
    }).join('')}

    ${transf.length ? `<div class="cb" style="border-top:1px solid var(--line);
        color:var(--dim);font-size:12.5px;line-height:1.6">
      ${transf.length} lançamento(s) em categoria de transferência (${brl(soma(transf))})
      ficam fora destas somas — PIX entre contas suas e pagamento de fatura só mudam
      o dinheiro de lugar, e contá-los inflaria os dois lados.</div>` : ''}
  </div>`;
}

/* Trocar a categoria de uma linha não pode repintar a tela inteira:
   a prévia tem centenas de linhas e o usuário perderia a rolagem no
   meio da conferência. Redesenha só o bloco do resumo. */
function finRedesenhaDash() {
  const alvo = document.getElementById('fdash');
  if (alvo && fin.imp) alvo.outerHTML = finDashImport(fin.imp.itens || []);
}

    map(el) { fin.imp.mapa[el.dataset.k] = Number(el.value); finRemontaCSV(); },

    inverter(el) { fin.imp.inverter = el.checked; finRemontaCSV(); },
    mappdf(el)   { fin.imp.mapa[el.dataset.k] = Number(el.value); finRemontaPDF(); },
    anopdf(el)   { fin.imp.mapa.ano = Number(el.value) || fin.imp.mapa.ano; finRemontaPDF(); },
    inverterpdf(el) { fin.imp.inverter = el.checked; finRemontaPDF(); },
    'p-usar'(el) { fin.imp.itens[+el.dataset.i].usar = el.checked;
      el.closest('tr').classList.toggle('fora', !el.checked); finRedesenhaDash(); },
    'p-cat'(el)  { fin.imp.itens[+el.dataset.i].categoria_id = el.value || null;
      finRedesenhaDash(); },
    'so-sem'()   { fin.imp.soSem = !fin.imp.soSem; pinta(); },
    'marcar-todos'() { fin.imp.itens.forEach(i => i.usar = true); pinta(); },
    'desmarcar-dups'() { fin.imp.itens.forEach(i => { if (i.duplicado) i.usar = false; }); pinta(); },
    async gravar(b) {
      const imp = fin.imp;
      const linhas = imp.itens.filter(i => i.usar).map(i => ({
        conta_id: imp.conta_id || null, data: i.data, descricao: i.descricao,
        descricao_original: i.descricao, valor: i.valor,
        categoria_id: i.categoria_id || null, origem: imp.tipo,
        id_externo: i.fitid || null, impressao: i.impressao
      }));
      if (!linhas.length) return toast('Nenhuma linha marcada.', { tipo:'info' });

      b.disabled = true; b.textContent = 'Importando…';
      let gravadas = 0;
      for (let i = 0; i < linhas.length; i += 200) {
        const { error } = await sb.from('fin_lancamentos').insert(linhas.slice(i, i + 200));
        if (error) { toast(error.message, { tipo:'bad' }); b.disabled = false; return; }
        gravadas += Math.min(200, linhas.length - i);
      }
      /* O que acabou de entrar, guardado para o painel abrir dizendo
         o que mudou. Sem isso a pessoa cai numa tela cheia de números
         sem saber quais são os do arquivo que ela mandou agora. */
      const usados = imp.itens.filter(i => i.usar);
      const datas = usados.map(i => i.data).sort();
      fin.ultimo = {
        n: gravadas,
        arquivo: imp.nome,
        de: datas[0], ate: datas[datas.length - 1],
        cats: new Set(usados.filter(i => i.valor < 0).map(i => i.categoria_id || 'sem')).size,
        semCat: usados.filter(i => !i.categoria_id
          || finNomeCat(i.categoria_id) === 'Sem categoria').length
      };
      fin.imp = null;
      fin.mes = linhas[0].data.slice(0, 7);
      toast(`${gravadas} lançamento(s) importado(s).`);
      vai('finPainel');
    }
  }
};

function finEscolheArquivo() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.ofx,.csv,.txt,.pdf,text/csv,application/pdf,application/x-ofx';
  inp.onchange = () => { if (inp.files[0]) finLeArquivo(inp.files[0]); };
  inp.click();
}

const finEhPDF = (file, buffer) =>
  /\.pdf$/i.test(file.name) || file.type === 'application/pdf' ||
  String.fromCharCode(...new Uint8Array(buffer).slice(0, 5)) === '%PDF-';

async function finLeArquivo(file, senha) {
  const buffer = await file.arrayBuffer();
  fin.imp = { nome: file.name, conta_id: fin.contas[0]?.id || '', inverter: false, lendo: true };

  if (finEhPDF(file, buffer)) { await finLeArquivoPDF(file, buffer, senha); return; }

  const texto = finDecodifica(buffer);
  fin.imp.lendo = false;
  if (/\.ofx$/i.test(file.name) || /<STMTTRN>/i.test(texto)) {
    const { itens, conta } = finLeOFX(texto);
    fin.imp.tipo = 'ofx'; fin.imp.contaOFX = conta; fin.imp.brutos = itens;
  } else {
    const linhas = finLeCSV(texto);
    if (!linhas.length) { fin.imp.erro = 'O arquivo está vazio ou não é um CSV.'; return pinta(); }
    fin.imp.tipo = 'csv'; fin.imp.linhas = linhas;
    fin.imp.mapa = finAdivinhaColunas(linhas);
    fin.imp.brutos = finMontaCSV(linhas, fin.imp.mapa, false);
  }
  await finRecalcula();
}

async function finLeArquivoPDF(file, buffer, senha) {
  fin.imp.tipo = 'pdf';
  pinta();                                   // mostra "lendo o PDF…" enquanto o pdf.js baixa
  let lido;
  try {
    lido = await finLePDF(buffer, senha);
  } catch (e) {
    fin.imp.lendo = false;
    /* Extrato de banco costuma vir travado com CPF ou data de
       nascimento. Vale pedir a senha em vez de dizer "deu erro". */
    if (e?.name === 'PasswordException') { finPedeSenhaPDF(file, buffer); return; }
    fin.imp.erro = 'Não deu para abrir esse PDF: ' + (e?.message || e);
    return pinta();
  }
  fin.imp.lendo = false;

  if (lido.bruto.trim().length < 40) {
    fin.imp.erro = 'Esse PDF não tem texto dentro — é imagem digitalizada, e daí não há o que ler. '
      + 'Peça no banco a versão OFX ou CSV do mesmo extrato.';
    return pinta();
  }

  const colunas = finColunasPDF(lido.linhas);
  if (!colunas.length) {
    fin.imp.erro = 'Li o texto do PDF mas não achei nenhuma coluna de valores nele. '
      + 'Confirme que é o extrato, e não o comprovante ou o informe de rendimentos.';
    fin.imp.linhas = lido.linhas; fin.imp.paginas = lido.paginas;
    return pinta();
  }

  /* A última coluna quase sempre é o saldo corrente, não o valor do
     lançamento — por isso a penúltima é o palpite. */
  const valorProvavel = colunas.length > 1 ? colunas.length - 2 : 0;
  const temAnoNoTexto = lido.linhas.some(l => finDataDaLinha(l.tokens)?.ano);

  Object.assign(fin.imp, {
    linhas: lido.linhas, colunas, paginas: lido.paginas, precisaAno: !temAnoNoTexto,
    mapa: { valor: valorProvavel, saida:-1, entrada:-1, ano: finAnoProvavel(lido.bruto) }
  });
  fin.imp.brutos = finMontaPDF(fin.imp);
  await finRecalcula();
}

function finPedeSenhaPDF(file, buffer) {
  modal({
    titulo: 'Esse PDF está com senha', ok: 'Abrir', largura: 440,
    corpo: `<div style="color:var(--txt2);font-size:13.5px;line-height:1.6;margin-bottom:15px">
        Banco costuma travar o extrato com os primeiros dígitos do CPF ou a data de nascimento.
        A senha é usada só para abrir o arquivo aqui no navegador — ela não é guardada nem enviada.</div>
      <div><label>Senha do arquivo</label><input type="password" data-s autocomplete="off"></div>`,
    onOk: async mask => {
      const senha = mask.querySelector('[data-s]').value;
      if (!senha) { const e = mask.querySelector('.err');
        e.textContent = 'Digite a senha.'; e.hidden = false; return false; }
      await finLeArquivoPDF(file, buffer, senha);
      return true;
    }
  });
}

/* Ordenado do mais recente para o mais antigo, como o extrato. */
async function finRecalcula() {
  const brutos = [...(fin.imp.brutos || [])].sort((a, b) => b.data.localeCompare(a.data));
  fin.imp.itens = await finPreparaItens(brutos, fin.imp.conta_id);
  await pinta();
}
async function finRemontaCSV() {
  fin.imp.brutos = finMontaCSV(fin.imp.linhas, fin.imp.mapa, fin.imp.inverter);
  await finRecalcula();
}
async function finRemontaPDF() {
  fin.imp.brutos = finMontaPDF(fin.imp);
  await finRecalcula();
}

function formFinConta(row) {
  form(row ? 'Editar conta' : 'Nova conta', [
    { k:'nome', label:'Nome', req:true, value:row?.nome, ph:'Ex.: Nubank pessoal' },
    { k:'tipo', label:'Tipo', type:'select', value:row?.tipo || 'corrente', opts:[
      { v:'corrente', t:'Conta corrente' }, { v:'poupanca', t:'Poupança' },
      { v:'cartao', t:'Cartão de crédito' }, { v:'dinheiro', t:'Dinheiro' },
      { v:'investimento', t:'Investimento' }] },
    { k:'instituicao', label:'Banco', value:row?.instituicao, ph:'Ex.: Nubank' },
    { k:'ativa', type:'checkbox', label:'Ativa', cap:'Ativa', value: row ? row.ativa : true }
  ], async d => {
    const ok = await grava('fin_contas', d, row?.id);
    if (ok) { await finBase(); if (fin.imp && !fin.imp.conta_id) {
      fin.imp.conta_id = fin.contas.find(c => c.nome === d.nome)?.id || ''; await finRecalcula(); } }
    return ok;
  });
}

    'edit-regra'(b) { formFinRegra(fin.regras.find(r => r.id === b.dataset.id)); },
    'del-regra'(b) { confirma('Excluir regra',
      'Os lançamentos já categorizados continuam como estão.',
      async () => { const ok = await apaga('fin_regras', b.dataset.id); if (ok) await finBase(); return ok; }); },
    'nova-conta'() { formFinConta(); },
    'edit-conta'(b) { formFinConta(fin.contas.find(c => c.id === b.dataset.id)); },
    'del-conta'(b) { confirma('Excluir conta',
      'Os lançamentos continuam, só ficam sem conta.',
      async () => { const ok = await apaga('fin_contas', b.dataset.id); if (ok) await finBase(); return ok; }); },
    /* Reaplicar não mexe no que você categorizou à mão sem regra:
       só recalcula o que hoje está sem categoria ou em "Sem categoria". */
    reaplicar() {
      confirma('Reaplicar as regras', `Vale para os lançamentos sem categoria e os que estão em
        "Sem categoria". O que você categorizou à mão fica como está.`, async () => {
        const semId = finCatId('Sem categoria');
        const todos = await q('fin_lancamentos', x => x.limit(5000));
        const alvo = todos.filter(l => !l.categoria_id || l.categoria_id === semId);
        let n = 0;
        for (const l of alvo) {
          const novo = finCategoriza(l.descricao, Number(l.valor));
          if (novo && novo !== l.categoria_id) {
            await sb.from('fin_lancamentos').update({ categoria_id: novo }).eq('id', l.id);
            n++;
          }
        }
        toast(n ? `${n} lançamento(s) recategorizado(s).` : 'Nada mudou — as regras já estavam aplicadas.');
        return true;
      }, { perigo:false });
    }
  }
};

let cmdAberto = false;
async function palette() {
  if (cmdAberto) return;
  cmdAberto = true;
  const el = document.createElement('div');
  el.className = 'cmdk';
  el.innerHTML = `<div class="box">
    <div class="ci">${ico('search', 18)}<input placeholder="Buscar ou executar…" autofocus></div>
    <div class="cl"></div>
    <div class="cf"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>↵</kbd> abrir</span><span><kbd>esc</kbd> fechar</span></div></div>`;
  document.body.appendChild(el);

  const acoesRapidas = [
    /* Separado por modo porque "Financeiro" existe dos dois lados —
       o do marketing e o seu. Sem o grupo, viram dois itens iguais. */
    ...Object.entries(R).filter(([k]) => podeVer(k)).map(([k, r]) => ({
      g: modoDaRota(k) === 'pessoal' ? 'Gestão Pessoal' : 'Navegar',
      t: r.label, ic: r.icone, run: () => vai(k) })),
    { g:'Ações', t:'Nova ação', ic:'plus', sc:'N', run:() => formAcao() },
    { g:'Ações', t:'Nova rotina recorrente', ic:'refresh', run:() => R.acoes.acoes.modelo() },
    { g:'Ações', t:'Gerar rotinas de hoje', ic:'zap', run:() => R.inicio.acoes.gerar() },
    { g:'Ações', t:'Gerar a semana inteira', ic:'cal', run:() => R.inicio.acoes['gerar-semana']() },
    { g:'Ações', t:'Nova campanha', ic:'target', run:() => formCampanha() },
    { g:'Ações', t:'Registrar feedback', ic:'users', run:() => R.time.acoes.fb() },
    { g:'Sistema', t:`Tema ${pref.theme === 'dark' ? 'claro' : 'escuro'}`, ic:pref.theme === 'dark' ? 'sun' : 'moon',
      run:() => { pref.theme = pref.theme === 'dark' ? 'light' : 'dark'; savePref(); montaShell(); } },
    { g:'Sistema', t:'Recarregar dados', ic:'refresh', sc:'R', run:() => { recarregaBase().then(pinta); } },
    { g:'Sistema', t:'Sair da conta', ic:'out', run:() => sb.auth.signOut().then(() => location.reload()) }
  ];

  let registros = [];
  Promise.all([
    q('acoes', x => x.eq('recorrencia', 'nenhuma').order('created_at', { ascending:false }).limit(120)),
    q('campanhas'), q('producao_conteudo', x => x.limit(120))
  ]).then(([a, c, p]) => {
    registros = [
      ...a.map(r => ({ g:'Ações', t:r.titulo, ic:'check', run:() => { vai('acoes'); setTimeout(() => formAcao(r), 260); } })),
      ...c.map(r => ({ g:'Campanhas', t:r.nome, ic:'target', run:() => { vai('campanhas'); setTimeout(() => formCampanha(r), 260); } })),
      ...p.map(r => ({ g:'Conteúdo', t:r.titulo, ic:'film', run:() => vai('producao') })),
      ...cache.usuarios.map(r => ({ g:'Time', t:r.nome, ic:'user', run:() => vai('time') })),
      ...cache.canais.map(r => ({ g:'Canais', t:r.nome, ic:'target', run:() => { vai('config'); abaCfg = 'time'; } }))
    ];
    desenha();
  });

  const inp = el.querySelector('input'), lista = el.querySelector('.cl');
  let sel = 0, atuais = [];

  function desenha() {
    const termo = inp.value.trim().toLowerCase();
    const base = termo ? [...acoesRapidas, ...registros] : acoesRapidas;
    atuais = (termo ? base.filter(i => i.t.toLowerCase().includes(termo)) : base).slice(0, 40);
    sel = Math.min(sel, Math.max(0, atuais.length - 1));
    if (!atuais.length) { lista.innerHTML = `<div class="empty" style="padding:34px"><p>Nada encontrado para "${esc(inp.value)}".</p></div>`; return; }
    let html = '', gAtual = null;
    atuais.forEach((i, n) => {
      if (i.g !== gAtual) { gAtual = i.g; html += `<div class="sec">${esc(i.g)}</div>`; }
      html += `<div class="it ${n === sel ? 'sel' : ''}" data-n="${n}">${ico(i.ic || 'arrowR', 16)}
        <span>${esc(i.t)}</span>${i.sc ? `<span class="sc"><kbd>${i.sc}</kbd></span>` : ''}</div>`;
    });
    lista.innerHTML = html;
    lista.querySelector('.it.sel')?.scrollIntoView({ block:'nearest' });
  }
  function fecha() { el.remove(); cmdAberto = false; document.removeEventListener('keydown', kd, true); }
  function roda(i) { fecha(); i?.run(); }
  function kd(e) {
    if (e.key === 'Escape') { e.preventDefault(); fecha(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % atuais.length; desenha(); }
    else if (e.key === 'ArrowUp')   { e.preventDefault(); sel = (sel - 1 + atuais.length) % atuais.length; desenha(); }
    else if (e.key === 'Enter')     { e.preventDefault(); roda(atuais[sel]); }
  }
  document.addEventListener('keydown', kd, true);
  inp.oninput = () => { sel = 0; desenha(); };
  lista.onclick = e => { const it = e.target.closest('.it'); if (it) roda(atuais[+it.dataset.n]); };
  el.onclick = e => { if (e.target === el) fecha(); };
  desenha(); inp.focus();
}

/* ── seletor em menu ──────────────────────────────────────────────
   `dd()` desenha o botão; o clique é interceptado na delegação da
   view e abre a lista vertical. */
function dd(rotulo, act, opcoes, atual, extra = {}) {
  const sel = opcoes.find(o => String(o.v) === String(atual ?? '')) || opcoes[0];
  // `fixo` transforma o seletor em botão de ação: o rótulo não muda
  const texto = extra.fixo || (sel ? sel.t : '—');
  return `<button class="dd ${extra.cls || ''}" data-act="dd" data-alvo="${esc(act)}"
    data-atual="${esc(atual ?? '')}" data-opts='${esc(JSON.stringify(opcoes))}'>
    ${extra.icone ? ico(extra.icone, 15) : ''}
    ${rotulo ? `<span class="rot">${esc(rotulo)}</span>` : ''}
    <b>${esc(texto)}</b><span class="cv">${ico('chevron', 13)}</span></button>`;
}

function abreSeletor(botao) {
  let opcoes = [];
  try { opcoes = JSON.parse(botao.dataset.opts); } catch { return; }
  const atual = botao.dataset.atual, act = botao.dataset.alvo;
  botao.classList.add('aberto');

  const alvo = popover(botao, `<div class="pl">${opcoes.map(o => `
    <div class="mi ${String(o.v) === String(atual) ? 'on' : ''}" data-v="${esc(o.v)}">
      ${o.i ? ico(o.i, 16) : ''}
      <div class="txt">${esc(o.t)}${o.d ? `<div class="sub2">${esc(o.d)}</div>` : ''}</div>
      ${String(o.v) === String(atual) ? ico('check', 14) : ''}</div>`).join('')}</div>`, 'menu');

  const fechar = () => botao.classList.remove('aberto');
  new MutationObserver((_, obs) => {
    if (!document.body.contains(alvo)) { fechar(); obs.disconnect(); }
  }).observe(document.body, { childList: true });

  alvo.onclick = e => {
    const mi = e.target.closest('.mi'); if (!mi) return;
    alvo.remove(); fechar();
    R[rota].acoes?.[act]?.({ dataset: { v: mi.dataset.v, act } });
  };
}

/* ═══════════════════════════════════════════════════════════════════
   POPOVERS
   ═══════════════════════════════════════════════════════════════════ */
function popover(ancora, html, classe = '') {
  $$('.pop').forEach(p => p.remove());
  const p = document.createElement('div');
  p.className = 'pop ' + classe; p.innerHTML = html;
  document.body.appendChild(p);
  const r = ancora.getBoundingClientRect();
  p.style.left = Math.max(10, Math.min(r.right - p.offsetWidth, innerWidth - p.offsetWidth - 10)) + 'px';
  /* No celular a lista costuma abrir perto do rodapé e ficava metade
     fora da tela. Se não couber abaixo da âncora, abre acima dela. */
  const alt = p.offsetHeight;
  p.style.top = (r.bottom + 8 + alt > innerHeight - 10 && r.top - alt - 8 > 10
    ? r.top - alt - 8
    : Math.min(r.bottom + 8, Math.max(10, innerHeight - alt - 10))) + 'px';
  /* pointerdown e não mousedown: no toque o mousedown só chega
     depois do toque terminar, e o menu demorava a fechar. */
  const fora = e => { if (!p.contains(e.target) && !ancora.contains(e.target)) { p.remove(); document.removeEventListener('pointerdown', fora); } };
  setTimeout(() => document.addEventListener('pointerdown', fora), 0);
  return p;
}

/* ═══════════════════════════════════════════════════════════════════
   SHELL
   ═══════════════════════════════════════════════════════════════════ */
function vai(r, a = null) {
  if (!R[r]) return;
  if (!podeVer(r)) return toast('Você não tem acesso a este módulo.', { tipo:'bad' });
  rota = r; area = a;
  location.hash = (a ? a + '/' : '') + r;
  if (a && !pref.abertos.includes(a)) { pref.abertos.push(a); savePref(); }
  montaShell();
}

/* Troca o menu inteiro. Cai na tela inicial do modo, e não na
   última visitada: entrar no Pessoal é para ver o dinheiro, não
   para reencontrar onde você parou. */
function trocaModo(m) {
  if (MODOS[m] && pref.modo !== m) vai(MODOS[m].inicio);
}

function elo(k, a) {
  const ativo = rota === k && area === a;
  const rotulo = a ? (R[k].curto || R[k].label) : R[k].label;
  return `<a href="#${a ? a + '/' : ''}${k}" data-r="${k}" data-a="${a || ''}"
    class="${ativo ? 'on' : ''}" title="${esc(rotulo)}">
    ${ico(R[k].icone)}<b>${esc(rotulo)}</b><span class="ct" data-ct="${k}" hidden></span></a>`;
}

function navHTML() {
  return (MODOS[pref.modo] || MODOS.empresa).nav.map(sec => {
    if (sec.tipo === 'item') return podeVer(sec.r) ? elo(sec.r, null) : '';
    // O menu mostra só os módulos que a pessoa pode abrir; grupo que
    // ficou sem nenhum item some inteiro.
    const itens = sec.itens.filter(podeVer);
    if (!itens.length) return '';
    if (sec.tipo === 'secao') return `<div class="grp">${sec.label}</div>` + itens.map(k => elo(k, null)).join('');
    // Grupos com `semArea` são só organização visual: não filtram nada.
    const a = sec.semArea ? null : sec.id;
    const dentro = sec.semArea ? itens.includes(rota) : area === sec.id;
    const aberto = pref.abertos.includes(sec.id) || dentro;
    return `<button class="gt ${aberto ? 'aberto' : ''} ${dentro ? 'ativo' : ''}" data-grupo="${sec.id}">
        ${ico(sec.icone)}<b>${sec.label}</b>
        <span class="chev">${ico('chevron', 14)}</span></button>
      <div class="sub ${aberto ? 'aberto' : ''}"><div>${itens.map(k => elo(k, a)).join('')}</div></div>`;
  }).join('');
}

/* Um botão só, que mostra para onde vai — e não onde você está.
   Dois botões lado a lado caberiam, mas na barra estreita viram
   duas palavras cortadas; e em modo mini sobra só o ícone. */
function trocaModoHTML() {
  const outro = pref.modo === 'empresa' ? 'pessoal' : 'empresa';
  const m = MODOS[outro];
  return `<button class="modo" id="modo" title="Ir para Gestão ${esc(m.nome)}">
    <span class="ic">${ico(m.icone, 16)}</span>
    <span class="tx"><b>Gestão ${esc(m.nome)}</b><i>${esc(m.desc)}</i></span>
    ${ico('arrowR', 14)}</button>`;
}

/* Mesmo 900px do CSS. Num lugar só: se um dia mudar o corte, muda
   aqui e no @media, e não em cinco `innerWidth <= 900` espalhados. */
const telaEstreita = () => innerWidth <= 900;

/* Abre e fecha o menu no celular. Trava a rolagem do fundo enquanto
   está aberto — sem isso o dedo arrasta a página atrás da gaveta e
   a pessoa perde o lugar onde estava. */
function gaveta(abrir) {
  const app = $('#app'); if (!app) return;
  const v = abrir === undefined ? !app.classList.contains('open') : !!abrir;
  app.classList.toggle('open', v);
  document.body.style.overflow = v ? 'hidden' : '';
}

function montaShell() {
  /* O modo é derivado da rota, sempre, e num lugar só. Assim não
     existe caminho — Ctrl+K, atalho de teclado, botão voltar do
     navegador, link colado — que deixe o menu de um lado com a tela
     do outro aberta. */
  const m = modoDaRota(rota);
  if (pref.modo !== m) { pref.modo = m; savePref(); }
  const nav = navHTML();

  $('#root').innerHTML = `<div class="app${pref.mini ? ' mini' : ''}" id="app">
    <aside>
      <div class="brand"><img class="lg" src="${logoSrc()}" alt="${esc(visual.nome_sistema)}">
        <div class="mk">${esc(iniciais(visual.nome_sistema))}</div></div>
      <nav>${nav}</nav>
      ${trocaModoHTML()}
      <div class="who" id="av" title="Minha conta">${avatar(eu, 32, sessao?.user?.email)}
        <div class="tx"><div class="n">${esc(eu?.nome || 'Sem perfil')}</div>
          <div class="s">${esc(eu?.cargo || sessao?.user?.email || '')}</div></div></div>
    </aside>
    <main>
      <div class="top">
        <button class="ib" id="tgl">${ico('menu', 18)}</button>
        <div class="ttl" id="ttl">${R[rota].titulo}</div>
        <button class="search" id="busca">${ico('search', 15)}
          <span>Buscar ações, campanhas, pessoas…</span><kbd>⌘K</kbd></button>
        <button class="ib" id="sino">${ico('bell', 18)}</button>
        <button class="ib" id="tema">${ico(pref.theme === 'dark' ? 'sun' : 'moon', 18)}</button>
      </div>
      <div class="wrap" id="view"></div>
    </main>
    <div class="scrim" id="scrim"></div></div>`;

  $$('[data-r]').forEach(a => a.onclick = e => {
    e.preventDefault(); vai(a.dataset.r, a.dataset.a || null);
    gaveta(false);
  });
  $$('[data-grupo]').forEach(b => b.onclick = () => {
    const id = b.dataset.grupo, i = pref.abertos.indexOf(id);
    if (i >= 0) pref.abertos.splice(i, 1); else pref.abertos.push(id);
    savePref();
    b.classList.toggle('aberto'); b.nextElementSibling.classList.toggle('aberto');
  });
  $('#tgl').onclick = () => {
    if (telaEstreita()) gaveta();
    else { pref.mini = !pref.mini; savePref(); $('#app').classList.toggle('mini'); }
  };
  $('#scrim').onclick = () => gaveta(false);
  /* Girar o aparelho com a gaveta aberta deixava a trava de rolagem
     ligada numa tela que já é de desktop. */
  addEventListener('resize', () => { if (!telaEstreita()) gaveta(false); });
  $('#modo').onclick = () => trocaModo(pref.modo === 'empresa' ? 'pessoal' : 'empresa');
  $('#busca').onclick = palette;
  $('#sino').onclick = e => notificacoes(e.currentTarget);
  $('#av').onclick = e => menuConta(e.currentTarget);
  $('#tema').onclick = () => { pref.theme = pref.theme === 'dark' ? 'light' : 'dark'; savePref(); montaShell(); };
  pinta();
}

function esqueleto() {
  return `<div class="head"><div><div class="skel" style="width:230px;height:26px"></div>
    <div class="skel" style="width:150px;margin-top:9px"></div></div></div>
    <div class="tiles">${'<div class="skel big"></div>'.repeat(4)}</div>
    <div class="skel big" style="height:280px"></div>`;
}

let pintando = 0;
/* ── filtros persistentes (pedido de 25/08) ──────────────────────
   Cada tela guarda seus filtros em R.<rota>.filtro. Isso morria no
   F5; agora todo pinta() salva o conjunto no localStorage e o boot
   restaura. A restauração só copia chaves que o filtro padrão da
   tela ainda tem — filtro de versão antiga não injeta chave morta. */
const FILTROS_KEY = 'mi_filtros';
function restauraFiltros() {
  let salvo = {};
  try { salvo = JSON.parse(localStorage.getItem(FILTROS_KEY) || '{}'); } catch {}
  Object.entries(salvo).forEach(([rota2, f]) => {
    const alvo = R[rota2]?.filtro;
    if (!alvo || typeof f !== 'object' || !f) return;
    Object.keys(alvo).forEach(k => { if (k in f) alvo[k] = f[k]; });
  });
}
function salvaFiltros() {
  const tudo = {};
  Object.entries(R).forEach(([k, r]) => { if (r.filtro) tudo[k] = r.filtro; });
  try { localStorage.setItem(FILTROS_KEY, JSON.stringify(tudo)); } catch {}
}

async function pinta() {
  const meu = ++pintando;
  salvaFiltros();
  const view = $('#view'); if (!view) return;
  const r = R[rota];
  $('#ttl').innerHTML = area
    ? `<span style="color:var(--ac)">${AREAS[area]}</span>
       <span class="mut" style="margin:0 6px">/</span>${esc(r.curto || r.titulo)}`
    : esc(r.titulo);
  $$('[data-r]').forEach(a =>
    a.classList.toggle('on', a.dataset.r === rota && (a.dataset.a || null) === area));
  view.innerHTML = esqueleto();

  let dados;
  try { dados = await r.dados(); }
  catch (e) {
    if (meu !== pintando) return;
    view.innerHTML = `<div class="card">${vazio('alert', 'Não deu para carregar',
      'Confira a conexão com o Supabase e tente de novo.')}</div>`;
    console.error(e); return;
  }
  if (meu !== pintando) return;

  // contadores da sidebar + sino
  try {
    const [k] = await q('v_dashboard_dia'); const kk = k || {};
    dados._temModelo = (await q('acoes', x => x.neq('recorrencia', 'nenhuma').limit(1))).length > 0;
    if (dados.k) dados.k._temModelo = dados._temModelo;
    const alerta = (+kk.acoes_urgentes || 0) + (+kk.acoes_atrasadas || 0);
    const setCt = (k2, n, hot) => { const e = $(`[data-ct="${k2}"]`); if (!e) return;
      e.hidden = !n; e.textContent = n; e.classList.toggle('hot', !!hot); };
    setCt('inicio', alerta, true);
    setCt('producao', +kk.conteudo_atrasado || 0, true);
    setCt('time', +kk.feedbacks_atrasados || 0, false);
    const sino = $('#sino');
    if (sino) {
      const total = alerta + (+kk.conteudo_atrasado||0) + (+kk.metas_atrasadas||0) + (+kk.feedbacks_atrasados||0);
      sino.innerHTML = ico('bell', 18) + (total ? '<span class="dot"></span>' : '');
    }
  } catch {}

  const html = r.render(dados);
  view.innerHTML = `<div class="view">${html}</div>`;
  r.pos?.(dados);   // carregamentos que acontecem depois da tela aparecer
  view.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.tagName === 'SELECT' || b.tagName === 'INPUT') return;  // esses reagem ao change
    if (b.dataset.act === 'dd') return abreSeletor(b);
    r.acoes?.[b.dataset.act]?.(b);
  };
  view.onchange = e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (el.tagName === 'SELECT' || el.tagName === 'INPUT') r.acoes?.[el.dataset.act]?.(el);
  };
}

/* ── atalhos globais ─────────────────────────────────────────────── */
let gPend = false;
document.addEventListener('keydown', e => {
  const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return palette(); }
  if (digitando || e.metaKey || e.ctrlKey || e.altKey || !sb || !sessao) return;
  const k = e.key.toLowerCase();
  if (gPend) {
    gPend = false;
    const mapa = { i:'inicio', a:'acoes', g:'agenda', c:'config', p:'producao', m:'metas',
                   f:'financeiro', t:'time', d:'finPainel' };
    if (mapa[k]) { e.preventDefault(); vai(mapa[k]); }
    return;
  }
  if (k === 'g') { gPend = true; setTimeout(() => gPend = false, 1400); }
  else if (k === 'n') { e.preventDefault(); formAcao(); }
  else if (k === 'r') { e.preventDefault(); recarregaBase().then(pinta); toast('Atualizado.', { tipo:'info' }); }
  else if (e.key === '?') { e.preventDefault(); abaCfg = 'atalhos'; vai('config'); }
  else if (e.key === 'Escape') { $$('.pop').forEach(p => p.remove()); gaveta(false); }
});
function leHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [a, r] = h.includes('/') ? h.split('/') : [null, h];
  if (!R[r] || !podeVer(r)) return null;   // link colado não fura o acesso
  return { rota: r, area: (a && AREAS[a]) ? a : null };
}
addEventListener('hashchange', () => {
  const h = leHash();
  if (h && (h.rota !== rota || h.area !== area)) { rota = h.rota; area = h.area; montaShell(); }
});

/* ═══════════════════════════════════════════════════════════════════
   ENTRADA: conexão → login → app
   ═══════════════════════════════════════════════════════════════════ */
/* Grafismo do fundo da tela de entrada. Escolhido em
   Configurações → Identidade visual. */
function aurora() {
  const g = visual.grafismo || 'aurora';
  if (g === 'limpo') return '';
  if (g === 'malha') return '<div class="malha"></div>';
  if (g === 'ondas') return '<div class="ondas"><i></i><i></i><i></i></div>';
  return '<div class="aurora"><i></i><i></i><i></i></div>';
}

function telaConexao() {
  $('#root').innerHTML = `<div class="gate">${aurora()}<div class="card">
    <img class="mark" src="${logoSrc()}" alt="MasterInfo">
    <div class="steps"><i class="on"></i><i></i></div>
    <h1>Conectar ao Supabase</h1>
    <p class="lede">Cole a URL e a chave <b>anon public</b> do projeto (Project Settings → API).
      Fica salvo só neste navegador.</p>
    <div class="fields">
      <div><label>Project URL</label><input id="u" placeholder="https://xxxxx.supabase.co" autocomplete="off"></div>
      <div><label>Anon public key</label><input id="k" placeholder="eyJhbGciOi…" autocomplete="off"></div>
      <div class="err" hidden></div>
      <button class="btn" id="go" style="justify-content:center">${ico('key',15)}Conectar</button>
    </div></div></div>`;
  const ir = () => {
    const url = $('#u').value.trim().replace(/\/+$/, ''), key = $('#k').value.trim();
    const err = $('.err');
    if (!/^https:\/\/.+\.supabase\.co$/.test(url)) {
      err.textContent = 'A URL deve ser parecida com https://xxxxx.supabase.co'; err.hidden = false; return;
    }
    if (key.length < 40) { err.textContent = 'A chave anon parece incompleta.'; err.hidden = false; return; }
    LS.set(CFG_KEY, { url, key }); location.reload();
  };
  $('#go').onclick = ir;
  $('#k').onkeydown = e => { if (e.key === 'Enter') ir(); };
}

function telaLogin() {
  $('#root').innerHTML = `<div class="gate">${aurora()}<div class="card">
    <img class="mark" src="${logoSrc()}" alt="MasterInfo">
    <div class="steps"><i class="on"></i><i class="on"></i></div>
    <h1>Gestão de Marketing e Comercial</h1>
    <p class="lede">Entre com o e-mail e a senha cadastrados no sistema.</p>
    <div class="fields">
      <div><label>E-mail</label><input id="e" type="email" autocomplete="username"></div>
      <div><label>Senha</label><input id="s" type="password" autocomplete="current-password"></div>
      <div class="err" hidden></div>
      <button class="btn" id="go" style="justify-content:center">${ico('arrowR',15)}Entrar</button>
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <button id="esq" style="color:var(--dim)">Esqueci a senha</button>
        <button id="cad" style="color:var(--ac);font-weight:600">Primeiro acesso? Criar conta</button></div>
      ${cfgFixa() ? '' : '<button class="btn ghost" id="tr" style="justify-content:center">Trocar de projeto</button>'}
    </div></div></div>`;
  const entrar = async () => {
    const err = $('.err'), b = $('#go');
    err.hidden = true; b.disabled = true; b.textContent = 'Entrando…';
    const { error } = await sb.auth.signInWithPassword({ email: $('#e').value.trim(), password: $('#s').value });
    b.disabled = false; b.innerHTML = ico('arrowR',15) + 'Entrar';
    if (error) { err.textContent = error.message === 'Invalid login credentials'
      ? 'E-mail ou senha incorretos.' : error.message; err.hidden = false; return; }
    iniciar();
  };
  $('#go').onclick = entrar;
  $('#s').onkeydown = e => { if (e.key === 'Enter') entrar(); };
  $('#cad').onclick = telaCadastro;
  $('#esq').onclick = async () => {
    const email = $('#e').value.trim(), err = $('.err');
    if (!email) { err.textContent = 'Escreva seu e-mail acima primeiro.'; err.hidden = false; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href });
    if (error) { err.textContent = error.message; err.hidden = false; return; }
    err.hidden = true;
    toast('Se esse e-mail tiver conta, o link de redefinição chegou nele.', { tipo:'info' });
  };
  if ($('#tr')) $('#tr').onclick = () => { LS.del(CFG_KEY); location.reload(); };
}

/* Autocadastro. A conta nasce sem nenhum acesso — quem libera é o
   convite, conferido logo depois pela função aceitar_convite(). */
function telaCadastro() {
  $('#root').innerHTML = `<div class="gate">${aurora()}<div class="card">
    <img class="mark" src="${logoSrc()}" alt="MasterInfo">
    <div class="steps"><i class="on"></i><i class="on"></i></div>
    <h1>Criar minha conta</h1>
    <p class="lede">Use o <b>mesmo e-mail</b> em que você recebeu o convite.
      Com outro e-mail a conta é criada, mas não abre nada.</p>
    <div class="fields">
      <div><label>E-mail do convite</label><input id="e" type="email" autocomplete="username"></div>
      <div><label>Crie uma senha</label><input id="s" type="password" autocomplete="new-password">
        <div class="hint">Mínimo de 6 caracteres.</div></div>
      <div><label>Repita a senha</label><input id="s2" type="password" autocomplete="new-password"></div>
      <div class="err" hidden></div>
      <button class="btn" id="go" style="justify-content:center">${ico('user',15)}Criar conta</button>
      <button class="btn ghost" id="volta" style="justify-content:center">Já tenho conta</button>
    </div></div></div>`;

  const criar = async () => {
    const err = $('.err'), b2 = $('#go');
    const email = $('#e').value.trim(), senha = $('#s').value, senha2 = $('#s2').value;
    err.hidden = true;
    if (senha.length < 6) { err.textContent = 'A senha precisa ter ao menos 6 caracteres.'; err.hidden = false; return; }
    if (senha !== senha2) { err.textContent = 'As duas senhas não são iguais.'; err.hidden = false; return; }
    b2.disabled = true; b2.textContent = 'Criando…';
    const { data, error } = await sb.auth.signUp({ email, password: senha });
    b2.disabled = false; b2.innerHTML = ico('user',15) + 'Criar conta';
    if (error) {
      err.textContent = /disabled|not allowed/i.test(error.message)
        ? 'O autocadastro está desligado no Supabase. Peça para ligar em Authentication → Sign In / Providers.'
        : error.message;
      err.hidden = false; return;
    }
    if (!data.session) {
      err.textContent = 'Conta criada. Confirme o e-mail que acabou de chegar e depois entre.';
      err.hidden = false; return;
    }
    iniciar();
  };
  $('#go').onclick = criar;
  $('#s2').onkeydown = e => { if (e.key === 'Enter') criar(); };
  $('#volta').onclick = telaLogin;
}

/* Autenticado, porém sem convite: fica autenticado e não vê nada. */
function telaSemAcesso() {
  $('#root').innerHTML = `<div class="gate">${aurora()}<div class="card">
    <img class="mark" src="${logoSrc()}" alt="MasterInfo">
    <h1>Conta criada, acesso pendente</h1>
    <p class="lede">Seu login funciona, mas o e-mail <b>${esc(sessao?.user?.email || '')}</b>
      não tem convite ativo — por isso nada aparece aqui.</p>
    <div class="fields">
      <div class="err" style="display:block">Peça a quem administra o sistema para criar um convite
        para este e-mail, em Configurações → Acesso e login. Depois é só entrar de novo.</div>
      <button class="btn ghost" id="sair" style="justify-content:center">${ico('out',15)}Sair</button>
    </div></div></div>`;
  $('#sair').onclick = () => sb.auth.signOut().then(() => location.reload());
}

/* Projeto fixo vindo do config.js — vale para qualquer navegador e máquina.
   Só cai na tela de conexão se o config.js não estiver preenchido. */
function cfgFixa() {
  const c = window.MI_CONFIG;
  return (c && /^https:\/\/.+\.supabase\.co$/.test(c.url || '') && (c.key || '').length > 40) ? c : null;
}

async function iniciar() {
  const c = cfgFixa() || LS.get(CFG_KEY);
  if (!c?.url) return telaConexao();
  if (!sb) sb = window.supabase.createClient(c.url, c.key, { auth: { persistSession: true, autoRefreshToken: true } });

  // A identidade visual carrega ANTES do login: a tela de entrada já
  // precisa da logo e das cores certas.
  await carregaVisual();

  const { data, error } = await sb.auth.getSession();
  if (error) { LS.del(CFG_KEY); return telaConexao(); }
  sessao = data.session;
  if (!sessao) return telaLogin();

  // Recém-cadastrado: tenta consumir o convite antes de qualquer leitura.
  // Se a função ainda não existir no banco, segue o fluxo antigo.
  try {
    await sb.rpc('aceitar_convite');
    const { data: liberado, error: e2 } = await sb.rpc('tem_acesso');
    if (!e2 && liberado === false) return telaSemAcesso();
  } catch {}

  await recarregaBase();
  eu = cache.usuarios.find(u => u.auth_user_id === sessao.user.id) || null;
  restauraFiltros();
  const h = leHash();
  if (h) { rota = h.rota; area = h.area; }
  montaShell();
}

iniciar();
</script>
