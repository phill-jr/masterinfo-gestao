          p.tentativas_max ? ` · ${n} de ${p.tentativas_max} tentativa(s)` : ' · tentativas ilimitadas'}</div></div>
      ${b ? `<span class="pill ${b.aprovado ? 'ok' : 'bad'}">${b.nota}%</span>` : ''}
      ${esgotou ? `<span class="pill warn">${ico('lock',11)} sem tentativa</span>` : ''}

  const linhaAula = a => {

  };

  const bloco = (m, i) => {

        <div><div class="sm2">Provas</div><div style="font-weight:600;margin-top:2px">${t.provas || 'nenhuma'}</div></div>
        ${t.duracao_dias ? `<div><div class="sm2">Duração prevista</div>
          <div style="font-weight:600;margin-top:2px">${t.duracao_dias} dias</div></div>` : ''}
        <div><div class="sm2">Matriculados</div><div style="font-weight:600;margin-top:2px">${t.matriculados}</div></div>
      </div>
      ${mat ? `<div style="min-width:190px">
        <div class="sm2" style="margin-bottom:6px">Seu progresso — ${mat.aulas_feitas}/${mat.aulas_total} aulas${
          mat.provas_total ? `, ${mat.provas_ok}/${mat.provas_total} provas` : ''}</div>
        <div class="bar"><i class="${pct === 100 ? 'ok' : ''}" style="width:${pct}%"></i></div>
        <div class="sm2" style="margin-top:5px">${pct}%${
          mat.status === 'concluida' ? ' · concluída' : ''}</div></div>`
      : `<div class="sm2" style="max-width:230px">Você ainda não começou esta trilha.
          Clicar em <b>Começar</b> abre sua matrícula e passa a registrar o progresso.</div>`}
    </div></div>

    ${conclusao}

    ${modulos.length ? modulos.map(bloco).join('')
      : `<div class="card">${vazio('book', 'Trilha vazia',
          'Crie o primeiro módulo. Módulo agrupa aulas — normalmente uma semana, uma fase ou um tema.',
          { act: 'novo-modulo', label: 'Novo módulo' })}</div>`}

    ${finais.length ? `<div class="card"><div class="modh">
        <div class="nm">${ico('medal',13)}</div><h4>Prova final da trilha</h4></div>
      ${finais.map(linhaProva).join('')}</div>`
      : modulos.length ? `<div style="margin-bottom:20px">
        <button class="btn ghost" data-act="nova-prova" data-trilha="${t.id}">${ico('medal',15)}Criar prova final</button></div>` : ''}

    <button class="btn ghost danger" data-act="del-trilha" data-id="${t.id}"
      style="background:var(--bad-bg);color:var(--bad);border-color:transparent">${ico('trash',14)}Excluir trilha</button>`;
}

/* ── tela: uma aula ──────────────────────────────────────────────── */
function onbTelaAula({ t, aula, aulas, mat, feitas, trein }) {
  if (!aula) return `<div class="card">${vazio('alert', 'Aula não encontrada', 'Volte e escolha de novo.')}</div>`;
  const ok   = feitas.has(aula.id);
  const idx  = aulas.findIndex(a => a.id === aula.id);
  const prox = aulas[idx + 1];

  const corpo = trein
    ? (trein.tipo === 'html' && trein.conteudo_html
        ? `<iframe class="quadro" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
             srcdoc="${esc(trein.conteudo_html)}"></iframe>
           <div class="sm2" style="margin-top:9px">${esc(trein.titulo)} — documento da biblioteca de treinamentos.</div>`
        : `<div class="card"><div class="cb">
             <p class="sm2" style="margin-bottom:12px">Este treinamento é um link externo.</p>
             <a class="btn" href="${esc(trein.url || '#')}" target="_blank" rel="noopener">
               ${ico('link',15)}Abrir ${esc(trein.titulo)}</a></div></div>`)
    : aula.url
      ? `<div class="card"><div class="cb">
           <a class="btn" href="${esc(aula.url)}" target="_blank" rel="noopener">${ico('link',15)}Abrir o material</a>
           </div></div>${aula.conteudo ? `<div class="doc">${md(aula.conteudo)}</div>` : ''}`
      : `<div class="doc">${md(aula.conteudo) || '<p class="mut">Esta aula ainda não tem conteúdo.</p>'}</div>`;

  /* A aula é larga porque o treinamento em HTML vem inteiro dentro
     dela; a prova é estreita porque é só texto e alternativa. Mesmo
     padrão de passos, largura diferente. */
  return `<div style="--wzw:900px">
    <div class="volta" data-act="volta-trilha">${ico('arrowL',14)}${esc(t?.nome || 'Voltar')}</div>
    <div class="wz">
      <div class="wzh"><span>Aula <b>${idx + 1}</b> de ${aulas.length}</span>
        <span>${feitas.size} concluída${feitas.size === 1 ? '' : 's'}</span></div>
      <div class="bar"><i style="width:${Math.round((idx + 1) / aulas.length * 100)}%"></i></div></div>
    <div class="wzc">
      <div class="head" style="margin-bottom:18px"><div>
          <h2>${esc(aula.titulo)}</h2>
          <div class="sub">${esc(aula.resumo || '')}${
            aula.duracao_min ? `${aula.resumo ? ' · ' : ''}${onbDur(aula.duracao_min)}` : ''}${
            aula.obrigatoria === false ? ' · opcional' : ''}</div></div>
        <div class="push">
          <button class="btn ghost" data-act="edit-aula" data-id="${aula.id}">${ico('edit',15)}Editar</button>
        </div></div>
      ${corpo}
      <div class="wznav">
        ${idx > 0 ? `<button class="btn ghost" data-act="aula" data-id="${aulas[idx-1].id}"
          title="${esc(aulas[idx-1].titulo)}">${ico('arrowL',14)}Voltar</button>` : ''}
        ${ok && prox ? `<span class="lnk" data-act="aula" data-id="${prox.id}">Seguir sem marcar de novo</span>` : ''}
        <div class="fim" style="display:flex;gap:9px;flex-wrap:wrap">
          ${!mat
            ? `<button class="btn" data-act="comecar" data-id="${t.id}">${ico('play',15)}Começar a trilha</button>`
            : ok
              ? `<button class="btn ghost" data-act="desfazer" data-mat="${mat.id}" data-aula="${aula.id}">
                   ${ico('check',15)}Concluída — desmarcar</button>
                 ${prox ? `<button class="btn" data-act="aula" data-id="${prox.id}">
                   Próxima aula${ico('arrowR',14)}</button>` : ''}`
              : `<button class="btn" data-act="concluir" data-mat="${mat.id}" data-aula="${aula.id}"
                   ${prox ? `data-prox="${prox.id}"` : ''}>${ico('check',15)}Concluir${prox ? ' e seguir' : ''}</button>`}
        </div></div>
      ${prox ? `<div class="sm2" style="text-align:center;margin-top:14px">A seguir: ${esc(prox.titulo)}</div>`
             : `<div class="sm2" style="text-align:center;margin-top:14px">Última aula da trilha.</div>`}
    </div></div>`;
}

/* ── tela: prova ─────────────────────────────────────────────────── */
function onbTelaProva({ p, questoes, alts, tents }) {
  if (!p) return `<div class="card">${vazio('alert', 'Prova não encontrada', 'Volte e escolha de novo.')}</div>`;

  const volta = `<div class="wzc"><div class="volta" data-act="volta-trilha">
    ${ico('arrowL',14)}Voltar para a trilha</div></div>`;

  if (onbResultado) {
    const r = onbResultado;
    const podeRefazer = p.tentativas_max === 0 || tents.length + 1 < p.tentativas_max;
    return `${volta}
      <div class="wzc">
        <div class="placar ${r.aprovado ? 'ok' : 'nao'}">
          <div class="big">${r.nota}%</div>
          <div style="flex:1">
            <h3 style="font-size:17px;margin-bottom:4px">${r.aprovado ? 'Aprovado' : 'Não passou desta vez'}</h3>
            <div class="sm2">${r.acertos} de ${r.total} questões · nota de corte ${r.nota_corte}%</div></div>
          ${!r.aprovado && podeRefazer
            ? `<button class="btn" data-act="refazer">${ico('refresh',15)}Refazer</button>`
            : !r.aprovado ? `<span class="pill warn">${ico('lock',11)} sem tentativa</span>` : ''}</div>

        <div class="card"><div class="ch"><h3>O que você acertou</h3>
          <div class="push"><span class="sm2">${r.acertos} de ${r.total}</span></div></div>
          ${r.gabarito.map((g, i) => `<div class="rev ${g.acertou ? 'ok' : ''}" style="cursor:default">
            <span class="n" ${g.acertou ? '' : 'style="background:var(--bad-bg);color:var(--bad)"'}>${
              g.acertou ? ico('check', 12) : i + 1}</span>
            <span class="q" title="${esc(g.enunciado)}">${esc(g.enunciado)}</span></div>`).join('')}</div>

        <h3 style="font-size:15px;margin:26px 0 12px">A correção, questão por questão</h3>
        ${r.gabarito.map((g, i) => `<div class="qz">
          <div class="qn">Questão ${i + 1} · ${g.acertou ? 'certa' : 'errada'}</div>
          <div class="qe">${esc(g.enunciado)}</div>
          <div class="alt ${g.acertou ? 'certa' : 'errada'}" style="cursor:default">
            <span class="rd" style="border-color:currentColor"></span>
            <div>${g.acertou ? 'Você acertou' : `Resposta certa: <b>${esc(g.correta_txt || '—')}</b>`}</div></div>
          ${g.explicacao ? `<div class="expl">${esc(g.explicacao)}</div>` : ''}</div>`).join('')}

        <div class="wznav"><button class="btn ghost" data-act="volta-trilha">
          ${ico('arrowL',14)}Voltar para a trilha</button></div>
      </div>`;
  }

  const usadas  = tents.length;
  const esgotou = p.tentativas_max > 0 && usadas >= p.tentativas_max;
  const melhor  = tents.reduce((a, x) => !a || x.nota > a.nota ? x : a, null);

  if (esgotou && !melhor?.aprovado) {
    return `${volta}<div class="card">${vazio('lock', 'Tentativas esgotadas',
      `Você usou as ${p.tentativas_max} tentativas desta prova e a melhor nota foi ${melhor?.nota ?? 0}%. Fale com quem conduz seu onboarding para liberar outra.`)}</div>`;
  }

  const porQ = {}; alts.forEach(a => (porQ[a.questao_id] ||= []).push(a));
  const ordemQ = onbOrdem?.q || questoes.map(x => x.id);
  const lista  = ordemQ.map(id => questoes.find(x => x.id === id)).filter(Boolean);

  if (!lista.length) {
    return `${volta}<div class="card">${vazio('grid', 'Prova sem questões',
      'Cadastre as questões antes de aplicar esta prova.')}</div>`;
  }

  /* Passos = questões + a revisão no fim. A revisão existe porque numa
     prova de dez questões em dez telas ninguém lembra o que deixou em
     branco — e questão em branco conta como errada. */
  const total     = lista.length + 1;
  const i         = Math.min(Math.max(onbQz, 0), lista.length);
  const naRevisao = i === lista.length;
  const respondidas = lista.filter(x => onbResp[x.id]).length;

  /* Piso de 4%: no primeiro passo a barra ficaria zerada e pareceria
     um pedaço de interface que não carregou. */
  const topo = rotulo => `<div class="wz">
    <div class="wzh"><span>Passo <b>${i + 1}</b> de ${total}</span><span>${esc(rotulo)}</span></div>
    <div class="bar"><i style="width:${Math.max(4, Math.round(i / (total - 1) * 100))}%"></i></div></div>`;

  const cabeca = `${volta}
    <div class="wzc"><div class="head" style="margin-bottom:18px"><div>
      <h2 style="font-size:22px">${esc(p.titulo)}</h2>
      <div class="sub">Nota de corte ${p.nota_corte}% · ${
        p.tentativas_max ? `tentativa ${usadas + 1} de ${p.tentativas_max}` : 'tentativas ilimitadas'}${
        melhor ? ` · melhor até aqui ${melhor.nota}%` : ''}</div></div></div></div>`;

  if (naRevisao) {
    const faltam = lista.length - respondidas;
    return `${cabeca}${topo('Revisão')}
      <div class="wzc">
        <div class="card"><div class="ch"><h3>Confira antes de entregar</h3>
          <div class="push"><span class="pill ${faltam ? 'warn' : 'ok'}">${
            faltam ? `${faltam} em branco` : 'tudo respondido'}</span></div></div>
          ${lista.map((qq, n) => `<button class="rev ${onbResp[qq.id] ? 'ok' : ''}" data-act="qz-ir" data-i="${n}">
            <span class="n">${onbResp[qq.id] ? ico('check', 12) : n + 1}</span>
            <span class="q">${esc(qq.enunciado)}</span>
            ${onbResp[qq.id] ? '' : '<span class="pill warn">em branco</span>'}
            <span style="color:var(--dim);display:flex">${ico('chevron', 15)}</span></button>`).join('')}</div>
        ${faltam ? `<div class="sm2" style="margin:-6px 0 16px">Questão em branco conta como errada.
          Clique em qualquer linha acima para voltar nela.</div>` : ''}
        <div class="wznav">
          <button class="btn ghost" data-act="qz-volta">${ico('arrowL',14)}Voltar</button>
          <button class="btn fim" data-act="enviar" data-total="${lista.length}">
            ${ico('check',15)}Entregar a prova</button></div></div>`;
  }

  const qq  = lista[i];
  const ord = onbOrdem?.a[qq.id] || (porQ[qq.id] || []).map(a => a.id);
  const marcada = onbResp[qq.id];

  return `${cabeca}${topo(`Questão ${i + 1} de ${lista.length}`)}
    <div class="wzc">
      <div class="qz">
        <div class="qn">${qq.tipo === 'vf' ? 'Verdadeiro ou falso' : 'Múltipla escolha'}</div>
        <div class="qe">${esc(qq.enunciado)}</div>
        <div>${ord.map(aid => {
          const a = (porQ[qq.id] || []).find(x => x.id === aid); if (!a) return '';
          return `<div class="alt ${marcada === a.id ? 'on' : ''}" data-act="alt" data-q="${qq.id}" data-a="${a.id}">
            <span class="rd"></span><div>${esc(a.texto)}</div></div>`;
        }).join('')}</div></div>
      <div class="wznav">
        ${i > 0 ? `<button class="btn ghost" data-act="qz-volta">${ico('arrowL',14)}Voltar</button>` : ''}
        <span class="lnk" data-act="qz-pula">Pular por enquanto</span>
        <button class="btn fim" id="wzAv" data-act="qz-avanca" ${marcada ? '' : 'disabled'}>
          ${i === lista.length - 1 ? 'Revisar' : 'Avançar'}${ico('arrowR',14)}</button></div>
      <div class="sm2" style="text-align:center;margin-top:14px">${respondidas} de ${lista.length} respondidas</div>
    </div>`;
}

/* Editor de questões: lista dentro de um modal, porque questão é coisa
   que se cadastra em rajada. Sair para uma tela e voltar a cada questão
   faria ninguém cadastrar dez. */
async function onbEditorQuestoes(provaId) {
  const [p] = await q('onb_provas', x => x.eq('id', provaId));
  const qs  = await q('onb_questoes', x => x.eq('prova_id', provaId).order('ordem'));
  /* A view _gabarito é a única porta da coluna `correta` (correção 20):
     na tabela ela não sai mais pela API. Só admin recebe linhas aqui —
     e só admin chega neste editor. */
  const as  = qs.length
    ? await q('onb_alternativas_gabarito', x => x.in('questao_id', qs.map(x2 => x2.id)).order('ordem')) : [];

  const corpo = `<div style="display:grid;gap:10px">
    ${qs.length ? qs.map((qq, i) => {
      const alt = as.filter(a => a.questao_id === qq.id);
      const certa = alt.find(a => a.correta);
      return `<div style="border:1px solid var(--line);border-radius:var(--r);padding:12px 14px">
        <div style="display:flex;gap:9px;align-items:flex-start">
          <div style="flex:1"><div class="sm2">Questão ${i + 1}${qq.tipo === 'vf' ? ' · V/F' : ''}</div>
            <div style="font-size:13.5px;font-weight:600;margin:3px 0 5px;line-height:1.4">${esc(qq.enunciado)}</div>
            <div class="sm2">Certa: ${esc(certa?.texto || '⚠ nenhuma marcada')} · ${alt.length} alternativa(s)</div></div>
          <button class="ib" data-q="${qq.id}" data-e title="Editar">${ico('edit',14)}</button>
          <button class="ib" data-q="${qq.id}" data-d title="Excluir">${ico('trash',14)}</button></div></div>`;
    }).join('')
    : '<div class="sm2">Nenhuma questão ainda.</div>'}</div>`;

  const { mask, fecha } = modal({
    titulo: `Questões — ${p?.titulo || ''}`, largura: 620, ok: 'Nova questão',
    corpo, onOk: () => { fecha(); formQuestao(null, provaId, qs.length + 1); return false; }
  });
  $$('[data-e]', mask).forEach(b => b.onclick = () => {
    fecha(); formQuestao(qs.find(x => x.id === b.dataset.q), provaId);
  });
  $$('[data-d]', mask).forEach(b => b.onclick = () => {
    fecha();
    confirma('Excluir questão', '<p>A questão e suas alternativas saem da prova.</p>',
      async () => { const ok = await apaga('onb_questoes', b.dataset.q); if (ok) onbEditorQuestoes(provaId); return ok; });
  });
}

async function formQuestao(row, provaId, ordem) {
  const alt = row ? await q('onb_alternativas_gabarito', x => x.eq('questao_id', row.id).order('ordem')) : [];
  const vf  = row?.tipo === 'vf';
  const cert = alt.findIndex(a => a.correta);

  form(row ? 'Editar questão' : 'Nova questão', [
    { k:'enunciado', label:'Enunciado', type:'textarea', req:true, value:row?.enunciado },
    { k:'tipo', label:'Tipo', type:'select', value:row?.tipo || 'multipla', opts:[
      { v:'multipla', t:'Múltipla escolha' }, { v:'vf', t:'Verdadeiro ou falso' }] },
    { k:'a1', label:'Alternativa 1', value:vf ? 'Verdadeiro' : alt[0]?.texto, req:true },
    { k:'a2', label:'Alternativa 2', value:vf ? 'Falso' : alt[1]?.texto, req:true },
    { k:'a3', label:'Alternativa 3', value:vf ? '' : alt[2]?.texto },
    { k:'a4', label:'Alternativa 4', value:vf ? '' : alt[3]?.texto },
    { k:'certa', label:'Qual é a correta', type:'select', value:String(cert >= 0 ? cert + 1 : 1),
      opts:[1,2,3,4].map(n => ({ v:String(n), t:`Alternativa ${n}` })) },
    { k:'explicacao', label:'Explicação', type:'textarea', value:row?.explicacao,
      hint:'Aparece na correção, certo ou errado. É a parte que ensina — não deixe em branco.' },
    { k:'peso', label:'Peso', type:'number', value:row?.peso ?? 1 },
    { k:'ordem', label:'Ordem', type:'number', value:row?.ordem ?? ordem ?? 0 }
  ], async d => {
    const textos = [d.a1, d.a2, d.a3, d.a4].filter(x => x && String(x).trim());
    const certa  = Number(d.certa);
    if (certa > textos.length) { toast(`A alternativa ${certa} está vazia.`, { tipo: 'bad' }); return false; }

    const campos = { prova_id: provaId || row.prova_id, enunciado: d.enunciado, tipo: d.tipo,
                     explicacao: d.explicacao, peso: d.peso, ordem: d.ordem };
    let qid = row?.id;
    if (qid) {
      if (!await grava('onb_questoes', campos, qid)) return false;
      await sb.from('onb_alternativas').delete().eq('questao_id', qid);
    } else {
      const r = await sb.from('onb_questoes').insert(campos).select('id').single();
      if (r.error) { toast(r.error.message, { tipo: 'bad' }); return false; }
      qid = r.data.id;
    }
    const linhas = textos.map((t, i) => ({ questao_id: qid, texto: t, correta: i + 1 === certa, ordem: i + 1 }));
    const r2 = await sb.from('onb_alternativas').insert(linhas);
    if (r2.error) { toast(r2.error.message, { tipo: 'bad' }); return false; }
    toast('Questão salva.');
    onbEditorQuestoes(provaId || row.prova_id);
  });
}

function treinEscolheArquivo() {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = '.html,.htm,text/html';
  i.onchange = () => { if (i.files[0]) treinLeArquivo(i.files[0]); };
  i.click();
}

function treinLeArquivo(file) {
  if (file.size > 4 * 1024 * 1024) {
    return toast('Arquivo acima de 4 MB. Provavelmente tem imagem embutida em base64 — vale reduzir antes.',
      { tipo: 'bad' });
  }
  const fr = new FileReader();
  fr.onerror = () => toast('Não deu para ler o arquivo.', { tipo: 'bad' });
  fr.onload = () => {
    const bruto = String(fr.result);
    const m = bruto.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    const titulo = (m ? m[1].replace(/\s+/g, ' ').trim().split(/\s+[—·|]\s+/)[0] : '')
      || file.name.replace(/\.html?$/i, '').replace(/-/g, ' ');
    const texto = bruto.replace(/<(script|style)[^>]*>[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]+>/g, ' ');
    formTreinamento({ titulo, conteudo_html: bruto, tipo: 'html',
                      duracao_min: Math.max(2, Math.round(texto.split(/\s+/).length / 200)) });
  };
  fr.readAsText(file, 'utf-8');
}

  form(novo ? 'Novo treinamento' : 'Editar treinamento', [

/* ── anexos de imagem ─────────────────────────────────────────────
   Ficam no Storage do Supabase, em bucket privado. O link de exibição
   é temporário e gerado na hora — imagem interna não deve viver numa
   URL pública que qualquer um abre. */
const ANEXO_BUCKET = 'anexos';
const linkAnexo = new Map();   // path -> url assinada, evita reassinar a cada render

/* Reduz antes de subir: print de celular tem 4000px e 6 MB, e para
   ler uma conversa 1600px sobra. */
function comprimeImagem(file, ladoMax = 1600, qualidade = 0.85) {
  return new Promise((ok, erro) => {
    if (!/^image\//.test(file.type)) return erro(new Error('Só imagens são aceitas.'));
    const fr = new FileReader();
    fr.onerror = () => erro(new Error('Não deu para ler o arquivo.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => erro(new Error('Arquivo de imagem inválido.'));
      img.onload = () => {
        const escala = Math.min(1, ladoMax / Math.max(img.width, img.height));
        if (escala === 1 && file.size < 400 * 1024) return ok(file);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * escala);
        c.height = Math.round(img.height * escala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? ok(b) : erro(new Error('Falha ao comprimir.')), 'image/jpeg', qualidade);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function subirAnexo(file) {
  const blob = await comprimeImagem(file);
  const ext = (blob.type || 'image/jpeg').split('/')[1].replace('jpeg', 'jpg');
  const path = `${eu?.id || 'sem-perfil'}/${Date.now()}-${Math.round(Math.random() * 1e6)}.${ext}`;
  const { error } = await sb.storage.from(ANEXO_BUCKET)
    .upload(path, blob, { contentType: blob.type || 'image/jpeg', upsert: false });
  if (error) throw new Error(error.message);
  return { path, nome: file.name || 'imagem', tipo: blob.type, tamanho: blob.size };
}

/* Assina em lote os caminhos ainda sem link, e devolve quando pronto */
async function assinaAnexos(paths) {
  const faltam = [...new Set(paths)].filter(x => x && !linkAnexo.has(x));
  if (!faltam.length) return;
  const { data, error } = await sb.storage.from(ANEXO_BUCKET).createSignedUrls(faltam, 3600);
  if (error) return;
  (data || []).forEach(d => { if (d.signedUrl) linkAnexo.set(d.path, d.signedUrl); });
}

function abreImagem(url) {
  const el = document.createElement('div');
  el.className = 'lightbox';
  el.innerHTML = `<span class="fechar">${ico('x', 26)}</span><img src="${esc(url)}" alt="">`;
  el.onclick = () => { el.remove(); document.removeEventListener('keydown', kd); };
  const kd = e => { if (e.key === 'Escape') el.click(); };
  document.addEventListener('keydown', kd);
  document.body.appendChild(el);
}

    const lista = notas.filter(n =>
      (!f.categoria || n.categoria === f.categoria) &&
      (!f.pessoa || n.usuario_id === f.pessoa) &&
      (!termo || (n.titulo || '').toLowerCase().includes(termo)
              || (n.conteudo || '').toLowerCase().includes(termo)));

    const fixas = lista.filter(n => n.fixada);
    const soltas = lista.filter(n => !n.fixada);

    const cartao = n => {
      const cat = CATEG_NOTA[n.categoria] || CATEG_NOTA.geral;
      const sobre = n.usuario_id ? cache.usuarios.find(u => u.id === n.usuario_id) : null;
      const longo = (n.conteudo || '').length > 420;
      return `<div class="nota ${n.fixada ? 'fixa' : ''}">
        <div class="topo">
          <span class="pill ${cat.c}">${ico(cat.i, 11)} ${cat.t}</span>
          ${sobre ? `<span class="pill dim">${esc(sobre.nome.split(' ')[0])}</span>` : ''}
          ${n.fixada ? `<span style="margin-left:auto;color:var(--ac)">${ico('star',14)}</span>` : ''}
        </div>
        ${n.titulo ? `<h4>${esc(n.titulo)}</h4>` : ''}
        <div class="corpo ${longo ? 'longo' : ''}" data-corpo>${esc(n.conteudo)}</div>
        ${longo ? '<button class="mais" data-act="expandir">Ver tudo</button>' : ''}
        ${(n.anexos || []).length ? `<div class="anexos">${n.anexos.map(a => {
          const url = linkAnexo.get(a.path);
          return url
            ? `<div class="anexo" data-act="ver" data-u="${esc(url)}"><img src="${esc(url)}" alt="${esc(a.nome || '')}"></div>`
            : `<div class="anexo falhou" title="Não foi possível carregar">sem link</div>`;
        }).join('')}</div>` : ''}
        <div class="rodape">
          ${n.autor_id ? esc(nomeUser(n.autor_id).split(' ')[0]) + ' · ' : ''}${dtl(n.created_at.slice(0,10))}
          <span class="fer">
            <button class="ib" data-act="fixar" data-id="${n.id}" data-v="${n.fixada ? '0' : '1'}"
              title="${n.fixada ? 'Desafixar' : 'Fixar no topo'}">${ico('star',14)}</button>
            <button class="ib" data-act="editar" data-id="${n.id}" title="Editar">${ico('edit',14)}</button>
            <button class="ib" data-act="excluir" data-id="${n.id}" title="Excluir">${ico('trash',14)}</button>
          </span></div></div>`;
    };

    return `<div class="head"><div><h2>Anotações</h2>
        <div class="sub">Pessoais: só você vê o que escreve aqui — nem o admin lê as suas.
          Anotação sobre alguém continua aparecendo para você na hora do feedback.</div></div>
        <div class="push"><button class="btn ghost" data-act="csv">${ico('down',15)}Exportar</button></div></div>

      <div class="captura" id="captura">
        <textarea id="nova-nota" placeholder="Escreva aqui. Ex.: Erika travou na objeção de preço — retomar no 1 a 1 de sexta.
Pode colar um print direto com Ctrl + V."></textarea>
        ${r.anexos.length ? `<div class="anexos">${r.anexos.map((a, i) => `
          <div class="anexo" data-act="ver-rascunho" data-i="${i}">
            ${a.previa ? `<img src="${esc(a.previa)}" alt="">` : ''}
            ${a.subindo ? '<span class="carregando">enviando…</span>' : ''}
            <span class="x" data-act="tira-rascunho" data-i="${i}">${ico('x',12)}</span>
          </div>`).join('')}</div>` : ''}
        <div class="pe">
          <button class="ib" data-act="anexar" title="Anexar imagem">${ico('down',17)}</button>
          ${dd('Tipo', 'rasc-cat', Object.entries(CATEG_NOTA).map(([v, o]) => ({ v, t:o.t, i:o.i })), r.categoria)}
          ${dd('Sobre', 'rasc-pessoa', [{ v:'', t:'Ninguém específico' },
            ...cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome, i:'user' }))], r.pessoa)}
          <button class="btn" data-act="salvar">${ico('check',15)}Salvar</button>
          <span class="dica">Ctrl + Enter salva</span>
        </div></div>

      <div class="filtros">
        ${dd('Tipo', 'fcat', [{ v:'', t:'Todos os tipos' },
          ...Object.entries(CATEG_NOTA).map(([v, o]) => ({ v, t:o.t, i:o.i }))], f.categoria)}
        ${dd('Sobre', 'fpessoa', [{ v:'', t:'Todo mundo' },
          ...cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome, i:'user' }))], f.pessoa)}
        <input data-act="fbusca" value="${esc(f.busca)}" placeholder="Buscar no texto…"
          style="width:auto;min-width:200px">
        <span class="sm2">${lista.length} de ${notas.length}</span>
      </div>

      ${fixas.length ? `<div class="grupo" style="border-radius:var(--r);margin-bottom:12px">
          ${ico('star',12)} Fixadas<span>${fixas.length}</span></div>
        <div class="notas" style="margin-bottom:24px">${fixas.map(cartao).join('')}</div>` : ''}

      ${soltas.length ? `<div class="notas">${soltas.map(cartao).join('')}</div>`
        : (!fixas.length ? `<div class="card">${vazio('edit',
            notas.length ? 'Nada com esse filtro' : 'Nenhuma anotação ainda',
            'Use a caixa acima. Anotação sobre alguém aparece junto na hora do feedback — é ali que ela vale ouro.')}</div>` : '')}`;
  },
  acoes: {
    'rasc-cat'(b)    { R.anotacoes.rascunho.categoria = b.dataset.v; pinta(); },
    'rasc-pessoa'(b) { R.anotacoes.rascunho.pessoa = b.dataset.v; pinta(); },
    fcat(b)    { R.anotacoes.filtro.categoria = b.dataset.v; pinta(); },
    fpessoa(b) { R.anotacoes.filtro.pessoa = b.dataset.v; pinta(); },
    fbusca(el) { R.anotacoes.filtro.busca = el.value; pinta(); },
    expandir(b) {
      const c = b.previousElementSibling;
      c.classList.toggle('cheio');
      b.textContent = c.classList.contains('cheio') ? 'Ver menos' : 'Ver tudo';
    },
    async salvar() {
      const el = $('#nova-nota');
      const texto = (el?.value || '').trim();
      const r = R.anotacoes.rascunho;
      if (!texto && !r.anexos.length) return toast('Escreva algo ou anexe uma imagem.', { tipo:'info' });
      if (r.anexos.some(a => a.subindo)) return toast('Espere as imagens terminarem de subir.', { tipo:'info' });

      const ok = await grava('anotacoes', {
        conteudo: texto || '(imagem)', categoria: r.categoria,
        usuario_id: r.pessoa || null, autor_id: eu?.id || null,
        anexos: r.anexos.filter(a => a.path).map(a => ({
          path: a.path, nome: a.nome, tipo: a.tipo, tamanho: a.tamanho }))
      });
      if (!ok) return;
      el.value = '';
      r.anexos = [];
      toast('Anotação salva.');
      pinta();
    },
    anexar() { escolheAnexos(); },
    ver(b) { abreImagem(b.dataset.u); },
    'ver-rascunho'(b) {
      const a = R.anotacoes.rascunho.anexos[+b.dataset.i];
      if (a?.previa) abreImagem(a.previa);
    },
    'tira-rascunho'(b) {
      R.anotacoes.rascunho.anexos.splice(+b.dataset.i, 1);
      pinta();
    },
    async fixar(b) {
      if (await grava('anotacoes', { fixada: b.dataset.v === '1' }, b.dataset.id)) pinta();
    },
    async editar(b) {
      const [n] = await q('anotacoes', x => x.eq('id', b.dataset.id));
      if (!n) return;
      form('Editar anotação', [
        { k:'titulo', label:'Título', value:n.titulo, ph:'Opcional' },
        { k:'conteudo', label:'Anotação', type:'textarea', req:true, value:n.conteudo },
        { k:'categoria', label:'Tipo', type:'select', value:n.categoria,
          opts:Object.entries(CATEG_NOTA).map(([v, o]) => ({ v, t:o.t })) },
        { k:'usuario_id', label:'Sobre quem', type:'select', value:n.usuario_id,
          opts:[{ v:'', t:'Ninguém específico' },
            ...cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome }))] }
      ], d => grava('anotacoes', d, n.id));
    },
    excluir(b) {
      confirma('Excluir anotação', '<p>A anotação some. Não dá para desfazer.</p>',
        () => apaga('anotacoes', b.dataset.id));
    },
    async csv() {
      const ns = await q('anotacoes', x => x.order('created_at', { ascending: false }));
      csv('anotacoes', ns.map(n => ({
        data: n.created_at.slice(0, 10),
        tipo: CATEG_NOTA[n.categoria]?.t || n.categoria,
        sobre: n.usuario_id ? nomeUser(n.usuario_id) : '',
        autor: n.autor_id ? nomeUser(n.autor_id) : '',
        titulo: n.titulo || '',
        anotacao: (n.conteudo || '').replace(/\n/g, ' ')
      })));
    }
  },
  pos() {
    const el = $('#nova-nota');
    if (!el) return;
    el.onkeydown = e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); R.anotacoes.acoes.salvar(); }
    };
    // Cresce conforme escreve, em vez de virar caixinha com rolagem
    el.oninput = () => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };

    // Colar print direto da tela é o caminho mais curto que existe
    el.onpaste = e => {
      const arquivos = [...(e.clipboardData?.items || [])]
        .filter(i => i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
      if (arquivos.length) { e.preventDefault(); recebeAnexos(arquivos); }
    };

    const cap = $('#captura');
    if (cap) {
      cap.ondragover = e => { e.preventDefault(); cap.style.borderColor = 'var(--ac)'; };
      cap.ondragleave = () => { cap.style.borderColor = ''; };
      cap.ondrop = e => {
        e.preventDefault(); cap.style.borderColor = '';
        const arquivos = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/'));
        if (arquivos.length) recebeAnexos(arquivos);
      };
    }
  }
};

function escolheAnexos() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = () => recebeAnexos([...inp.files]);
  inp.click();
}

/* Mostra a miniatura na hora e sobe em segundo plano: esperar upload
   para ver o que colou é o tipo de espera que faz desistir da nota. */
async function recebeAnexos(arquivos) {
  const r = R.anotacoes.rascunho;
  const novos = arquivos.slice(0, 6).map(f => ({ nome: f.name || 'print', subindo: true, arquivo: f }));
  r.anexos.push(...novos);
  novos.forEach(a => {
    const fr = new FileReader();
    fr.onload = () => { a.previa = fr.result; pinta(); };
    fr.readAsDataURL(a.arquivo);
  });
  pinta();

  for (const a of novos) {
    try {
      const meta = await subirAnexo(a.arquivo);
      Object.assign(a, meta, { subindo: false });
    } catch (e) {
      a.subindo = false; a.erro = true;
      toast('Falha ao anexar: ' + e.message, { tipo:'bad' });
    }
    pinta();
  }
}

/* ── Dicionário da Casa ───────────────────────────────────────────
   Todo lugar tem um dialeto próprio: sigla de processo, apelido de
   plano, nome de etapa. Quem está há três anos acha óbvio; quem
   entrou ontem nunca ouviu. Enquanto isso não está escrito, cada
   dúvida vira interrupção de um veterano — e a resposta muda
   conforme quem responde.

   Os dois campos que ninguém escreve e todo vendedor precisa são o
   `cliente_chama` e o `explicar_ao_cliente`: o cliente não usa o
   termo interno, então o verbete tem que servir dos dois lados.

   A tabela vem de sql/vendedores-01-dicionario.sql. Enquanto ela não
   existir, a tela avisa em vez de quebrar (qOpcional devolve null). */
const CATEG_TERMO = {
  tecnico:   { t:'Técnico / rede', c:'info', i:'zap'    },
  produto:   { t:'Produto',        c:'ac',   i:'star'   },
  processo:  { t:'Processo',       c:'warn', i:'refresh'},
  comercial: { t:'Comercial',      c:'ok',   i:'money'  },
  cultura:   { t:'Cultura',        c:'dim',  i:'users'  }
};

R.dicionario = {
  label: 'Dicionário', curto: 'Dicionário', icone: 'help', titulo: 'Dicionário da Casa',
  filtro: { categoria: '', nivel: '', status: '', busca: '' },
  async dados() {
    const [termos, lacunas] = await Promise.all([
      qOpcional('vd_termos', x => x.order('termo')),
      qOpcional('vd_buscas_sem_resultado', x => x.eq('resolvido', false).order('created_at', { ascending: false }).limit(30))
    ]);
    return { termos, lacunas: lacunas || [] };
  },
  render({ termos, lacunas }) {
    if (termos === null) return `<div class="head"><div><h2>Dicionário da Casa</h2>
        <div class="sub">O vocabulário interno da empresa, escrito uma vez.</div></div></div>
      ${avisoSql('A tabela <b>vd_termos</b> ainda não existe neste banco.')}`;

    const f = R.dicionario.filtro;
    const termo = f.busca.trim().toLowerCase();
    const bate = t => !termo
      || (t.termo || '').toLowerCase().includes(termo)
      || (t.sinonimos || '').toLowerCase().includes(termo)
      || (t.explicacao || '').toLowerCase().includes(termo)
      || (t.cliente_chama || '').toLowerCase().includes(termo);

    const lista = termos.filter(t =>
      (!f.categoria || t.categoria === f.categoria) &&
      (!f.nivel     || t.nivel === f.nivel) &&
      (!f.status    || t.status === f.status) &&
      bate(t));

    const publicados = termos.filter(t => t.status === 'publicado').length;
    const rascunhos  = termos.filter(t => t.status === 'rascunho').length;

    const cartao = t => {
      const cat = CATEG_TERMO[t.categoria] || CATEG_TERMO.tecnico;
      const vencido = t.revisado_em && (Date.now() - new Date(t.revisado_em + 'T12:00:00')) > 1000 * 60 * 60 * 24 * 183;
      return `<div class="nota ${t.status === 'publicado' ? 'fixa' : ''}">
        <div class="topo">
          <span class="pill ${cat.c}">${ico(cat.i, 11)} ${cat.t}</span>
          ${t.nivel === 'avancado' ? '<span class="pill dim">avançado</span>' : ''}
          ${t.status !== 'publicado' ? `<span class="pill warn">${esc(t.status)}</span>` : ''}
          ${vencido ? `<span class="pill warn" title="Sem revisão há mais de 6 meses">${ico('clock',11)} revisar</span>` : ''}
        </div>
        <h4>${esc(t.termo)}</h4>
        ${t.sinonimos ? `<div class="sm2" style="margin:-4px 0 8px">também: ${esc(t.sinonimos)}</div>` : ''}
        <div class="corpo">${esc(t.explicacao)}</div>
        ${t.cliente_chama ? `<div class="corpo" style="margin-top:8px"><b>O cliente chama de:</b> ${esc(t.cliente_chama)}</div>` : ''}
        ${t.explicar_ao_cliente ? `<div class="corpo" style="margin-top:8px"><b>Como explicar:</b> "${esc(t.explicar_ao_cliente)}"</div>` : ''}
        ${t.cuidado ? `<div class="corpo" style="margin-top:8px;color:var(--warn,inherit)"><b>Cuidado:</b> ${esc(t.cuidado)}</div>` : ''}
        <div class="rodape">
          ${t.autor_id ? esc(nomeUser(t.autor_id).split(' ')[0]) + ' · ' : ''}${t.revisado_em ? 'revisado ' + dtl(t.revisado_em) : 'sem revisão'}
          <span class="fer">
            <button class="ib" data-act="publicar" data-id="${t.id}" data-v="${t.status === 'publicado' ? 'rascunho' : 'publicado'}"
              title="${t.status === 'publicado' ? 'Voltar para rascunho' : 'Publicar'}">${ico('check',14)}</button>
            <button class="ib" data-act="editar" data-id="${t.id}" title="Editar">${ico('edit',14)}</button>
            <button class="ib" data-act="excluir" data-id="${t.id}" data-t="${esc(t.termo)}" title="Excluir">${ico('trash',14)}</button>
          </span></div></div>`;
    };

    return `<div class="head"><div><h2>Dicionário da Casa</h2>
        <div class="sub">O vocabulário interno da empresa, escrito uma vez — para quem entrou ontem não precisar adivinhar.</div></div>
        <div class="push">
          <button class="btn ghost" data-act="csv">${ico('down',15)}Exportar</button>
          <button class="btn" data-act="novo">${ico('plus',15)}Novo termo</button></div></div>

      <div class="filtros">
        ${dd('Tipo', 'fcat', [{ v:'', t:'Todos os tipos' },
          ...Object.entries(CATEG_TERMO).map(([v, o]) => ({ v, t:o.t, i:o.i }))], f.categoria)}
        ${dd('Nível', 'fnivel', [{ v:'', t:'Todos os níveis' },
          { v:'basico', t:'Básico' }, { v:'avancado', t:'Avançado' }], f.nivel)}
        ${dd('Status', 'fstatus', [{ v:'', t:'Todos' },
          { v:'publicado', t:'Publicados' }, { v:'rascunho', t:'Rascunhos' },
          { v:'arquivado', t:'Arquivados' }], f.status)}
        <input data-act="fbusca" value="${esc(f.busca)}" placeholder="Buscar termo, sinônimo ou explicação…"
          style="width:auto;min-width:240px">
        <span class="sm2">${lista.length} de ${termos.length} · ${publicados} publicados${rascunhos ? ` · ${rascunhos} em rascunho` : ''}</span>
      </div>

      ${lista.length ? `<div class="notas">${lista.map(cartao).join('')}</div>`
        : `<div class="card">${termo
            ? vazio('search', `Ninguém escreveu "${f.busca.trim()}" ainda`,
                'Registre a busca: essa lista é o melhor roteiro do que escrever em seguida, porque veio de dúvida real.',
                { act:'registra-lacuna', label:'Registrar o que faltou' })
            : vazio('help', 'Nenhum termo cadastrado',
                'Comece pelos 40 termos que um cliente ou um novato já pediu para explicar. Ordene por frequência de uso, não por importância.',
                { act:'novo', label:'Novo termo' })}</div>`}

      ${lacunas.length ? `<div class="grupo" style="border-radius:var(--r);margin:24px 0 12px">
          ${ico('alert',12)} Procuraram e não acharam<span>${lacunas.length}</span></div>
        <div class="card"><div class="t-scroll"><table><thead><tr>
          <th>Buscaram por</th><th>Quem</th><th>Quando</th><th></th>
        </tr></thead><tbody>${lacunas.map(l => `<tr>
          <td><b>${esc(l.texto)}</b></td>
          <td class="mut">${l.usuario_id ? esc(nomeUser(l.usuario_id)) : '—'}</td>
          <td class="mut">${dtl(l.created_at.slice(0,10))}</td>
          <td class="act">
            <button class="btn sm ghost" data-act="escrever" data-t="${esc(l.texto)}" data-id="${l.id}">${ico('plus',13)}Escrever</button>
            <button class="btn sm ghost" data-act="resolver" data-id="${l.id}" title="Marcar como resolvido">${ico('check',13)}</button>
          </td></tr>`).join('')}</tbody></table></div></div>` : ''}`;
  },
  acoes: {
    fcat(b)    { R.dicionario.filtro.categoria = b.dataset.v; pinta(); },
    fnivel(b)  { R.dicionario.filtro.nivel = b.dataset.v; pinta(); },
    fstatus(b) { R.dicionario.filtro.status = b.dataset.v; pinta(); },
    fbusca(el) { R.dicionario.filtro.busca = el.value; pinta(); },
    novo: () => formTermo(),
    async editar(b) { const [r] = await q('vd_termos', x => x.eq('id', b.dataset.id)); if (r) formTermo(r); },
    async publicar(b) {
      const virar = b.dataset.v;
      if (await grava('vd_termos',
            { status: virar, revisado_em: virar === 'publicado' ? hoje() : null }, b.dataset.id)) {
        toast(virar === 'publicado' ? 'Termo publicado.' : 'Voltou para rascunho.');
        await pinta();
      }
    },
    excluir(b) {
      confirma('Excluir termo', `"${esc(b.dataset.t)}" será removido do dicionário.`,
        () => apaga('vd_termos', b.dataset.id));
    },
    async 'registra-lacuna'() {
      const texto = R.dicionario.filtro.busca.trim();
      if (!texto) return;
      const { error } = await sb.from('vd_buscas_sem_resultado')
        .insert({ texto, usuario_id: eu?.id || null });
      if (error) return toast(error.message, { tipo: 'bad' });
      toast('Registrado. Vai aparecer na lista do que falta escrever.');
      await pinta();
    },
    escrever(b) { formTermo({ termo: b.dataset.t }, b.dataset.id); },
    async resolver(b) {
      const { error } = await sb.from('vd_buscas_sem_resultado')
        .update({ resolvido: true }).eq('id', b.dataset.id);
      if (error) return toast(error.message, { tipo: 'bad' });
      await pinta();
    },
    csv() {
      csv('dicionario', (R.dicionario._ultimo || []).map(t => ({
        termo: t.termo, sinonimos: t.sinonimos, categoria: t.categoria, nivel: t.nivel,
        explicacao: t.explicacao, cliente_chama: t.cliente_chama,
        explicar_ao_cliente: t.explicar_ao_cliente, cuidado: t.cuidado, status: t.status
      })));
    }
  },
  pos({ termos }) { R.dicionario._ultimo = termos || []; }
};

/* `lacunaId` fecha o ciclo: escreveu o verbete que faltava, a busca
   que originou ele sai da lista de pendências sozinha. */
function formTermo(row, lacunaId) {
  form(row?.id ? 'Editar termo' : 'Novo termo', [
    { k:'termo', label:'Termo', req:true, value:row?.termo, ph:'Como se fala aqui dentro' },
    { k:'sinonimos', label:'Também chamado de', value:row?.sinonimos,
      hint:'Siglas, apelidos e erros comuns de escrita, separados por vírgula. É o que faz achar quando digitam errado.' },
    { k:'categoria', label:'Tipo', type:'select', value:row?.categoria || 'tecnico',
      opts:Object.entries(CATEG_TERMO).map(([v, o]) => ({ v, t:o.t })) },
    { k:'nivel', label:'Nível', type:'select', value:row?.nivel || 'basico',
      opts:[{ v:'basico', t:'Básico — todo vendedor precisa saber na 1ª semana' },
            { v:'avancado', t:'Avançado' }] },
    { k:'explicacao', label:'Explicação curta', req:true, type:'textarea', value:row?.explicacao,
      ph:'Duas ou três frases, sem usar outro jargão dentro.' },
    { k:'cliente_chama', label:'Como o cliente chama isso', type:'textarea', value:row?.cliente_chama,
      ph:'O cliente quase nunca usa o termo interno.' },
    { k:'explicar_ao_cliente', label:'Como explicar para o cliente', type:'textarea', value:row?.explicar_ao_cliente,
      ph:'A frase pronta, do jeito que dá para falar numa ligação.' },
    { k:'cuidado', label:'Cuidado / erro comum', type:'textarea', value:row?.cuidado,
      ph:'O que o novato erra aqui — e o que acontece quando erra.' },
    { k:'status', label:'Status', type:'select', value:row?.status || 'rascunho',
      opts:[{ v:'rascunho', t:'Rascunho' }, { v:'publicado', t:'Publicado' },
            { v:'arquivado', t:'Arquivado' }] }
  ], async d => {
    if (!row?.id) d.autor_id = eu?.id || null;
    if (d.status === 'publicado') d.revisado_em = hoje();
    const ok = await grava('vd_termos', d, row?.id);
    if (ok && lacunaId) await sb.from('vd_buscas_sem_resultado').update({ resolvido: true }).eq('id', lacunaId);
    return ok;
  });
}

/* ── Feedback ─────────────────────────────────────────────────────
   Histórico completo. A tela de PDI mostra o último; aqui está tudo,
   porque padrão só aparece quando você olha a sequência. */
const TIPOS_FB = {
  um_a_um:        { t:'1 a 1',              cor:'info', ic:'users' },
  corretivo:      { t:'Corretivo',          cor:'warn', ic:'alert' },
  reconhecimento: { t:'Reconhecimento',     cor:'ok',   ic:'star'  },
  avaliacao_ciclo:{ t:'Avaliação de ciclo', cor:'ac',   ic:'check' }
};

R.feedbacks = {
  label: 'Feedback', curto: 'Feedback', icone: 'inbox', titulo: 'Feedback',
  filtro: { pessoa: '', tipo: '' },
  async dados() {
    return { fbs: await q('feedbacks', x => x.order('data', { ascending: false }).limit(400)) };
  },
  render({ fbs }) {
    const f = R.feedbacks.filtro;
    const lista = fbs.filter(x =>
      (!f.pessoa || x.usuario_id === f.pessoa) && (!f.tipo || x.tipo === f.tipo));

    const pessoas = cache.usuarios.filter(u => u.ativo);
    const ultimo = {};
    fbs.forEach(x => { if (!ultimo[x.usuario_id]) ultimo[x.usuario_id] = x; });
    const diasDe = u => ultimo[u.id]
      ? Math.floor((new Date() - new Date(ultimo[u.id].data + 'T12:00:00')) / 864e5) : null;

    // Quem está esperando há mais tempo aparece primeiro — é a fila real
    const fila = [...pessoas].sort((a, b) => {
      const da = diasDe(a), db = diasDe(b);
      if (da == null) return -1; if (db == null) return 1;
      return db - da;
    });
    const atrasados = pessoas.filter(u => { const d = diasDe(u); return d == null || d > 30; });
    const esteMes = fbs.filter(x => x.data >= hoje().slice(0, 8) + '01').length;

    // Agrupa por mês para a linha do tempo
    const meses = {};
    lista.forEach(x => { (meses[x.data.slice(0, 7)] ||= []).push(x); });
    const rotuloMes = m => {
      const d = new Date(m + '-15T12:00:00');
      const s = d.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
      return s[0].toUpperCase() + s.slice(1);
    };

    return `<div class="head"><div><h2>Feedback</h2>
        <div class="sub">Todo o histórico. Padrão de comportamento só aparece na sequência, não num registro solto.</div></div>
        <div class="push">
          <button class="btn ghost" data-act="csv">${ico('down',15)}CSV</button>
          <button class="btn" data-act="novo">${ico('plus',15)}Registrar feedback</button></div></div>

      ${pessoas.length ? `
      <div class="tiles stg">
        <div class="tile ${atrasados.length ? 'bad' : 'ok'}"><div class="ic">${ico('alert',18)}</div>
          <div class="n">${atrasados.length}</div><div class="l">Esperando há mais de 30 dias</div>
          <div class="h">${atrasados.slice(0,3).map(u => u.nome.split(' ')[0]).join(', ') || 'ninguém'}</div></div>
        <div class="tile"><div class="ic">${ico('inbox',18)}</div><div class="n">${esteMes}</div>
          <div class="l">Registrados neste mês</div></div>
        <div class="tile"><div class="ic">${ico('star',18)}</div>
          <div class="n">${fbs.filter(x => x.tipo === 'reconhecimento').length}</div>
          <div class="l">Reconhecimentos</div></div>
        <div class="tile"><div class="ic">${ico('alert',18)}</div>
          <div class="n">${fbs.filter(x => x.tipo === 'corretivo').length}</div>
          <div class="l">Corretivos</div></div>
      </div>

      <div class="card"><div class="ch"><h3>Fila — quem está esperando</h3>
        <span class="push sm2">clique para registrar</span></div>
        <div class="t-scroll"><table><thead><tr>
          <th>Pessoa</th><th>Último feedback</th><th>Tipo</th><th>Silêncio</th><th></th>
        </tr></thead><tbody>${fila.map(u => {
          const d = diasDe(u), lastf = ultimo[u.id];
          const cor = d == null ? 'bad' : d > 30 ? 'bad' : d > 15 ? 'warn' : 'ok';
          return `<tr>
            <td><div style="display:flex;align-items:center;gap:10px">${avatar(u, 28)}
              <div><b>${esc(u.nome)}</b><div class="sm2">${esc(u.cargo || '—')}</div></div></div></td>
            <td class="mut">${lastf ? dtl(lastf.data) : 'nunca'}</td>
            <td>${lastf ? `<span class="pill ${TIPOS_FB[lastf.tipo]?.cor || 'dim'}">${TIPOS_FB[lastf.tipo]?.t || lastf.tipo}</span>` : '—'}</td>
            <td><span class="pill ${cor}">${d == null ? 'nunca' : d + ' dias'}</span></td>
            <td class="act"><button class="btn sm" data-act="novo" data-u="${u.id}">Registrar</button></td>
          </tr>`;
        }).join('')}</tbody></table></div></div>` : ''}

      <div class="card"><div class="ch"><h3>Histórico</h3>
        <div class="push">
          <select data-act="fpessoa" style="width:auto;min-width:160px">
            <option value="">Todas as pessoas</option>
            ${pessoas.map(u => `<option value="${u.id}"${f.pessoa===u.id?' selected':''}>${esc(u.nome)}</option>`).join('')}
          </select>
          <select data-act="ftipo" style="width:auto;min-width:150px">
            <option value="">Todos os tipos</option>
            ${Object.entries(TIPOS_FB).map(([k,v]) => `<option value="${k}"${f.tipo===k?' selected':''}>${v.t}</option>`).join('')}
          </select>
          <span class="sm2">${lista.length} registro(s)</span></div></div>
        ${lista.length ? Object.keys(meses).sort().reverse().map(m => `
          <div style="padding:14px 18px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
                      color:var(--dim);font-weight:700;background:var(--surface2)">${rotuloMes(m)}</div>
          ${meses[m].map(x => {
            const u = cache.usuarios.find(y => y.id === x.usuario_id);
            const tp = TIPOS_FB[x.tipo] || { t:x.tipo, cor:'dim', ic:'inbox' };
            return `<div class="row" style="align-items:flex-start">
              ${avatar(u, 32, '?')}
              <div class="g"><div class="t">${esc(u?.nome || 'Pessoa removida')}
                  <span class="pill ${tp.cor}" style="margin-left:6px">${tp.t}</span></div>
                <div class="m">${dtl(x.data)}${x.autor_id ? ' · por ' + esc(nomeUser(x.autor_id)) : ''}</div>
                ${x.notas ? `<div style="margin-top:7px;font-size:13px;color:var(--txt2);
                    white-space:pre-wrap;line-height:1.55">${esc(x.notas)}</div>`
                  : '<div class="sm2" style="margin-top:6px;font-style:italic">Sem notas — registro sem conteúdo não ajuda ninguém depois.</div>'}</div>
              <button class="btn sm ghost" data-act="editar" data-id="${x.id}">${ico('edit',13)}</button>
              <button class="btn sm ghost" data-act="excluir" data-id="${x.id}">${ico('trash',13)}</button>
            </div>`;
          }).join('')}`).join('')
        : vazio('inbox', 'Nenhum feedback com esse filtro',
            'Feedback que não é registrado vira memória, e memória some. Comece por quem está há mais tempo sem conversa.',
            { act:'novo', label:'Registrar feedback' })}</div>`;
  },
  acoes: {
    novo(b) { formFeedback(null, b?.dataset.u); },
    async editar(b) { const [r] = await q('feedbacks', x => x.eq('id', b.dataset.id)); if (r) formFeedback(r); },
    excluir(b) {
      confirma('Excluir feedback', 'O registro sai do histórico. Não dá para desfazer.',
        () => apaga('feedbacks', b.dataset.id));
    },
    fpessoa(b) { R.feedbacks.filtro.pessoa = b.value; pinta(); },
    ftipo(b)   { R.feedbacks.filtro.tipo   = b.value; pinta(); },
    async csv() {
      const fbs = await q('feedbacks', x => x.order('data', { ascending: false }));
      csv('feedbacks', fbs.map(x => ({
        data: x.data, pessoa: nomeUser(x.usuario_id), tipo: TIPOS_FB[x.tipo]?.t || x.tipo,
        autor: x.autor_id ? nomeUser(x.autor_id) : '', notas: (x.notas || '').replace(/\n/g, ' ')
      })));
    }
  }
};

function formFeedback(row, usuarioId) {
  form(row ? 'Editar feedback' : 'Registrar feedback', [
    { k:'usuario_id', label:'Pessoa', type:'select', req:true, value:row?.usuario_id || usuarioId,
      opts:cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome })) },
    { k:'data', label:'Data', type:'date', value:row?.data || hoje() },
    { k:'tipo', label:'Tipo', type:'select', value:row?.tipo || 'um_a_um',
      opts:Object.entries(TIPOS_FB).map(([v, o]) => ({ v, t:o.t })) },
    { k:'notas', label:'Notas', type:'textarea', value:row?.notas,
      ph:'O que foi dito, o que a pessoa respondeu e o que ficou combinado.',
      hint:'Escreva o combinado. É o que você vai querer reler no próximo ciclo.' }
  ], d => { if (!row) d.autor_id = eu?.id || null; return grava('feedbacks', d, row?.id); });
}

R.config = {
  label: 'Configurações', icone: 'cog', titulo: 'Configurações',
  async dados() { return {}; },
  pos() { if (abaCfg === 'acesso') listaConvites(); },
  render() {
    /* Quem não é admin resolve aqui o que é DELE: perfil, senha (a aba
       acesso vira só "trocar senha" para membro), aparência e atalhos.
       O resto — time, identidade, dados, conexão — é administração. */
    const soAdmin = new Set(['time', 'painel', 'identidade', 'dados', 'conexao']);
    const abas = [
      ['perfil',     'Perfil',            'user',  'Sua foto, nome e cargo'],
      ['time',       'Time e canais',     'users', 'Pessoas, cargos, setores e canais'],
      ['painel',     'Painel',            'chart', 'Quais números aparecem na Rotina semanal'],
      ['acesso',     'Acesso e login',    'key',   ehAdmin() ? 'Convites e senha' : 'Trocar minha senha'],
      ['identidade', 'Identidade visual', 'star',  'Logo, cores e grafismo'],
      ['aparencia',  'Aparência',         'moon',  'Tema e densidade deste navegador'],
      ['dados',      'Dados',             'down',  'Exportar e limpar'],
      ['conexao',    'Conexão',           'db',    'Projeto Supabase'],
      ['atalhos',    'Atalhos',           'zap',   'Teclas do sistema']
    ].filter(([v]) => ehAdmin() || !soAdmin.has(v));
    if (!abas.some(([v]) => v === abaCfg)) abaCfg = 'perfil';
    return `<div class="head"><div><h2>Configurações</h2>
      <div class="sub">Preferências ficam neste navegador. Time e canais ficam no banco.</div></div></div>
      <div style="margin-bottom:22px">${dd('Seção', 'aba',
        abas.map(([v, l, i, d]) => ({ v, t:l, i, d })), abaCfg)}</div>
      <div id="cfg-corpo">${cfgCorpo()}</div>`;
  },
  acoes: {
    aba(b) { abaCfg = b.dataset.v; pinta(); },
    tema(b) { pref.theme = b.dataset.v; savePref(); montaShell(); },
    densidade(b) { pref.density = b.dataset.v; savePref(); pinta(); },

    /* ── identidade visual ───────────────────────────────────────── */
    accent(b) { visual.accent = b.dataset.v; visual.accent_hex = null; aplicaVisual(); pinta(); },
    'aplica-hex'() {
      const v = ($('#iv-hex')?.value || '').trim();
      if (v && !/^#[0-9a-f]{6}$/i.test(v)) return toast('Use o formato #rrggbb, por exemplo #ff6b00.', { tipo:'bad' });
      visual.accent_hex = v || null; aplicaVisual(); pinta();
    },
    grafismo(b) { visual.grafismo = b.dataset.v; pinta(); },
    'tema-padrao'(b) { visual.tema_padrao = b.dataset.v; pinta(); },
    'sobe-logo'(b) {
      const campo = b.dataset.c;
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/png,image/svg+xml,image/jpeg,image/webp';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        if (f.size > 400 * 1024) return toast('Arquivo acima de 400 KB. Reduza a imagem.', { tipo:'bad' });
        const fr = new FileReader();
        fr.onload = () => { visual[campo] = fr.result; aplicaVisual(); pinta();
          toast('Logo carregada. Clique em "Salvar identidade" para valer para todos.', { tipo:'info' }); };
        fr.readAsDataURL(f);
      };
      inp.click();
    },
    'tira-logo'(b) { visual[b.dataset.c] = null; aplicaVisual(); pinta(); },
    'reset-visual'() {
      confirma('Restaurar identidade padrão',
        'Volta à logo oficial da MasterInfo, ao laranja e ao grafismo aurora. Só é aplicado depois de salvar.',
        () => { visual = { ...VISUAL_PADRAO }; aplicaVisual(); return true; }, { perigo:false });
    },
    async 'salva-visual'() {
      visual.nome_sistema = ($('#iv-nome')?.value || '').trim() || 'MasterInfo';
      visual.subtitulo    = ($('#iv-sub')?.value || '').trim() || null;
      const { id, updated_at, ...campos } = visual;
      const { error } = await sb.from('config_visual').update(campos).eq('id', 1);
      if (error) return toast(error.message, { tipo:'bad' });
      aplicaVisual(); montaShell();
      toast('Identidade visual salva para todo o time.');
    },
    obon() { pref.ob = true; savePref(); toast('Checklist reativado.'); pinta(); },
    'novo-user': () => formUser(),
    'novo-canal': () => formCanal(),

    /* ── acesso e login ──────────────────────────────────────────── */
    'novo-convite': () => formConvite(),
    'convidar-pessoa'(b) { formConvite(cache.usuarios.find(u => u.id === b.dataset.id)); },
    async 'copia-convite'(b) {
      const texto = `Você foi convidado para o sistema de gestão da MasterInfo.

1. Abra: ${location.origin + location.pathname}
2. Clique em "Primeiro acesso? Criar conta"
3. Use exatamente este e-mail: ${b.dataset.e}
4. Crie sua senha e pronto.`;
      try { await navigator.clipboard.writeText(texto); toast('Mensagem copiada. Cole no WhatsApp.'); }
      catch { modal({ titulo:'Copie a mensagem', ok:'Fechar', onOk:() => true,
        corpo:`<textarea style="min-height:170px">${esc(texto)}</textarea>` }); }
    },
    'revoga-convite'(b) {
      confirma('Revogar convite',
        `O convite de <b>${esc(b.dataset.e)}</b> deixa de valer. Se a pessoa ainda não se cadastrou, não vai conseguir.`,
        async () => { const ok = await apaga('convites', b.dataset.id); if (ok) listaConvites(); return ok; });
    },
    'trocar-senha': () => form('Trocar minha senha', [
      { k:'senha', label:'Nova senha', type:'password', req:true, hint:'Mínimo de 6 caracteres.' },
      { k:'senha2', label:'Repita a nova senha', type:'password', req:true }
    ], async d => {
      if (d.senha.length < 6) { toast('A senha precisa ter ao menos 6 caracteres.', { tipo:'bad' }); return false; }
      if (d.senha !== d.senha2) { toast('As duas senhas não são iguais.', { tipo:'bad' }); return false; }

      if (error) { toast(error.message, { tipo:'bad' }); return false; }

        async () => { const ok = await apaga('setores', b.dataset.id);

    async 'csv-canal'() { csv('canais', cache.canais); },
    /* ── perfil ──────────────────────────────────────────────────── */
    'perfil-foto'() {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        try {
          eu.foto = await fotoQuadrada(f);
          if (await grava('usuarios', { foto: eu.foto }, eu.id)) {
            await recarregaBase(); eu = cache.usuarios.find(u => u.id === eu.id);

        toast('Foto removida.'); montaShell();
      }
    },
    async 'salva-perfil'() {
      const nome = ($('#pf-nome')?.value || '').trim();
      if (!nome) return toast('O nome não pode ficar vazio.', { tipo:'bad' });
      const dados = { nome, canal_principal_id: $('#pf-canal')?.value || null };
      const cg = $('#pf-cargo')?.value || null;
      if (cache.temCargos) dados.cargo_id = cg; else dados.cargo = cg;
      if (!await grava('usuarios', dados, eu.id)) return;
      await recarregaBase();
      eu = cache.usuarios.find(u => u.id === eu.id);
      toast('Perfil salvo.'); montaShell();
    },
    'criar-perfil'() {
      const sugestao = (sessao?.user?.email || '').split('@')[0]
        .split(/[^a-zA-ZÀ-ÿ]+/).filter(Boolean)
        .map(p => p[0].toUpperCase() + p.slice(1)).join(' ');
      form('Criar meu perfil', [
        { k:'nome', label:'Nome', req:true, value:sugestao },
        campoCargo(null),
        { k:'canal_principal_id', label:'Canal principal', type:'select', opts:optCanais() }
      ], async d => {
        d.auth_user_id = sessao.user.id;
        if (!await grava('usuarios', d)) return false;
        await recarregaBase();
        eu = cache.usuarios.find(u => u.auth_user_id === sessao.user.id) || null;
        toast('Perfil criado.'); montaShell();
        return true;
      }, 'Criar');
    },

    vincular() {
      form('Vincular meu login', [
        { k:'usuario_id', label:'Eu sou', type:'select', req:true,
          opts:cache.usuarios.map(u => ({ v:u.id, t:u.nome })),
          hint:'Liga o login à pessoa, para os feedbacks saírem com sua autoria.' }
      ], async d => {
        const ok = await grava('usuarios', { auth_user_id: sessao.user.id }, d.usuario_id);
        if (ok) { eu = cache.usuarios.find(u => u.id === d.usuario_id); toast('Login vinculado.'); montaShell(); }
        return ok;
      }, 'Vincular');
    },
    limpar() {
      confirma('Limpar preferências locais',
        'Tema, densidade e a conexão salvos <b>neste navegador</b> serão apagados. Nenhum dado do banco é tocado.',
        () => { LS.del(CFG_KEY); LS.del(PREF_KEY); location.reload(); return true; },
        { palavra: 'LIMPAR' });
    },
    sair() { sb.auth.signOut().then(() => location.reload()); }
  }
};

/* ── acesso por módulo ────────────────────────────────────────────
   O que cada pessoa enxerga. Papel admin ignora a lista — vê tudo e
   configura o sistema. Lista vazia = marcar nada = a pessoa só abre
   Início, Configurações e a Gestão Pessoal dela. */
function formAcesso(u) {
  const marcados = new Set(u.modulos || []);
  const tudo = u.modulos == null;
  const corpo = `
    <div><label>Papel</label><select data-k="papel">
      <option value="membro"${u.papel !== 'admin' ? ' selected' : ''}>Membro — usa o sistema</option>
      <option value="admin"${u.papel === 'admin' ? ' selected' : ''}>Admin — vê tudo e configura</option>
    </select><div class="hint">Admin ignora a lista abaixo.</div></div>
    <div class="chk" style="margin:14px 0 4px">
      <input type="checkbox" data-k="_tudo"${tudo ? ' checked' : ''} id="ac-tudo">
      <label for="ac-tudo"><b>Todos os módulos</b> — sem restrição</label></div>
    <div id="ac-lista" style="${tudo ? 'opacity:.45;pointer-events:none' : ''}">
      ${CATALOGO_MODULOS.map(g => `
        <div class="grp" style="margin:12px 0 6px">${esc(g.grupo)}</div>
        ${g.itens.map(k => `<div class="chk" style="margin:3px 0">
          <input type="checkbox" data-mod="${k}"${!tudo && marcados.has(k) ? ' checked' : ''} id="ac-${k}">
          <label for="ac-${k}">${esc(R[k]?.label || k)}</label></div>`).join('')}`).join('')}
    </div>
    <div class="hint" style="margin-top:10px">Início, Configurações (perfil e aparência)
      e a Gestão Pessoal são de todo mundo — não precisam de liberação.</div>`;
  const m = modal({
    titulo: `Acesso · ${u.nome}`, corpo, ok: 'Salvar acesso',
    onOk: async mask => {
      const papel = mask.querySelector('[data-k="papel"]').value;
      const tudo2 = mask.querySelector('[data-k="_tudo"]').checked;
      const modulos = tudo2 ? null
        : [...mask.querySelectorAll('[data-mod]')].filter(c => c.checked).map(c => c.dataset.mod);
      const ok = await grava('usuarios', { papel, modulos }, u.id);
      if (!ok) return false;
      await recarregaBase();
      // Mexeu no próprio acesso: o menu precisa refletir na hora
      if (eu?.id === u.id) { eu = cache.usuarios.find(x => x.id === u.id); montaShell(); }
      else pinta();
      toast('Acesso salvo.');
      return true;
    }
  });
  m.mask.querySelector('[data-k="_tudo"]').onchange = e => {
    const l = m.mask.querySelector('#ac-lista');
    l.style.opacity = e.target.checked ? '.45' : '';
    l.style.pointerEvents = e.target.checked ? 'none' : '';
  };
}
/* ── convites ─────────────────────────────────────────────────────
   A tabela pode não existir ainda (correção 04). Nesse caso a tela
   explica em vez de despejar erro. */
async function listaConvites() {
  const alvo = $('#lista-convites'); if (!alvo) return;
  const { data, error } = await sb.from('convites').select('*').order('created_at', { ascending: false });
  if (error) {
    alvo.innerHTML = `<div class="cb"><div class="err" style="display:block">
      O convite ainda não existe no banco. Rode o arquivo
      <b>CORRECAO-04.sql</b> no SQL Editor do Supabase para ligar esta parte.</div></div>`;
    return;
  }
  const abertos = data.filter(c => !c.usado_em && (!c.expira_em || c.expira_em >= hoje()));
  const ct = $('#ct-conv'); if (ct) ct.textContent = `${abertos.length} aberto(s)`;

  if (!data.length) {
    alvo.innerHTML = vazio('inbox', 'Nenhum convite',
      'Crie um convite com o e-mail da pessoa. Ela se cadastra sozinha e já entra com o cargo certo.',
      { act:'novo-convite', label:'Convidar alguém' });
    return;
  }
  alvo.innerHTML = `<div class="t-scroll"><table><thead><tr>
    <th>E-mail</th><th>Nome</th><th>Cargo</th><th>Validade</th><th>Situação</th><th></th>
  </tr></thead><tbody>${data.map(c => {
    const vencido = !c.usado_em && c.expira_em && c.expira_em < hoje();
    return `<tr>
      <td><b>${esc(c.email)}</b></td>
      <td class="mut">${esc(c.nome || '—')}</td>
      <td class="mut">${esc(nomeCargo(c.cargo_id))}</td>
      <td class="mut">${dtl(c.expira_em)}</td>
      <td>${c.usado_em ? `<span class="pill ok">usado em ${dt(c.usado_em.slice(0,10))}</span>`
            : vencido ? '<span class="pill bad">vencido</span>'
            : '<span class="pill warn">aguardando</span>'}</td>
      <td class="act">
        ${c.usado_em ? '' : `
          <button class="btn sm ghost" data-act="copia-convite" data-e="${esc(c.email)}">${ico('copy',13)} Copiar mensagem</button>
          <button class="btn sm ghost" data-act="revoga-convite" data-id="${c.id}" data-e="${esc(c.email)}">${ico('trash',13)}</button>`}
      </td></tr>`;
  }).join('')}</tbody></table></div>`;
}

/* Reordena trocando de lugar com o vizinho. Simples e previsível. */
async function moveMetrica(id, passo) {
  const ms = [...cache.metricas].sort((a, b) => a.ordem - b.ordem);
  const i = ms.findIndex(m => m.id === id), j = i + passo;
  if (i < 0 || j < 0 || j >= ms.length) return;
  await Promise.all([
    grava('metricas_painel', { ordem: ms[j].ordem }, ms[i].id),
    grava('metricas_painel', { ordem: ms[i].ordem }, ms[j].id)
  ]);
  await recarregaBase(); pinta();
}

/* Excluir: antes de perguntar, conta o que vai junto. Metas e
   lançamentos financeiros são apagados em cascata; o resto só
   perde o vínculo com o canal. */
async function excluiCanal(id, nome) {
  const [metas, fin, acoes, camp, cont, fun, pess] = await Promise.all([
    conta('metas','canal_id',id),          conta('financeiro_mkt','canal_id',id),
    conta('acoes','canal_id',id),          conta('campanhas','canal_id',id),
    conta('producao_conteudo','canal_id',id), conta('funil','canal_id',id),
    conta('usuarios','canal_principal_id',id)
  ]);
  const cascata = metas + fin;
  const solta = acoes + camp + cont + fun + pess;
  const linha = (n, t) => n ? `<li>${n} ${t}</li>` : '';

  confirma(`Excluir "${nome}"`, `
    ${cascata ? `<p style="color:var(--bad);font-weight:600;margin-bottom:8px">
        Isto apaga junto, sem volta:</p>
      <ul style="margin:0 0 14px 18px;color:var(--bad)">
        ${linha(metas,'meta(s)')}${linha(fin,'lançamento(s) financeiro(s)')}</ul>` : ''}
    ${solta ? `<p style="margin-bottom:8px">Estes registros <b>não</b> são apagados — apenas ficam sem canal:</p>
      <ul style="margin:0 0 14px 18px;color:var(--txt2)">
        ${linha(acoes,'ação(ões)')}${linha(camp,'campanha(s)')}${linha(cont,'conteúdo(s)')}
        ${linha(fun,'registro(s) de funil')}${linha(pess,'pessoa(s) com este canal principal')}</ul>` : ''}
    ${!cascata && !solta ? '<p>Nada depende deste canal. Pode excluir tranquilo.</p>' : ''}
    <p class="sm2">Se a ideia é só tirar da frente sem perder histórico, edite o canal e desmarque
      <b>Ativo</b> — ele some das listas e mantém tudo.</p>`,
    async () => {
      const ok = await apaga('canais_venda', id);
      if (ok) { await recarregaBase(); toast(`Canal "${nome}" excluído.`); }
      return ok;
    },
    cascata ? { palavra: 'EXCLUIR' } : {});
}

/* ═══════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════ */

}

const finSemBanco = () => `<div class="head"><div><h2>Gestão Pessoal</h2></div></div>

const finCat    = id => fin.cats.find(c => c.id === id) || null;
const finCatId  = nome => fin.cats.find(c => c.nome === nome)?.id || null;
const finGrupo  = id => finCat(id)?.grupo || 'variavel';
