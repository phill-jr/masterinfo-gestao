/* ── tags ─────────────────────────────────────────────────────────
   Texto livre. A cor sai do próprio nome, então a mesma tag tem
   sempre a mesma cor sem ninguém precisar escolher. */
const CORES_TAG = ['#6366f1','#10b981','#f59e0b','#ec4899','#06b6d4','#8b5cf6','#ef4444','#14b8a6'];
function corTag(t) {
  let h = 0;
  for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return CORES_TAG[h % CORES_TAG.length];
}
const leTags = txt => {
  const l = String(txt || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
  return l.length ? [...new Set(l)] : null;
};
const chipsTags = tags => !tags?.length ? '' :
  `<div class="tags">${tags.map(t => {
    const c = corTag(t);
    return `<span style="color:${c};background:${c}22;border-color:${c}44">${esc(t)}</span>`;
  }).join('')}</div>`;

/* ── Check do dia ─────────────────────────────────────────────────
   Onde você marca o que fez e vê o quanto da rotina saiu. O número
   sozinho não serve: por isso vem com os últimos 14 dias do lado,
   que é onde constância aparece. */
R.checkDiario = {
  label: 'Checklist', curto: 'Checklist', icone: 'check', titulo: 'Checklist',
  filtro: { periodo: 'hoje', quem: 'minha', tag: '', natureza: 'tudo', data: null },
  async dados() {
    const de = new Date(Date.now() - 29 * 864e5).toISOString().slice(0, 10);
    const [acoes, modelos] = await Promise.all([
      q('acoes', x => x.eq('recorrencia', 'nenhuma').not('prazo', 'is', null).gte('prazo', de).order('prazo')),
      q('acoes', x => x.neq('recorrencia', 'nenhuma').eq('status', 'aberta'))
    ]);
    return { acoes, modelos };
  },
  render({ acoes, modelos }) {
    const f = R.checkDiario.filtro;
    if (f.quem === 'minha' && !eu) f.quem = 'todos';
    if (f.periodo === 'dia' && !f.data) f.data = hoje();

    // Veio de uma rotina recorrente, ou apareceu solta hoje?
    const ehRotina = a => !!a.acao_modelo_id || a.origem === 'recorrencia';

    const meus = acoes.filter(a =>
      (f.quem !== 'minha' || a.responsavel_id === eu?.id) &&
      (!f.tag || (a.tags || []).includes(f.tag)) &&
      (f.natureza === 'tudo' || (f.natureza === 'rotina') === ehRotina(a)) &&
      a.status !== 'cancelada');

    // Intervalo do período escolhido
    const ini = f.periodo === 'dia' ? f.data
              : f.periodo === 'hoje' ? hoje()
              : f.periodo === 'semana' ? seg()
              : hoje().slice(0, 8) + '01';
    const fim = f.periodo === 'dia' ? f.data
              : f.periodo === 'hoje' ? hoje()
              : f.periodo === 'semana' ? new Date(new Date(seg() + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10)
              : new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).toISOString().slice(0, 10);

    let lista = meus.filter(a => a.prazo >= ini && a.prazo <= fim);

    /* Dia escolhido que ainda não foi gerado: em vez de mostrar tela
       vazia, calcula a partir das rotinas o que VAI cair ali. É uma
       previsão, não tarefa — por isso não dá para marcar. */
    const previsao = f.periodo === 'dia' && !lista.length
      ? (modelos || [])
          .filter(m => caiNoDia(m, f.data))
          .filter(m => (f.quem !== 'minha' || !eu || m.responsavel_id === eu.id) &&
                       (!f.tag || (m.tags || []).includes(f.tag)) &&
                       (f.natureza !== 'pontual'))
          .sort((a, b) => (a.hora || '99') > (b.hora || '99') ? 1 : -1)
      : [];
    const feitas = lista.filter(a => a.status === 'concluida');
    const pct = lista.length ? Math.round(100 * feitas.length / lista.length) : null;

    // Últimos 14 dias: constância só aparece na sequência
    const dias14 = [...Array(14)].map((_, i) => {
      const d = new Date(Date.now() - (13 - i) * 864e5).toISOString().slice(0, 10);
      const doDia = meus.filter(a => a.prazo === d);
      const ok = doDia.filter(a => a.status === 'concluida').length;
      return { d, total: doDia.length, ok, pct: doDia.length ? Math.round(100 * ok / doDia.length) : null };
    });

    // Sequência de dias fechados em 100%, contando de trás para frente.
    // Dia sem nenhuma rotina não conta nem a favor nem contra.
    let streak = 0;
    for (let i = dias14.length - 1; i >= 0; i--) {
      if (dias14[i].total === 0) continue;
      if (dias14[i].pct === 100) streak++; else break;
    }

    const tagsUsadas = [...new Set(meus.flatMap(a => a.tags || []))].sort();
    const atrasadas = lista.filter(a => a.status !== 'concluida' && a.prazo < hoje());

    const porDia = f.periodo === 'hoje' || f.periodo === 'dia';

    const item = a => {
      const feito = a.status === 'concluida';
      const rot = ehRotina(a);
      return `<div class="tl-item ${rot ? 'rotina' : 'pontual'} ${feito ? 'feito' : ''}">
        <div class="tl-hora ${a.hora ? '' : 'vazia'}">${a.hora ? hm(a.hora) : 'sem hora'}</div>
        <div class="tl-rail"><span class="pt"></span></div>
        <div class="tl-corpo">
          <button class="tick ${rot ? '' : 'pt'} ${feito ? 'done' : ''}" data-act="virar" data-id="${a.id}"
            data-v="${feito ? 'aberta' : 'concluida'}">${ico('check', 12)}</button>
          <div class="g">
            <div class="t">${esc(a.titulo)}</div>
            <div class="m">${!porDia ? dt(a.prazo) + ' · ' : ''}${
              esc(nomeUser(a.responsavel_id))}${
              a.setor_id ? ' · ' + esc(nomeSetor(a.setor_id)) : ''}${
              a.canal_id ? ' · ' + esc(nomeCanal(a.canal_id)) : ''}</div>
            ${chipsTags(a.tags)}
          </div>
          ${a.prazo < hoje() && !feito ? '<span class="pill bad">atrasada</span>' : ''}
          ${feito && a.concluida_em ? `<span class="sm2">✓ ${hora(a.concluida_em)}</span>` : ''}
        </div></div>`;
    };

    // No dia, agrupa por turno; em período maior, agrupa por data
    const grupos = {};
    if (porDia) {
      const turno = a => {
        if (!a.hora) return '4. Sem horário';
        const h = +hm(a.hora).slice(0, 2);
        return h < 12 ? '1. Manhã' : h < 18 ? '2. Tarde' : '3. Noite';
      };
      lista.forEach(a => { (grupos[turno(a)] ||= []).push(a); });
    } else {
      lista.forEach(a => { (grupos[a.prazo] ||= []).push(a); });
    }
    /* Cronológico dentro de qualquer agrupamento. Sem hora vai para o
       fim — e o desempate é pelo título, para a ordem não dançar a
       cada recarga quando duas tarefas marcam a mesma hora. */
    Object.values(grupos).forEach(g => g.sort((a, b) =>
      emMinuto(a.hora) - emMinuto(b.hora) || (a.titulo > b.titulo ? 1 : -1)));
    const chaves = Object.keys(grupos).sort();
    if (!porDia) chaves.reverse();
    const rotuloGrupo = k => porDia ? k.slice(3)
      : (k === hoje() ? 'Hoje · ' : '') + new Date(k + 'T12:00:00')
          .toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'2-digit' });

    const raio = 52, volta = 2 * Math.PI * raio;

    return `<div class="head"><div><h2>Checklist</h2>
        <div class="sub">Marque o que saiu. O que importa não é o dia perfeito, é a sequência.</div></div>
        <div class="push">
          ${dd(null, 'gerar-quando', [
            { v:'hoje',   t:'Hoje',            i:'clock' },
            { v:'amanha', t:'Amanhã',          i:'arrowR', d:'Deixar o dia seguinte pronto' },
            { v:'semana', t:'Esta semana',     i:'cal',    d:'De segunda a domingo' },
            { v:'prox',   t:'Próximos 7 dias', i:'refresh' },
            { v:'dia',    t:'O dia escolhido', i:'target', d:'Usa a data do filtro' }
          ], '', { fixo:'Gerar rotinas', icone:'zap' })}
          <button class="btn" data-act="nova-rotina">${ico('refresh',15)}Rotina</button>
          <button class="btn pontual" data-act="nova-pontual">${ico('zap',15)}Tarefa pontual</button>
        </div></div>

      <div class="filtros">
        ${dd('Período', 'periodo', [
          { v:'hoje', t:'Hoje', i:'clock' },
          { v:'semana', t:'Esta semana', i:'cal' },
          { v:'mes', t:'Este mês', i:'chart' },
          { v:'dia', t:'Um dia específico', i:'cal', d:'Ver com antecedência como vai ser' }
        ], f.periodo)}
        ${f.periodo === 'dia' ? `<input type="date" data-act="escolhe-data" value="${esc(f.data || hoje())}"
          style="width:auto;font-weight:600">
          <span class="pill ${f.data === hoje() ? 'ac' : f.data > hoje() ? 'info' : 'dim'}">${
            f.data === hoje() ? 'hoje'
            : f.data > hoje() ? 'daqui a ' + Math.round((new Date(f.data + 'T12:00:00') - new Date(hoje() + 'T12:00:00')) / 864e5) + ' dia(s)'
            : 'passado'}</span>` : ''}
        ${dd('De quem', 'quem', [
          { v:'minha', t:'Minhas', i:'user' },
          { v:'todos', t:'Do time', i:'users' }
        ], f.quem)}
        ${dd('Natureza', 'natureza', [
          { v:'tudo', t:'Rotina e pontual', i:'grid' },
          { v:'rotina', t:'Só rotina', i:'refresh' },
          { v:'pontual', t:'Só pontual', i:'zap' }
        ], f.natureza)}
        ${cache.temTags && tagsUsadas.length ? dd('Tag', 'tag',
          [{ v:'', t:'Todas as tags' }, ...tagsUsadas.map(t => ({ v:t, t }))], f.tag) : ''}
      </div>

      ${previsao.length ? `
        <div class="card"><div class="ch">
          <h3>${(() => { const d = new Date(f.data + 'T12:00:00')
              .toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
            return d[0].toUpperCase() + d.slice(1); })()}</h3>
          <span class="pill info">previsão</span>
          <div class="push"><button class="btn" data-act="gerar-dia">${ico('zap',15)}Gerar este dia</button></div></div>
        <div class="cb" style="padding-bottom:4px"><p class="sm2">
          As tarefas deste dia ainda não foram criadas. Isto é o que as suas rotinas
          <b>vão gerar</b> — dá para se preparar, mas ainda não dá para marcar.
          Clique em "Gerar este dia" se quiser antecipar.</p></div>
        ${previsao.map(m => `<div class="tl-item rotina previsto">
          <div class="tl-hora ${m.hora ? '' : 'vazia'}">${m.hora ? hm(m.hora) : 'sem hora'}</div>
          <div class="tl-rail"><span class="pt"></span></div>
          <div class="tl-corpo">
            <span class="tick" style="border-style:dashed;cursor:default"></span>
            <div class="g"><div class="t">${esc(m.titulo)}</div>
              <div class="m">${esc(nomeUser(m.responsavel_id))}${
                m.setor_id ? ' · ' + esc(nomeSetor(m.setor_id)) : ''}</div>
              ${chipsTags(m.tags)}</div>
            <span class="pill dim">prevista</span></div></div>`).join('')}
        </div>` : `
      <div class="progresso">
        <div class="anel">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="${raio}" class="tr"/>
            <circle cx="60" cy="60" r="${raio}" class="fr ${pct === 100 ? 'cheio' : ''}"
              style="stroke-dasharray:${volta};stroke-dashoffset:${volta * (1 - (pct || 0) / 100)}"/>
          </svg>
          <div class="mid"><div class="p">${pct == null ? '—' : pct + '%'}</div>
            <div class="s">${feitas.length}/${lista.length}</div></div>
        </div>
        <div class="lado">
          <div class="linha"><div><div class="lb">Sequência</div>
            <div class="ds">Dias seguidos fechando 100%</div></div>
            <div class="v ${streak >= 3 ? 'ok' : ''}">${streak}${streak === 1 ? ' dia' : ' dias'}</div></div>
          <div class="linha"><div><div class="lb">Em aberto</div>
            <div class="ds">${atrasadas.length ? atrasadas.length + ' com prazo vencido' : 'nada atrasado'}</div></div>
            <div class="v ${atrasadas.length ? 'bad' : ''}">${lista.length - feitas.length}</div></div>
          <div class="heat">
            <div class="lb" style="margin-bottom:8px">Últimos 14 dias</div>
            <div class="grade">${dias14.map(x => `<span title="${dtl(x.d)} — ${
              x.total ? x.ok + '/' + x.total : 'nada previsto'}"
              class="${x.total === 0 ? 'vazio' : x.pct === 100 ? 'cheio' : x.pct >= 50 ? 'meio' : 'pouco'}"></span>`).join('')}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="ch"><h3>${f.periodo === 'hoje' ? 'A rotina de hoje'
          : f.periodo === 'semana' ? 'Esta semana'
          : f.periodo === 'mes' ? 'Este mês'
          : (() => { const d = new Date(f.data + 'T12:00:00')
              .toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
             return d[0].toUpperCase() + d.slice(1); })()}</h3>
          <span class="push sm2">${lista.length} item(ns)</span></div>
        <div class="legenda">
          <b><i style="background:var(--ac)"></i> Rotina — se repete</b>
          <b><i style="background:var(--pt)"></i> Pontual — só hoje</b>
          <span style="margin-left:auto">${lista.filter(ehRotina).length} rotina(s) ·
            ${lista.filter(a => !ehRotina(a)).length} pontual(is)</span></div>
        ${lista.length ? chaves.map(k => `
          <div class="grupo">${rotuloGrupo(k)}
            <span>${grupos[k].filter(a => a.status === 'concluida').length}/${grupos[k].length}</span></div>
          ${grupos[k].map(item).join('')}`).join('')
        : vazio('check',
            f.periodo === 'hoje' ? 'Nada previsto para hoje'
            : f.periodo === 'dia' ? 'Nenhuma rotina cai neste dia'
            : 'Nada neste período',
            'Se você tem rotinas cadastradas, clique em "Gerar hoje". Se não tem, comece criando uma em Rotina semanal.',
            { act:'gerar', label:'Gerar hoje' })}
      </div>`}`;
  },
  acoes: {
    periodo(b)  { R.checkDiario.filtro.periodo = b.dataset.v; pinta(); },
    quem(b)     { R.checkDiario.filtro.quem = b.dataset.v; pinta(); },
    tag(b)      { R.checkDiario.filtro.tag = b.dataset.v; pinta(); },
    natureza(b) { R.checkDiario.filtro.natureza = b.dataset.v; pinta(); },
    'escolhe-data'(el) { R.checkDiario.filtro.data = el.value || hoje(); pinta(); },
    async 'gerar-dia'() { await R.checkDiario.acoes['gerar-quando']({ dataset:{ v:'dia' } }); },

    async 'gerar-quando'(b) {
      const f = R.checkDiario.filtro;
      const mais = n => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);
      const faixas = {
        hoje:   [hoje(), hoje()],
        amanha: [mais(1), mais(1)],
        semana: [seg(), new Date(new Date(seg() + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10)],
        prox:   [hoje(), mais(6)],
        dia:    [f.data || hoje(), f.data || hoje()]
      };
      const [de, ate] = faixas[b.dataset.v] || faixas.hoje;

      const { data, error } = await sb.rpc('gerar_acoes_do_periodo', { p_de: de, p_ate: ate });
      if (error) {
        return toast(/function|does not exist/i.test(error.message)
          ? 'A geração por período ainda não existe no banco (correção 07).' : error.message, { tipo:'bad' });
      }
      const quando = de === ate ? dt(de) : `${dt(de)} a ${dt(ate)}`;
      toast(data ? `${data} tarefa(s) criada(s) — ${quando}.` : `Nada novo a gerar em ${quando}.`,
        { tipo: data ? 'ok' : 'info' });

      // Leva a tela para onde o usuário acabou de gerar
      if (b.dataset.v === 'amanha') { f.periodo = 'dia'; f.data = mais(1); }
      else if (b.dataset.v === 'semana' || b.dataset.v === 'prox') f.periodo = 'semana';
      pinta();
    },
    'nova-rotina'()  { R.acoes.acoes.modelo(); },
    'nova-pontual'() { formPontual(); },
    async gerar() {
      const { data, error } = await sb.rpc('gerar_acoes_do_dia');
      if (error) return toast(error.message, { tipo:'bad' });
      toast(data ? `${data} tarefa(s) criada(s) para hoje.` : 'Hoje já estava gerado.',
        { tipo: data ? 'ok' : 'info' });
      pinta();
    },
    async 'gerar-semana'() {
      const de = seg();
      const ate = new Date(new Date(de + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10);
      const { data, error } = await sb.rpc('gerar_acoes_do_periodo', { p_de: de, p_ate: ate });
      if (error) {
        return toast(/function|does not exist/i.test(error.message)
          ? 'A geração por semana ainda não existe no banco (correção 07).' : error.message, { tipo:'bad' });
      }
      toast(data ? `${data} tarefa(s) criada(s) de ${dt(de)} a ${dt(ate)}.`
                 : 'A semana já estava gerada.', { tipo: data ? 'ok' : 'info' });
      R.checkDiario.filtro.periodo = 'semana';
      pinta();
    },
    async virar(b) {
      const novo = b.dataset.v;
      b.classList.toggle('done', novo === 'concluida');   // resposta imediata
      if (await grava('acoes', { status: novo }, b.dataset.id)) pinta();
      else pinta();
    }
  }
};

/* ── painel de métricas ───────────────────────────────────────────
   Cada cartão é uma linha de metricas_painel. Em vez de campo de
   fórmula livre — que parece flexível e falha calado — a métrica é
   montada por partes: o que medir, em que período, filtrando o quê.
   O alcance é o mesmo e o sistema consegue validar. */
const TIPOS_METRICA = {
  percentual: { t:'% concluído',        d:'Quanto do previsto foi fechado' },
  abertas:    { t:'Em aberto',          d:'Quantas ainda faltam' },
  previstas:  { t:'Previstas',          d:'Quantas existem no período' },
  concluidas: { t:'Concluídas',         d:'Quantas foram fechadas' },
  atrasadas:  { t:'Atrasadas',          d:'Passaram do prazo e não fecharam' },
  dia_pico:   { t:'Dia mais carregado', d:'Onde a semana concentra' },
  sequencia:  { t:'Sequência',          d:'Dias seguidos fechando 100%' }
};

function calculaMetrica(m, ocorrencias) {
  const ehRotina = a => !!a.acao_modelo_id || a.origem === 'recorrencia';
  const base = ocorrencias.filter(a =>
    a.status !== 'cancelada' &&
    (m.escopo !== 'minha' || !eu || a.responsavel_id === eu.id) &&
    (m.natureza === 'tudo' || (m.natureza === 'rotina') === ehRotina(a)) &&
    (!m.setor_id || a.setor_id === m.setor_id) &&
    (!m.tag || (a.tags || []).includes(m.tag)));

  const ini = m.periodo === 'hoje' ? hoje()
            : m.periodo === 'semana' ? seg() : hoje().slice(0, 8) + '01';
  const fim = m.periodo === 'hoje' ? hoje()
            : m.periodo === 'semana'
              ? new Date(new Date(seg() + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10)
              : new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).toISOString().slice(0, 10);
  const dentro = base.filter(a => a.prazo >= ini && a.prazo <= fim);
  const feitas = dentro.filter(a => a.status === 'concluida');

  switch (m.tipo) {
    case 'percentual':
      return { valor: dentro.length ? Math.round(100 * feitas.length / dentro.length) : null,
               sufixo: '%', rodape: `${feitas.length} de ${dentro.length}` };
    case 'abertas':
      return { valor: dentro.length - feitas.length, rodape: `de ${dentro.length} previstas` };
    case 'previstas':  return { valor: dentro.length };
    case 'concluidas': return { valor: feitas.length, rodape: `de ${dentro.length}` };
    case 'atrasadas': {
      const at = base.filter(a => a.status !== 'concluida' && a.prazo < hoje());
      return { valor: at.length, invertido: true,
               rodape: at.length ? 'a mais antiga: ' + dt(at.map(a => a.prazo).sort()[0]) : 'nada vencido' };
    }
    case 'dia_pico': {
      const porDia = ORDEM_SEMANA.map(d => ({ d,
        n: dentro.filter(a => new Date(a.prazo + 'T12:00:00').getDay() === d).length }));
      const topo = porDia.reduce((a, b) => b.n > a.n ? b : a, porDia[0]);
      return { texto: topo.n ? NOME_DIA[topo.d] : '—', rodape: `${topo.n} tarefa(s)` };
    }
    case 'sequencia': {
      let n = 0;
      for (let i = 0; i < 60; i++) {
        const d = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
        const doDia = base.filter(a => a.prazo === d);
        if (!doDia.length) continue;
        if (doDia.every(a => a.status === 'concluida')) n++; else break;
      }
      return { valor: n, rodape: n === 1 ? 'dia' : 'dias' };
    }
  }
  return { valor: null };
}

function painelMetricas(ocorrencias) {
  const ativas = cache.metricas.filter(m => m.ativo);
  if (!cache.temMetricas) return '';
  if (!ativas.length) return `<div class="card"><div class="cb sm2">
    Nenhuma métrica ativa. Escolha o que acompanhar em
    <b>Configurações → Painel</b>.</div></div>`;

  return `<div class="tiles stg">${ativas.map(m => {
    const r = calculaMetrica(m, ocorrencias);
    const v = r.texto ?? (r.valor == null ? '—' : r.valor + (r.sufixo || ''));
    let cls = '';
    if (m.meta != null && r.valor != null) {
      const bate = r.invertido ? r.valor <= m.meta : r.valor >= m.meta;
      cls = bate ? 'ok' : (r.invertido ? 'bad' : r.valor >= m.meta * 0.6 ? 'warn' : 'bad');
    } else if (r.invertido && r.valor > 0) cls = 'warn';
    return `<div class="tile ${cls}">
      <div class="ic">${ico(m.icone || 'check', 18)}</div>
      <div class="n" style="${r.texto ? 'font-size:22px' : ''}">${esc(v)}</div>
      <div class="l">${esc(m.nome)}</div>
      <div class="h">${esc(r.rodape || '')}${m.meta != null ? ` · meta ${m.meta}${r.sufixo || ''}` : ''}</div>
      ${m.meta != null && r.valor != null && !r.invertido ? `<div class="bar" style="margin-top:9px">
        <i class="${cls}" style="width:${Math.min(100, 100 * r.valor / m.meta)}%"></i></div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

/* ── calendário das rotinas ───────────────────────────────────────
   Mesma regra de recorrência que o banco usa para gerar o dia. Se as
   duas divergirem, o calendário vira ficção. */
function caiNoDia(m, iso) {
  const d = new Date(iso + 'T12:00:00'), dow = d.getDay(), dia = d.getDate();
  switch (m.recorrencia) {
    case 'diaria':     return true;
    case 'dias_uteis': return dow >= 1 && dow <= 5;
    case 'semanal':    return (m.recorrencia_dias || []).includes(dow);
    case 'quinzenal':
      if (!m.recorrencia_inicio || iso < m.recorrencia_inicio) return false;
      return Math.round((d - new Date(m.recorrencia_inicio + 'T12:00:00')) / 864e5) % 14 === 0;
    case 'mensal': {
      const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      return dia === Math.min(m.recorrencia_dia_mes || 1, ultimo);
    }
  }
  return false;
}

let _calModelos = [];

function calendario(modelos, mesRef) {
  _calModelos = modelos;
  const hj = hoje();
  const [ano, mes] = (mesRef || hj.slice(0, 7)).split('-').map(Number);
  const primeiro = new Date(ano, mes - 1, 1);
  const ultimo   = new Date(ano, mes, 0).getDate();
  // Segunda como primeiro dia da semana
  const desloca  = (primeiro.getDay() + 6) % 7;
  const iso = d => `${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  const passo = n => {
    const d = new Date(ano, mes - 1 + n, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}`;
  };
  const titulo = primeiro.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });

  const celulas = [];
  for (let i = 0; i < desloca; i++) celulas.push('<div class="cel fora"></div>');
  for (let d = 1; d <= ultimo; d++) {
    const data = iso(d);
    const doDia = modelos.filter(m => caiNoDia(m, data))
      .sort((a, b) => (a.hora || '99') > (b.hora || '99') ? 1 : -1);
    const fds = [0, 6].includes(new Date(data + 'T12:00:00').getDay());
    celulas.push(`<div class="cel ${data === hj ? 'hoje' : ''} ${fds ? 'fds' : ''} ${doDia.length ? 'temAlgo' : ''}"
      ${doDia.length ? `data-act="dia" data-d="${data}"` : ''}>
      <div class="num">${d}${data === hj ? '<span>hoje</span>' : ''}</div>
      ${doDia.slice(0, 3).map(m => `<div class="ev" title="${esc(m.titulo)}">
        ${m.hora ? `<b>${hm(m.hora)}</b> ` : ''}${esc(m.titulo)}</div>`).join('')}
      ${doDia.length > 3 ? `<div class="mais">+${doDia.length - 3}</div>` : ''}</div>`);
  }

  return `<div class="card"><div class="ch">
      <button class="ib" data-act="mes" data-v="${passo(-1)}">${ico('arrowL',16)}</button>
      <h3 style="min-width:190px;text-align:center">${titulo[0].toUpperCase() + titulo.slice(1)}</h3>
      <button class="ib" data-act="mes" data-v="${passo(1)}">${ico('arrowR',16)}</button>
      <div class="push">
        <button class="btn sm ghost" data-act="mes" data-v="${hj.slice(0,7)}">Hoje</button></div></div>
    <div class="cb">
      <div class="cal">
        ${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(n => `<div class="cab">${n}</div>`).join('')}
        ${celulas.join('')}
      </div>
      <div class="sm2" style="margin-top:12px">Mostra onde cada rotina cai, incluindo as mensais e as
        quinzenais. Clique num dia para ver a lista completa.</div>

function detalheDoDia(data) {
  const lista = _calModelos.filter(m => caiNoDia(m, data))
    .sort((a, b) => (a.hora || '99') > (b.hora || '99') ? 1 : -1);
  const d = new Date(data + 'T12:00:00');
  const t = d.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
  modal({
    titulo: t[0].toUpperCase() + t.slice(1), ok: 'Fechar', largura: 460,
    onOk: () => true,
    corpo: lista.map(m => `<div style="display:flex;gap:12px;align-items:flex-start;
        padding:11px 0;border-bottom:1px solid var(--line)">
        <span class="pill ${m.hora ? 'ac' : 'dim'}" style="min-width:56px;justify-content:center">
          ${m.hora ? hm(m.hora) : '—'}</span>
        <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px">${esc(m.titulo)}</div>
          <div class="sm2">${esc(nomeUser(m.responsavel_id))}${
            m.canal_id ? ' · ' + esc(nomeCanal(m.canal_id)) : ''}</div>
          ${chipsTags(m.tags)}</div></div>`).join('')
      || '<p class="sm2">Nada previsto.</p>'
  });
}

/* ── Rotina semanal ───────────────────────────────────────────────
   A semana inteira em sete colunas. É a pergunta "como é a minha
   segunda-feira?" respondida sem precisar abrir cada rotina. */
R.rotinaSemanal = {
  label: 'Rotina semanal', curto: 'Rotina semanal', icone: 'cal', titulo: 'Rotina semanal',
  filtro: { quem: 'minha', vista: 'kanban', mes: null },
  async dados() {
    const de = new Date(Date.now() - 59 * 864e5).toISOString().slice(0, 10);
    const [modelos, ocorrencias] = await Promise.all([
      q('acoes', x => x.neq('recorrencia', 'nenhuma').eq('status', 'aberta')),
      q('acoes', x => x.eq('recorrencia', 'nenhuma').not('prazo', 'is', null).gte('prazo', de))
    ]);
    return { modelos, ocorrencias };
  },
  render({ modelos, ocorrencias }) {
    const f = R.rotinaSemanal.filtro;
    if (f.quem === 'minha' && !eu) f.quem = 'todos';
    const meus = f.quem === 'minha' && eu
      ? modelos.filter(m => m.responsavel_id === eu.id) : modelos;

    const hojeDia = new Date().getDay();
    const semanais = meus.filter(m => diasDaRotina(m));
    const mensais  = meus.filter(m => !diasDaRotina(m));

    // Minutos desde a meia-noite; sem hora vai para o fim do dia
    const emMin = h => { if (!h) return 99999;
      const [H, M] = hm(h).split(':').map(Number); return H * 60 + M; };

    const doDia = d => semanais
      .filter(m => diasDaRotina(m).includes(d))
      .sort((a, b) => emMin(a.hora) - emMin(b.hora));

    const cartao = m => `<div class="k" data-act="editar" data-id="${m.id}" style="cursor:pointer">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
        ${m.hora
          ? `<span class="pill ac" style="font-variant-numeric:tabular-nums">${hm(m.hora)}</span>`
          : '<span class="pill dim">sem hora</span>'}
        ${m.recorrencia === 'quinzenal' ? '<span class="pill info">quinzenal</span>' : ''}
      </div>
      <div class="t">${esc(m.titulo)}</div>
      <div class="m">${esc(nomeUser(m.responsavel_id))}${
        m.canal_id ? ' · ' + esc(nomeCanal(m.canal_id)) : ''}</div>
      ${chipsTags(m.tags)}</div>`;

    const carga = ORDEM_SEMANA.map(d => doDia(d).length);
    const pico = Math.max(...carga, 1);
    const maxCarga = Math.max(...carga);
    const diaPico = ORDEM_SEMANA[carga.indexOf(maxCarga)];
    // Só considera os dias úteis: sábado vazio não é desequilíbrio
    const uteis = [1,2,3,4,5].map(d => doDia(d).length);
    const desequilibrio = Math.max(...uteis) - Math.min(...uteis);

    return `<div class="head"><div><h2>Rotina semanal</h2>
        <div class="sub">Sua semana inteira em uma tela. Cada coluna é um dia, em ordem de horário.</div></div>
        <div class="push">
          ${dd('Visão', 'vista', [
            { v:'kanban', t:'Kanban', i:'grid', d:'A semana em sete colunas' },
            { v:'lista', t:'Lista', i:'check', d:'Tabela para revisar e editar' },
            { v:'calendario', t:'Calendário', i:'cal', d:'O mês inteiro, com as mensais' }
          ], f.vista)}
          ${dd('De quem', 'quem', [
            { v:'minha', t:'Minha rotina', i:'user' },
            { v:'todos', t:'Todo o time', i:'users' }
          ], f.quem)}
          <button class="btn" data-act="nova">${ico('plus',15)}Nova rotina</button></div></div>

      ${!cache.temHora ? `<div class="card"><div class="cb"><div class="err" style="display:block">
        O campo de horário ainda não existe no banco — as rotinas aparecem sem hora.
        Para ligar, rode <b>CORRECAO-05.sql</b> (é uma linha só).</div></div></div>` : ''}

      ${semanais.length || mensais.length ? `
        ${cache.temMetricas ? painelMetricas(ocorrencias) : `
        <div class="tiles stg">
          <div class="tile"><div class="ic">${ico('refresh',18)}</div><div class="n">${semanais.length}</div>
            <div class="l">Rotinas na semana</div></div>
          <div class="tile ok"><div class="ic">${ico('clock',18)}</div>
            <div class="n">${doDia(hojeDia).length}</div><div class="l">Para hoje</div></div>
          <div class="tile ${desequilibrio > 4 ? 'warn' : ''}"><div class="ic">${ico('chart',18)}</div>
            <div class="n" style="font-size:22px">${NOME_DIA[diaPico]}</div>
            <div class="l">Dia mais carregado</div><div class="h">${maxCarga} rotina(s)</div></div>
          <div class="tile"><div class="ic">${ico('cal',18)}</div>
            <div class="n">${mensais.length}</div><div class="l">Mensais</div></div>
        </div>`}
        ${cache.temMetricas ? `<div class="sm2" style="margin:-8px 0 20px">
          Estes números são configuráveis em
          <b data-act="ir-painel" style="cursor:pointer;color:var(--ac)">Configurações › Painel</b>.</div>` : ''}

        ${f.vista === 'kanban' ? `
        <div class="semana">${ORDEM_SEMANA.map(d => {
          const lista = doDia(d);
          return `<div class="col ${d === hojeDia ? 'hoje' : ''} ${d === 0 || d === 6 ? 'fds' : ''}">
            <h4>${NOME_DIA[d]}${d === hojeDia ? '<span class="agora">hoje</span>' : ''}
              <span>${lista.length}</span></h4>
            <div class="carga"><i style="width:${100 * lista.length / pico}%"></i></div>
            ${lista.length ? lista.map(cartao).join('')
              : `<div class="livre">${d === 0 || d === 6 ? 'folga' : 'dia livre'}</div>`}
          </div>`;
        }).join('')}</div>` : ''}

        ${f.vista === 'lista' ? `
        <div class="card"><div class="ch"><h3>Todas as rotinas</h3>
          <span class="push sm2">${semanais.length + mensais.length} no total</span></div>
          <div class="t-scroll"><table><thead><tr>
            <th>Rotina</th><th>Setor</th><th>Dias de execução</th><th>Hora</th>
            <th>Responsável</th><th>Canal</th><th>Tags</th><th></th>
          </tr></thead><tbody>${[...semanais, ...mensais]
            .sort((a, b) => emMin(a.hora) - emMin(b.hora) || (a.titulo > b.titulo ? 1 : -1))
            .map(m => `<tr>
              <td><b>${esc(m.titulo)}</b>${m.recorrencia === 'quinzenal'
                ? ' <span class="pill info">quinzenal</span>' : ''}</td>
              <td>${m.setor_id
                ? `<span class="pill" style="color:${corSetor(m.setor_id)};background:${corSetor(m.setor_id)}22">${esc(nomeSetor(m.setor_id))}</span>`
                : '<span class="mut">—</span>'}</td>
              <td>${reguaDias(m)}</td>
              <td class="mut">${m.hora ? '<b style="color:var(--txt)">' + hm(m.hora) + '</b>' : '—'}</td>
              <td class="mut">${esc(nomeUser(m.responsavel_id))}</td>
              <td class="mut">${m.canal_id ? esc(nomeCanal(m.canal_id)) : '—'}</td>
              <td>${chipsTags(m.tags) || '<span class="mut">—</span>'}</td>
              <td class="act">
                <button class="btn sm ghost" data-act="editar" data-id="${m.id}" title="Editar">${ico('edit',13)}</button>
                <button class="btn sm ghost" data-act="dup-rotina" data-id="${m.id}" title="Duplicar">${ico('copy',13)}</button>
                <button class="btn sm ghost" data-act="del-rotina" data-id="${m.id}" data-t="${esc(m.titulo)}" title="Excluir">${ico('trash',13)}</button>
              </td>
            </tr>`).join('')}</tbody></table></div></div>` : ''}

        ${f.vista === 'calendario' ? calendario(meus, f.mes) : ''}

        ${f.vista !== 'lista' && mensais.length ? `<div class="card" style="margin-top:20px">
          <div class="ch"><h3>Rotinas mensais</h3>
            <span class="push sm2">não caem num dia fixo da semana</span></div>
          ${mensais.map(m => `<div class="row" data-act="editar" data-id="${m.id}" style="cursor:pointer">
            <span class="pill ac">dia ${m.recorrencia_dia_mes}</span>
            <div class="g"><div class="t">${esc(m.titulo)}</div>
              <div class="m">${esc(nomeUser(m.responsavel_id))}${
                m.canal_id ? ' · ' + esc(nomeCanal(m.canal_id)) : ''}</div></div>
            ${m.hora ? `<span class="pill dim">${hm(m.hora)}</span>` : ''}</div>`).join('')}
        </div>` : ''}`
      : `<div class="card">${vazio('cal',
          f.quem === 'minha' ? 'Sua semana está vazia' : 'Nenhuma rotina cadastrada',
          f.quem === 'minha'
            ? 'Nenhuma rotina recorrente está no seu nome. Crie uma, ou veja a do time inteiro no botão acima.'
            : 'Cadastre o que se repete toda semana e ele aparece aqui, distribuído por dia.',
          { act:'nova', label:'Criar rotina' })}</div>`}`;
  },
  acoes: {
    quem(b)  { R.rotinaSemanal.filtro.quem = b.dataset.v; pinta(); },
    vista(b) { R.rotinaSemanal.filtro.vista = b.dataset.v; pinta(); },
    mes(b)   { R.rotinaSemanal.filtro.mes = b.dataset.v; pinta(); },
    dia(b)   { detalheDoDia(b.dataset.d); },
    nova() { R.acoes.acoes.modelo(); },
    'ir-painel'() { abaCfg = 'painel'; vai('config'); },
    async 'dup-rotina'(b) {
      const [r] = await q('acoes', x => x.eq('id', b.dataset.id));
      if (!r) return;
      const { id, created_at, updated_at, concluida_em, ...copia } = r;
      copia.titulo = r.titulo + ' (cópia)';
      form('Duplicar rotina', [
        { k:'titulo', label:'Título', req:true, value:copia.titulo },
        ...(cache.temSetores ? [{ k:'setor_id', label:'Setor', type:'select', value:copia.setor_id, opts:optSetores() }] : []),
        { k:'responsavel_id', label:'Responsável', type:'select', value:copia.responsavel_id, opts:optUsuarios() },
        ...(cache.temHora ? [{ k:'hora', label:'Horário', type:'time', value:copia.hora ? hm(copia.hora) : '' }] : [])
      ], d => grava('acoes', { ...copia, ...d }), 'Duplicar');
    },
    'del-rotina'(b) {
      confirma('Excluir rotina',
        `<p>"${esc(b.dataset.t)}" sai da grade. As tarefas que ela já gerou nos dias anteriores
         <b>também são apagadas</b>, junto com o histórico de cumprimento.</p>
         <p class="sm2" style="margin-top:10px">Se quiser só tirar da rotina sem perder o histórico,
         use <b>Pausar</b> na tela Ações e rotinas.</p>`,
        async () => { const ok = await apaga('acoes', b.dataset.id); if (ok) toast('Rotina excluída.'); return ok; },
        { palavra: 'EXCLUIR' });
    },
    async editar(b) {
      const [m] = await q('acoes', x => x.eq('id', b.dataset.id));
      if (!m) return;
      form(`Rotina · ${m.titulo}`, [
        { k:'titulo', label:'Título', req:true, value:m.titulo },
        ...(cache.temHora ? [{ k:'hora', label:'Horário', type:'time', value:m.hora ? hm(m.hora) : '',
          hint:'Deixe vazio se não tem hora marcada.' }] : []),
        { k:'responsavel_id', label:'Responsável', type:'select', value:m.responsavel_id, opts:optUsuarios() },
        ...(cache.temSetores ? [{ k:'setor_id', label:'Setor', type:'select', value:m.setor_id, opts:optSetores() }] : []),
        { k:'canal_id', label:'Canal', type:'select', value:m.canal_id, opts:optCanais() },
        { k:'_dias', label:'Dias da semana', value:(diasDaRotina(m) || []).join(','),
          hint:'0=dom, 1=seg … 6=sáb. Muda a rotina para semanal nesses dias.' }
      ], d => {
        const dias = String(d._dias || '').split(',').map(x => parseInt(x, 10))
          .filter(n => n >= 0 && n <= 6);
        delete d._dias;
        if (dias.length) {
          // 5 dias úteis ou 7 dias têm recorrência própria, mais legível
          const util = [1,2,3,4,5].every(x => dias.includes(x)) && dias.length === 5;
          const todos = dias.length === 7;
          d.recorrencia = todos ? 'diaria' : util ? 'dias_uteis' : 'semanal';
          d.recorrencia_dias = d.recorrencia === 'semanal' ? dias : null;
        }
        return grava('acoes', d, m.id);
      });
    }
  }
};

/* ── Rotinas do time ──────────────────────────────────────────────
   Mesmas rotinas da tela de Ações, mas olhadas pela ótica de quem
   executa: quem carrega o quê e quem está cumprindo. */
R.rotinasTime = {
  label: 'Rotinas do time', curto: 'Rotinas do time', icone: 'refresh', titulo: 'Rotinas do time',
  async dados() {
    const desde = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
    const [modelos, ocor] = await Promise.all([
      q('acoes', x => x.neq('recorrencia', 'nenhuma').order('titulo')),
      q('acoes', x => x.not('acao_modelo_id', 'is', null).gte('prazo', desde))
    ]);
    return { modelos, ocor };
  },
  render({ modelos, ocor }) {
    const porModelo = {};
    ocor.forEach(o => {
      const m = (porModelo[o.acao_modelo_id] ||= { total: 0, feitas: 0 });
      m.total++; if (o.status === 'concluida') m.feitas++;
    });

    const rec = m => m.recorrencia === 'semanal'
        ? (m.recorrencia_dias || []).map(d => DIAS[d]).join(', ')
      : m.recorrencia === 'mensal'    ? `dia ${m.recorrencia_dia_mes}`
      : m.recorrencia === 'quinzenal' ? 'a cada 14 dias'
      : m.recorrencia.replace('_', ' ');

    // Agrupa por pessoa; quem não tem dono cai em "Sem responsável"
    const grupos = {};
    modelos.forEach(m => { (grupos[m.responsavel_id || 'sem'] ||= []).push(m); });

    const geral = Object.values(porModelo).reduce((a, x) =>
      ({ t: a.t + x.total, f: a.f + x.feitas }), { t: 0, f: 0 });
    const pctGeral = geral.t ? Math.round(100 * geral.f / geral.t) : null;

    const bloco = (chave, lista) => {
      const u = cache.usuarios.find(x => x.id === chave);
      const soma = lista.reduce((a, m) => {
        const p = porModelo[m.id] || { total:0, feitas:0 };
        return { t: a.t + p.total, f: a.f + p.feitas };
      }, { t:0, f:0 });
      const pct = soma.t ? Math.round(100 * soma.f / soma.t) : null;
      const cls = pct == null ? '' : pct >= 80 ? 'ok' : pct >= 50 ? 'warn' : 'bad';

      return `<div class="card"><div class="ch">
          ${u ? avatar(u, 30) : `<div class="av" style="width:30px;height:30px">?</div>`}
          <div><h3>${esc(u?.nome || 'Sem responsável')}</h3>
            <div class="sm2">${esc(u?.cargo || 'ninguém assumiu estas rotinas')}</div></div>
          <div class="push" style="align-items:center">
            <span class="sm2">${lista.length} rotina(s)</span>
            ${pct == null ? '<span class="pill dim">sem histórico</span>' : `
              <div style="text-align:right"><div class="bar" style="width:110px">
                <i class="${cls}" style="width:${pct}%"></i></div>
                <div class="sm2" style="margin-top:3px">${pct}% cumprida (30d)</div></div>`}
          </div></div>
        <div class="t-scroll"><table><thead><tr>
          <th>Rotina</th><th>Dias</th><th>Canal</th><th class="num">Geradas</th>
          <th class="num">Concluídas</th><th>Cumprimento</th><th>Estado</th><th></th>
        </tr></thead><tbody>${lista.map(m => {
          const p = porModelo[m.id] || { total:0, feitas:0 };
          const pc2 = p.total ? Math.round(100 * p.feitas / p.total) : null;
          const c2 = pc2 == null ? '' : pc2 >= 80 ? 'ok' : pc2 >= 50 ? 'warn' : 'bad';
          return `<tr><td><b>${esc(m.titulo)}</b>${m.hora ? `<div class="sm2">${hm(m.hora)}</div>` : ''}</td>
            <td>${reguaDias(m)}</td>
            <td class="mut">${esc(nomeCanal(m.canal_id))}</td>
            <td class="num">${p.total}</td><td class="num">${p.feitas}</td>
            <td>${pc2 == null ? '<span class="mut">—</span>'
              : `<div class="bar" style="max-width:120px"><i class="${c2}" style="width:${pc2}%"></i></div>`}</td>
            <td><span class="pill ${m.status === 'aberta' ? 'ok' : 'dim'}">${m.status === 'aberta' ? 'ativa' : 'pausada'}</span></td>
            <td class="act">
              <button class="btn sm ghost" data-act="dono" data-id="${m.id}" title="Trocar responsável">${ico('users',13)}</button>
              <button class="btn sm ghost" data-act="pausar" data-id="${m.id}" data-v="${m.status === 'aberta' ? 'cancelada' : 'aberta'}">${m.status === 'aberta' ? 'Pausar' : 'Ativar'}</button>
            </td></tr>`;
        }).join('')}</tbody></table></div></div>`;
    };

    const ordem = Object.keys(grupos).sort((a, b) =>
      a === 'sem' ? 1 : b === 'sem' ? -1 : (nomeUser(a) > nomeUser(b) ? 1 : -1));

    return `<div class="head"><div><h2>Rotinas do time</h2>
        <div class="sub">Quem carrega o quê, e quem está cumprindo. Cumprimento dos últimos 30 dias.</div></div>
        <div class="push"><button class="btn" data-act="nova">${ico('plus',15)}Nova rotina</button></div></div>
      ${modelos.length ? `
        <div class="tiles stg">
          <div class="tile"><div class="ic">${ico('refresh',18)}</div><div class="n">${modelos.length}</div>
            <div class="l">Rotinas ativas</div></div>
          <div class="tile"><div class="ic">${ico('users',18)}</div>
            <div class="n">${Object.keys(grupos).filter(k => k !== 'sem').length}</div>
            <div class="l">Pessoas com rotina</div></div>
          <div class="tile ${pctGeral != null && pctGeral < 50 ? 'bad' : pctGeral != null && pctGeral < 80 ? 'warn' : 'ok'}">
            <div class="ic">${ico('check',18)}</div><div class="n">${pctGeral == null ? '—' : pctGeral + '%'}</div>
            <div class="l">Cumprimento geral</div><div class="h">${geral.f} de ${geral.t} ocorrências</div></div>
          <div class="tile ${grupos.sem ? 'warn' : ''}"><div class="ic">${ico('alert',18)}</div>
            <div class="n">${grupos.sem?.length || 0}</div><div class="l">Sem responsável</div></div>
        </div>
        ${ordem.map(k => bloco(k, grupos[k])).join('')}`
      : `<div class="card">${vazio('refresh', 'Nenhuma rotina cadastrada',
          'Cadastre o que se repete toda semana e o sistema passa a criar as tarefas sozinho, todo dia.',
          { act:'nova', label:'Criar rotina' })}</div>`}`;
  },
  acoes: {
    nova() { R.acoes.acoes.modelo(); },
    async pausar(b) { if (await grava('acoes', { status: b.dataset.v }, b.dataset.id)) { toast('Atualizado.'); pinta(); } },
    async dono(b) {
      const [r] = await q('acoes', x => x.eq('id', b.dataset.id));
      if (!r) return;
      form(`Responsável por "${r.titulo}"`, [
        { k:'responsavel_id', label:'Quem executa', type:'select', value:r.responsavel_id, opts:optUsuarios() }
      ], d => grava('acoes', d, r.id), 'Trocar');
    }
  }
};

/* ── Horários ─────────────────────────────────────────────────────
   Escala semanal. Dia sem linha no banco = folga. */
const SEMANA = [[1,'Segunda'],[2,'Terça'],[3,'Quarta'],[4,'Quinta'],[5,'Sexta'],[6,'Sábado'],[0,'Domingo']];
const hm = t => (t || '').slice(0, 5);
/* Minutos desde a meia-noite. Sem hora devolve um valor alto de
   propósito: a tarefa cai no fim do dia em vez de fingir madrugada. */
const emMinuto = t => {
  if (!t) return 99999;
  const [h, m] = hm(t).split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
};
const minutosDia = h => {
  const [a, b] = [hm(h.entrada), hm(h.saida)].map(x => {
    const [H, M] = x.split(':').map(Number); return H * 60 + M;
  });
  return Math.max(0, b - a - (h.intervalo_min || 0));
};
const hhmm = min => `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}`;

R.horarios = {
  label: 'Horários', curto: 'Horários', icone: 'clock', titulo: 'Horários do time',
  async dados() { return { hs: await q('horarios') }; },
  render({ hs }) {
    const pessoas = cache.usuarios.filter(u => u.ativo);
    const mapa = {};
    hs.forEach(h => { (mapa[h.usuario_id] ||= {})[h.dia_semana] = h; });

    const agora = new Date();
    const hojeDia = agora.getDay();
    const minAgora = agora.getHours() * 60 + agora.getMinutes();
    const trabalhando = p => {
      const h = mapa[p.id]?.[hojeDia]; if (!h) return false;
      const [ini, fim] = [hm(h.entrada), hm(h.saida)].map(x => {
        const [H, M] = x.split(':').map(Number); return H * 60 + M; });
      return minAgora >= ini && minAgora <= fim;
    };
    const emExpediente = pessoas.filter(trabalhando);

    return `<div class="head"><div><h2>Horários do time</h2>
        <div class="sub">Escala da semana. Dia em branco é folga.</div></div>
        <div class="push">
          <button class="btn ghost" data-act="csv">${ico('down',15)}CSV</button>
          <button class="btn" data-act="def">${ico('clock',15)}Definir horário</button></div></div>

      ${pessoas.length ? `
      <div class="tiles stg">
        <div class="tile ok"><div class="ic">${ico('users',18)}</div><div class="n">${emExpediente.length}</div>
          <div class="l">Em expediente agora</div>
          <div class="h">${emExpediente.map(p => p.nome.split(' ')[0]).join(', ') || 'ninguém'}</div></div>
        <div class="tile"><div class="ic">${ico('clock',18)}</div>
          <div class="n">${hhmm(pessoas.reduce((a, p) =>
            a + Object.values(mapa[p.id] || {}).reduce((x, h) => x + minutosDia(h), 0), 0))}</div>
          <div class="l">Carga total da semana</div></div>
        <div class="tile ${pessoas.some(p => !mapa[p.id]) ? 'warn' : ''}"><div class="ic">${ico('alert',18)}</div>
          <div class="n">${pessoas.filter(p => !mapa[p.id]).length}</div>
          <div class="l">Sem horário definido</div></div>
      </div>

      <div class="card"><div class="ch"><h3>Escala semanal</h3></div>
        <div class="t-scroll"><table><thead><tr><th>Pessoa</th>
          ${SEMANA.map(([d, n]) => `<th${d === hojeDia ? ' style="color:var(--ac)"' : ''}>${n}</th>`).join('')}
          <th class="num">Semana</th><th></th></tr></thead>
        <tbody>${pessoas.map(p => {
          const dias = mapa[p.id] || {};
          const total = Object.values(dias).reduce((a, h) => a + minutosDia(h), 0);
          return `<tr>
            <td><div style="display:flex;align-items:center;gap:10px">${avatar(p, 28)}
              <div><b>${esc(p.nome)}</b><div class="sm2">${esc(p.cargo || '—')}</div></div></div></td>
            ${SEMANA.map(([d]) => {
              const h = dias[d];
              return `<td class="mut" style="white-space:nowrap${d === hojeDia ? ';background:var(--ac-bg)' : ''}">${
                h ? `<b style="color:var(--txt)">${hm(h.entrada)}–${hm(h.saida)}</b>${
                  h.intervalo_min ? `<div class="sm2">${h.intervalo_min}min almoço</div>` : ''}`
                  : '<span style="opacity:.4">folga</span>'}</td>`;
            }).join('')}
            <td class="num"><b>${total ? hhmm(total) : '—'}</b></td>
            <td class="act"><button class="btn sm ghost" data-act="edit" data-id="${p.id}">${ico('edit',13)}</button></td>
          </tr>`;
        }).join('')}</tbody></table></div></div>`
      : `<div class="card">${vazio('users', 'Time vazio',
          'Cadastre as pessoas em Configurações → Time e canais para montar a escala.')}</div>`}`;
  },
  acoes: {
    def: () => formHorario(),
    edit(b) { formHorario(b.dataset.id); },
    async csv() {
      const hs = await q('horarios');
      csv('horarios', hs.map(h => ({
        pessoa: nomeUser(h.usuario_id),
        dia: SEMANA.find(([d]) => d === h.dia_semana)?.[1] || h.dia_semana,
        entrada: hm(h.entrada), saida: hm(h.saida),
        intervalo_min: h.intervalo_min, horas_liquidas: hhmm(minutosDia(h))
      })));
    }
  }
};

async function formHorario(usuarioId) {
  const atuais = usuarioId ? await q('horarios', x => x.eq('usuario_id', usuarioId)) : [];
  const base = atuais[0];
  form('Definir horário', [
    { k:'usuario_id', label:'Pessoa', type:'select', req:true, value:usuarioId,
      opts:cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome })) },
    { k:'_dias', label:'Dias de trabalho', req:true,
      value: atuais.length ? atuais.map(h => h.dia_semana).sort().join(',') : '1,2,3,4,5',
      hint:'0=dom, 1=seg … 6=sáb, separados por vírgula. Os dias que você NÃO listar viram folga.' },
    { k:'entrada', label:'Entrada', type:'time', req:true, value: base ? hm(base.entrada) : '08:00' },
    { k:'saida', label:'Saída', type:'time', req:true, value: base ? hm(base.saida) : '18:00' },
    { k:'intervalo_min', label:'Intervalo (minutos)', type:'number', value: base?.intervalo_min ?? 60,
      hint:'Descontado do total de horas da semana.' },
    { k:'observacao', label:'Observação', value: base?.observacao }
  ], async d => {
    const dias = String(d._dias || '').split(',').map(s => parseInt(s, 10))
      .filter(n => n >= 0 && n <= 6);
    if (!dias.length) { toast('Informe ao menos um dia.', { tipo:'bad' }); return false; }
    if (d.saida <= d.entrada) { toast('A saída precisa ser depois da entrada.', { tipo:'bad' }); return false; }
    // Regrava a semana inteira: o que não foi listado deixa de existir.
    await sb.from('horarios').delete().eq('usuario_id', d.usuario_id);
    const { error } = await sb.from('horarios').insert(dias.map(dia => ({
      usuario_id: d.usuario_id, dia_semana: dia, entrada: d.entrada, saida: d.saida,
      intervalo_min: d.intervalo_min ?? 0, observacao: d.observacao
    })));
    if (error) { toast(error.message, { tipo:'bad' }); return false; }
    toast('Horário salvo.');
    return true;
  });
}

        { k:'data', label:'Data', type:'date', value:hoje() },

          { v:'um_a_um', t:'1 a 1' }, { v:'corretivo', t:'Corretivo' },

      ], d => { d.autor_id = eu?.id || null; return grava('feedbacks', d); });

    async marco(b) {
      const [c] = await q('pdi', x => x.eq('id', b.dataset.id));
      if (!c) return;
      form('Atualizar marco', [
        { k:'marco_atual', label:'Onde a pessoa está agora', type:'textarea', value:c.marco_atual }
      ], d => grava('pdi', d, c.id), 'Atualizar');
    },
    aprovar(b) { fechaCiclo(b.dataset.id, b.dataset.n, 'aprovado'); },
    reprovar(b) { fechaCiclo(b.dataset.id, b.dataset.n, 'reprovado'); }

function fechaCiclo(id, nome, status) {
  const aprovado = status === 'aprovado';
  confirma(aprovado ? 'Aprovar ciclo' : 'Ciclo não aprovado',
    `<p>${aprovado
      ? `A prova de <b>${esc(nome)}</b> foi cumprida. O ciclo é encerrado como aprovado e a recompensa passa a valer.`
      : `A prova de <b>${esc(nome)}</b> não foi cumprida. O ciclo encerra sem aprovação — o próximo pode repetir o mesmo objetivo.`}</p>
     <p class="sm2" style="margin-top:10px">Um feedback de avaliação é registrado junto, para não ficar decisão sem conversa.</p>`,
    async () => {
      const [c] = await q('pdi', x => x.eq('id', id));
      if (!await grava('pdi', { status, avaliado_em: hoje() }, id)) return false;
      await grava('feedbacks', {
        usuario_id: c?.usuario_id, autor_id: eu?.id || null, data: hoje(),
        tipo: 'avaliacao_ciclo',
        notas: `Ciclo de PDI ${aprovado ? 'aprovado' : 'não aprovado'}. Objetivo: ${c?.objetivo || ''}`
      });
      toast(aprovado ? 'Ciclo aprovado.' : 'Ciclo encerrado sem aprovação.');
      return true;
    }, { perigo: !aprovado });
}

/* ── anexos de imagem ─────────────────────────────────────────────
   Ficam no Storage do Supabase, em bucket privado. O link de exibição
   é temporário e gerado na hora — imagem interna não deve viver numa
   URL pública que qualquer um abre. */
const ANEXO_BUCKET = 'anexos';
const linkAnexo = new Map();   // path -> url assinada, evita reassinar a cada render

/* Reduz antes de subir: print de celular tem 4000px e 6 MB, e para
   ler uma conversa 1600px sobra. */
function comprimeImagem(file, ladoMax = 1600, qualidade = 0.85) {
  return new Promise((ok, erro) => {
    if (!/^image\//.test(file.type)) return erro(new Error('Só imagens são aceitas.'));
    const fr = new FileReader();
    fr.onerror = () => erro(new Error('Não deu para ler o arquivo.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => erro(new Error('Arquivo de imagem inválido.'));
      img.onload = () => {
        const escala = Math.min(1, ladoMax / Math.max(img.width, img.height));
        if (escala === 1 && file.size < 400 * 1024) return ok(file);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * escala);
        c.height = Math.round(img.height * escala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? ok(b) : erro(new Error('Falha ao comprimir.')), 'image/jpeg', qualidade);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function subirAnexo(file) {
  const blob = await comprimeImagem(file);
  const ext = (blob.type || 'image/jpeg').split('/')[1].replace('jpeg', 'jpg');
  const path = `${eu?.id || 'sem-perfil'}/${Date.now()}-${Math.round(Math.random() * 1e6)}.${ext}`;
  const { error } = await sb.storage.from(ANEXO_BUCKET)
    .upload(path, blob, { contentType: blob.type || 'image/jpeg', upsert: false });
  if (error) throw new Error(error.message);
  return { path, nome: file.name || 'imagem', tipo: blob.type, tamanho: blob.size };
}

/* Assina em lote os caminhos ainda sem link, e devolve quando pronto */
async function assinaAnexos(paths) {
  const faltam = [...new Set(paths)].filter(x => x && !linkAnexo.has(x));
  if (!faltam.length) return;
  const { data, error } = await sb.storage.from(ANEXO_BUCKET).createSignedUrls(faltam, 3600);
  if (error) return;
  (data || []).forEach(d => { if (d.signedUrl) linkAnexo.set(d.path, d.signedUrl); });
}

function abreImagem(url) {
  const el = document.createElement('div');
  el.className = 'lightbox';
  el.innerHTML = `<span class="fechar">${ico('x', 26)}</span><img src="${esc(url)}" alt="">`;
  el.onclick = () => { el.remove(); document.removeEventListener('keydown', kd); };
  const kd = e => { if (e.key === 'Escape') el.click(); };
  document.addEventListener('keydown', kd);
  document.body.appendChild(el);
}

/* ── Anotações ────────────────────────────────────────────────────
   Bloco de notas do gestor. A caixa de escrita fica sempre aberta no
   topo: nota que exige abrir um formulário não é escrita. */
const CATEG_NOTA = {
  geral:    { t:'Geral',     i:'inbox', c:'dim'  },
  time:     { t:'Time',      i:'users', c:'info' },
  feedback: { t:'Feedback',  i:'star',  c:'ac'   },
  ideia:    { t:'Ideia',     i:'zap',   c:'ok'   },
  reuniao:  { t:'Reunião',   i:'cal',   c:'info' },
  decisao:  { t:'Decisão',   i:'check', c:'ok'   },
  alerta:   { t:'Atenção',   i:'alert', c:'bad'  }
};

R.anotacoes = {
  label: 'Anotações', curto: 'Anotações', icone: 'edit', titulo: 'Anotações',
  filtro: { categoria: '', pessoa: '', busca: '' },
  rascunho: { categoria: 'geral', pessoa: '', anexos: [] },
  async dados() {
    const notas = await qOpcional('anotacoes', x => x.order('created_at', { ascending: false }).limit(300));
    if (notas) await assinaAnexos(notas.flatMap(n => (n.anexos || []).map(a => a.path)));
    return { notas };
  },
  render({ notas }) {
    if (notas === null) return `<div class="head"><div><h2>Anotações</h2></div></div>
      <div class="card"><div class="cb"><div class="err" style="display:block">
        A tabela de anotações ainda não existe neste banco.</div></div></div>`;

    const f = R.anotacoes.filtro, r = R.anotacoes.rascunho;
    const termo = f.busca.trim().toLowerCase();
    const lista = notas.filter(n =>
      (!f.categoria || n.categoria === f.categoria) &&
      (!f.pessoa || n.usuario_id === f.pessoa) &&
      (!termo || (n.titulo || '').toLowerCase().includes(termo)
              || (n.conteudo || '').toLowerCase().includes(termo)));

    const fixas = lista.filter(n => n.fixada);
    const soltas = lista.filter(n => !n.fixada);

    const cartao = n => {
      const cat = CATEG_NOTA[n.categoria] || CATEG_NOTA.geral;
      const sobre = n.usuario_id ? cache.usuarios.find(u => u.id === n.usuario_id) : null;
      const longo = (n.conteudo || '').length > 420;
      return `<div class="nota ${n.fixada ? 'fixa' : ''}">
        <div class="topo">
          <span class="pill ${cat.c}">${ico(cat.i, 11)} ${cat.t}</span>
          ${sobre ? `<span class="pill dim">${esc(sobre.nome.split(' ')[0])}</span>` : ''}
          ${n.fixada ? `<span style="margin-left:auto;color:var(--ac)">${ico('star',14)}</span>` : ''}
        </div>
        ${n.titulo ? `<h4>${esc(n.titulo)}</h4>` : ''}
        <div class="corpo ${longo ? 'longo' : ''}" data-corpo>${esc(n.conteudo)}</div>
        ${longo ? '<button class="mais" data-act="expandir">Ver tudo</button>' : ''}
        ${(n.anexos || []).length ? `<div class="anexos">${n.anexos.map(a => {
          const url = linkAnexo.get(a.path);
          return url
            ? `<div class="anexo" data-act="ver" data-u="${esc(url)}"><img src="${esc(url)}" alt="${esc(a.nome || '')}"></div>`
            : `<div class="anexo falhou" title="Não foi possível carregar">sem link</div>`;
        }).join('')}</div>` : ''}
        <div class="rodape">
          ${n.autor_id ? esc(nomeUser(n.autor_id).split(' ')[0]) + ' · ' : ''}${dtl(n.created_at.slice(0,10))}

            <button class="ib" data-act="fixar" data-id="${n.id}" data-v="${n.fixada ? '0' : '1'}"
