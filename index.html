          'Cadastre as pessoas em Configurações → Time e canais para acompanhar PDI.')}</div>`}`;
  },
  acoes: {
    novo(b) {
      const d = new Date(), ini = hoje().slice(0,8) + '01';
      const fim = new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10);
      form('Novo ciclo de PDI', [
        { k:'usuario_id', label:'Pessoa', type:'select', req:true, value:b?.dataset.u,
          opts:cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome })) },
        { k:'ciclo_inicio', label:'Início', type:'date', req:true, value:ini },
        { k:'ciclo_fim', label:'Fim', type:'date', req:true, value:fim },
        { k:'objetivo', label:'Objetivo', type:'textarea', req:true,
          ph:'O que essa pessoa precisa saber fazer no fim do mês?' },
        { k:'marco_atual', label:'Marco atual' },
        { k:'prova', label:'Prova de aprovação', type:'textarea',
          hint:'Binário: passou ou não passou. Se precisa de interpretação, não é prova.' },
        { k:'recompensa', label:'Recompensa' }
      ], d2 => grava('pdi', d2));
    },
    fb(b) {
      form('Registrar feedback', [
        { k:'usuario_id', label:'Pessoa', type:'select', req:true, value:b?.dataset.u,
          opts:cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome })) },
        { k:'data', label:'Data', type:'date', value:hoje() },
        { k:'tipo', label:'Tipo', type:'select', value:'um_a_um', opts:[
          { v:'um_a_um', t:'1 a 1' }, { v:'corretivo', t:'Corretivo' },
          { v:'reconhecimento', t:'Reconhecimento' }, { v:'avaliacao_ciclo', t:'Avaliação de ciclo' }] },
        { k:'notas', label:'Notas', type:'textarea', ph:'O que foi dito e o que ficou combinado.' }
      ], d => { d.autor_id = eu?.id || null; return grava('feedbacks', d); });
    },
    async marco(b) {
      const [c] = await q('pdi', x => x.eq('id', b.dataset.id));
      if (!c) return;
      form('Atualizar marco', [
        { k:'marco_atual', label:'Onde a pessoa está agora', type:'textarea', value:c.marco_atual }
      ], d => grava('pdi', d, c.id), 'Atualizar');
    },
    aprovar(b) { fechaCiclo(b.dataset.id, b.dataset.n, 'aprovado'); },
    reprovar(b) { fechaCiclo(b.dataset.id, b.dataset.n, 'reprovado'); }
  }
};

function fechaCiclo(id, nome, status) {
  const aprovado = status === 'aprovado';
  confirma(aprovado ? 'Aprovar ciclo' : 'Ciclo não aprovado',
    `<p>${aprovado
      ? `A prova de <b>${esc(nome)}</b> foi cumprida. O ciclo é encerrado como aprovado e a recompensa passa a valer.`
      : `A prova de <b>${esc(nome)}</b> não foi cumprida. O ciclo encerra sem aprovação — o próximo pode repetir o mesmo objetivo.`}</p>
     <p class="sm2" style="margin-top:10px">Um feedback de avaliação é registrado junto, para não ficar decisão sem conversa.</p>`,
    async () => {
      const [c] = await q('pdi', x => x.eq('id', id));
      if (!await grava('pdi', { status, avaliado_em: hoje() }, id)) return false;
      await grava('feedbacks', {
        usuario_id: c?.usuario_id, autor_id: eu?.id || null, data: hoje(),
        tipo: 'avaliacao_ciclo',
        notas: `Ciclo de PDI ${aprovado ? 'aprovado' : 'não aprovado'}. Objetivo: ${c?.objetivo || ''}`
      });
      toast(aprovado ? 'Ciclo aprovado.' : 'Ciclo encerrado sem aprovação.');
      return true;
    }, { perigo: !aprovado });
}

/* ── Feedback ─────────────────────────────────────────────────────
   Histórico completo. A tela de PDI mostra o último; aqui está tudo,
   porque padrão só aparece quando você olha a sequência. */
const TIPOS_FB = {
  um_a_um:        { t:'1 a 1',              cor:'info', ic:'users' },
  corretivo:      { t:'Corretivo',          cor:'warn', ic:'alert' },
  reconhecimento: { t:'Reconhecimento',     cor:'ok',   ic:'star'  },
  avaliacao_ciclo:{ t:'Avaliação de ciclo', cor:'ac',   ic:'check' }
};

R.feedbacks = {
  label: 'Feedback', curto: 'Feedback', icone: 'inbox', titulo: 'Feedback',
  filtro: { pessoa: '', tipo: '' },
  async dados() {
    return { fbs: await q('feedbacks', x => x.order('data', { ascending: false }).limit(400)) };
  },
  render({ fbs }) {
    const f = R.feedbacks.filtro;
    const lista = fbs.filter(x =>
      (!f.pessoa || x.usuario_id === f.pessoa) && (!f.tipo || x.tipo === f.tipo));

    const pessoas = cache.usuarios.filter(u => u.ativo);
    const ultimo = {};
    fbs.forEach(x => { if (!ultimo[x.usuario_id]) ultimo[x.usuario_id] = x; });
    const diasDe = u => ultimo[u.id]
      ? Math.floor((new Date() - new Date(ultimo[u.id].data + 'T12:00:00')) / 864e5) : null;

    // Quem está esperando há mais tempo aparece primeiro — é a fila real
    const fila = [...pessoas].sort((a, b) => {
      const da = diasDe(a), db = diasDe(b);
      if (da == null) return -1; if (db == null) return 1;
      return db - da;
    });
    const atrasados = pessoas.filter(u => { const d = diasDe(u); return d == null || d > 30; });
    const esteMes = fbs.filter(x => x.data >= hoje().slice(0, 8) + '01').length;

    // Agrupa por mês para a linha do tempo
    const meses = {};
    lista.forEach(x => { (meses[x.data.slice(0, 7)] ||= []).push(x); });
    const rotuloMes = m => {
      const d = new Date(m + '-15T12:00:00');
      const s = d.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
      return s[0].toUpperCase() + s.slice(1);
    };

    return `<div class="head"><div><h2>Feedback</h2>
        <div class="sub">Todo o histórico. Padrão de comportamento só aparece na sequência, não num registro solto.</div></div>
        <div class="push">
          <button class="btn ghost" data-act="csv">${ico('down',15)}CSV</button>
          <button class="btn" data-act="novo">${ico('plus',15)}Registrar feedback</button></div></div>

      ${pessoas.length ? `
      <div class="tiles stg">
        <div class="tile ${atrasados.length ? 'bad' : 'ok'}"><div class="ic">${ico('alert',18)}</div>
          <div class="n">${atrasados.length}</div><div class="l">Esperando há mais de 30 dias</div>
          <div class="h">${atrasados.slice(0,3).map(u => u.nome.split(' ')[0]).join(', ') || 'ninguém'}</div></div>
        <div class="tile"><div class="ic">${ico('inbox',18)}</div><div class="n">${esteMes}</div>
          <div class="l">Registrados neste mês</div></div>
        <div class="tile"><div class="ic">${ico('star',18)}</div>
          <div class="n">${fbs.filter(x => x.tipo === 'reconhecimento').length}</div>
          <div class="l">Reconhecimentos</div></div>
        <div class="tile"><div class="ic">${ico('alert',18)}</div>
          <div class="n">${fbs.filter(x => x.tipo === 'corretivo').length}</div>
          <div class="l">Corretivos</div></div>
      </div>

      <div class="card"><div class="ch"><h3>Fila — quem está esperando</h3>
        <span class="push sm2">clique para registrar</span></div>
        <div class="t-scroll"><table><thead><tr>
          <th>Pessoa</th><th>Último feedback</th><th>Tipo</th><th>Silêncio</th><th></th>
        </tr></thead><tbody>${fila.map(u => {
          const d = diasDe(u), lastf = ultimo[u.id];
          const cor = d == null ? 'bad' : d > 30 ? 'bad' : d > 15 ? 'warn' : 'ok';
          return `<tr>
            <td><div style="display:flex;align-items:center;gap:10px">${avatar(u, 28)}
              <div><b>${esc(u.nome)}</b><div class="sm2">${esc(u.cargo || '—')}</div></div></div></td>
            <td class="mut">${lastf ? dtl(lastf.data) : 'nunca'}</td>
            <td>${lastf ? `<span class="pill ${TIPOS_FB[lastf.tipo]?.cor || 'dim'}">${TIPOS_FB[lastf.tipo]?.t || lastf.tipo}</span>` : '—'}</td>
            <td><span class="pill ${cor}">${d == null ? 'nunca' : d + ' dias'}</span></td>
            <td class="act"><button class="btn sm" data-act="novo" data-u="${u.id}">Registrar</button></td>
          </tr>`;
        }).join('')}</tbody></table></div></div>` : ''}

      <div class="card"><div class="ch"><h3>Histórico</h3>
        <div class="push">
          <select data-act="fpessoa" style="width:auto;min-width:160px">
            <option value="">Todas as pessoas</option>
            ${pessoas.map(u => `<option value="${u.id}"${f.pessoa===u.id?' selected':''}>${esc(u.nome)}</option>`).join('')}
          </select>
          <select data-act="ftipo" style="width:auto;min-width:150px">
            <option value="">Todos os tipos</option>
            ${Object.entries(TIPOS_FB).map(([k,v]) => `<option value="${k}"${f.tipo===k?' selected':''}>${v.t}</option>`).join('')}
          </select>
          <span class="sm2">${lista.length} registro(s)</span></div></div>
        ${lista.length ? Object.keys(meses).sort().reverse().map(m => `
          <div style="padding:14px 18px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
                      color:var(--dim);font-weight:700;background:var(--surface2)">${rotuloMes(m)}</div>
          ${meses[m].map(x => {
            const u = cache.usuarios.find(y => y.id === x.usuario_id);
            const tp = TIPOS_FB[x.tipo] || { t:x.tipo, cor:'dim', ic:'inbox' };
            return `<div class="row" style="align-items:flex-start">
              ${avatar(u, 32, '?')}
              <div class="g"><div class="t">${esc(u?.nome || 'Pessoa removida')}
                  <span class="pill ${tp.cor}" style="margin-left:6px">${tp.t}</span></div>
                <div class="m">${dtl(x.data)}${x.autor_id ? ' · por ' + esc(nomeUser(x.autor_id)) : ''}</div>
                ${x.notas ? `<div style="margin-top:7px;font-size:13px;color:var(--txt2);
                    white-space:pre-wrap;line-height:1.55">${esc(x.notas)}</div>`
                  : '<div class="sm2" style="margin-top:6px;font-style:italic">Sem notas — registro sem conteúdo não ajuda ninguém depois.</div>'}</div>
              <button class="btn sm ghost" data-act="editar" data-id="${x.id}">${ico('edit',13)}</button>
              <button class="btn sm ghost" data-act="excluir" data-id="${x.id}">${ico('trash',13)}</button>
            </div>`;
          }).join('')}`).join('')
        : vazio('inbox', 'Nenhum feedback com esse filtro',
            'Feedback que não é registrado vira memória, e memória some. Comece por quem está há mais tempo sem conversa.',
            { act:'novo', label:'Registrar feedback' })}</div>`;
  },
  acoes: {
    novo(b) { formFeedback(null, b?.dataset.u); },
    async editar(b) { const [r] = await q('feedbacks', x => x.eq('id', b.dataset.id)); if (r) formFeedback(r); },
    excluir(b) {
      confirma('Excluir feedback', 'O registro sai do histórico. Não dá para desfazer.',
        () => apaga('feedbacks', b.dataset.id));
    },
    fpessoa(b) { R.feedbacks.filtro.pessoa = b.value; pinta(); },
    ftipo(b)   { R.feedbacks.filtro.tipo   = b.value; pinta(); },
    async csv() {
      const fbs = await q('feedbacks', x => x.order('data', { ascending: false }));
      csv('feedbacks', fbs.map(x => ({
        data: x.data, pessoa: nomeUser(x.usuario_id), tipo: TIPOS_FB[x.tipo]?.t || x.tipo,
        autor: x.autor_id ? nomeUser(x.autor_id) : '', notas: (x.notas || '').replace(/\n/g, ' ')
      })));
    }
  }
};

function formFeedback(row, usuarioId) {
  form(row ? 'Editar feedback' : 'Registrar feedback', [
    { k:'usuario_id', label:'Pessoa', type:'select', req:true, value:row?.usuario_id || usuarioId,
      opts:cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome })) },
    { k:'data', label:'Data', type:'date', value:row?.data || hoje() },
    { k:'tipo', label:'Tipo', type:'select', value:row?.tipo || 'um_a_um',
      opts:Object.entries(TIPOS_FB).map(([v, o]) => ({ v, t:o.t })) },
    { k:'notas', label:'Notas', type:'textarea', value:row?.notas,
      ph:'O que foi dito, o que a pessoa respondeu e o que ficou combinado.',
      hint:'Escreva o combinado. É o que você vai querer reler no próximo ciclo.' }
  ], d => { if (!row) d.autor_id = eu?.id || null; return grava('feedbacks', d, row?.id); });
}

/* ───────────────────────── CONFIGURAÇÕES ───────────────────────── */
R.config = {
  label: 'Configurações', icone: 'cog', titulo: 'Configurações',
  async dados() { return {}; },
  pos() { if (abaCfg === 'acesso') listaConvites(); },
  render() {
    const abas = [['perfil','Perfil'],['time','Time e canais'],['acesso','Acesso e login'],
                  ['identidade','Identidade visual'],['aparencia','Aparência'],
                  ['dados','Dados'],['conexao','Conexão'],['atalhos','Atalhos']];
    return `<div class="head"><div><h2>Configurações</h2>
      <div class="sub">Preferências ficam neste navegador. Time e canais ficam no banco.</div></div></div>
      <div class="tabs">${abas.map(([v,l]) =>
        `<button data-act="aba" data-v="${v}" class="${abaCfg===v?'on':''}">${l}</button>`).join('')}</div>
      <div id="cfg-corpo">${cfgCorpo()}</div>`;
  },
  acoes: {
    aba(b) { abaCfg = b.dataset.v; pinta(); },
    tema(b) { pref.theme = b.dataset.v; savePref(); montaShell(); },
    densidade(b) { pref.density = b.dataset.v; savePref(); pinta(); },

    /* ── identidade visual ───────────────────────────────────────── */
    accent(b) { visual.accent = b.dataset.v; visual.accent_hex = null; aplicaVisual(); pinta(); },
    'aplica-hex'() {
      const v = ($('#iv-hex')?.value || '').trim();
      if (v && !/^#[0-9a-f]{6}$/i.test(v)) return toast('Use o formato #rrggbb, por exemplo #ff6b00.', { tipo:'bad' });
      visual.accent_hex = v || null; aplicaVisual(); pinta();
    },
    grafismo(b) { visual.grafismo = b.dataset.v; pinta(); },
    'tema-padrao'(b) { visual.tema_padrao = b.dataset.v; pinta(); },
    'sobe-logo'(b) {
      const campo = b.dataset.c;
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/png,image/svg+xml,image/jpeg,image/webp';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        if (f.size > 400 * 1024) return toast('Arquivo acima de 400 KB. Reduza a imagem.', { tipo:'bad' });
        const fr = new FileReader();
        fr.onload = () => { visual[campo] = fr.result; aplicaVisual(); pinta();
          toast('Logo carregada. Clique em "Salvar identidade" para valer para todos.', { tipo:'info' }); };
        fr.readAsDataURL(f);
      };
      inp.click();
    },
    'tira-logo'(b) { visual[b.dataset.c] = null; aplicaVisual(); pinta(); },
    'reset-visual'() {
      confirma('Restaurar identidade padrão',
        'Volta à logo oficial da MasterInfo, ao laranja e ao grafismo aurora. Só é aplicado depois de salvar.',
        () => { visual = { ...VISUAL_PADRAO }; aplicaVisual(); return true; }, { perigo:false });
    },
    async 'salva-visual'() {
      visual.nome_sistema = ($('#iv-nome')?.value || '').trim() || 'MasterInfo';
      visual.subtitulo    = ($('#iv-sub')?.value || '').trim() || null;
      const { id, updated_at, ...campos } = visual;
      const { error } = await sb.from('config_visual').update(campos).eq('id', 1);
      if (error) return toast(error.message, { tipo:'bad' });
      aplicaVisual(); montaShell();
      toast('Identidade visual salva para todo o time.');
    },
    obon() { pref.ob = true; savePref(); toast('Checklist reativado.'); pinta(); },
    'novo-user': () => formUser(),
    'novo-canal': () => formCanal(),

    /* ── acesso e login ──────────────────────────────────────────── */
    'novo-convite': () => formConvite(),
    'convidar-pessoa'(b) { formConvite(cache.usuarios.find(u => u.id === b.dataset.id)); },
    async 'copia-convite'(b) {
      const texto = `Você foi convidado para o sistema de gestão da MasterInfo.

1. Abra: ${location.origin + location.pathname}
2. Clique em "Primeiro acesso? Criar conta"
3. Use exatamente este e-mail: ${b.dataset.e}
4. Crie sua senha e pronto.`;
      try { await navigator.clipboard.writeText(texto); toast('Mensagem copiada. Cole no WhatsApp.'); }
      catch { modal({ titulo:'Copie a mensagem', ok:'Fechar', onOk:() => true,
        corpo:`<textarea style="min-height:170px">${esc(texto)}</textarea>` }); }
    },
    'revoga-convite'(b) {
      confirma('Revogar convite',
        `O convite de <b>${esc(b.dataset.e)}</b> deixa de valer. Se a pessoa ainda não se cadastrou, não vai conseguir.`,
        async () => { const ok = await apaga('convites', b.dataset.id); if (ok) listaConvites(); return ok; });
    },
    'trocar-senha': () => form('Trocar minha senha', [
      { k:'senha', label:'Nova senha', type:'password', req:true, hint:'Mínimo de 6 caracteres.' },
      { k:'senha2', label:'Repita a nova senha', type:'password', req:true }
    ], async d => {
      if (d.senha.length < 6) { toast('A senha precisa ter ao menos 6 caracteres.', { tipo:'bad' }); return false; }
      if (d.senha !== d.senha2) { toast('As duas senhas não são iguais.', { tipo:'bad' }); return false; }
      const { error } = await sb.auth.updateUser({ password: d.senha });
      if (error) { toast(error.message, { tipo:'bad' }); return false; }
      toast('Senha alterada.');
      return true;
    }, 'Trocar'),

    /* ── cargos ──────────────────────────────────────────────────── */
    'novo-cargo': () => formCargo(),
    async 'edit-cargo'(b) { const [r] = await q('cargos', x => x.eq('id', b.dataset.id)); if (r) formCargo(r); },
    async 'dup-cargo'(b) {
      const [r] = await q('cargos', x => x.eq('id', b.dataset.id));
      if (!r) return;
      const { id, created_at, updated_at, ...copia } = r;
      copia.nome = nomeLivre(r.nome, cache.cargos.map(c => c.nome));
      formCargo(copia, true);
    },
    'del-cargo'(b) {
      const quantos = Number(b.dataset.q) || 0;
      confirma(`Excluir "${b.dataset.t}"`, `
        ${quantos ? `<p>${quantos} pessoa(s) usam este cargo. Elas <b>não</b> são apagadas —
            apenas ficam sem cargo, e você reatribui depois.</p>`
          : '<p>Ninguém usa este cargo. Pode excluir tranquilo.</p>'}
        <p class="sm2" style="margin-top:10px">Se for um cargo que não existe mais mas você quer manter o histórico,
          edite e desmarque <b>Ativo</b>: ele some da lista de escolha e continua nas pessoas antigas.</p>`,
        async () => {
          const ok = await apaga('cargos', b.dataset.id);
          if (ok) { await recarregaBase(); toast('Cargo excluído.'); }
          return ok;
        }, quantos ? { palavra:'EXCLUIR' } : {});
    },
    'csv-cargo'() {
      csv('cargos', cache.cargos.map(g => ({
        nome: g.nome, descricao: g.descricao || '', ativo: g.ativo ? 'sim' : 'não',
        pessoas: cache.usuarios.filter(u => u.cargo_id === g.id).length
      })));
    },
    async 'edit-user'(b) { const [r] = await q('usuarios', x => x.eq('id', b.dataset.id)); if (r) formUser(r); },
    async 'edit-canal'(b) { const [r] = await q('canais_venda', x => x.eq('id', b.dataset.id)); if (r) formCanal(r); },

    /* Duplicar: copia tudo menos a identidade e o nome, que é único.
       Abre o formulário para você ajustar antes de salvar. */
    async 'dup-canal'(b) {
      const [r] = await q('canais_venda', x => x.eq('id', b.dataset.id));
      if (!r) return;
      const { id, created_at, updated_at, ...copia } = r;
      copia.nome = nomeLivre(r.nome, cache.canais.map(c => c.nome));
      formCanal(copia, true);
    },

    /* Excluir: antes de perguntar, conta o que vai junto. Metas e
       lançamentos financeiros são apagados em cascata; o resto só
       perde o vínculo com o canal. */
    async 'del-canal'(b) {
      const id = b.dataset.id, nome = b.dataset.t;
      const [metas, fin, acoes, camp, cont, fun, pess] = await Promise.all([
        conta('metas','canal_id',id),          conta('financeiro_mkt','canal_id',id),
        conta('acoes','canal_id',id),          conta('campanhas','canal_id',id),
        conta('producao_conteudo','canal_id',id), conta('funil','canal_id',id),
        conta('usuarios','canal_principal_id',id)
      ]);
      const cascata = metas + fin;
      const solta = acoes + camp + cont + fun + pess;
      const linha = (n, t) => n ? `<li>${n} ${t}</li>` : '';

      confirma(`Excluir "${nome}"`, `
        ${cascata ? `<p style="color:var(--bad);font-weight:600;margin-bottom:8px">
            Isto apaga junto, sem volta:</p>
          <ul style="margin:0 0 14px 18px;color:var(--bad)">
            ${linha(metas,'meta(s)')}${linha(fin,'lançamento(s) financeiro(s)')}</ul>` : ''}
        ${solta ? `<p style="margin-bottom:8px">Estes registros <b>não</b> são apagados — apenas ficam sem canal:</p>
          <ul style="margin:0 0 14px 18px;color:var(--txt2)">
            ${linha(acoes,'ação(ões)')}${linha(camp,'campanha(s)')}${linha(cont,'conteúdo(s)')}
            ${linha(fun,'registro(s) de funil')}${linha(pess,'pessoa(s) com este canal principal')}</ul>` : ''}
        ${!cascata && !solta ? '<p>Nada depende deste canal. Pode excluir tranquilo.</p>' : ''}
        <p class="sm2">Se a ideia é só tirar da frente sem perder histórico, edite o canal e desmarque
          <b>Ativo</b> — ele some das listas e mantém tudo.</p>`,
        async () => {
          const ok = await apaga('canais_venda', id);
          if (ok) { await recarregaBase(); toast(`Canal "${nome}" excluído.`); }
          return ok;
        },
        cascata ? { palavra: 'EXCLUIR' } : {});
    },
    async 'csv-user'() { csv('usuarios', cache.usuarios); },
    async 'csv-canal'() { csv('canais', cache.canais); },
    /* ── perfil ──────────────────────────────────────────────────── */
    'perfil-foto'() {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        try {
          eu.foto = await fotoQuadrada(f);
          if (await grava('usuarios', { foto: eu.foto }, eu.id)) {
            await recarregaBase(); eu = cache.usuarios.find(u => u.id === eu.id);
            toast('Foto atualizada.'); montaShell();
          }
        } catch (e) { toast(e.message, { tipo:'bad' }); }
      };
      inp.click();
    },
    async 'perfil-sem-foto'() {
      if (await grava('usuarios', { foto: null }, eu.id)) {
        eu.foto = null; await recarregaBase(); eu = cache.usuarios.find(u => u.id === eu.id);
        toast('Foto removida.'); montaShell();
      }
    },
    async 'salva-perfil'() {
      const nome = ($('#pf-nome')?.value || '').trim();
      if (!nome) return toast('O nome não pode ficar vazio.', { tipo:'bad' });
      const dados = { nome, canal_principal_id: $('#pf-canal')?.value || null };
      const cg = $('#pf-cargo')?.value || null;
      if (cache.temCargos) dados.cargo_id = cg; else dados.cargo = cg;
      if (!await grava('usuarios', dados, eu.id)) return;
      await recarregaBase();
      eu = cache.usuarios.find(u => u.id === eu.id);
      toast('Perfil salvo.'); montaShell();
    },
    'criar-perfil'() {
      const sugestao = (sessao?.user?.email || '').split('@')[0]
        .split(/[^a-zA-ZÀ-ÿ]+/).filter(Boolean)
        .map(p => p[0].toUpperCase() + p.slice(1)).join(' ');
      form('Criar meu perfil', [
        { k:'nome', label:'Nome', req:true, value:sugestao },
        campoCargo(null),
        { k:'canal_principal_id', label:'Canal principal', type:'select', opts:optCanais() }
      ], async d => {
        d.auth_user_id = sessao.user.id;
        if (!await grava('usuarios', d)) return false;
        await recarregaBase();
        eu = cache.usuarios.find(u => u.auth_user_id === sessao.user.id) || null;
        toast('Perfil criado.'); montaShell();
        return true;
      }, 'Criar');
    },

    vincular() {
      form('Vincular meu login', [
        { k:'usuario_id', label:'Eu sou', type:'select', req:true,
          opts:cache.usuarios.map(u => ({ v:u.id, t:u.nome })),
          hint:'Liga o login à pessoa, para os feedbacks saírem com sua autoria.' }
      ], async d => {
        const ok = await grava('usuarios', { auth_user_id: sessao.user.id }, d.usuario_id);
        if (ok) { eu = cache.usuarios.find(u => u.id === d.usuario_id); toast('Login vinculado.'); montaShell(); }
        return ok;
      }, 'Vincular');
    },
    limpar() {
      confirma('Limpar preferências locais',
        'Tema, densidade e a conexão salvos <b>neste navegador</b> serão apagados. Nenhum dado do banco é tocado.',
        () => { LS.del(CFG_KEY); LS.del(PREF_KEY); location.reload(); return true; },
        { palavra: 'LIMPAR' });
    },
    sair() { sb.auth.signOut().then(() => location.reload()); }
  }
};

function cfgCorpo() {
  const bloco = (t, c) => `<div class="card"><div class="ch"><h3>${t}</h3></div><div class="cb">${c}</div></div>`;

  if (abaCfg === 'perfil') {
    // Login ainda não ligado a uma pessoa do time: resolve isso antes.
    if (!eu) return bloco('Sua conta', `
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
        ${avatar(null, 52, sessao?.user?.email)}
        <div><div style="font-weight:600;font-size:15px">Login sem perfil</div>
          <div class="sm2">${esc(sessao?.user?.email || '')}</div></div>
        <div class="push" style="margin-left:auto">
          <button class="btn ghost" data-act="sair">${ico('out',15)}Sair</button></div></div>
      <div class="err" style="display:block;margin-bottom:16px">Seu login ainda não está ligado a uma pessoa do time.
        Sem isso você não consegue editar perfil e os feedbacks que registra ficam sem autor.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" data-act="criar-perfil">${ico('plus',15)}Criar meu perfil</button>
        ${cache.usuarios.length ? `<button class="btn ghost" data-act="vincular">${ico('user',15)}Já existo na lista — vincular</button>` : ''}
      </div>`);

    return bloco('Meu perfil', `
      <div style="display:flex;align-items:center;gap:18px;margin-bottom:24px;flex-wrap:wrap">
        ${avatar(eu, 76)}
        <div style="display:flex;gap:8px;flex-wrap:wrap">

function formUser(row) {
  form(row ? 'Editar pessoa' : 'Nova pessoa', [
    { k:'nome', label:'Nome', req:true, value:row?.nome },
    campoCargo(row),

  ], async d => { const ok = await grava('usuarios', d, row?.id); if (ok) await recarregaBase(); return ok; });
}
/* ── convites ─────────────────────────────────────────────────────
   A tabela pode não existir ainda (correção 04). Nesse caso a tela
   explica em vez de despejar erro. */
async function listaConvites() {
  const alvo = $('#lista-convites'); if (!alvo) return;
  const { data, error } = await sb.from('convites').select('*').order('created_at', { ascending: false });
  if (error) {
    alvo.innerHTML = `<div class="cb"><div class="err" style="display:block">
      O convite ainda não existe no banco. Rode o arquivo
      <b>CORRECAO-04.sql</b> no SQL Editor do Supabase para ligar esta parte.</div></div>`;
    return;
  }
  const abertos = data.filter(c => !c.usado_em && (!c.expira_em || c.expira_em >= hoje()));
  const ct = $('#ct-conv'); if (ct) ct.textContent = `${abertos.length} aberto(s)`;

  if (!data.length) {
    alvo.innerHTML = vazio('inbox', 'Nenhum convite',
      'Crie um convite com o e-mail da pessoa. Ela se cadastra sozinha e já entra com o cargo certo.',
      { act:'novo-convite', label:'Convidar alguém' });
    return;
  }
  alvo.innerHTML = `<div class="t-scroll"><table><thead><tr>
    <th>E-mail</th><th>Nome</th><th>Cargo</th><th>Validade</th><th>Situação</th><th></th>
  </tr></thead><tbody>${data.map(c => {
    const vencido = !c.usado_em && c.expira_em && c.expira_em < hoje();
    return `<tr>
      <td><b>${esc(c.email)}</b></td>
      <td class="mut">${esc(c.nome || '—')}</td>
      <td class="mut">${esc(nomeCargo(c.cargo_id))}</td>
      <td class="mut">${dtl(c.expira_em)}</td>
      <td>${c.usado_em ? `<span class="pill ok">usado em ${dt(c.usado_em.slice(0,10))}</span>`
            : vencido ? '<span class="pill bad">vencido</span>'
            : '<span class="pill warn">aguardando</span>'}</td>
      <td class="act">
        ${c.usado_em ? '' : `
          <button class="btn sm ghost" data-act="copia-convite" data-e="${esc(c.email)}">${ico('copy',13)} Copiar mensagem</button>
          <button class="btn sm ghost" data-act="revoga-convite" data-id="${c.id}" data-e="${esc(c.email)}">${ico('trash',13)}</button>`}
      </td></tr>`;
  }).join('')}</tbody></table></div>`;
}

function formConvite(pessoa) {
  form(pessoa ? `Convidar ${pessoa.nome}` : 'Novo convite', [
    { k:'email', label:'E-mail da pessoa', req:true, type:'email',
      hint:'Precisa ser o mesmo e-mail que ela vai usar para criar a conta.' },
    { k:'nome', label:'Nome', value:pessoa?.nome,
      hint:pessoa ? '' : 'Usado para criar a pessoa no time quando o convite for aceito.' },
    ...(cache.temCargos
      ? [{ k:'cargo_id', label:'Cargo', type:'select', value:pessoa?.cargo_id, opts:optCargos() }] : []),
    { k:'expira_em', label:'Válido até', type:'date',
      value: new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10) }
  ], async d => {
    d.email = String(d.email).trim().toLowerCase();
    d.criado_por = eu?.id || null;

/* ═══════════════════════════════════════════════════════════════════
   COMMAND PALETTE
   ═══════════════════════════════════════════════════════════════════ */
let cmdAberto = false;
async function palette() {
  if (cmdAberto) return;
  cmdAberto = true;
  const el = document.createElement('div');
  el.className = 'cmdk';
  el.innerHTML = `<div class="box">
    <div class="ci">${ico('search', 18)}<input placeholder="Buscar ou executar…" autofocus></div>
    <div class="cl"></div>
    <div class="cf"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>↵</kbd> abrir</span><span><kbd>esc</kbd> fechar</span></div></div>`;
  document.body.appendChild(el);

  const acoesRapidas = [
    ...Object.entries(R).map(([k, r]) => ({ g:'Navegar', t:r.label, ic:r.icone, run:() => vai(k) })),
    { g:'Ações', t:'Nova ação', ic:'plus', sc:'N', run:() => formAcao() },
    { g:'Ações', t:'Nova rotina recorrente', ic:'refresh', run:() => R.acoes.acoes.modelo() },
    { g:'Ações', t:'Gerar rotinas de hoje', ic:'zap', run:() => R.inicio.acoes.gerar() },
    { g:'Ações', t:'Nova campanha', ic:'target', run:() => formCampanha() },
    { g:'Ações', t:'Registrar feedback', ic:'users', run:() => R.time.acoes.fb() },
    { g:'Sistema', t:`Tema ${pref.theme === 'dark' ? 'claro' : 'escuro'}`, ic:pref.theme === 'dark' ? 'sun' : 'moon',
      run:() => { pref.theme = pref.theme === 'dark' ? 'light' : 'dark'; savePref(); montaShell(); } },
    { g:'Sistema', t:'Recarregar dados', ic:'refresh', sc:'R', run:() => { recarregaBase().then(pinta); } },
    { g:'Sistema', t:'Sair da conta', ic:'out', run:() => sb.auth.signOut().then(() => location.reload()) }
  ];

  let registros = [];
  Promise.all([
    q('acoes', x => x.eq('recorrencia', 'nenhuma').order('created_at', { ascending:false }).limit(120)),
    q('campanhas'), q('producao_conteudo', x => x.limit(120))
  ]).then(([a, c, p]) => {
    registros = [
      ...a.map(r => ({ g:'Ações', t:r.titulo, ic:'check', run:() => { vai('acoes'); setTimeout(() => formAcao(r), 260); } })),
      ...c.map(r => ({ g:'Campanhas', t:r.nome, ic:'target', run:() => { vai('campanhas'); setTimeout(() => formCampanha(r), 260); } })),
      ...p.map(r => ({ g:'Conteúdo', t:r.titulo, ic:'film', run:() => vai('producao') })),
      ...cache.usuarios.map(r => ({ g:'Time', t:r.nome, ic:'user', run:() => vai('time') })),
      ...cache.canais.map(r => ({ g:'Canais', t:r.nome, ic:'target', run:() => { vai('config'); abaCfg = 'time'; } }))
    ];
    desenha();
  });

  const inp = el.querySelector('input'), lista = el.querySelector('.cl');
  let sel = 0, atuais = [];

  function desenha() {
    const termo = inp.value.trim().toLowerCase();
    const base = termo ? [...acoesRapidas, ...registros] : acoesRapidas;
    atuais = (termo ? base.filter(i => i.t.toLowerCase().includes(termo)) : base).slice(0, 40);
    sel = Math.min(sel, Math.max(0, atuais.length - 1));
    if (!atuais.length) { lista.innerHTML = `<div class="empty" style="padding:34px"><p>Nada encontrado para "${esc(inp.value)}".</p></div>`; return; }
    let html = '', gAtual = null;
    atuais.forEach((i, n) => {
      if (i.g !== gAtual) { gAtual = i.g; html += `<div class="sec">${esc(i.g)}</div>`; }
      html += `<div class="it ${n === sel ? 'sel' : ''}" data-n="${n}">${ico(i.ic || 'arrowR', 16)}
        <span>${esc(i.t)}</span>${i.sc ? `<span class="sc"><kbd>${i.sc}</kbd></span>` : ''}</div>`;
    });
    lista.innerHTML = html;
    lista.querySelector('.it.sel')?.scrollIntoView({ block:'nearest' });
  }
  function fecha() { el.remove(); cmdAberto = false; document.removeEventListener('keydown', kd, true); }
  function roda(i) { fecha(); i?.run(); }
  function kd(e) {
    if (e.key === 'Escape') { e.preventDefault(); fecha(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % atuais.length; desenha(); }
    else if (e.key === 'ArrowUp')   { e.preventDefault(); sel = (sel - 1 + atuais.length) % atuais.length; desenha(); }
    else if (e.key === 'Enter')     { e.preventDefault(); roda(atuais[sel]); }
  }
  document.addEventListener('keydown', kd, true);
  inp.oninput = () => { sel = 0; desenha(); };
  lista.onclick = e => { const it = e.target.closest('.it'); if (it) roda(atuais[+it.dataset.n]); };
  el.onclick = e => { if (e.target === el) fecha(); };
  desenha(); inp.focus();
}

/* ═══════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════ */
function popover(ancora, html, classe = '') {
  $$('.pop').forEach(p => p.remove());
  const p = document.createElement('div');
  p.className = 'pop ' + classe; p.innerHTML = html;
  document.body.appendChild(p);
  const r = ancora.getBoundingClientRect();
  p.style.top = (r.bottom + 8) + 'px';
  p.style.left = Math.max(10, Math.min(r.right - p.offsetWidth, innerWidth - p.offsetWidth - 10)) + 'px';
  const fora = e => { if (!p.contains(e.target) && !ancora.contains(e.target)) { p.remove(); document.removeEventListener('mousedown', fora); } };
  setTimeout(() => document.addEventListener('mousedown', fora), 0);
  return p;
}

/* ═══════════════════════════════════════════════════════════════════
   SHELL
   ═══════════════════════════════════════════════════════════════════ */
function vai(r, a = null) {
  if (!R[r]) return;
  rota = r; area = a;
  location.hash = (a ? a + '/' : '') + r;
  if (a && !pref.abertos.includes(a)) { pref.abertos.push(a); savePref(); }
  montaShell();
}

function elo(k, a) {
  const ativo = rota === k && area === a;
  const rotulo = a ? (R[k].curto || R[k].label) : R[k].label;
  return `<a href="#${a ? a + '/' : ''}${k}" data-r="${k}" data-a="${a || ''}"
    class="${ativo ? 'on' : ''}" title="${esc(rotulo)}">
    ${ico(R[k].icone)}<b>${esc(rotulo)}</b><span class="ct" data-ct="${k}" hidden></span></a>`;
}

function navHTML() {
  return NAV.map(sec => {
    if (sec.tipo === 'item')  return elo(sec.r, null);
    if (sec.tipo === 'secao') return `<div class="grp">${sec.label}</div>` + sec.itens.map(k => elo(k, null)).join('');
    // Grupos com `semArea` são só organização visual: não filtram nada.
    const a = sec.semArea ? null : sec.id;
    const dentro = sec.semArea ? sec.itens.includes(rota) : area === sec.id;
    const aberto = pref.abertos.includes(sec.id) || dentro;
    return `<button class="gt ${aberto ? 'aberto' : ''} ${dentro ? 'ativo' : ''}" data-grupo="${sec.id}">
        ${ico(sec.icone)}<b>${sec.label}</b>
        <span class="chev">${ico('chevron', 14)}</span></button>
      <div class="sub ${aberto ? 'aberto' : ''}"><div>${sec.itens.map(k => elo(k, a)).join('')}</div></div>`;
  }).join('');
}

      </div>

    </main></div>`;

  $$('[data-r]').forEach(a => a.onclick = e => {

  });
  $$('[data-grupo]').forEach(b => b.onclick = () => {

    if (i >= 0) pref.abertos.splice(i, 1); else pref.abertos.push(id);

  return `<div class="head"><div><div class="skel" style="width:230px;height:26px"></div>
    <div class="skel" style="width:150px;margin-top:9px"></div></div></div>

    <div class="skel big" style="height:280px"></div>`;
}

let pintando = 0;
async function pinta() {
  const meu = ++pintando;
  const view = $('#view'); if (!view) return;
  const r = R[rota];
  $('#ttl').innerHTML = area
    ? `<span style="color:var(--ac)">${AREAS[area]}</span>
       <span class="mut" style="margin:0 6px">/</span>${esc(r.curto || r.titulo)}`
    : esc(r.titulo);
  $$('[data-r]').forEach(a =>
    a.classList.toggle('on', a.dataset.r === rota && (a.dataset.a || null) === area));
  view.innerHTML = esqueleto();

  let dados;
  try { dados = await r.dados(); }
  catch (e) {
    if (meu !== pintando) return;
    view.innerHTML = `<div class="card">${vazio('alert', 'Não deu para carregar',
      'Confira a conexão com o Supabase e tente de novo.')}</div>`;
    console.error(e); return;
  }
  if (meu !== pintando) return;

  // contadores da sidebar + sino
  try {
    const [k] = await q('v_dashboard_dia'); const kk = k || {};
    dados._temModelo = (await q('acoes', x => x.neq('recorrencia', 'nenhuma').limit(1))).length > 0;
    if (dados.k) dados.k._temModelo = dados._temModelo;
    const alerta = (+kk.acoes_urgentes || 0) + (+kk.acoes_atrasadas || 0);
    const setCt = (k2, n, hot) => { const e = $(`[data-ct="${k2}"]`); if (!e) return;
      e.hidden = !n; e.textContent = n; e.classList.toggle('hot', !!hot); };
    setCt('inicio', alerta, true);
    setCt('producao', +kk.conteudo_atrasado || 0, true);
    setCt('time', +kk.feedbacks_atrasados || 0, false);
    const sino = $('#sino');
    if (sino) {
      const total = alerta + (+kk.conteudo_atrasado||0) + (+kk.metas_atrasadas||0) + (+kk.feedbacks_atrasados||0);
      sino.innerHTML = ico('bell', 18) + (total ? '<span class="dot"></span>' : '');
    }
  } catch {}

  const html = r.render(dados);
  view.innerHTML = `<div class="view">${html}</div>`;
  r.pos?.(dados);   // carregamentos que acontecem depois da tela aparecer
  view.onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.tagName === 'SELECT' || b.tagName === 'INPUT') return;  // esses reagem ao change
    r.acoes?.[b.dataset.act]?.(b);
  };
  view.onchange = e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (el.tagName === 'SELECT' || el.tagName === 'INPUT') r.acoes?.[el.dataset.act]?.(el);
  };
}

/* ── atalhos globais ─────────────────────────────────────────────── */
let gPend = false;
document.addEventListener('keydown', e => {
  const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return palette(); }
  if (digitando || e.metaKey || e.ctrlKey || e.altKey || !sb || !sessao) return;
  const k = e.key.toLowerCase();
  if (gPend) {
    gPend = false;
    const mapa = { i:'inicio', a:'acoes', g:'agenda', c:'config', p:'producao', m:'metas', f:'financeiro', t:'time' };
    if (mapa[k]) { e.preventDefault(); vai(mapa[k]); }
    return;
  }
  if (k === 'g') { gPend = true; setTimeout(() => gPend = false, 1400); }
  else if (k === 'n') { e.preventDefault(); formAcao(); }
  else if (k === 'r') { e.preventDefault(); recarregaBase().then(pinta); toast('Atualizado.', { tipo:'info' }); }
  else if (e.key === '?') { e.preventDefault(); abaCfg = 'atalhos'; vai('config'); }
  else if (e.key === 'Escape') { $$('.pop').forEach(p => p.remove()); }
});
function leHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [a, r] = h.includes('/') ? h.split('/') : [null, h];
  if (!R[r]) return null;
  return { rota: r, area: (a && AREAS[a]) ? a : null };
}
addEventListener('hashchange', () => {
  const h = leHash();
  if (h && (h.rota !== rota || h.area !== area)) { rota = h.rota; area = h.area; montaShell(); }
});

    <div class="fields">
      <div><label>E-mail</label><input id="e" type="email" autocomplete="username"></div>
      <div><label>Senha</label><input id="s" type="password" autocomplete="current-password"></div>
      <div class="err" hidden></div>
      <button class="btn" id="go" style="justify-content:center">${ico('arrowR',15)}Entrar</button>
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <button id="esq" style="color:var(--dim)">Esqueci a senha</button>
        <button id="cad" style="color:var(--ac);font-weight:600">Primeiro acesso? Criar conta</button></div>
      ${cfgFixa() ? '' : '<button class="btn ghost" id="tr" style="justify-content:center">Trocar de projeto</button>'}
    </div></div></div>`;
  const entrar = async () => {
    const err = $('.err'), b = $('#go');
    err.hidden = true; b.disabled = true; b.textContent = 'Entrando…';
    const { error } = await sb.auth.signInWithPassword({ email: $('#e').value.trim(), password: $('#s').value });
    b.disabled = false; b.innerHTML = ico('arrowR',15) + 'Entrar';
    if (error) { err.textContent = error.message === 'Invalid login credentials'
      ? 'E-mail ou senha incorretos.' : error.message; err.hidden = false; return; }
    iniciar();
  };
  $('#go').onclick = entrar;
  $('#s').onkeydown = e => { if (e.key === 'Enter') entrar(); };
  $('#cad').onclick = telaCadastro;
  $('#esq').onclick = async () => {
    const email = $('#e').value.trim(), err = $('.err');
    if (!email) { err.textContent = 'Escreva seu e-mail acima primeiro.'; err.hidden = false; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href });
    if (error) { err.textContent = error.message; err.hidden = false; return; }
    err.hidden = true;
    toast('Se esse e-mail tiver conta, o link de redefinição chegou nele.', { tipo:'info' });
  };
  if ($('#tr')) $('#tr').onclick = () => { LS.del(CFG_KEY); location.reload(); };
}

/* Autocadastro. A conta nasce sem nenhum acesso — quem libera é o
   convite, conferido logo depois pela função aceitar_convite(). */
function telaCadastro() {
  $('#root').innerHTML = `<div class="gate">${aurora()}<div class="card">
    <img class="mark" src="${logoSrc()}" alt="MasterInfo">
    <div class="steps"><i class="on"></i><i class="on"></i></div>
    <h1>Criar minha conta</h1>
    <p class="lede">Use o <b>mesmo e-mail</b> em que você recebeu o convite.
      Com outro e-mail a conta é criada, mas não abre nada.</p>
    <div class="fields">
      <div><label>E-mail do convite</label><input id="e" type="email" autocomplete="username"></div>
      <div><label>Crie uma senha</label><input id="s" type="password" autocomplete="new-password">
        <div class="hint">Mínimo de 6 caracteres.</div></div>
      <div><label>Repita a senha</label><input id="s2" type="password" autocomplete="new-password"></div>
      <div class="err" hidden></div>
      <button class="btn" id="go" style="justify-content:center">${ico('user',15)}Criar conta</button>
      <button class="btn ghost" id="volta" style="justify-content:center">Já tenho conta</button>
    </div></div></div>`;

  const criar = async () => {
    const err = $('.err'), b2 = $('#go');
    const email = $('#e').value.trim(), senha = $('#s').value, senha2 = $('#s2').value;
    err.hidden = true;
    if (senha.length < 6) { err.textContent = 'A senha precisa ter ao menos 6 caracteres.'; err.hidden = false; return; }
    if (senha !== senha2) { err.textContent = 'As duas senhas não são iguais.'; err.hidden = false; return; }
    b2.disabled = true; b2.textContent = 'Criando…';
    const { data, error } = await sb.auth.signUp({ email, password: senha });
    b2.disabled = false; b2.innerHTML = ico('user',15) + 'Criar conta';
    if (error) {
      err.textContent = /disabled|not allowed/i.test(error.message)
        ? 'O autocadastro está desligado no Supabase. Peça para ligar em Authentication → Sign In / Providers.'
        : error.message;
      err.hidden = false; return;
    }
    if (!data.session) {
      err.textContent = 'Conta criada. Confirme o e-mail que acabou de chegar e depois entre.';
      err.hidden = false; return;
    }
    iniciar();
  };
  $('#go').onclick = criar;
  $('#s2').onkeydown = e => { if (e.key === 'Enter') criar(); };
  $('#volta').onclick = telaLogin;
}

/* Autenticado, porém sem convite: fica autenticado e não vê nada. */
function telaSemAcesso() {
  $('#root').innerHTML = `<div class="gate">${aurora()}<div class="card">
    <img class="mark" src="${logoSrc()}" alt="MasterInfo">
    <h1>Conta criada, acesso pendente</h1>
    <p class="lede">Seu login funciona, mas o e-mail <b>${esc(sessao?.user?.email || '')}</b>
      não tem convite ativo — por isso nada aparece aqui.</p>
    <div class="fields">
      <div class="err" style="display:block">Peça a quem administra o sistema para criar um convite
        para este e-mail, em Configurações → Acesso e login. Depois é só entrar de novo.</div>
      <button class="btn ghost" id="sair" style="justify-content:center">${ico('out',15)}Sair</button>
    </div></div></div>`;
  $('#sair').onclick = () => sb.auth.signOut().then(() => location.reload());
}

/* Projeto fixo vindo do config.js — vale para qualquer navegador e máquina.
   Só cai na tela de conexão se o config.js não estiver preenchido. */
function cfgFixa() {
  const c = window.MI_CONFIG;
  return (c && /^https:\/\/.+\.supabase\.co$/.test(c.url || '') && (c.key || '').length > 40) ? c : null;
}

async function iniciar() {
  const c = cfgFixa() || LS.get(CFG_KEY);
  if (!c?.url) return telaConexao();
  if (!sb) sb = window.supabase.createClient(c.url, c.key, { auth: { persistSession: true, autoRefreshToken: true } });

  // A identidade visual carrega ANTES do login: a tela de entrada já
  // precisa da logo e das cores certas.
  await carregaVisual();

  const { data, error } = await sb.auth.getSession();
  if (error) { LS.del(CFG_KEY); return telaConexao(); }
  sessao = data.session;
  if (!sessao) return telaLogin();

  // Recém-cadastrado: tenta consumir o convite antes de qualquer leitura.
  // Se a função ainda não existir no banco, segue o fluxo antigo.
  try {
    await sb.rpc('aceitar_convite');
    const { data: liberado, error: e2 } = await sb.rpc('tem_acesso');
    if (!e2 && liberado === false) return telaSemAcesso();
  } catch {}

  await recarregaBase();
  eu = cache.usuarios.find(u => u.auth_user_id === sessao.user.id) || null;
  const h = leHash();
  if (h) { rota = h.rota; area = h.area; }
  montaShell();
}

iniciar();
</script>
