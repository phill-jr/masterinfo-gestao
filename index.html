<!doctype html>
<html lang="pt-BR" data-theme="light" data-accent="orange" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="logo.png">
<title>Gestão · MasterInfo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Projeto fixo. Preenchido em config.js, o sistema nunca mais pergunta. -->
<script src="config.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   TOKENS
   ═══════════════════════════════════════════════════════════ */
:root{
  --r:10px; --r-lg:14px;
  --sb:248px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 2px rgba(0,0,0,.16),0 8px 24px -12px rgba(0,0,0,.4);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.6);
  --row-y:11px;
}
:root[data-density="compact"]{--row-y:7px}

:root[data-theme="dark"]{
  --bg:#0a0b0e; --surface:#101217; --surface2:#161920; --surface3:#1c2029;
  --line:#232833; --line2:#2e3441;
  --txt:#e9ecf2; --txt2:#b3bac9; --dim:#7d8496;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  --pt:#5b8def; --pt-bg:rgba(91,141,239,.15);
  --ok-bg:rgba(52,211,153,.13); --warn-bg:rgba(251,191,36,.13);
  --bad-bg:rgba(248,113,113,.13); --info-bg:rgba(96,165,250,.13);
  --skel:linear-gradient(90deg,#161920 25%,#1e222b 50%,#161920 75%);
}
:root[data-theme="light"]{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f5f6f9; --surface3:#eceef3;
  --line:#e6e9ef; --line2:#d3d9e3;
  --txt:#111318; --txt2:#3d4351; --dim:#767d8d;
  --ok:#059669; --warn:#b45309; --bad:#dc2626; --info:#2563eb;
  --pt:#1e3a8a; --pt-bg:rgba(30,58,138,.10);
  --ok-bg:rgba(5,150,105,.10); --warn-bg:rgba(180,83,9,.10);
  --bad-bg:rgba(220,38,38,.10); --info-bg:rgba(37,99,235,.10);
  --skel:linear-gradient(90deg,#eef0f4 25%,#f7f8fa 50%,#eef0f4 75%);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -14px rgba(16,24,40,.16);
  --shadow-lg:0 24px 60px -18px rgba(16,24,40,.18);
}
/* No tema claro o painel lateral ganha um cinza levíssimo para se
   separar do branco puro do conteúdo. */
:root[data-theme="light"] aside{background:#fcfcfd}
:root[data-accent="orange"]{--ac:#ff6b00;--ac2:#ff8c33;--ac-bg:rgba(255,107,0,.13);--ac-fg:#fff}
:root[data-accent="indigo"]{--ac:#6366f1;--ac2:#818cf8;--ac-bg:rgba(99,102,241,.15);--ac-fg:#fff}
:root[data-accent="emerald"]{--ac:#10b981;--ac2:#34d399;--ac-bg:rgba(16,185,129,.15);--ac-fg:#fff}
:root[data-accent="violet"]{--ac:#8b5cf6;--ac2:#a78bfa;--ac-bg:rgba(139,92,246,.15);--ac-fg:#fff}
:root[data-accent="rose"]{--ac:#f43f5e;--ac2:#fb7185;--ac-bg:rgba(244,63,94,.15);--ac-fg:#fff}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14.5px;line-height:1.55;
  font-feature-settings:"cv02","cv03","cv04","ss01";
  -webkit-font-smoothing:antialiased;
  transition:background .25s var(--ease),color .25s var(--ease);
}
h1,h2,h3,h4{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.02em;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:var(--ac);color:var(--ac-fg)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--dim);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ═══════════════════════════════════════════════════════════
   ANIMAÇÕES
   ═══════════════════════════════════════════════════════════ */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes checkPop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes grow{from{width:0}}

.view{animation:fadeUp .3s var(--ease) both}
.stg>*{animation:fadeUp .34s var(--ease) both}
.stg>*:nth-child(1){animation-delay:.02s} .stg>*:nth-child(2){animation-delay:.05s}
.stg>*:nth-child(3){animation-delay:.08s} .stg>*:nth-child(4){animation-delay:.11s}
.stg>*:nth-child(5){animation-delay:.14s} .stg>*:nth-child(6){animation-delay:.17s}
.stg>*:nth-child(n+7){animation-delay:.2s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ═══════════════════════════════════════════════════════════
   GATE (config / login)
   ═══════════════════════════════════════════════════════════ */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:var(--bg)}
/* aurora: três manchas de luz que passeiam devagar atrás do cartão */
.aurora{position:absolute;inset:-25%;pointer-events:none;filter:blur(80px);z-index:0}
.aurora i{position:absolute;display:block;border-radius:50%;will-change:transform}
.aurora i:nth-child(1){width:44vw;height:44vw;left:2%;top:-4%;
  background:radial-gradient(circle,var(--ac) 0,transparent 66%);opacity:.30;animation:drift1 26s ease-in-out infinite}
.aurora i:nth-child(2){width:38vw;height:38vw;right:0%;top:22%;
  background:radial-gradient(circle,#ffb066 0,transparent 66%);opacity:.26;animation:drift2 32s ease-in-out infinite}
.aurora i:nth-child(3){width:34vw;height:34vw;left:26%;bottom:-12%;
  background:radial-gradient(circle,var(--ac2) 0,transparent 66%);opacity:.20;animation:drift3 38s ease-in-out infinite}
:root[data-theme="dark"] .aurora{filter:blur(90px)}
:root[data-theme="dark"] .aurora i:nth-child(1){opacity:.24}
:root[data-theme="dark"] .aurora i:nth-child(2){opacity:.18}
:root[data-theme="dark"] .aurora i:nth-child(3){opacity:.16}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}
  33%{transform:translate3d(9vw,7vh,0) scale(1.14)}66%{transform:translate3d(-5vw,12vh,0) scale(.92)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1)}
  40%{transform:translate3d(-11vw,9vh,0) scale(1.18)}75%{transform:translate3d(4vw,-7vh,0) scale(.95)}}
@keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(8vw,-11vh,0) scale(1.2)}}

/* grafismo: malha */
.malha{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--line2) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line2) 1px,transparent 1px);
  background-size:46px 46px;opacity:.5;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 42%,#000 0,transparent 78%);
  mask-image:radial-gradient(ellipse 70% 60% at 50% 42%,#000 0,transparent 78%);
  animation:malhaAnda 32s linear infinite}
@keyframes malhaAnda{to{background-position:46px 46px}}

/* grafismo: ondas */
.ondas{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ondas i{position:absolute;left:-60%;right:-60%;height:70vh;border-radius:44%;
  background:linear-gradient(180deg,var(--ac-bg),transparent 72%);will-change:transform}
.ondas i:nth-child(1){bottom:-42vh;animation:onda 20s ease-in-out infinite}
.ondas i:nth-child(2){bottom:-50vh;opacity:.7;animation:onda 27s ease-in-out infinite reverse}
.ondas i:nth-child(3){bottom:-58vh;opacity:.45;animation:onda 34s ease-in-out infinite}
@keyframes onda{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(7deg) translateY(-3vh)}}

.gate .card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:38px;width:100%;max-width:440px;box-shadow:var(--shadow-lg);animation:pop .45s var(--ease) both}
.gate .mark{display:block;height:30px;width:auto;margin-bottom:26px;
  animation:fadeUp .6s var(--ease) .08s both}
.gate h1{font-size:21px;margin-bottom:6px;animation:fadeUp .5s var(--ease) .14s both}
.gate .lede{color:var(--dim);font-size:13.5px;margin-bottom:26px;animation:fadeUp .5s var(--ease) .19s both}
.gate .fields{display:grid;gap:16px}
.gate .fields>*{animation:fadeUp .5s var(--ease) both}
.gate .fields>*:nth-child(1){animation-delay:.24s}
.gate .fields>*:nth-child(2){animation-delay:.29s}
.gate .fields>*:nth-child(3){animation-delay:.34s}
.gate .fields>*:nth-child(n+4){animation-delay:.38s}
.gate .steps{display:flex;gap:6px;margin-bottom:22px}
.gate .steps i{height:3px;flex:1;background:var(--line);border-radius:2px;transform-origin:left}
.gate .steps i.on{background:var(--ac);animation:grow .55s var(--ease) both}
/* brilho que atravessa o botão de tempos em tempos */
.gate .btn{position:relative;overflow:hidden}
.gate .btn::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-45%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);
  animation:brilho 4.5s ease-in-out 1.4s infinite}
@keyframes brilho{0%{left:-45%}55%,100%{left:125%}}

/* ═══════════════════════════════════════════════════════════
   SHELL
   ═══════════════════════════════════════════════════════════ */
.app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh;transition:grid-template-columns .22s var(--ease)}
.app.mini{--sb:72px}

aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:14px 12px;gap:2px;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{display:flex;align-items:center;gap:11px;padding:10px 8px 20px;min-width:0}
.brand .lg{height:23px;width:auto;flex:none}
.brand .mk{display:none;width:34px;height:34px;border-radius:10px;flex:none;place-items:center;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ac-fg);font-weight:700;font-size:13px;letter-spacing:-.4px}
.app.mini .brand .lg{display:none}
.app.mini .brand .mk{display:grid}
.app.mini .grp,.app.mini nav b,.app.mini .who .tx{display:none}
.app.mini .brand{justify-content:center;padding-left:0;padding-right:0}
.app.mini nav a{justify-content:center;padding-left:0;padding-right:0}
.app.mini .who{justify-content:center}

.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
  font-weight:700;padding:16px 10px 7px}
nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;flex:1;margin:0 -2px;padding:0 2px}
nav a{display:flex;align-items:center;gap:11px;padding:8.5px 10px;border-radius:var(--r);
  color:var(--txt2);font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;
  transition:background .15s,color .15s,transform .15s var(--ease);position:relative}
nav a svg{flex:none;opacity:.8}
nav a b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
nav a:hover{background:var(--surface2);color:var(--txt)}
nav a.on{background:var(--ac);color:var(--ac-fg);font-weight:600;box-shadow:0 4px 14px -6px var(--ac)}
nav a.on svg{opacity:1}
nav .ct{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;text-align:center;
  padding:1px 6px;border-radius:20px;background:var(--surface3);color:var(--dim)}
nav a.on .ct{background:rgba(0,0,0,.22);color:#fff}
nav .ct.hot{background:var(--bad-bg);color:var(--bad)}

/* ── submenus ─────────────────────────────────────────────────── */
nav .gt{display:flex;align-items:center;gap:11px;width:100%;padding:8.5px 10px;border-radius:var(--r);
  color:var(--txt2);font-weight:600;font-size:14px;white-space:nowrap;margin-top:6px;
  transition:background .15s,color .15s}
nav .gt:hover{background:var(--surface2);color:var(--txt)}
nav .gt.ativo{color:var(--ac)}
nav .gt.ativo svg{color:var(--ac)}
nav .gt b{font-weight:600;flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis}
nav .gt .chev{display:grid;place-items:center;transition:transform .22s var(--ease);opacity:.6}
nav .gt.aberto .chev{transform:rotate(90deg)}
nav .sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s var(--ease);
  margin-left:18px;border-left:1.5px solid var(--line);padding-left:6px}
nav .sub>div{overflow:hidden;display:flex;flex-direction:column;gap:2px}
nav .sub.aberto{grid-template-rows:1fr}
nav .sub a{font-size:13.5px;padding:7px 10px;font-weight:500}
nav .sub a svg{width:15px;height:15px}
/* colapsada, a barra vira só ícones: os submenus não cabem */
.app.mini nav .sub,.app.mini nav .gt .chev,.app.mini nav .gt b{display:none}
.app.mini nav .gt{justify-content:center;padding-left:0;padding-right:0}

.who{margin-top:8px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;
  cursor:pointer;border-radius:var(--r);transition:background .15s}
.who:hover{background:var(--surface2)}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ac-fg);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who .tx{min-width:0;flex:1;overflow:hidden}
.who .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .s{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* topbar */
main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 26px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.top .ttl{font-family:"Inter Tight";font-weight:600;font-size:15px}
.search{margin-left:auto;display:flex;align-items:center;gap:9px;width:min(400px,38vw);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;
  color:var(--dim);font-size:13.5px;transition:border-color .15s,box-shadow .15s}
.search:hover{border-color:var(--line2)}
.search kbd{margin-left:auto;font:600 11px Inter;background:var(--surface2);border:1px solid var(--line);
  border-radius:5px;padding:2px 6px;color:var(--dim)}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--dim);
  transition:background .15s,color .15s;position:relative;flex:none}
.ib:hover{background:var(--surface2);color:var(--txt)}
.ib .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad);
  box-shadow:0 0 0 2px var(--bg)}

.wrap{padding:26px;max-width:1440px;width:100%}
.head{display:flex;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.head h2{font-size:26px}
.head .sub{color:var(--dim);font-size:13.5px;margin-top:3px}
.head .push{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ═══════════════════════════════════════════════════════════
   COMPONENTES
   ═══════════════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--ac);color:var(--ac-fg);
  border-radius:9px;padding:8.5px 15px;font-weight:600;font-size:13.5px;white-space:nowrap;
  transition:transform .13s var(--ease),box-shadow .13s,background .15s,opacity .15s;
  box-shadow:0 4px 14px -6px var(--ac)}
.btn:hover{background:var(--ac2);transform:translateY(-1px);box-shadow:0 8px 20px -8px var(--ac)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--surface);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--surface2);border-color:var(--line2);box-shadow:none}
.btn.danger{background:var(--bad);box-shadow:none;color:#fff}
/* Tarefa pontual tem cor própria: a diferença entre o que se repete e
   o que apareceu hoje precisa ser lida sem ninguém explicar. */
.btn.pontual{background:var(--pt);color:#fff;box-shadow:0 4px 14px -6px var(--pt)}
.btn.pontual:hover{background:var(--pt);filter:brightness(1.14);box-shadow:0 8px 20px -8px var(--pt)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px;box-shadow:none}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{flex:none}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px;margin-bottom:26px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;
  transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.tile:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow)}
.tile .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px;
  background:var(--ac-bg);color:var(--ac)}
.tile .n{font-family:"Inter Tight";font-size:31px;font-weight:700;letter-spacing:-.035em;line-height:1}
.tile .l{font-size:13px;color:var(--dim);margin-top:7px}
.tile .h{font-size:12px;margin-top:3px;color:var(--dim)}
.tile.bad .ic{background:var(--bad-bg);color:var(--bad)} .tile.bad .n{color:var(--bad)}
.tile.warn .ic{background:var(--warn-bg);color:var(--warn)} .tile.warn .n{color:var(--warn)}
.tile.ok .ic{background:var(--ok-bg);color:var(--ok)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:20px}
.card>.ch{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.card>.ch h3{font-size:14.5px;font-weight:600}
.card>.ch .push{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.card .cb{padding:18px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
  padding:9px 18px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:var(--row-y) 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .13s}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.act{text-align:right;white-space:nowrap}
td.act .btn{opacity:.35;transition:opacity .15s}
tr:hover td.act .btn{opacity:1}
.t-scroll{overflow-x:auto}
.mut{color:var(--dim)}
.sm2{font-size:12px;color:var(--dim)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2.5px 9px;
  border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.dim{background:var(--surface3);color:var(--dim)}
.pill.ac{background:var(--ac-bg);color:var(--ac)}

.bar{height:6px;background:var(--surface3);border-radius:4px;overflow:hidden;min-width:88px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:4px;
  animation:grow .7s var(--ease) both;transition:width .4s var(--ease)}
.bar i.ok{background:var(--ok)} .bar i.bad{background:var(--bad)} .bar i.warn{background:var(--warn)}

/* checkbox de tarefa */
.tick{width:19px;height:19px;border:1.8px solid var(--line2);border-radius:6px;flex:none;
  display:grid;place-items:center;transition:all .16s var(--ease);color:transparent}
.tick:hover{border-color:var(--ac);background:var(--ac-bg)}
.tick.done{background:var(--ac);border-color:var(--ac);color:var(--ac-fg);animation:checkPop .3s var(--ease)}

.row{display:flex;align-items:center;gap:13px;padding:12px 18px;border-bottom:1px solid var(--line);
  transition:background .13s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row .g{flex:1;min-width:0}
.row .t{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--dim);margin-top:1px}
.row.off .t{text-decoration:line-through;color:var(--dim)}

/* estados */
.empty{padding:52px 22px;text-align:center;animation:fadeIn .35s}
.empty .ic{width:48px;height:48px;border-radius:14px;margin:0 auto 16px;display:grid;place-items:center;
  background:var(--surface2);color:var(--dim)}
.empty h4{font-size:16px;margin-bottom:6px}
.empty p{color:var(--dim);font-size:13.5px;max-width:400px;margin:0 auto 18px}
.skel{background:var(--skel);background-size:200% 100%;animation:shimmer 1.3s linear infinite;
  border-radius:7px;height:13px}
.skel.big{height:80px;border-radius:var(--r-lg)}

/* onboarding */
.ob{background:linear-gradient(135deg,var(--ac-bg),transparent 65%);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:20px;margin-bottom:22px;animation:fadeUp .35s var(--ease) both}
.ob .oh{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ob h3{font-size:16px}
.ob .pr{font-size:12px;color:var(--dim);margin-top:2px}
.ob ul{list-style:none;display:grid;gap:8px}
.ob li{display:flex;align-items:center;gap:11px;font-size:13.5px;padding:9px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ob li.done{opacity:.5}
.ob li.done .lb{text-decoration:line-through}
.ob li .lb{flex:1}
.ob .rg{width:20px;height:20px;border-radius:50%;border:1.8px solid var(--line2);flex:none;
  display:grid;place-items:center;color:transparent}
.ob li.done .rg{background:var(--ok);border-color:var(--ok);color:#fff}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(196px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kb .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;min-height:130px}
.kb .col h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
  margin-bottom:11px;display:flex;align-items:center;gap:7px}
.kb .col h4 span{background:var(--surface3);border-radius:20px;padding:1px 7px;font-size:10.5px}
.kb .k{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:11px;margin-bottom:8px;
  transition:transform .15s var(--ease),border-color .15s;animation:fadeUp .3s var(--ease) both}
.kb .k:hover{transform:translateY(-2px);border-color:var(--line2)}
.kb .k .t{font-size:13px;font-weight:600;margin-bottom:5px;line-height:1.35}
.kb .k .m{font-size:11.5px;color:var(--dim)}
.kb .k .ks{display:flex;gap:5px;margin-top:9px}

/* formulários */
label{display:block;font-size:12px;color:var(--txt2);margin-bottom:6px;font-weight:600}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:13.5px;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);background:var(--surface);
  box-shadow:0 0 0 3px var(--ac-bg)}
input[type=checkbox]{width:auto}
textarea{min-height:76px;resize:vertical;line-height:1.5}
.hint{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.45}
.chk{display:flex;align-items:center;gap:9px}.chk label{margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{color:var(--bad);font-size:12.5px;background:var(--bad-bg);padding:9px 12px;border-radius:8px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(3,5,9,.62);backdrop-filter:blur(3px);display:grid;
  place-items:center;padding:20px;z-index:70;animation:fadeIn .16s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .24s var(--ease)}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{font-size:16px;flex:1}
.modal .mb{padding:22px;display:grid;gap:15px;overflow-y:auto}
.modal .mf{padding:15px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface)}

/* command palette */
.cmdk{position:fixed;inset:0;background:rgba(3,5,9,.6);backdrop-filter:blur(4px);z-index:90;
  display:flex;justify-content:center;padding-top:12vh;animation:fadeIn .14s}
.cmdk .box{background:var(--surface);border:1px solid var(--line2);border-radius:15px;width:min(600px,92vw);
  max-height:68vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg);
  animation:pop .2s var(--ease)}
.cmdk .ci{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line)}
.cmdk .ci input{border:0;background:none;padding:0;font-size:15.5px}
.cmdk .ci input:focus{box-shadow:none}
.cmdk .cl{overflow-y:auto;padding:7px}
.cmdk .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
  font-weight:700;padding:11px 11px 5px}
.cmdk .it{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13.5px}
.cmdk .it svg{color:var(--dim);flex:none}
.cmdk .it .sc{margin-left:auto;font-size:11.5px;color:var(--dim)}
.cmdk .it.sel{background:var(--ac);color:var(--ac-fg)}
.cmdk .it.sel svg,.cmdk .it.sel .sc{color:var(--ac-fg);opacity:.85}
.cmdk .cf{border-top:1px solid var(--line);padding:9px 16px;font-size:11.5px;color:var(--dim);display:flex;gap:16px}
kbd{font:600 11px Inter;background:var(--surface2);border:1px solid var(--line);border-radius:5px;
  padding:1.5px 5px;color:var(--dim)}

/* toasts */
.toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:9px;
  align-items:flex-end;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--line2);border-radius:11px;padding:12px 15px;
  display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg);animation:slideL .26s var(--ease);
  pointer-events:auto;max-width:380px;font-size:13.5px}
.toast .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
.toast.ok .ic{background:var(--ok-bg);color:var(--ok)}
.toast.bad .ic{background:var(--bad-bg);color:var(--bad)}
.toast.info .ic{background:var(--info-bg);color:var(--info)}
.toast button{color:var(--ac);font-weight:600;font-size:13px;white-space:nowrap}

/* popover (notificações / conta) */
.pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line2);border-radius:13px;
  box-shadow:var(--shadow-lg);width:340px;max-height:70vh;overflow:hidden;display:flex;flex-direction:column;
  animation:pop .18s var(--ease)}
.pop .ph{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;
  display:flex;align-items:center;gap:8px}
.pop .pl{overflow-y:auto}
.pop .pi{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .13s}
.pop .pi:hover{background:var(--surface2)}
.pop .pi:last-child{border-bottom:0}
.pop .pi .d{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.pop .pi .t{font-size:13px;font-weight:600}
.pop .pi .s{font-size:12px;color:var(--dim)}
.menu{width:230px}
.menu .mi{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13.5px;cursor:pointer;transition:background .13s}
.menu .mi:hover{background:var(--surface2)}
.menu .mi svg{color:var(--dim)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}

/* tabs */
.tabs{display:flex;gap:3px;background:var(--surface2);padding:4px;border-radius:11px;margin-bottom:22px;
  overflow-x:auto;width:fit-content;max-width:100%}
.tabs button{padding:7px 15px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--dim);
  white-space:nowrap;transition:all .15s}
.tabs button:hover{color:var(--txt)}
.tabs button.on{background:var(--surface);color:var(--txt);box-shadow:var(--shadow)}

.seg{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:9px}
.seg button{padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--dim);transition:all .15s}
.seg button.on{background:var(--surface);color:var(--txt);box-shadow:var(--shadow)}

.sw{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .lb{font-size:13.5px;font-weight:600}
.sw .ds{font-size:12.5px;color:var(--dim);margin-top:2px}
.sw .ct{flex:none}
.swatch{display:flex;gap:8px}
.swatch button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;transition:transform .15s}
.swatch button:hover{transform:scale(1.12)}
.swatch button.on{border-color:var(--txt)}

.zone{border:1px solid var(--bad);border-radius:var(--r-lg);padding:18px;background:var(--bad-bg)}

/* ── tags ────────────────────────────────────────────────────── */
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tags span{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;
  border:1px solid transparent;text-transform:lowercase}

/* ── filtros do check ────────────────────────────────────────── */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.tagfiltro{display:flex;gap:5px;flex-wrap:wrap}
.tagfiltro button{font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;
  border:1px solid var(--line);background:var(--surface);color:var(--dim);transition:all .15s}
.tagfiltro button:hover{border-color:var(--line2)}
.tagfiltro button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}

/* ── progresso do dia ────────────────────────────────────────── */
.progresso{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:24px;margin-bottom:22px}
.anel{position:relative;width:132px;height:132px;flex:none}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel circle{fill:none;stroke-width:9;stroke-linecap:round}
.anel .tr{stroke:var(--surface3)}
.anel .fr{stroke:var(--ac);transition:stroke-dashoffset .7s var(--ease)}
.anel .fr.cheio{stroke:var(--ok)}
.anel .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.anel .mid .p{font-family:"Inter Tight";font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1}
.anel .mid .s{font-size:12px;color:var(--dim);margin-top:3px}
.lado{display:grid;gap:12px;min-width:0}
.lado .linha{display:flex;align-items:center;gap:14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.lado .lb{font-size:13px;font-weight:600}
.lado .ds{font-size:12px;color:var(--dim);margin-top:1px}
.lado .v{margin-left:auto;font-family:"Inter Tight";font-size:21px;font-weight:700;white-space:nowrap}
.lado .v.ok{color:var(--ok)} .lado .v.bad{color:var(--bad)}
.heat .grade{display:flex;gap:4px;flex-wrap:wrap}
.heat .grade span{width:20px;height:20px;border-radius:5px;background:var(--surface3);
  border:1px solid var(--line);animation:fadeIn .4s both}
.heat .grade span.pouco{background:color-mix(in srgb,var(--ac) 28%,transparent);border-color:transparent}
.heat .grade span.meio {background:color-mix(in srgb,var(--ac) 60%,transparent);border-color:transparent}
.heat .grade span.cheio{background:var(--ok);border-color:transparent}
.heat .grade span.vazio{opacity:.45}
@media(max-width:720px){.progresso{grid-template-columns:1fr;justify-items:center;text-align:center}
  .lado{width:100%}}

/* ── lista do check ──────────────────────────────────────────── */
.grupo{padding:13px 18px 7px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--dim);font-weight:700;background:var(--surface2);display:flex;align-items:center;gap:8px}
.grupo span{margin-left:auto;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.chk-item{display:flex;align-items:flex-start;gap:13px;padding:12px 18px;
  border-bottom:1px solid var(--line);transition:background .13s,opacity .2s}
.chk-item:hover{background:var(--surface2)}
.chk-item .g{flex:1;min-width:0}
.chk-item .t{font-weight:600;font-size:13.5px;transition:color .2s}
.chk-item .m{font-size:12px;color:var(--dim);margin-top:2px}
.chk-item.feito{opacity:.55}
.chk-item.feito .t{text-decoration:line-through;color:var(--dim)}
.chk-item .tick{margin-top:1px}
.chk-item.rotina{box-shadow:inset 3px 0 0 var(--ac)}
.chk-item.pontual{box-shadow:inset 3px 0 0 var(--pt)}
.tick.pt:hover{border-color:var(--pt);background:var(--pt-bg)}
.tick.pt.done{background:var(--pt);border-color:var(--pt)}
.row.rotina{box-shadow:inset 3px 0 0 var(--ac)}
.row.pontual{box-shadow:inset 3px 0 0 var(--pt)}
.pill.pt{background:var(--pt-bg);color:var(--pt)}
.legenda{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--dim);
  padding:10px 18px;border-bottom:1px solid var(--line)}
.legenda b{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.legenda i{width:9px;height:9px;border-radius:3px;display:block}

/* ── régua de dias da semana ─────────────────────────────────── */
.regua{display:inline-flex;gap:3px}
.regua span{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;background:var(--surface2);color:var(--dim);
  border:1px solid var(--line)}
.regua span.on{background:var(--ac);color:var(--ac-fg);border-color:var(--ac)}

/* ── semana em colunas ───────────────────────────────────────── */
.semana{display:grid;grid-template-columns:repeat(7,minmax(158px,1fr));gap:11px;
  overflow-x:auto;padding-bottom:8px;align-items:start}
.semana .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:12px;min-height:140px;transition:border-color .18s}
.semana .col.fds{background:var(--surface2)}
.semana .col.hoje{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-bg)}
.semana .col h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);
  display:flex;align-items:center;gap:6px;margin-bottom:8px}
.semana .col.hoje h4{color:var(--ac)}
.semana .col h4 span{margin-left:auto;background:var(--surface3);border-radius:20px;
  padding:1px 7px;font-size:10.5px;color:var(--dim)}
.semana .col h4 .agora{margin-left:0;background:var(--ac);color:var(--ac-fg)}
.semana .carga{height:3px;background:var(--surface3);border-radius:2px;margin-bottom:11px;overflow:hidden}
.semana .carga i{display:block;height:100%;background:var(--ac);border-radius:2px;
  animation:grow .6s var(--ease) both}
.semana .k{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);
  padding:10px;margin-bottom:7px;transition:transform .15s var(--ease),border-color .15s;
  animation:fadeUp .3s var(--ease) both}
.semana .k:hover{transform:translateY(-2px);border-color:var(--ac)}
.semana .k .t{font-size:12.5px;font-weight:600;line-height:1.35}
.semana .k .m{font-size:11px;color:var(--dim);margin-top:3px}
.semana .livre{text-align:center;color:var(--dim);font-size:12px;padding:18px 6px;opacity:.6}
@media(max-width:900px){.semana{grid-template-columns:repeat(7,minmax(150px,1fr))}}

/* miniaturas dos grafismos */
.gprev{height:74px;position:relative;overflow:hidden;background:var(--bg)}
.gp-aurora::before,.gp-aurora::after{content:"";position:absolute;border-radius:50%;filter:blur(16px)}
.gp-aurora::before{width:64px;height:64px;left:8px;top:-14px;background:var(--ac);opacity:.5}
.gp-aurora::after{width:52px;height:52px;right:6px;bottom:-16px;background:var(--ac2);opacity:.38}
.gp-ondas::before,.gp-ondas::after{content:"";position:absolute;left:-30%;right:-30%;height:60px;border-radius:44%;
  background:linear-gradient(180deg,var(--ac),transparent 75%)}
.gp-ondas::before{bottom:-32px;opacity:.42}
.gp-ondas::after{bottom:-42px;opacity:.24;transform:rotate(-6deg)}
.gp-malha{background-image:linear-gradient(var(--line2) 1px,transparent 1px),
  linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:15px 15px}
.gp-limpo{background:var(--bg)}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;z-index:60;width:var(--sb);transform:translateX(-100%);
    transition:transform .24s var(--ease);box-shadow:var(--shadow-lg)}
  .app.open aside{transform:none}
  .wrap{padding:18px}
  .top{padding:11px 16px}
  .search{width:auto;flex:1}.search span{display:none}
  .head h2{font-size:21px}
  .kb{grid-template-columns:repeat(5,minmax(170px,1fr))}
}
</style>

function aplicaVisual() {
  const r = document.documentElement;
  // Cor: preset nomeado usa o CSS pronto; hex livre entra por variável.
  const hex = visual.accent_hex;
  if (hex && /^#[0-9a-f]{6}$/i.test(hex)) {
    const n = parseInt(hex.slice(1), 16);
    const R = n >> 16, G = (n >> 8) & 255, B = n & 255;
    const clarear = (c) => Math.round(c + (255 - c) * 0.28);
    // Luminância decide se o texto sobre a cor fica branco ou preto
    const lum = (0.299 * R + 0.587 * G + 0.114 * B) / 255;
    r.style.setProperty('--ac', hex);
    r.style.setProperty('--ac2', `rgb(${clarear(R)},${clarear(G)},${clarear(B)})`);
    r.style.setProperty('--ac-bg', `rgba(${R},${G},${B},.14)`);
    r.style.setProperty('--ac-fg', lum > 0.62 ? '#111318' : '#fff');
  } else {
    ['--ac','--ac2','--ac-bg','--ac-fg'].forEach(v => r.style.removeProperty(v));
    r.dataset.accent = visual.accent || 'orange';
  }
  document.title = `${visual.nome_sistema} · ${visual.subtitulo || 'Gestão'}`;
  const ic = document.querySelector('link[rel=icon]');
  if (ic) ic.href = visual.favicon || visual.logo_clara || 'logo.png';
}

   "918.philipe@gmail.com" vira PH, não 9. */

  if (s.includes('@')) {
    const letras = s.split('@')[0].split(/[^a-zA-ZÀ-ÿ]+/).filter(Boolean);
    if (letras.length) return (letras.length > 1
      ? letras[0][0] + letras[1][0] : letras[0].slice(0, 2)).toUpperCase();

  return s.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

/* Recorta a foto no centro, deixa quadrada e reduz para 256px.
   Assim uma foto de 5 MB do celular vira ~20 KB e cabe no banco sem
   o usuário precisar saber o que é redimensionar. */
function fotoQuadrada(file, lado = 256) {
  return new Promise((ok, erro) => {
    if (!/^image\//.test(file.type)) return erro(new Error('Escolha um arquivo de imagem.'));
    const fr = new FileReader();
    fr.onerror = () => erro(new Error('Não deu para ler o arquivo.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => erro(new Error('Esse arquivo não é uma imagem válida.'));
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = lado;
        const menor = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img,
          (img.width - menor) / 2, (img.height - menor) / 2, menor, menor, 0, 0, lado, lado);
        ok(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function csv(nome, linhas) {
  if (!linhas.length) return toast('Nada para exportar.', { tipo: 'info' });
  const cols = Object.keys(linhas[0]);
  const cel = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const txt = '﻿' + [cols.join(';'), ...linhas.map(l => cols.map(c => cel(l[c])).join(';'))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  a.download = `${nome}-${hoje()}.csv`; a.click(); URL.revokeObjectURL(a.href);
  toast(`${linhas.length} linha(s) exportada(s).`);
}

function modal({ titulo, corpo, ok = 'Salvar', onOk, largura }) {
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `<div class="modal"${largura ? ` style="max-width:${largura}px"` : ''}>
    <div class="mh"><h3>${esc(titulo)}</h3><button class="ib" data-x>${ico('x', 16)}</button></div>
    <div class="mb">${corpo}<div class="err" hidden></div></div>
    <div class="mf"><button class="btn ghost" data-x>Cancelar</button>
      <button class="btn" data-ok>${esc(ok)}</button></div></div>`;
  document.body.appendChild(mask);
  const fecha = () => { mask.remove(); document.removeEventListener('keydown', kd); };
  const kd = e => { if (e.key === 'Escape') fecha(); };
  document.addEventListener('keydown', kd);
  $$('[data-x]', mask).forEach(b => b.onclick = fecha);
  mask.onclick = e => { if (e.target === mask) fecha(); };
  mask.querySelector('[data-ok]').onclick = async () => {
    const b = mask.querySelector('[data-ok]');
    b.disabled = true; b.textContent = 'Salvando…';
    const r = await onOk(mask);
    b.disabled = false; b.textContent = ok;
    if (r !== false) fecha();
  };
  setTimeout(() => mask.querySelector('input,select,textarea')?.focus(), 60);
  return { mask, fecha };
}

function campo(f) {
  const v = f.value ?? '';
  const inner =
    f.type === 'select'   ? `<select data-k="${f.k}">${(f.opts||[]).map(o =>
        `<option value="${esc(o.v)}"${String(o.v) === String(v) ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`
  : f.type === 'textarea' ? `<textarea data-k="${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`
  : f.type === 'checkbox' ? `<div class="chk"><input type="checkbox" data-k="${f.k}"${v ? ' checked' : ''}><label>${esc(f.cap||'Sim')}</label></div>`
  : `<input type="${f.type||'text'}" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.step?` step="${f.step}"`:''}>`;
  return `<div>${f.type === 'checkbox' ? '' : `<label>${esc(f.label)}${f.req ? ' *' : ''}</label>`}
    ${inner}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}

function form(titulo, campos, onSave, ok) {
  return modal({
    titulo, ok, corpo: campos.map(campo).join(''),
    onOk: async mask => {
      const out = {}, erro = mask.querySelector('.err');
      for (const f of campos) {
        const el = mask.querySelector(`[data-k="${f.k}"]`);
        let v = f.type === 'checkbox' ? el.checked : el.value;
        if (typeof v === 'string') v = v.trim();
        if (f.req && (v === '' || v == null)) {
          erro.textContent = `Preencha "${f.label}".`; erro.hidden = false; return false;
        }
        if (v === '') v = null;
        if (f.type === 'number' && v != null) v = Number(v);
        out[f.k] = v;
      }
      erro.hidden = true;
      const r = await onSave(out);
      if (r !== false) { await pinta(); }
      return r;
    }
  });
}

function confirma(titulo, texto, onSim, { perigo = true, palavra } = {}) {
  modal({
    titulo, ok: perigo ? 'Excluir' : 'Confirmar', largura: 420,
    corpo: `<div style="color:var(--txt2);font-size:13.5px;line-height:1.6">${texto}</div>
      ${palavra ? `<div><label>Digite <b>${esc(palavra)}</b> para confirmar</label>
        <input data-w placeholder="${esc(palavra)}"></div>` : ''}`,
    onOk: async mask => {
      if (palavra && mask.querySelector('[data-w]').value.trim() !== palavra) {
        const e = mask.querySelector('.err'); e.textContent = 'Texto não confere.'; e.hidden = false; return false;
      }
      const r = await onSim();
      if (r !== false) await pinta();
      return r;
    }
  });
  setTimeout(() => { const b = $('.mask .btn:not(.ghost)'); if (b && perigo) b.classList.add('danger'); }, 10);
}

/* Tarefa pontual: nasce com prazo de hoje e sem recorrência. É o que
   apareceu agora e não faz parte da rotina — por isso vem separada. */
function formPontual() {
  form('Nova tarefa pontual', [
    { k:'titulo', label:'O que precisa ser feito', req:true, ph:'Ex.: Ligar para o cliente da proposta 42' },
    { k:'descricao', label:'Detalhes', type:'textarea' },
    { k:'prazo', label:'Para quando', type:'date', value:hoje() },
    ...(cache.temHora ? [{ k:'hora', label:'Horário', type:'time',
      hint:'Opcional. Coloca a tarefa na ordem certa do dia.' }] : []),
    { k:'responsavel_id', label:'Responsável', type:'select', value:eu?.id, opts:optUsuarios() },
    { k:'canal_id', label:'Canal', type:'select', opts:optCanais() },
    ...(cache.temTags ? [{ k:'_tags', label:'Tags', ph:'comercial, urgente' }] : []),
    { k:'urgente', type:'checkbox', label:'Urgente', cap:'Urgente — fura a fila' }

    { k:'descricao', label:'Descrição', type:'textarea', value:row?.descricao },

/* ───────────────────────── AÇÕES ───────────────────────── */
const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
const INICIAL_DIA = ['D','S','T','Q','Q','S','S'];
// A semana começa na segunda, como a pessoa pensa a rotina de trabalho
const ORDEM_SEMANA = [1, 2, 3, 4, 5, 6, 0];
const NOME_DIA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

/* Em quais dias da semana esta rotina cai. null = não é semanal
   (mensal), então não entra na visão de semana. */
function diasDaRotina(m) {
  switch (m.recorrencia) {
    case 'diaria':     return [0, 1, 2, 3, 4, 5, 6];
    case 'dias_uteis': return [1, 2, 3, 4, 5];
    case 'semanal':    return (m.recorrencia_dias || []).slice().sort();
    case 'quinzenal':  return m.recorrencia_inicio
      ? [new Date(m.recorrencia_inicio + 'T12:00:00').getDay()] : [];
    default:           return null;   // mensal
  }
}

/* Régua visual da semana: S T Q Q S S D, com os dias de execução
   acesos. Diz num relance o que a palavra "quinzenal" não diz. */
function reguaDias(m) {
  const dias = diasDaRotina(m);
  if (!dias) return `<span class="pill dim">dia ${m.recorrencia_dia_mes} do mês</span>`;
  return `<div class="regua" title="${dias.map(d => DIAS[d]).join(', ')}">
    ${ORDEM_SEMANA.map(d => `<span class="${dias.includes(d) ? 'on' : ''}">${INICIAL_DIA[d]}</span>`).join('')}
  </div>`;
}

R.agenda = {

    ag.forEach(a => { (dias[a.data_hora.slice(0, 10)] ||= []).push(a); });
    const chaves = Object.keys(dias).sort();
    return `<div class="head"><div><h2>Agenda da semana</h2>
        <div class="sub">A ação diz o que fazer. O agendamento diz quando.</div></div>
        <div class="push"><button class="btn" data-act="novo">${ico('plus',15)}Agendar ação</button></div></div>

/* ── tags ─────────────────────────────────────────────────────────
   Texto livre. A cor sai do próprio nome, então a mesma tag tem
   sempre a mesma cor sem ninguém precisar escolher. */
const CORES_TAG = ['#6366f1','#10b981','#f59e0b','#ec4899','#06b6d4','#8b5cf6','#ef4444','#14b8a6'];
function corTag(t) {
  let h = 0;
  for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return CORES_TAG[h % CORES_TAG.length];
}
const leTags = txt => {
  const l = String(txt || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
  return l.length ? [...new Set(l)] : null;
};
const chipsTags = tags => !tags?.length ? '' :
  `<div class="tags">${tags.map(t => {
    const c = corTag(t);
    return `<span style="color:${c};background:${c}22;border-color:${c}44">${esc(t)}</span>`;
  }).join('')}</div>`;

/* ── Check do dia ─────────────────────────────────────────────────
   Onde você marca o que fez e vê o quanto da rotina saiu. O número
   sozinho não serve: por isso vem com os últimos 14 dias do lado,
   que é onde constância aparece. */
R.checkDiario = {
  label: 'Check do dia', curto: 'Check do dia', icone: 'check', titulo: 'Check do dia',
  filtro: { periodo: 'hoje', quem: 'minha', tag: '', natureza: 'tudo' },
  async dados() {
    const de = new Date(Date.now() - 29 * 864e5).toISOString().slice(0, 10);
    return { acoes: await q('acoes', x =>
      x.eq('recorrencia', 'nenhuma').not('prazo', 'is', null).gte('prazo', de).order('prazo')) };
  },
  render({ acoes }) {
    const f = R.checkDiario.filtro;
    if (f.quem === 'minha' && !eu) f.quem = 'todos';

    // Veio de uma rotina recorrente, ou apareceu solta hoje?
    const ehRotina = a => !!a.acao_modelo_id || a.origem === 'recorrencia';

    const meus = acoes.filter(a =>
      (f.quem !== 'minha' || a.responsavel_id === eu?.id) &&
      (!f.tag || (a.tags || []).includes(f.tag)) &&
      (f.natureza === 'tudo' || (f.natureza === 'rotina') === ehRotina(a)) &&
      a.status !== 'cancelada');

    // Intervalo do período escolhido
    const ini = f.periodo === 'hoje' ? hoje()
              : f.periodo === 'semana' ? seg()
              : hoje().slice(0, 8) + '01';
    const fim = f.periodo === 'hoje' ? hoje()
              : f.periodo === 'semana' ? new Date(new Date(seg() + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10)
              : new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).toISOString().slice(0, 10);

    const lista = meus.filter(a => a.prazo >= ini && a.prazo <= fim);
    const feitas = lista.filter(a => a.status === 'concluida');
    const pct = lista.length ? Math.round(100 * feitas.length / lista.length) : null;

    // Últimos 14 dias: constância só aparece na sequência
    const dias14 = [...Array(14)].map((_, i) => {
      const d = new Date(Date.now() - (13 - i) * 864e5).toISOString().slice(0, 10);
      const doDia = meus.filter(a => a.prazo === d);
      const ok = doDia.filter(a => a.status === 'concluida').length;
      return { d, total: doDia.length, ok, pct: doDia.length ? Math.round(100 * ok / doDia.length) : null };
    });

    // Sequência de dias fechados em 100%, contando de trás para frente.
    // Dia sem nenhuma rotina não conta nem a favor nem contra.
    let streak = 0;
    for (let i = dias14.length - 1; i >= 0; i--) {
      if (dias14[i].total === 0) continue;
      if (dias14[i].pct === 100) streak++; else break;
    }

    const tagsUsadas = [...new Set(meus.flatMap(a => a.tags || []))].sort();
    const atrasadas = lista.filter(a => a.status !== 'concluida' && a.prazo < hoje());

    const item = a => {
      const feito = a.status === 'concluida';
      const rot = ehRotina(a);
      return `<div class="chk-item ${rot ? 'rotina' : 'pontual'} ${feito ? 'feito' : ''}">
        <button class="tick ${rot ? '' : 'pt'} ${feito ? 'done' : ''}" data-act="virar" data-id="${a.id}"
          data-v="${feito ? 'aberta' : 'concluida'}">${ico('check', 12)}</button>
        <div class="g">
          <div class="t">${esc(a.titulo)}</div>
          <div class="m">${a.hora ? '<b>' + hm(a.hora) + '</b> · ' : ''}${
            f.periodo !== 'hoje' ? dt(a.prazo) + ' · ' : ''}${
            esc(nomeUser(a.responsavel_id))}${a.canal_id ? ' · ' + esc(nomeCanal(a.canal_id)) : ''}</div>
          ${chipsTags(a.tags)}
        </div>
        ${a.prazo < hoje() && !feito ? '<span class="pill bad">atrasada</span>' : ''}
        ${feito && a.concluida_em ? `<span class="sm2">${hora(a.concluida_em)}</span>` : ''}</div>`;
    };

    // No dia, agrupa por turno; em período maior, agrupa por data
    const grupos = {};
    if (f.periodo === 'hoje') {
      const turno = a => {
        if (!a.hora) return '4. Sem horário';
        const h = +hm(a.hora).slice(0, 2);
        return h < 12 ? '1. Manhã' : h < 18 ? '2. Tarde' : '3. Noite';
      };
      lista.forEach(a => { (grupos[turno(a)] ||= []).push(a); });
      Object.values(grupos).forEach(g => g.sort((a, b) => (a.hora || '99') > (b.hora || '99') ? 1 : -1));
    } else {
      lista.forEach(a => { (grupos[a.prazo] ||= []).push(a); });
    }
    const chaves = Object.keys(grupos).sort().reverse();
    const rotuloGrupo = k => f.periodo === 'hoje' ? k.slice(3)
      : (k === hoje() ? 'Hoje · ' : '') + new Date(k + 'T12:00:00')
          .toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'2-digit' });

    const raio = 52, volta = 2 * Math.PI * raio;

    return `<div class="head"><div><h2>Check do dia</h2>
        <div class="sub">Marque o que saiu. O que importa não é o dia perfeito, é a sequência.</div></div>
        <div class="push">
          <button class="btn ghost" data-act="gerar">${ico('refresh',15)}Gerar rotinas de hoje</button>
          <button class="btn" data-act="nova-rotina">${ico('refresh',15)}Rotina</button>
          <button class="btn pontual" data-act="nova-pontual">${ico('zap',15)}Tarefa pontual</button>
        </div></div>

      <div class="filtros">
        <div class="seg">${[['hoje','Hoje'],['semana','Semana'],['mes','Mês']].map(([v,l]) =>
          `<button data-act="periodo" data-v="${v}" class="${f.periodo===v?'on':''}">${l}</button>`).join('')}</div>
        <div class="seg">${[['minha','Minha'],['todos','Time']].map(([v,l]) =>
          `<button data-act="quem" data-v="${v}" class="${f.quem===v?'on':''}"${
            v==='minha' && !eu ? ' disabled' : ''}>${l}</button>`).join('')}</div>
        <div class="seg">${[['tudo','Tudo'],['rotina','Rotina'],['pontual','Pontual']].map(([v,l]) =>
          `<button data-act="natureza" data-v="${v}" class="${f.natureza===v?'on':''}">${l}</button>`).join('')}</div>
        ${cache.temTags && tagsUsadas.length ? `<div class="tagfiltro">
          <button data-act="tag" data-v="" class="${!f.tag?'on':''}">todas</button>
          ${tagsUsadas.map(t => `<button data-act="tag" data-v="${esc(t)}" class="${f.tag===t?'on':''}"
            style="${f.tag===t?`background:${corTag(t)};border-color:${corTag(t)};color:#fff`:`color:${corTag(t)}`}">${esc(t)}</button>`).join('')}
        </div>` : ''}
      </div>

      <div class="progresso">
        <div class="anel">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="${raio}" class="tr"/>
            <circle cx="60" cy="60" r="${raio}" class="fr ${pct === 100 ? 'cheio' : ''}"
              style="stroke-dasharray:${volta};stroke-dashoffset:${volta * (1 - (pct || 0) / 100)}"/>
          </svg>
          <div class="mid"><div class="p">${pct == null ? '—' : pct + '%'}</div>
            <div class="s">${feitas.length}/${lista.length}</div></div>
        </div>
        <div class="lado">
          <div class="linha"><div><div class="lb">Sequência</div>
            <div class="ds">Dias seguidos fechando 100%</div></div>
            <div class="v ${streak >= 3 ? 'ok' : ''}">${streak}${streak === 1 ? ' dia' : ' dias'}</div></div>
          <div class="linha"><div><div class="lb">Em aberto</div>
            <div class="ds">${atrasadas.length ? atrasadas.length + ' com prazo vencido' : 'nada atrasado'}</div></div>
            <div class="v ${atrasadas.length ? 'bad' : ''}">${lista.length - feitas.length}</div></div>
          <div class="heat">
            <div class="lb" style="margin-bottom:8px">Últimos 14 dias</div>
            <div class="grade">${dias14.map(x => `<span title="${dtl(x.d)} — ${
              x.total ? x.ok + '/' + x.total : 'nada previsto'}"
              class="${x.total === 0 ? 'vazio' : x.pct === 100 ? 'cheio' : x.pct >= 50 ? 'meio' : 'pouco'}"></span>`).join('')}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="ch"><h3>${f.periodo === 'hoje' ? 'A rotina de hoje'
          : f.periodo === 'semana' ? 'Esta semana' : 'Este mês'}</h3>
          <span class="push sm2">${lista.length} item(ns)</span></div>
        <div class="legenda">
          <b><i style="background:var(--ac)"></i> Rotina — se repete</b>
          <b><i style="background:var(--pt)"></i> Pontual — só hoje</b>
          <span style="margin-left:auto">${lista.filter(ehRotina).length} rotina(s) ·
            ${lista.filter(a => !ehRotina(a)).length} pontual(is)</span></div>
        ${lista.length ? chaves.map(k => `
          <div class="grupo">${rotuloGrupo(k)}
            <span>${grupos[k].filter(a => a.status === 'concluida').length}/${grupos[k].length}</span></div>
          ${grupos[k].map(item).join('')}`).join('')
        : vazio('check',
            f.periodo === 'hoje' ? 'Nada previsto para hoje' : 'Nada neste período',
            'Se você tem rotinas cadastradas, clique em "Gerar rotinas de hoje". Se não tem, comece criando uma em Rotina semanal.',
            { act:'gerar', label:'Gerar rotinas de hoje' })}
      </div>`;
  },
  acoes: {
    periodo(b)  { R.checkDiario.filtro.periodo = b.dataset.v; pinta(); },
    quem(b)     { R.checkDiario.filtro.quem = b.dataset.v; pinta(); },
    tag(b)      { R.checkDiario.filtro.tag = b.dataset.v; pinta(); },
    natureza(b) { R.checkDiario.filtro.natureza = b.dataset.v; pinta(); },
    'nova-rotina'()  { R.acoes.acoes.modelo(); },
    'nova-pontual'() { formPontual(); },
    async gerar() {
      const { data, error } = await sb.rpc('gerar_acoes_do_dia');
      if (error) return toast(error.message, { tipo:'bad' });
      toast(data ? `${data} rotina(s) criada(s).` : 'Nenhuma rotina nova para hoje.', { tipo: data ? 'ok' : 'info' });
      pinta();
    },
    async virar(b) {
      const novo = b.dataset.v;
      b.classList.toggle('done', novo === 'concluida');   // resposta imediata
      if (await grava('acoes', { status: novo }, b.dataset.id)) pinta();
      else pinta();
    }
  }
};

/* ── Rotina semanal ───────────────────────────────────────────────
   A semana inteira em sete colunas. É a pergunta "como é a minha
   segunda-feira?" respondida sem precisar abrir cada rotina. */
R.rotinaSemanal = {
  label: 'Rotina semanal', curto: 'Rotina semanal', icone: 'cal', titulo: 'Rotina semanal',
  filtro: { quem: 'minha' },
  async dados() {
    return { modelos: await q('acoes', x => x.neq('recorrencia', 'nenhuma').eq('status', 'aberta')) };
  },
  render({ modelos }) {
    const f = R.rotinaSemanal.filtro;
    if (f.quem === 'minha' && !eu) f.quem = 'todos';
    const meus = f.quem === 'minha' && eu
      ? modelos.filter(m => m.responsavel_id === eu.id) : modelos;

    const hojeDia = new Date().getDay();
    const semanais = meus.filter(m => diasDaRotina(m));
    const mensais  = meus.filter(m => !diasDaRotina(m));

    // Minutos desde a meia-noite; sem hora vai para o fim do dia
    const emMin = h => { if (!h) return 99999;
      const [H, M] = hm(h).split(':').map(Number); return H * 60 + M; };

    const doDia = d => semanais
      .filter(m => diasDaRotina(m).includes(d))
      .sort((a, b) => emMin(a.hora) - emMin(b.hora));

    const cartao = m => `<div class="k" data-act="editar" data-id="${m.id}" style="cursor:pointer">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
        ${m.hora
          ? `<span class="pill ac" style="font-variant-numeric:tabular-nums">${hm(m.hora)}</span>`
          : '<span class="pill dim">sem hora</span>'}
        ${m.recorrencia === 'quinzenal' ? '<span class="pill info">quinzenal</span>' : ''}
      </div>
      <div class="t">${esc(m.titulo)}</div>
      <div class="m">${esc(nomeUser(m.responsavel_id))}${
        m.canal_id ? ' · ' + esc(nomeCanal(m.canal_id)) : ''}</div>
      ${chipsTags(m.tags)}</div>`;

    const carga = ORDEM_SEMANA.map(d => doDia(d).length);
    const pico = Math.max(...carga, 1);
    const maxCarga = Math.max(...carga);
    const diaPico = ORDEM_SEMANA[carga.indexOf(maxCarga)];
    // Só considera os dias úteis: sábado vazio não é desequilíbrio
    const uteis = [1,2,3,4,5].map(d => doDia(d).length);
    const desequilibrio = Math.max(...uteis) - Math.min(...uteis);

    return `<div class="head"><div><h2>Rotina semanal</h2>
        <div class="sub">Sua semana inteira em uma tela. Cada coluna é um dia, em ordem de horário.</div></div>
        <div class="push">
          <div class="seg">${[['minha','Minha rotina'],['todos','Todo o time']].map(([v,l]) =>
            `<button data-act="quem" data-v="${v}" class="${f.quem===v?'on':''}"${
              v==='minha' && !eu ? ' disabled title="Crie seu perfil primeiro"' : ''}>${l}</button>`).join('')}</div>
          <button class="btn" data-act="nova">${ico('plus',15)}Nova rotina</button></div></div>

      ${!cache.temHora ? `<div class="card"><div class="cb"><div class="err" style="display:block">
        O campo de horário ainda não existe no banco — as rotinas aparecem sem hora.
        Para ligar, rode <b>CORRECAO-05.sql</b> (é uma linha só).</div></div></div>` : ''}

      ${semanais.length || mensais.length ? `
        <div class="tiles stg">
          <div class="tile"><div class="ic">${ico('refresh',18)}</div><div class="n">${semanais.length}</div>
            <div class="l">Rotinas na semana</div>
            <div class="h">${semanais.filter(m => m.hora).length} com horário definido</div></div>
          <div class="tile ok"><div class="ic">${ico('clock',18)}</div>
            <div class="n">${doDia(hojeDia).length}</div><div class="l">Para hoje</div>
            <div class="h">${NOME_DIA[hojeDia].toLowerCase()}</div></div>
          <div class="tile ${desequilibrio > 4 ? 'warn' : ''}"><div class="ic">${ico('chart',18)}</div>
            <div class="n" style="font-size:22px">${NOME_DIA[diaPico]}</div>
            <div class="l">Dia mais carregado</div>
            <div class="h">${maxCarga} rotina(s)${desequilibrio > 4 ? ' — semana desequilibrada' : ''}</div></div>
          <div class="tile"><div class="ic">${ico('cal',18)}</div>
            <div class="n">${mensais.length}</div><div class="l">Mensais</div></div>
        </div>

        <div class="semana">${ORDEM_SEMANA.map((d, i) => {
          const lista = doDia(d);
          const nome = NOME_DIA[d];
          return `<div class="col ${d === hojeDia ? 'hoje' : ''} ${d === 0 || d === 6 ? 'fds' : ''}">
            <h4>${nome}${d === hojeDia ? '<span class="agora">hoje</span>' : ''}
              <span>${lista.length}</span></h4>
            <div class="carga"><i style="width:${100 * lista.length / pico}%"></i></div>
            ${lista.length ? lista.map(cartao).join('')
              : `<div class="livre">${d === 0 || d === 6 ? 'folga' : 'dia livre'}</div>`}
          </div>`;
        }).join('')}</div>

        ${mensais.length ? `<div class="card" style="margin-top:20px">
          <div class="ch"><h3>Rotinas mensais</h3>
            <span class="push sm2">não caem num dia fixo da semana</span></div>
          ${mensais.map(m => `<div class="row" data-act="editar" data-id="${m.id}" style="cursor:pointer">
            <span class="pill ac">dia ${m.recorrencia_dia_mes}</span>
            <div class="g"><div class="t">${esc(m.titulo)}</div>
              <div class="m">${esc(nomeUser(m.responsavel_id))}${
                m.canal_id ? ' · ' + esc(nomeCanal(m.canal_id)) : ''}</div></div>
            ${m.hora ? `<span class="pill dim">${hm(m.hora)}</span>` : ''}</div>`).join('')}
        </div>` : ''}`
      : `<div class="card">${vazio('cal',
          f.quem === 'minha' ? 'Sua semana está vazia' : 'Nenhuma rotina cadastrada',
          f.quem === 'minha'
            ? 'Nenhuma rotina recorrente está no seu nome. Crie uma, ou veja a do time inteiro no botão acima.'
            : 'Cadastre o que se repete toda semana e ele aparece aqui, distribuído por dia.',
          { act:'nova', label:'Criar rotina' })}</div>`}`;
  },
  acoes: {
    quem(b) { R.rotinaSemanal.filtro.quem = b.dataset.v; pinta(); },
    nova() { R.acoes.acoes.modelo(); },
    async editar(b) {
      const [m] = await q('acoes', x => x.eq('id', b.dataset.id));
      if (!m) return;
      form(`Rotina · ${m.titulo}`, [
        { k:'titulo', label:'Título', req:true, value:m.titulo },
        ...(cache.temHora ? [{ k:'hora', label:'Horário', type:'time', value:m.hora ? hm(m.hora) : '',
          hint:'Deixe vazio se não tem hora marcada.' }] : []),
        { k:'responsavel_id', label:'Responsável', type:'select', value:m.responsavel_id, opts:optUsuarios() },
        { k:'canal_id', label:'Canal', type:'select', value:m.canal_id, opts:optCanais() },
        { k:'_dias', label:'Dias da semana', value:(diasDaRotina(m) || []).join(','),
          hint:'0=dom, 1=seg … 6=sáb. Muda a rotina para semanal nesses dias.' }
      ], d => {
        const dias = String(d._dias || '').split(',').map(x => parseInt(x, 10))
          .filter(n => n >= 0 && n <= 6);
        delete d._dias;
        if (dias.length) {
          // 5 dias úteis ou 7 dias têm recorrência própria, mais legível
          const util = [1,2,3,4,5].every(x => dias.includes(x)) && dias.length === 5;
          const todos = dias.length === 7;
          d.recorrencia = todos ? 'diaria' : util ? 'dias_uteis' : 'semanal';
          d.recorrencia_dias = d.recorrencia === 'semanal' ? dias : null;
        }
        return grava('acoes', d, m.id);
      });
    }
  }
};

/* ── Rotinas do time ──────────────────────────────────────────────
   Mesmas rotinas da tela de Ações, mas olhadas pela ótica de quem
   executa: quem carrega o quê e quem está cumprindo. */
R.rotinasTime = {
  label: 'Rotinas do time', curto: 'Rotinas do time', icone: 'refresh', titulo: 'Rotinas do time',
  async dados() {
    const desde = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
    const [modelos, ocor] = await Promise.all([
      q('acoes', x => x.neq('recorrencia', 'nenhuma').order('titulo')),
      q('acoes', x => x.not('acao_modelo_id', 'is', null).gte('prazo', desde))
    ]);
    return { modelos, ocor };
  },
  render({ modelos, ocor }) {
    const porModelo = {};
    ocor.forEach(o => {
      const m = (porModelo[o.acao_modelo_id] ||= { total: 0, feitas: 0 });
      m.total++; if (o.status === 'concluida') m.feitas++;
    });

    const rec = m => m.recorrencia === 'semanal'
        ? (m.recorrencia_dias || []).map(d => DIAS[d]).join(', ')
      : m.recorrencia === 'mensal'    ? `dia ${m.recorrencia_dia_mes}`
      : m.recorrencia === 'quinzenal' ? 'a cada 14 dias'
      : m.recorrencia.replace('_', ' ');

    // Agrupa por pessoa; quem não tem dono cai em "Sem responsável"
    const grupos = {};
    modelos.forEach(m => { (grupos[m.responsavel_id || 'sem'] ||= []).push(m); });

    const geral = Object.values(porModelo).reduce((a, x) =>
      ({ t: a.t + x.total, f: a.f + x.feitas }), { t: 0, f: 0 });
    const pctGeral = geral.t ? Math.round(100 * geral.f / geral.t) : null;

    const bloco = (chave, lista) => {
      const u = cache.usuarios.find(x => x.id === chave);
      const soma = lista.reduce((a, m) => {
        const p = porModelo[m.id] || { total:0, feitas:0 };
        return { t: a.t + p.total, f: a.f + p.feitas };
      }, { t:0, f:0 });
      const pct = soma.t ? Math.round(100 * soma.f / soma.t) : null;
      const cls = pct == null ? '' : pct >= 80 ? 'ok' : pct >= 50 ? 'warn' : 'bad';

      return `<div class="card"><div class="ch">
          ${u ? avatar(u, 30) : `<div class="av" style="width:30px;height:30px">?</div>`}
          <div><h3>${esc(u?.nome || 'Sem responsável')}</h3>
            <div class="sm2">${esc(u?.cargo || 'ninguém assumiu estas rotinas')}</div></div>
          <div class="push" style="align-items:center">
            <span class="sm2">${lista.length} rotina(s)</span>
            ${pct == null ? '<span class="pill dim">sem histórico</span>' : `
              <div style="text-align:right"><div class="bar" style="width:110px">
                <i class="${cls}" style="width:${pct}%"></i></div>
                <div class="sm2" style="margin-top:3px">${pct}% cumprida (30d)</div></div>`}
          </div></div>
        <div class="t-scroll"><table><thead><tr>
          <th>Rotina</th><th>Dias</th><th>Canal</th><th class="num">Geradas</th>

            <div class="l">Rotinas ativas</div></div>

            <div class="l">Cumprimento geral</div><div class="h">${geral.f} de ${geral.t} ocorrências</div></div>

            <div class="n">${grupos.sem?.length || 0}</div><div class="l">Sem responsável</div></div>

          { act:'nova', label:'Criar rotina' })}</div>`}`;

  acoes: {

    async dono(b) {

};

/* ── Horários ─────────────────────────────────────────────────────
   Escala semanal. Dia sem linha no banco = folga. */
const SEMANA = [[1,'Segunda'],[2,'Terça'],[3,'Quarta'],[4,'Quinta'],[5,'Sexta'],[6,'Sábado'],[0,'Domingo']];
const hm = t => (t || '').slice(0, 5);
const minutosDia = h => {
  const [a, b] = [hm(h.entrada), hm(h.saida)].map(x => {
    const [H, M] = x.split(':').map(Number); return H * 60 + M;
  });
  return Math.max(0, b - a - (h.intervalo_min || 0));
};
const hhmm = min => `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}`;

R.horarios = {
  label: 'Horários', curto: 'Horários', icone: 'clock', titulo: 'Horários do time',
  async dados() { return { hs: await q('horarios') }; },
  render({ hs }) {
    const pessoas = cache.usuarios.filter(u => u.ativo);
    const mapa = {};
    hs.forEach(h => { (mapa[h.usuario_id] ||= {})[h.dia_semana] = h; });

    const agora = new Date();
    const hojeDia = agora.getDay();
    const minAgora = agora.getHours() * 60 + agora.getMinutes();
    const trabalhando = p => {
      const h = mapa[p.id]?.[hojeDia]; if (!h) return false;
      const [ini, fim] = [hm(h.entrada), hm(h.saida)].map(x => {
        const [H, M] = x.split(':').map(Number); return H * 60 + M; });
      return minAgora >= ini && minAgora <= fim;
    };
    const emExpediente = pessoas.filter(trabalhando);

    return `<div class="head"><div><h2>Horários do time</h2>
        <div class="sub">Escala da semana. Dia em branco é folga.</div></div>
        <div class="push">
          <button class="btn ghost" data-act="csv">${ico('down',15)}CSV</button>
          <button class="btn" data-act="def">${ico('clock',15)}Definir horário</button></div></div>

      ${pessoas.length ? `
      <div class="tiles stg">
        <div class="tile ok"><div class="ic">${ico('users',18)}</div><div class="n">${emExpediente.length}</div>
          <div class="l">Em expediente agora</div>
          <div class="h">${emExpediente.map(p => p.nome.split(' ')[0]).join(', ') || 'ninguém'}</div></div>
        <div class="tile"><div class="ic">${ico('clock',18)}</div>
          <div class="n">${hhmm(pessoas.reduce((a, p) =>
            a + Object.values(mapa[p.id] || {}).reduce((x, h) => x + minutosDia(h), 0), 0))}</div>
          <div class="l">Carga total da semana</div></div>
        <div class="tile ${pessoas.some(p => !mapa[p.id]) ? 'warn' : ''}"><div class="ic">${ico('alert',18)}</div>
          <div class="n">${pessoas.filter(p => !mapa[p.id]).length}</div>
          <div class="l">Sem horário definido</div></div>
      </div>

      <div class="card"><div class="ch"><h3>Escala semanal</h3></div>
        <div class="t-scroll"><table><thead><tr><th>Pessoa</th>
          ${SEMANA.map(([d, n]) => `<th${d === hojeDia ? ' style="color:var(--ac)"' : ''}>${n}</th>`).join('')}
          <th class="num">Semana</th><th></th></tr></thead>
        <tbody>${pessoas.map(p => {
          const dias = mapa[p.id] || {};
          const total = Object.values(dias).reduce((a, h) => a + minutosDia(h), 0);
          return `<tr>
            <td><div style="display:flex;align-items:center;gap:10px">${avatar(p, 28)}
              <div><b>${esc(p.nome)}</b><div class="sm2">${esc(p.cargo || '—')}</div></div></div></td>
            ${SEMANA.map(([d]) => {
              const h = dias[d];
              return `<td class="mut" style="white-space:nowrap${d === hojeDia ? ';background:var(--ac-bg)' : ''}">${
                h ? `<b style="color:var(--txt)">${hm(h.entrada)}–${hm(h.saida)}</b>${
                  h.intervalo_min ? `<div class="sm2">${h.intervalo_min}min almoço</div>` : ''}`
                  : '<span style="opacity:.4">folga</span>'}</td>`;
            }).join('')}
            <td class="num"><b>${total ? hhmm(total) : '—'}</b></td>
            <td class="act"><button class="btn sm ghost" data-act="edit" data-id="${p.id}">${ico('edit',13)}</button></td>
          </tr>`;
        }).join('')}</tbody></table></div></div>`
      : `<div class="card">${vazio('users', 'Time vazio',
          'Cadastre as pessoas em Configurações → Time e canais para montar a escala.')}</div>`}`;
  },
  acoes: {
    def: () => formHorario(),
    edit(b) { formHorario(b.dataset.id); },
    async csv() {
      const hs = await q('horarios');
      csv('horarios', hs.map(h => ({
        pessoa: nomeUser(h.usuario_id),
        dia: SEMANA.find(([d]) => d === h.dia_semana)?.[1] || h.dia_semana,
        entrada: hm(h.entrada), saida: hm(h.saida),
        intervalo_min: h.intervalo_min, horas_liquidas: hhmm(minutosDia(h))
      })));
    }
  }
};

async function formHorario(usuarioId) {
  const atuais = usuarioId ? await q('horarios', x => x.eq('usuario_id', usuarioId)) : [];
  const base = atuais[0];
  form('Definir horário', [
    { k:'usuario_id', label:'Pessoa', type:'select', req:true, value:usuarioId,
      opts:cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome })) },
    { k:'_dias', label:'Dias de trabalho', req:true,
      value: atuais.length ? atuais.map(h => h.dia_semana).sort().join(',') : '1,2,3,4,5',
      hint:'0=dom, 1=seg … 6=sáb, separados por vírgula. Os dias que você NÃO listar viram folga.' },
    { k:'entrada', label:'Entrada', type:'time', req:true, value: base ? hm(base.entrada) : '08:00' },
    { k:'saida', label:'Saída', type:'time', req:true, value: base ? hm(base.saida) : '18:00' },
    { k:'intervalo_min', label:'Intervalo (minutos)', type:'number', value: base?.intervalo_min ?? 60,
      hint:'Descontado do total de horas da semana.' },
    { k:'observacao', label:'Observação', value: base?.observacao }
  ], async d => {
    const dias = String(d._dias || '').split(',').map(s => parseInt(s, 10))
      .filter(n => n >= 0 && n <= 6);
    if (!dias.length) { toast('Informe ao menos um dia.', { tipo:'bad' }); return false; }
    if (d.saida <= d.entrada) { toast('A saída precisa ser depois da entrada.', { tipo:'bad' }); return false; }
    // Regrava a semana inteira: o que não foi listado deixa de existir.
    await sb.from('horarios').delete().eq('usuario_id', d.usuario_id);
    const { error } = await sb.from('horarios').insert(dias.map(dia => ({
      usuario_id: d.usuario_id, dia_semana: dia, entrada: d.entrada, saida: d.saida,
      intervalo_min: d.intervalo_min ?? 0, observacao: d.observacao
    })));
    if (error) { toast(error.message, { tipo:'bad' }); return false; }
    toast('Horário salvo.');
    return true;
  });
}

/* ── PDI ──────────────────────────────────────────────────────────
   Ciclos de um mês com prova binária e recompensa. */
R.pdi = {
  label: 'PDI', curto: 'PDI', icone: 'star', titulo: 'PDI e feedback',
  async dados() {
    const [ciclos, fbs] = await Promise.all([
      q('pdi', x => x.order('ciclo_inicio', { ascending: false })),
      q('feedbacks', x => x.order('data', { ascending: false }).limit(60))
    ]);
    return { ciclos, fbs };
  },
  render({ ciclos, fbs }) {
    const pessoas = cache.usuarios.filter(u => u.ativo);
    const atual = {}, historico = {};
    ciclos.forEach(c => {
      if (c.status === 'em_andamento' && !atual[c.usuario_id]) atual[c.usuario_id] = c;
      else (historico[c.usuario_id] ||= []).push(c);

    fbs.forEach(f => { if (!ultimoFb[f.usuario_id]) ultimoFb[f.usuario_id] = f; });

    const cartao = p => {
      const c = atual[p.id];
      const dias = c ? Math.ceil((new Date(c.ciclo_fim + 'T12:00:00') - new Date()) / 864e5) : null;
      const fb = ultimoFb[p.id];
      const diasFb = fb ? Math.floor((new Date() - new Date(fb.data + 'T12:00:00')) / 864e5) : null;
      return `<div class="card" style="margin:0">
        <div class="ch">${avatar(p, 34)}
          <div style="flex:1;min-width:0"><h3>${esc(p.nome)}</h3>
            <div class="sm2">${esc(p.cargo || '—')}</div></div>
          ${c ? (dias < 0 ? '<span class="pill bad">ciclo vencido</span>'
                : dias <= 7 ? `<span class="pill warn">${dias}d para o fim</span>`
                : `<span class="pill info">${dias} dias</span>`)
              : '<span class="pill dim">sem ciclo</span>'}</div>
        <div class="cb">
          ${c ? `
            <div style="margin-bottom:14px"><div class="sm2">Objetivo do ciclo</div>
              <div style="font-weight:600;margin-top:2px">${esc(c.objetivo)}</div></div>
            ${c.marco_atual ? `<div style="margin-bottom:14px"><div class="sm2">Marco atual</div>
              <div style="margin-top:2px">${esc(c.marco_atual)}</div></div>` : ''}
            ${c.prova ? `<div style="margin-bottom:14px;padding:11px 13px;background:var(--surface2);
                border-radius:var(--r);border-left:3px solid var(--ac)">
              <div class="sm2">Prova de aprovação</div>
              <div style="margin-top:2px">${esc(c.prova)}</div>
              ${c.recompensa ? `<div class="sm2" style="margin-top:7px">🎁 ${esc(c.recompensa)}</div>` : ''}</div>` : ''}
            <div class="sm2" style="margin-bottom:14px">Ciclo ${dtl(c.ciclo_inicio)} → ${dtl(c.ciclo_fim)}</div>
            <div style="display:flex;gap:7px;flex-wrap:wrap">
              <button class="btn sm" data-act="aprovar" data-id="${c.id}" data-n="${esc(p.nome)}">Aprovar</button>
              <button class="btn sm ghost" data-act="reprovar" data-id="${c.id}" data-n="${esc(p.nome)}">Não passou</button>
              <button class="btn sm ghost" data-act="marco" data-id="${c.id}">Atualizar marco</button>
            </div>`
          : `<p class="sm2" style="margin-bottom:14px">Sem ciclo em andamento.
              Um ciclo é um mês, com uma prova objetiva no fim.</p>
             <button class="btn sm" data-act="novo" data-u="${p.id}">${ico('plus',13)}Abrir ciclo</button>`}

          <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
                      display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <div style="flex:1"><div class="sm2">Último feedback</div>
              <div style="font-size:13px">${fb
                ? `${dtl(fb.data)} <span class="pill ${diasFb > 30 ? 'bad' : diasFb > 15 ? 'warn' : 'ok'}">${diasFb}d</span>`
                : '<span class="pill bad">nunca</span>'}</div></div>
            <button class="btn sm ghost" data-act="fb" data-u="${p.id}">Registrar</button>
          </div>
          ${historico[p.id]?.length ? `<div class="sm2" style="margin-top:12px">
            Ciclos anteriores: ${historico[p.id].slice(0,4).map(h =>
              `<span class="pill ${h.status==='aprovado'?'ok':h.status==='reprovado'?'bad':'dim'}"
                title="${esc(h.objetivo)}">${dt(h.ciclo_fim)}</span>`).join(' ')}</div>` : ''}
        </div></div>`;
    };

    const semCiclo = pessoas.filter(p => !atual[p.id]).length;
    const vencidos = pessoas.filter(p => atual[p.id] &&
      new Date(atual[p.id].ciclo_fim + 'T12:00:00') < new Date()).length;

    return `<div class="head"><div><h2>PDI e feedback</h2>
        <div class="sub">Ciclos de um mês, com prova binária e recompensa. Passou ou não passou.</div></div>
        <div class="push"><button class="btn" data-act="novo">${ico('plus',15)}Novo ciclo</button></div></div>
      ${pessoas.length ? `
        <div class="tiles stg">
          <div class="tile"><div class="ic">${ico('users',18)}</div><div class="n">${pessoas.length}</div>
            <div class="l">Pessoas ativas</div></div>
          <div class="tile ${semCiclo ? 'warn' : 'ok'}"><div class="ic">${ico('star',18)}</div>
            <div class="n">${pessoas.length - semCiclo}</div><div class="l">Com ciclo em andamento</div></div>
