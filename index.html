function modal({ titulo, corpo, ok = 'Salvar', onOk, largura }) {
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `<div class="modal"${largura ? ` style="max-width:${largura}px"` : ''}>
    <div class="mh"><h3>${esc(titulo)}</h3><button class="ib" data-x>${ico('x', 16)}</button></div>
    <div class="mb">${corpo}<div class="err" hidden></div></div>
    <div class="mf"><button class="btn ghost" data-x>Cancelar</button>
      <button class="btn" data-ok>${esc(ok)}</button></div></div>`;
  document.body.appendChild(mask);
  const fecha = () => { mask.remove(); document.removeEventListener('keydown', kd); };
  const kd = e => { if (e.key === 'Escape') fecha(); };
  document.addEventListener('keydown', kd);
  $$('[data-x]', mask).forEach(b => b.onclick = fecha);
  mask.onclick = e => { if (e.target === mask) fecha(); };
  mask.querySelector('[data-ok]').onclick = async () => {
    const b = mask.querySelector('[data-ok]');
    b.disabled = true; b.textContent = 'Salvando…';
    const r = await onOk(mask);
    b.disabled = false; b.textContent = ok;
    if (r !== false) fecha();
  };
  setTimeout(() => mask.querySelector('input,select,textarea')?.focus(), 60);
  return { mask, fecha };
}

function campo(f) {
  const v = f.value ?? '';
  const inner =
    f.type === 'select'   ? `<select data-k="${f.k}">${(f.opts||[]).map(o =>
        `<option value="${esc(o.v)}"${String(o.v) === String(v) ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}</select>`
  : f.type === 'textarea' ? `<textarea data-k="${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`
  : f.type === 'checkbox' ? `<div class="chk"><input type="checkbox" data-k="${f.k}"${v ? ' checked' : ''}><label>${esc(f.cap||'Sim')}</label></div>`
  : `<input type="${f.type||'text'}" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.step?` step="${f.step}"`:''}>`;
  return `<div>${f.type === 'checkbox' ? '' : `<label>${esc(f.label)}${f.req ? ' *' : ''}</label>`}
    ${inner}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}

function form(titulo, campos, onSave, ok) {
  return modal({
    titulo, ok, corpo: campos.map(campo).join(''),
    onOk: async mask => {
      const out = {}, erro = mask.querySelector('.err');
      for (const f of campos) {
        const el = mask.querySelector(`[data-k="${f.k}"]`);
        let v = f.type === 'checkbox' ? el.checked : el.value;
        if (typeof v === 'string') v = v.trim();
        if (f.req && (v === '' || v == null)) {
          erro.textContent = `Preencha "${f.label}".`; erro.hidden = false; return false;
        }
        if (v === '') v = null;
        if (f.type === 'number' && v != null) v = Number(v);
        out[f.k] = v;
      }
      erro.hidden = true;
      const r = await onSave(out);
      if (r !== false) { await pinta(); }
      return r;
    }
  });
}

function confirma(titulo, texto, onSim, { perigo = true, palavra } = {}) {
  modal({
    titulo, ok: perigo ? 'Excluir' : 'Confirmar', largura: 420,
    corpo: `<div style="color:var(--txt2);font-size:13.5px;line-height:1.6">${texto}</div>
      ${palavra ? `<div><label>Digite <b>${esc(palavra)}</b> para confirmar</label>
        <input data-w placeholder="${esc(palavra)}"></div>` : ''}`,
    onOk: async mask => {
      if (palavra && mask.querySelector('[data-w]').value.trim() !== palavra) {
        const e = mask.querySelector('.err'); e.textContent = 'Texto não confere.'; e.hidden = false; return false;
      }
      const r = await onSim();
      if (r !== false) await pinta();
      return r;
    }
  });
  setTimeout(() => { const b = $('.mask .btn:not(.ghost)'); if (b && perigo) b.classList.add('danger'); }, 10);
}

/* ── os dois modos ────────────────────────────────────────────────
   Empresa e Pessoal não são duas seções da mesma lista: são dois
   menus. O botão no rodapé da barra troca de um para o outro.
   O motivo de separar em vez de empilhar: o Pessoal é privado (RLS
   por dono, ver sql/CORRECAO-12.sql) e misturá-lo com as telas do
   time convida ao engano de achar que alguém mais está vendo. */
const NAV_PESSOAL = [
  { tipo:'secao', label:'Financeiro',
    itens:['finPainel', 'finLancamentos', 'finImportar', 'finCategorias'] }
];
const MODOS = {
  empresa: { nome:'Empresa',  desc:'Comercial, marketing e time', icone:'users',
             nav:NAV_EMPRESA, inicio:'inicio' },
  pessoal: { nome:'Pessoal',  desc:'Só você enxerga',             icone:'user',
             nav:NAV_PESSOAL, inicio:'finPainel' }
};
if (!MODOS[pref.modo]) pref.modo = 'empresa';

/* Em que modo mora cada rota. Serve para o Ctrl+K, os atalhos e o
   link colado por alguém caírem no menu certo em vez de abrir a
   tela com a barra lateral errada do lado. */
const ROTAS_PESSOAIS = new Set(NAV_PESSOAL.flatMap(s => s.itens));
const modoDaRota = r => ROTAS_PESSOAIS.has(r) ? 'pessoal' : 'empresa';

/* ── acesso por módulo (correção 16) ──────────────────────────────
   O sistema é modular: cada pessoa enxerga só as telas da lista
   `usuarios.modulos` (nulo = todas). O admin ignora a lista — é quem
   monta o acesso dos outros. Antes da correção 16 rodar no banco,
   nada muda: todo mundo continua vendo tudo.

   Isto é trava de interface, não de dado: o RLS por trás continua
   `tem_acesso()`. Serve para cada pessoa abrir o sistema e ver só o
   que é dela — não para esconder segredo de quem sabe usar a API. */
const ehAdmin = () => !cache.temAcesso || !eu || eu.papel === 'admin';

/* Início e Configurações nunca somem: é onde a pessoa edita o próprio
   perfil e troca a senha. O Pessoal (financeiro) é privado por dono
   via RLS — não faz sentido um admin "conceder" o que já é da pessoa. */
const ROTAS_LIVRES = new Set(['inicio', 'config']);
function podeVer(r) {
  if (ROTAS_LIVRES.has(r) || ROTAS_PESSOAIS.has(r)) return true;
  if (ehAdmin()) return true;
  return eu.modulos == null ? true : eu.modulos.includes(r);
}

/* O catálogo que a tela de acesso mostra. Uma rota que aparece em dois
   grupos do menu (ações, campanhas…) é UM módulo só — liberar libera
   nas duas áreas. */
const CATALOGO_MODULOS = [
  { grupo:'Comercial e Marketing', itens:['canais','agenda','dicionario','campanhas','producao'] },
  { grupo:'Onboarding', itens:['onbTrilhas','onbMinha','onbAcompanhar','treinamentos'] },
  { grupo:'Desenvolvimento', itens:['pdi','feedbacks'] },
  { grupo:'Gestão', itens:['horarios','rotinaSemanal','anotacoes','time'] }
];

const AREAS = { comercial:'Comercial', marketing:'Marketing' };

/* ── filtro por área ───────────────────────────────────────────────
   As telas base trazem canal_id; as views trazem o nome do canal.
   Por isso os dois filtros. */
function canaisDaArea() {
  if (!area) return null;
  return cache.canais.filter(c => c.area === area || c.area === 'ambos' || !c.area);
}
function porCanalId(linhas) {
  const cs = canaisDaArea(); if (!cs) return linhas;
  const ids = new Set(cs.map(c => c.id));
  return linhas.filter(l => !l.canal_id || ids.has(l.canal_id));
}
function porCanalNome(linhas) {
  const cs = canaisDaArea(); if (!cs) return linhas;
  const nomes = new Set(cs.map(c => c.nome));
  return linhas.filter(l => !l.canal || nomes.has(l.canal));
}

const vazio = (icone, titulo, texto, botao) => `<div class="empty">
  <div class="ic">${ico(icone, 22)}</div><h4>${esc(titulo)}</h4><p>${esc(texto)}</p>
  ${botao ? `<button class="btn" data-act="${botao.act}">${ico('plus',15)}${esc(botao.label)}</button>` : ''}</div>`;

/* ── Aviso de tabela faltando ─────────────────────────────────────
   Uma tela nova depende de tabela que só existe depois de alguém
   rodar o SQL. Em vez de quebrar com erro do PostgREST, ela mostra
   isto — com os dois links que economizam a procura: o SQL Editor
   já apontado para o projeto certo (o ref sai do próprio config.js,
   então isto funciona em qualquer projeto) e o arquivo para copiar. */
const REPO_SQL_ARQ = 'sql/vendedores-01-dicionario.sql';
const REPO_RAW = 'https://raw.githubusercontent.com/phill-jr/masterinfo-gestao/main/';

/* `oQueFalta` é frase completa, para concordar em número. `arquivo` é o
   .sql que resolve — cada tela nova aponta para o seu, senão o link
   manda a pessoa rodar o script de outro módulo. */
function avisoSql(oQueFalta, arquivo = REPO_SQL_ARQ) {
  let editor = 'https://supabase.com/dashboard/projects';
  try {
    const ref = new URL(window.MI_CONFIG.url).hostname.split('.')[0];
    if (ref) editor = `https://supabase.com/dashboard/project/${ref}/sql/new`;
  } catch {}
  return `<div class="card"><div class="cb">
    <div class="err" style="display:block">${oQueFalta}</div>
    <p style="color:var(--txt2);font-size:13.5px;line-height:1.6;margin:12px 0">
      Falta rodar o SQL desta tela — uma vez só.
      Abra o SQL Editor, cole o arquivo inteiro, clique em <b>Run</b> e recarregue aqui.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn" href="${editor}" target="_blank" rel="noopener">${ico('db',15)}Abrir o SQL Editor</a>
      <a class="btn ghost" href="${REPO_RAW + arquivo}" target="_blank" rel="noopener">${ico('copy',15)}Abrir o SQL para copiar</a>
    </div>
    <div class="sm2" style="margin-top:10px">Arquivo: <b>${esc(arquivo)}</b> — pode ser rodado de novo sem duplicar nada.</div>
  </div></div>`;
}

/* ───────────────────────── INÍCIO ───────────────────────── */
/* O Início voltou a ser painel (24/08): a barra lateral fica sempre
   visível — os módulos moram nela — e a página abre com o que decide
   a manhã: os destaques, a semana e a fila de prioridades. */
R.inicio = {
  label: 'Início', icone: 'grid', titulo: 'Início',
  async dados() {
    const segunda = seg();
    const fimSem = new Date(new Date(segunda + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10);
    const [kpi, fila, semana, pends] = await Promise.all([
      q('v_dashboard_dia'),
      q('v_acoes_hoje'),
      q('acoes', x => x.eq('recorrencia', 'nenhuma').not('prazo', 'is', null)
        .gte('prazo', segunda).lte('prazo', fimSem)),
      cache.temSemana
        ? q('acoes', x => x.eq('recorrencia', 'nenhuma').eq('semana_de', segunda))
        : Promise.resolve([])
    ]);
    return { k: kpi[0] || {}, fila: porCanalNome(fila), semana, pends: pends || [], segunda, fimSem };
  },
  render({ k, fila, semana, pends, segunda, fimSem }) {
    const tile = (icone, n, l, cls = '') => `<div class="tile ${Number(n) > 0 ? cls : ''}">
      <div class="ic">${ico(icone, 18)}</div><div class="n">${n ?? 0}</div>
      <div class="l">${l}</div></div>`;

    /* Régua da semana: um quadrado por dia, com o que ainda está
       aberto e o que já saiu. Clicar cai na visão Semana. */
    const dias = ORDEM_SEMANA.map((_, i) => {
      const d = new Date(new Date(segunda + 'T12:00:00').getTime() + i * 864e5);
      const iso = d.toISOString().slice(0, 10);
      const doDia = semana.filter(a => a.prazo === iso && a.status !== 'cancelada');
      const abertas = doDia.filter(a => a.status === 'aberta' || a.status === 'em_andamento').length;
      const feitas = doDia.filter(a => a.status === 'concluida').length;
      return `<button class="d ${iso === hoje() ? 'on' : ''}" data-act="ir-semana">
        <b>${DIAS[d.getDay()]}</b><span class="dd">${dt(iso)}</span>
        <span class="n ${abertas ? '' : feitas ? 'ok' : 'dim'}">${
          abertas ? abertas + ' aberta' + (abertas > 1 ? 's' : '')
          : feitas ? '✓ ' + feitas + ' feita' + (feitas > 1 ? 's' : '') : '—'}</span></button>`;
    }).join('');

    const pendsVivas = pends.filter(a => a.status === 'aberta' || a.status === 'em_andamento');
    const pendsFeitas = pends.filter(a => a.status === 'concluida').length;
    const nomeDe = id => cache.usuarios.find(u => u.id === id)?.nome || '';

    const pendHtml = !cache.temSemana ? '' : `
      <div class="ch" style="border-top:1px solid var(--line)"><h3>Pendências da semana</h3>
        <div class="push">${pendsFeitas ? `<span class="pill ok">${pendsFeitas} concluída${pendsFeitas > 1 ? 's' : ''}</span>` : ''}
          <button class="btn sm ghost" data-act="nova-pendencia">${ico('plus',13)}Pendência</button></div></div>
      ${pendsVivas.length ? pendsVivas.map(p => `<div class="row" data-id="${p.id}">
          <button class="tick" data-act="concluir" data-id="${p.id}" title="Concluir">${ico('check', 12)}</button>
          <div class="g"><div class="t">${esc(p.titulo)}</div>
            <div class="m">até domingo${nomeDe(p.responsavel_id) ? ' · ' + esc(nomeDe(p.responsavel_id)) : ''}</div></div>
          ${p.urgente ? `<span class="pill ac">${ico('star',11)} urgente</span>` : ''}
          <button class="ib" data-act="editar" data-id="${p.id}" title="Editar">${ico('edit', 15)}</button></div>`).join('')
        : `<div class="sm2" style="padding:12px 18px">Nenhuma pendência pendurada nesta semana.</div>`}`;

    const ehRot = a => a.origem === 'recorrencia';
    const item = a => `<div class="row ${ehRot(a) ? 'rotina' : 'pontual'}" data-id="${a.id}">
      <button class="tick ${ehRot(a) ? '' : 'pt'}" data-act="concluir" data-id="${a.id}" title="Concluir">${ico('check', 12)}</button>
      <div class="g"><div class="t">${esc(a.titulo)}</div>
        <div class="m">${esc(a.canal || 'Sem canal')}${a.responsavel ? ' · ' + esc(a.responsavel) : ''}${
          a.travando ? ` · <span style="color:var(--info)">travando ${esc(a.travando)}</span>` : ''}</div></div>
      ${a.prioridade === 'atrasada' ? `<span class="pill bad">${ico('alert',11)} ${a.dias_de_atraso}d atrasada</span>`
        : a.prioridade === 'urgente' ? `<span class="pill ac">${ico('star',11)} urgente</span>`
        : a.prioridade === 'hoje'    ? '<span class="pill warn">hoje</span>'
        : a.prioridade === 'destrava'? '<span class="pill info">destrava o time</span>'
        : `<span class="pill dim">${dt(a.prazo)}</span>`}
      <button class="ib" data-act="editar" data-id="${a.id}" title="Editar">${ico('edit', 15)}</button></div>`;

    return `<div class="head">
        <div><h2>${saudacao()}${eu?.nome ? ', ' + esc(eu.nome.split(' ')[0]) : ''} 👋</h2>
          <div class="sub">${dataExtenso()}</div></div>
        <div class="push">
          <button class="btn ghost" data-act="gerar">${ico('refresh',15)}Gerar hoje</button>
          <button class="btn ghost" data-act="gerar-semana">${ico('cal',15)}Gerar a semana</button>
          <button class="btn" data-act="nova-rotina">${ico('refresh',15)}Rotina</button>
          <button class="btn pontual" data-act="nova">${ico('zap',15)}Tarefa pontual</button></div></div>

      <div class="tiles stg">
        ${tile('star',  k.acoes_urgentes,      'Urgentes', 'bad')}
        ${tile('alert', k.acoes_atrasadas,     'Atrasadas', 'bad')}
        ${tile('clock', k.acoes_hoje,          'Vencem hoje', 'warn')}
        ${tile('users', k.pendencias_travando, 'Travando o time', 'warn')}
        ${tile('cal',   k.compromissos_hoje,   'Compromissos hoje')}
        ${tile('target',k.campanhas_ativas,    'Campanhas ativas')}
        ${tile('film',  k.conteudo_atrasado,   'Conteúdo atrasado', 'warn')}
        ${tile('chart', k.metas_atrasadas,     'Metas atrasadas', 'bad')}
      </div>

      <div class="card"><div class="ch"><h3>A semana</h3>
        <div class="push"><span class="sm2">${dt(segunda)} a ${dt(fimSem)}</span>
          <button class="btn sm ghost" data-act="ir-semana">${ico('grid',13)}Abrir a semana</button></div></div>
        <div class="ini-sem">${dias}</div>
        ${pendHtml}
      </div>

      <div class="card"><div class="ch"><h3>Prioridades</h3>
        <div class="push"><span class="sm2">${fila.length} em aberto</span>
          <button class="btn sm ghost" data-act="csv">${ico('down',13)}CSV</button></div></div>
        ${fila.length ? fila.map(item).join('')
          : vazio('check', 'Fila limpa', 'Nada em aberto para hoje. Se isso parece bom demais, clique em "Gerar hoje".',
                  { act: 'nova', label: 'Nova ação' })}</div>`;
  },
  acoes: {
    'ir-semana'() { vai('rotinaSemanal'); },
    'nova-pendencia'() { formPendencia(); },
    async gerar() {
      const { data, error } = await sb.rpc('gerar_acoes_do_dia');
      if (error) return toast(error.message, { tipo: 'bad' });
      toast(data ? `${data} tarefa(s) criada(s) para hoje.` : 'Hoje já estava gerado.',
        { tipo: data ? 'ok' : 'info' });
      pinta();
    },
    async 'gerar-semana'() {
      const de = seg();
      const ate = new Date(new Date(de + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10);
      const { data, error } = await sb.rpc('gerar_acoes_do_periodo', { p_de: de, p_ate: ate });
      if (error) {
        return toast(/function|does not exist/i.test(error.message)
          ? 'A geração por semana ainda não existe no banco (correção 07).' : error.message, { tipo: 'bad' });
      }
      toast(data ? `${data} tarefa(s) criada(s) de ${dt(de)} a ${dt(ate)}.`
                 : 'A semana já estava gerada.', { tipo: data ? 'ok' : 'info' });
      pinta();
    },
    nova: () => formPontual(),
    'nova-rotina'() { R.acoes.acoes.modelo(); },
    async editar(b) { const [r] = await q('acoes', x => x.eq('id', b.dataset.id)); if (r) formAcao(r); },
    async concluir(b) {
      const id = b.dataset.id;
      b.classList.add('done');
      b.closest('.row')?.classList.add('off');
      const ok = await grava('acoes', { status: 'concluida' }, id);
      if (!ok) return pinta();
      toast('Ação concluída.', { desfazer: async () => { await grava('acoes', { status: 'aberta' }, id); pinta(); } });
      setTimeout(pinta, 450);
    },
    'fecha-ob'() { pref.ob = false; savePref(); pinta(); },
    'ir-config'() { vai('config'); },
    'ir-acoes'()  { vai('acoes'); },
    async csv() { csv('fila-do-dia', await q('v_acoes_hoje')); }
  }
};

/* Tarefa pontual: nasce com prazo de hoje e sem recorrência. É o que
   apareceu agora e não faz parte da rotina — por isso vem separada.
   Quando nasce de um bloco da semana, já chega com o dia daquele
   bloco: quem clicou em "quinta" não deveria ter que digitar a data. */
/* Quando a visão Semana está filtrada numa pessoa (admin olhando a
   semana de alguém), a tarefa nova já nasce no nome dela. */
function respDoFiltro() {
  const quem = R.rotinaSemanal?.filtro?.quem;
  return rota === 'rotinaSemanal' && quem && !['minha', 'liderados', 'todos'].includes(quem)
    ? quem : eu?.id;
}

function formPontual(dia) {
  form('Nova tarefa pontual', [
    { k:'titulo', label:'O que precisa ser feito', req:true, ph:'Ex.: Ligar para o cliente da proposta 42' },
    { k:'descricao', label:'Detalhes', type:'textarea' },
    { k:'prazo', label:'Para quando', type:'date', value:dia || hoje() },
    ...(cache.temHora ? [{ k:'hora', label:'Horário', type:'time',
      hint:'Opcional para a tarefa. Obrigatório se for para a agenda.' }] : []),
    { k:'responsavel_id', label:'Responsável', type:'select', value:respDoFiltro(), opts:optUsuarios() },
    ...(cache.temSetores ? [{ k:'setor_id', label:'Setor', type:'select', opts:optSetores() }] : []),
    { k:'canal_id', label:'Canal', type:'select', opts:optCanais() },
    ...(cache.temTags ? [{ k:'_tags', label:'Tags', ph:'comercial, urgente' }] : []),
    { k:'urgente', type:'checkbox', label:'Urgente', cap:'Urgente — fura a fila' },
    { k:'_agendar', type:'checkbox', label:'Agenda', cap:'Também marcar na agenda',
      hint:'Cria o compromisso com hora e duração, além da tarefa no checklist.' },
    { k:'_area', label:'Em qual agenda', type:'select', value: area || 'comercial', opts:[
      { v:'comercial', t:'Comercial' }, { v:'marketing', t:'Marketing' },
      { v:'ambos', t:'As duas' }] },
    { k:'_duracao', label:'Duração (minutos)', type:'number', value:30 }
  ], async d => {
    const agendar = d._agendar, agArea = d._area, agDur = d._duracao;
    delete d._agendar; delete d._area; delete d._duracao;

    if (agendar && !d.hora) {
      toast('Para entrar na agenda a tarefa precisa de horário.', { tipo:'bad' });
      return false;
    }
    if (cache.temTags) { d.tags = leTags(d._tags); delete d._tags; }
    d.tipo = 'rotina'; d.origem = 'manual';   // avulsa: sem modelo por trás

    if (!agendar) return grava('acoes', d);

    // Precisa do id da ação para amarrar o compromisso a ela
    const { data: criada, error } = await sb.from('acoes').insert(d).select().single();
    if (error) { toast(error.message, { tipo:'bad' }); return false; }

    const quando = new Date(`${d.prazo}T${hm(d.hora)}:00`).toISOString();
    const r = await sb.from('agendamentos').insert({
      acao_id: criada.id, canal_id: d.canal_id || null, area: agArea,
      data_hora: quando, duracao_min: agDur || 30
    });
    if (r.error) {
      toast('Tarefa criada, mas a agenda falhou: ' + r.error.message, { tipo:'bad' });
      return true;
    }
    toast(`Tarefa criada e marcada na agenda ${agArea === 'ambos' ? 'das duas áreas' : 'do ' + agArea}.`);
    return true;
  }, 'Criar tarefa');
}

/* Pendência da semana: é da semana que começa em `segunda`, mas não
   tem dia marcado — prazo fica nulo e semana_de segura a âncora.
   Preencher o campo de dia converte: vira tarefa comum do bloco. */
function formPendencia(segunda, row) {
  segunda = segunda || seg();
  const fim = new Date(new Date(segunda + 'T12:00:00').getTime() + 6 * 864e5).toISOString().slice(0, 10);
  form(row ? `Pendência · ${row.titulo}` : 'Nova pendência da semana', [
    { k:'titulo', label:'O que precisa sair até domingo', req:true, value:row?.titulo,
      ph:'Ex.: Fechar a arte da campanha de setembro' },
    { k:'descricao', label:'Detalhes', type:'textarea', value:row?.descricao },
    { k:'_dia', label:'Já tem dia certo? (opcional)', type:'date', value:'',
      hint:`Vazio, fica pendurada na faixa da semana (${dt(segunda)} a ${dt(fim)}). ` +
           'Com um dia, vira tarefa do bloco daquele dia.' },
    { k:'responsavel_id', label:'Responsável', type:'select',
      value:row?.responsavel_id ?? respDoFiltro(), opts:optUsuarios() },
    ...(cache.temSetores ? [{ k:'setor_id', label:'Setor', type:'select', value:row?.setor_id, opts:optSetores() }] : []),
    { k:'canal_id', label:'Canal', type:'select', value:row?.canal_id, opts:optCanais() },
    ...(cache.temTags ? [{ k:'_tags', label:'Tags', value:(row?.tags || []).join(', '),
      ph:'comercial, urgente', hint:'Separadas por vírgula.' }] : []),
    { k:'urgente', type:'checkbox', label:'Urgente', cap:'Urgente — fura a fila', value:row?.urgente }
  ], d => {
    if (cache.temTags) { d.tags = leTags(d._tags); delete d._tags; }
    const dia = d._dia; delete d._dia;
    if (dia) { d.prazo = dia; d.semana_de = null; }
    else     { d.prazo = null; d.semana_de = segunda; }
    if (!row) { d.tipo = 'rotina'; d.origem = 'manual'; }
    return grava('acoes', d, row?.id);
  }, row ? 'Salvar' : 'Criar pendência');
}

function formAcao(row) {
  form(row?.id ? 'Editar ação' : 'Nova ação', [
    { k:'titulo', label:'Título', req:true, value:row?.titulo, ph:'Ex.: Revisar criativos do Meta' },
    { k:'descricao', label:'Descrição', type:'textarea', value:row?.descricao },
    { k:'tipo', label:'Tipo', type:'select', value:row?.tipo || 'rotina', opts:[
      { v:'rotina', t:'Rotina' }, { v:'campanha', t:'Campanha' }, { v:'pendencia_gestor', t:'Pendência do gestor' }] },
    ...(cache.temSetores ? [{ k:'setor_id', label:'Setor', type:'select', value:row?.setor_id, opts:optSetores() }] : []),
    { k:'canal_id', label:'Canal', type:'select', value:row?.canal_id, opts:optCanais() },
    { k:'responsavel_id', label:'Responsável', type:'select', value:row?.responsavel_id, opts:optUsuarios() },
    { k:'bloqueia_id', label:'Está travando quem?', type:'select', value:row?.bloqueia_id,
      opts:optUsuarios('— ninguém —'), hint:'Preenchido, a pendência sobe na fila mesmo sem prazo.' },
    { k:'prazo', label:'Prazo', type:'date', value:row?.prazo },
    ...(cache.temTags ? [{ k:'_tags', label:'Tags', value:(row?.tags || []).join(', '),
      ph:'comercial, conteúdo', hint:'Separadas por vírgula.' }] : []),
    { k:'urgente', type:'checkbox', label:'Urgente', cap:'Urgente — fura a fila', value:row?.urgente,
      hint:'Use pouco. Se tudo é urgente, nada é.' }
  ], d => {
    if (cache.temTags) { d.tags = leTags(d._tags); delete d._tags; }
    return grava('acoes', d, row?.id);
  });
}

/* ───────────────────────── AÇÕES ───────────────────────── */
const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
const INICIAL_DIA = ['D','S','T','Q','Q','S','S'];
// A semana começa na segunda, como a pessoa pensa a rotina de trabalho
const ORDEM_SEMANA = [1, 2, 3, 4, 5, 6, 0];
const NOME_DIA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

/* Em quais dias da semana esta rotina cai. null = não é semanal
   (mensal), então não entra na visão de semana. */
function diasDaRotina(m) {
  switch (m.recorrencia) {
    case 'diaria':     return [0, 1, 2, 3, 4, 5, 6];
    case 'dias_uteis': return [1, 2, 3, 4, 5];
    case 'semanal':    return (m.recorrencia_dias || []).slice().sort();
    case 'quinzenal':  return m.recorrencia_inicio
      ? [new Date(m.recorrencia_inicio + 'T12:00:00').getDay()] : [];
    default:           return null;   // mensal
  }
}

/* Régua visual da semana: S T Q Q S S D, com os dias de execução
   acesos. Diz num relance o que a palavra "quinzenal" não diz. */
function reguaDias(m) {
  const dias = diasDaRotina(m);
  if (!dias) return `<span class="pill dim">dia ${m.recorrencia_dia_mes} do mês</span>`;
  return `<div class="regua" title="${dias.map(d => DIAS[d]).join(', ')}">
    ${ORDEM_SEMANA.map(d => `<span class="${dias.includes(d) ? 'on' : ''}">${INICIAL_DIA[d]}</span>`).join('')}
  </div>`;
}
R.acoes = {

        : vazio('refresh', 'Nenhuma rotina recorrente',
            'É aqui que o sistema começa a trabalhar por você: cadastre o que se repete e ele cria sozinho todo dia.',
            { act:'modelo', label:'Criar rotina' })}</div>

      <div class="card"><div class="ch"><h3>Ações</h3>
        <div class="push">

          <button class="btn sm ghost" data-act="csv">${ico('down',13)}CSV</button></div></div>
        ${lista.length ? `<div class="t-scroll"><table><thead><tr>

        : vazio('check', 'Nada por aqui', 'Nenhuma ação com esse filtro.', { act:'nova', label:'Nova ação' })}</div>`;
  },
  acoes: {
    nova: () => formAcao(),
    async editar(b) { const [r] = await q('acoes', x => x.eq('id', b.dataset.id)); if (r) formAcao(r); },
    filtro(b) { R.acoes.filtro.status = b.dataset.v; pinta(); },

      form('Nova rotina recorrente', [

        { k:'tipo', label:'Tipo', type:'select', value:'rotina',
          opts:[{ v:'rotina', t:'Rotina' }, { v:'campanha', t:'Campanha' }] },
        ...(cache.temSetores ? [{ k:'setor_id', label:'Setor', type:'select', opts:optSetores(),
          hint:'Cadastrado em Configurações → Time e canais.' }] : []),
        { k:'canal_id', label:'Canal', type:'select', opts:optCanais() },
        { k:'responsavel_id', label:'Responsável', type:'select', opts:optUsuarios() },
        { k:'recorrencia', label:'Com que frequência', type:'select', value:'dias_uteis', opts:[
          { v:'diaria', t:'Todo dia' }, { v:'dias_uteis', t:'Dias úteis (seg–sex)' },
          { v:'semanal', t:'Semanal' }, { v:'quinzenal', t:'Quinzenal' }, { v:'mensal', t:'Mensal' }] },
        { k:'_dias', label:'Dias da semana', value:'1,3,5',
          hint:'Só para "Semanal". 0=dom, 1=seg … 6=sáb, separados por vírgula.' },
        { k:'recorrencia_dia_mes', label:'Dia do mês', type:'number',
          hint:'Só para "Mensal". 1 a 31 — ajusta sozinho em mês curto.' },
        { k:'recorrencia_inicio', label:'Início da contagem', type:'date', value:hoje(),
          hint:'Só para "Quinzenal". Repete a cada 14 dias a partir daqui.' },
        ...(cache.temHora ? [{ k:'hora', label:'Horário', type:'time',
          hint:'Opcional. Serve para ordenar o dia na tela Rotina semanal.' }] : []),
        ...(cache.temTags ? [{ k:'_tags', label:'Tags', ph:'comercial, prospecção',
          hint:'Separadas por vírgula. Servem para filtrar o check do dia.' }] : [])
      ], d => {
        if (cache.temTags) { d.tags = leTags(d._tags); delete d._tags; }
        const dias = d._dias; delete d._dias;
        d.recorrencia_dias = d.recorrencia === 'semanal'
          ? String(dias || '').split(',').map(s => parseInt(s, 10)).filter(n => n >= 0 && n <= 6) : null;
        if (d.recorrencia !== 'mensal')    d.recorrencia_dia_mes = null;
        if (d.recorrencia !== 'quinzenal') d.recorrencia_inicio = null;
        return grava('acoes', d);
      });
    }
  }
};

    async del(b) { if (await apaga('agendamentos', b.dataset.id)) { toast('Removido.'); pinta(); } }

/* ───────────────────────── CANAIS DE VENDA ─────────────────────
   Canal não é etiqueta de dropdown: é produto com ciclo de vida. Ele
   é aberto, estruturado, testado, operado e escalado — e some da
   cabeça de todo mundo se ninguém enxerga em que fase está.

   A tela tem duas caras:

   · pipeline — uma coluna por estágio. A leitura que importa é
     horizontal: a coluna onde os canais empilham é onde a operação
     trava.
   · ficha    — os cinco blocos de abertura, um por aba, com o gate
     que o estágio atual precisa cumprir para avançar.

   O checklist não guarda "feito" em lugar nenhum: cada item é uma
   ação em `acoes`, com canal e bloco. Feito = ação concluída. Por
   isso a abertura do canal aparece na fila do dia junto com o resto
   do trabalho, em vez de virar uma segunda caixa de entrada que
   ninguém abre. Estrutura em sql/CORRECAO-15.sql. */

const ESTAGIOS = [
  ['ideia',        'Ideia',        'Existe a intenção. Falta o plano.'],
  ['estruturacao', 'Estruturação', 'Montando o que precisa existir antes do D1.'],
  ['piloto',       'Piloto',       'No ar para a primeira leva, acompanhado de perto.'],
  ['operacao',     'Operação',     'Rodando com rotina viva e campanha no ar.'],
  ['escala',       'Escala',       'Se sustenta e ensina o próximo canal.'],
  ['encerrado',    'Encerrado',    'Fora do ar. Fica no histórico.']
];
const NOME_ESTAGIO = Object.fromEntries(ESTAGIOS.map(([v, t]) => [v, t]));

const BLOCOS = [
  ['estrutura', '1 · Estrutura',
   'Dono, regra, oferta que fecha a conta, materiais e rastreio.'],
  ['ativacao',  '2 · Ativação',
   'Acontece uma vez: primeira leva, D1 e quem recebe o lead treinado.'],
  ['motor',     '3 · Campanhas e rotina',
   'O que repete. Campanha tem fim; rotina é o que segura o canal entre elas.'],
  ['medicao',   '4 · Medição',
   'Funil chegando sozinho, CAC e ROI do canal com número real.'],
  ['escala',    '5 · Escala',
   'Reativar quem parou, reconhecer os melhores, documentar, abrir o próximo.']
];
const NOME_BLOCO = Object.fromEntries(BLOCOS.map(([v, t]) => [v, t]));

let canalSel = null, canalAba = 'estrutura', canalSecao = 'oquee';
let canalArrastou = false;   // suprime o clique que sobra depois do arrasto
const canalCache = { saude: [], blocos: [], itens: [], camps: [], rots: [], kpi: [], canal: {} };

const blocoDe = (id, b) => canalCache.blocos.find(x => x.canal_id === id && x.bloco === b);
const somaBloco = (id, campo) => canalCache.blocos
  .filter(x => x.canal_id === id).reduce((n, x) => n + (+x[campo] || 0), 0);

/* Configuração do canal em 5 passos — as mesmas seções da ficha.
   "Configurado" é ter os cinco: sem isso o canal existe no quadro
   mas ninguém sabe o que ele é, quanto deve vender nem como opera.
   Lê do cache.canais (linha crua) porque a view de saúde não traz
   regras nem fluxograma. */
function passosConfig(id) {
  const c = cache.canais.find(x => x.id === id) || {};
  return [
    { n:1, t:'O que é',    feito: !!(c.publico && c.mecanica),  act:'editar-oquee' },
    { n:2, t:'Meta',       feito: c.meta_30d != null,           act:'editar-meta' },
    { n:3, t:'Regras',     feito: !!c.regras,                   act:'editar-regras' },
    { n:4, t:'Fluxograma', feito: !!c.fluxograma,               act:'editar-fluxo' },
    { n:5, t:'Plano',      feito: somaBloco(id, 'itens') > 0,   act:'secao', v:'plano' }
  ];
}

function cartaoCanal(s) {
  const tot = somaBloco(s.id, 'itens'), ok = somaBloco(s.id, 'feitos');
  const atrasados = somaBloco(s.id, 'atrasados');
  const pct = tot ? Math.round(100 * ok / tot) : 0;
  const cfg = passosConfig(s.id).filter(p => p.feito).length;
  return `<div class="cnl" data-act="abrir" data-id="${s.id}">
    <div class="cn">${esc(s.nome)}</div>
    <div class="cm">${esc(s.dono || 'sem dono')}${
      s.data_abertura ? ' · D1 ' + dt(s.data_abertura) : ''}</div>
    <div class="bar"><i class="${pct === 100 ? 'ok' : ''}" style="width:${pct}%"></i></div>
    <div class="cf">
      ${cfg === 5 ? '<span class="pill ok">configurado</span>'
                  : `<span class="pill warn">sem configuração · ${cfg}/5</span>`}
      ${tot ? `<span class="pill dim">${ok}/${tot} do plano</span>` : ''}
      ${atrasados ? `<span class="pill bad">${atrasados} atrasado${atrasados > 1 ? 's' : ''}</span>` : ''}
      ${s.estagio === 'operacao' || s.estagio === 'escala'
        ? (+s.rotinas ? `<span class="pill ok">${s.rotinas} rotina${+s.rotinas > 1 ? 's' : ''}</span>`
                      : '<span class="pill warn">sem rotina</span>') : ''}
      ${+s.campanhas_ativas ? `<span class="pill info">${s.campanhas_ativas} no ar</span>` : ''}
      ${s.gate_ok && s.estagio !== 'escala' && s.estagio !== 'encerrado'
        ? '<span class="pill ok">gate cumprido</span>' : ''}
    </div></div>`;
}

function canalPipeline(cs) {
  const ativos = cs.filter(c => c.estagio !== 'encerrado');
  const abrindo = cs.filter(c => c.estagio === 'estruturacao' || c.estagio === 'ideia').length;
  const atrasados = cs.reduce((n, c) => n + (+c.plano_atrasados || 0), 0);
  const semMotor = cs.filter(c =>
    (c.estagio === 'operacao' || c.estagio === 'escala') && (!+c.rotinas || !+c.campanhas_ativas)).length;

  const coluna = ([v, t, d]) => {
    const meus = cs.filter(c => c.estagio === v);
    if (v === 'encerrado' && !meus.length) return '';
    return `<div class="col" data-estagio="${v}"><h4>${esc(t)}</h4><div class="dsc">${esc(d)}</div>
      ${meus.length ? meus.map(cartaoCanal).join('')
        : '<div class="zero">nenhum canal aqui</div>'}</div>`;
  };

  return `<div class="head"><div><h2>Canais de venda</h2>
      <div class="sub">${area ? `Os canais que ${AREAS[area]} opera` : 'Todos os canais'}
        — onde cada um está no ciclo de vida, e o que falta para avançar.</div></div>
      <div class="push">
        <button class="btn ghost" data-act="csv">${ico('down',15)}CSV</button>
        <button class="btn" data-act="novo">${ico('plus',15)}Novo canal</button></div></div>

    ${cs.length ? `
    <div class="tiles stg">
      <div class="tile"><div class="ic">${ico('target',18)}</div><div class="n">${ativos.length}</div>
        <div class="l">Canais vivos</div><div class="h">${cs.length - ativos.length} encerrado(s)</div></div>
      <div class="tile"><div class="ic">${ico('zap',18)}</div><div class="n">${abrindo}</div>
        <div class="l">Em abertura</div><div class="h">ainda não passaram do bloco 1</div></div>
      <div class="tile ${atrasados ? 'bad' : ''}"><div class="ic">${ico('alert',18)}</div>
        <div class="n">${atrasados}</div><div class="l">Passos atrasados</div>
        <div class="h">somando todos os canais</div></div>
      <div class="tile ${semMotor ? 'warn' : ''}"><div class="ic">${ico('refresh',18)}</div>
        <div class="n">${semMotor}</div><div class="l">Operando sem motor</div>
        <div class="h">sem rotina ou sem campanha</div></div>
    </div>

    <div class="pipe">${ESTAGIOS.map(coluna).join('')}</div>

    <div class="card"><div class="cb"><p class="sm2">
      Canal que fica parado numa coluna não é canal devagar — é canal sem dono ou sem gate cumprido.
      Clique nele para ver o que trava. Lançar e parar de comunicar é o jeito mais comum de matar um canal:
      é por isso que <b>campanha e rotina moram no mesmo bloco</b>.</p></div></div>`
    : `<div class="card">${vazio('target', 'Nenhum canal cadastrado',
        'Cadastre os canais que você opera de verdade: é o que faz meta, campanha e rotina terem de onde vir.',
        { act:'novo', label:'Adicionar canal' })}</div>`}`;
}

function linhaItem(a) {
  const feito = a.status === 'concluida';
  const atrasada = !feito && a.prazo && a.prazo < hoje();
  return `<div class="row ${feito ? 'off' : ''}">
    <button class="tick ${feito ? 'done' : ''}" data-act="marcar" data-id="${a.id}"
      title="${feito ? 'Reabrir' : 'Marcar como pronto'}">${ico('check', 12)}</button>
    <div class="g"><div class="t" style="white-space:normal">${esc(a.titulo)}</div>
      <div class="m">${a.criterio ? esc(a.criterio) : 'Sem critério de pronto definido.'}
        ${a.prova ? ` · <b style="color:var(--ok)">prova:</b> ${esc(a.prova)}` : ''}</div></div>
    <span class="pill ${feito ? 'ok' : atrasada ? 'bad' : 'dim'}">${
      feito ? 'pronto' : a.prazo ? dt(a.prazo) : 'sem prazo'}</span>
    <span class="pill dim">${esc(a.responsavel_id ? nomeUser(a.responsavel_id) : 'sem dono')}</span>
    <button class="ib" data-act="editar-item" data-id="${a.id}" title="Editar">${ico('edit', 15)}</button>
  </div>`;
}

/* A ficha do canal é uma tela de abas: o que é, meta, engajamento,
   regras, fluxograma e plano de abertura. Cada aba mostra no próprio
   botão o estado da seção ("a definir", "3 etapas", "12/20") — o
   panorama do hub orbital sem o custo dele: a órbita era bonita mas
   os quadrados ficavam minúsculos e o conteúdo começava abaixo da
   dobra (removida em 24/08 a pedido do Philipe). */
function canalFicha(s) {
  const c = canalCache.canal || {};
  const itens = canalCache.itens.filter(a => a.bloco === canalAba);
  const b = blocoDe(s.id, canalAba);
  const [, tituloBloco, descBloco] = BLOCOS.find(x => x[0] === canalAba);

  const botaoBloco = ([v, t, d]) => {
    const bb = blocoDe(s.id, v);
    const tot = bb ? +bb.itens : 0, ok = bb ? +bb.feitos : 0;
    const pct = tot ? Math.round(100 * ok / tot) : 0;
    return `<button class="${v === canalAba ? 'on' : ''}" data-act="aba" data-v="${v}">
      <div class="bt">${esc(t)}</div><div class="bs">${esc(d)}</div>
      <div class="bar"><i class="${pct === 100 ? 'ok' : ''}" style="width:${pct}%"></i></div>
      <div class="sm2" style="margin-top:5px">${tot ? `${ok}/${tot}` : 'sem itens'}${
        bb && +bb.atrasados ? ` · ${bb.atrasados} atrasado(s)` : ''}</div></button>`;
  };

  const identidade = `<div class="card"><div class="ch"><h3>O que é este canal</h3>
    <div class="push"><button class="btn sm" data-act="editar-oquee">${ico('edit',13)}Editar</button></div></div>
    <div class="cb ficha">
    <div><div class="fl">Dono</div><div class="fv">${esc(s.dono || '— defina —')}</div></div>
    <div><div class="fl">D1</div><div class="fv">${s.data_abertura ? dt(s.data_abertura) : '— sem data —'}</div></div>
    <div><div class="fl">Meta 30 / 90 dias</div>
      <div class="fv">${s.meta_30d ?? '—'} / ${s.meta_90d ?? '—'} vendas</div></div>
    <div><div class="fl">CAC-alvo</div><div class="fv">${s.cac_alvo != null ? 'R$ ' + Number(s.cac_alvo).toLocaleString('pt-BR') : '—'}</div></div>
    <div style="flex:1;min-width:230px"><div class="fl">Quem indica</div>
      <div class="fv" style="font-weight:500;line-height:1.5">${esc(s.publico || '— não definido —')}</div></div>
    <div style="flex:1;min-width:230px"><div class="fl">O que o canal promete</div>
      <div class="fv" style="font-weight:500;line-height:1.5">${esc(s.mecanica || '— não definido —')}</div></div>
  </div></div>`;

  const gate = `<div class="card"><div class="cb" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <span class="pill ${s.gate_ok ? 'ok' : 'warn'}">${s.gate_ok ? 'gate cumprido' : 'gate em aberto'}</span>
    <div style="flex:1;min-width:240px">
      <div class="sm2">Para sair de <b>${esc(NOME_ESTAGIO[s.estagio])}</b>, precisa ser verdade:</div>
      <div style="font-weight:600;margin-top:3px">${esc(s.gate)}</div></div>
    ${s.estagio === 'encerrado' ? '' : `<button class="btn ${s.gate_ok ? '' : 'ghost'}"
      data-act="avancar">${ico('arrowR',15)}Avançar estágio</button>`}
  </div></div>`;

  /* Engajamento é campanha E rotina lado a lado: sem isso, "lançar e
     parar de comunicar" não aparece na tela. */
  const motor = canalSecao !== 'engajamento' ? '' : `
    <div class="card"><div class="ch"><h3>Campanhas do canal</h3>
      <span class="pill dim">${canalCache.camps.length}</span>
      <div class="push"><button class="btn sm ghost" data-act="nova-campanha">${ico('plus',13)}Nova</button></div></div>
      ${canalCache.camps.length ? canalCache.camps.map(c => `<div class="row">
        <div class="g"><div class="t">${esc(c.nome)}</div>
          <div class="m">${dt(c.data_inicio)} — ${c.data_fim ? dt(c.data_fim) : 'sem fim'}${
            c.objetivo ? ' · ' + esc(c.objetivo) : ''}</div></div>
        <span class="pill ${c.status === 'ativa' ? 'ok' : c.status === 'planejada' ? 'info'
          : c.status === 'pausada' ? 'warn' : 'dim'}">${esc(c.status)}</span>
        <button class="ib" data-act="editar-campanha" data-id="${c.id}" title="Editar">${ico('edit', 15)}</button></div>`).join('')
      : `<div class="cb">${vazio('zap', 'Nenhuma campanha neste canal',
          'Campanha é o pico. Sem pelo menos duas por ciclo, o canal vive só do lançamento.',
          { act:'nova-campanha', label:'Nova campanha' })}</div>`}</div>

    <div class="card"><div class="ch"><h3>Rotina do canal</h3>
      <span class="pill dim">${canalCache.rots.length}</span>
      <div class="push"><button class="btn sm ghost" data-act="nova-rotina">${ico('plus',13)}Nova rotina</button></div></div>
      ${canalCache.rots.length ? canalCache.rots.map(r => `<div class="row rotina">
        <div class="g"><div class="t">${esc(r.titulo)}</div>
          <div class="m">${esc(r.recorrencia)} · ${esc(r.responsavel_id ? nomeUser(r.responsavel_id) : 'sem dono')}</div></div>
        <span class="pill ${r.status === 'aberta' ? 'ok' : 'dim'}">${esc(r.status)}</span>
        <button class="ib" data-act="editar-rotina" data-id="${r.id}" title="Editar">${ico('edit', 15)}</button></div>`).join('')
      : `<div class="cb">${vazio('refresh', 'Nenhuma rotina neste canal',
          'Campanha morre no dia do fim. Rotina é o que mantém o canal vivo entre uma e outra — ranking, lembrete, cobrança do SLA.',
          { act:'nova-rotina', label:'Criar rotina' })}</div>`}</div>`;

  const medicao = canalSecao !== 'meta' ? '' : `
    <div class="card"><div class="ch"><h3>Custo e retorno</h3>
      <div class="push"><button class="btn sm ghost" data-act="ir-financeiro">${ico('money',13)}Lançar mês</button></div></div>
      ${canalCache.kpi && canalCache.kpi.length ? `<div class="t-scroll"><table><thead><tr>
          <th>Mês</th><th class="num">Investimento</th><th class="num">Leads</th><th class="num">Vendas</th>
          <th class="num">CPL</th><th class="num">CAC</th><th class="num">ROI</th><th>Veredito</th></tr></thead>
        <tbody>${canalCache.kpi.map(k => `<tr>
          <td>${dt(k.periodo)}</td><td class="num">${brl(k.investimento)}</td>
          <td class="num">${k.leads_gerados}</td><td class="num">${k.vendas}</td>
          <td class="num">${k.cpl != null ? brl(k.cpl) : '—'}</td>
          <td class="num"${s.cac_alvo && k.cac > s.cac_alvo ? ' style="color:var(--bad)"' : ''}>${
            k.cac != null ? brl(k.cac) : '—'}</td>
          <td class="num">${k.roi != null ? k.roi : '—'}</td>
          <td><span class="pill ${k.veredito === 'escalar' ? 'ok' : k.veredito === 'saudavel' ? 'info'
            : k.veredito === 'cortar' ? 'bad' : 'dim'}">${esc(k.veredito.replace('_',' '))}</span></td>
        </tr>`).join('')}</tbody></table></div>
        ${s.cac_alvo ? `<div class="cb"><p class="sm2">CAC-alvo deste canal:
          <b>R$ ${Number(s.cac_alvo).toLocaleString('pt-BR')}</b>. É contra ele que o número acima vale alguma coisa.</p></div>` : ''}`
      : `<div class="cb">${vazio('chart', 'Sem número lançado',
          'Enquanto investimento, leads, vendas e receita não forem lançados no mês, o veredito do canal é opinião.')}</div>`}</div>`;

  /* ── as seis abas ────────────────────────────────────────────── */
  const totPlano = somaBloco(s.id, 'itens'), okPlano = somaBloco(s.id, 'feitos');
  const pctPlano = totPlano ? Math.round(100 * okPlano / totPlano) : 0;
  const etapasFluxo = (c.fluxograma || '').split('\n').map(x => x.trim()).filter(Boolean);
  const SECOES = [
    ['oquee',       'O que é',    'book',    s.publico || s.mecanica ? 'definido' : 'a definir'],
    ['meta',        'Meta',       'chart',   s.meta_30d != null ? `${s.meta_30d} em 30d` : 'a definir'],
    ['engajamento', 'Engajamento','refresh', `${canalCache.camps.length} campanha(s) · ${canalCache.rots.length} rotina(s)`],
    ['regras',      'Regras',     'lock',    c.regras ? 'definidas' : 'a definir'],
    ['fluxo',       'Fluxograma', 'link',    etapasFluxo.length ? `${etapasFluxo.length} etapa(s)` : 'a desenhar'],
    ['plano',       'Plano',      'check',   totPlano ? `${okPlano}/${totPlano} · ${pctPlano}%` : 'sem plano'],
    ['doc',         'Documento',  'copy',    c.doc_html ? 'anexado' : 'sem arquivo']
  ];
  const abas = `<div class="ctabs">${SECOES.map(([k, t, icone, info]) => `
    <button class="${canalSecao === k ? 'on' : ''}" data-act="secao" data-v="${k}">
      <span class="bt">${ico(icone, 15)}${t}</span><span class="inf">${esc(info)}</span></button>`).join('')}
  </div>`;

  /* Canal sem os 5 passos abre com o guia de configuração no topo:
     cada passo é um botão que abre direto o formulário da seção.
     Fechou os cinco, o guia some sozinho. */
  const passos = passosConfig(s.id);
  const feitosCfg = passos.filter(p => p.feito).length;
  const wizard = feitosCfg === 5 ? '' : `
    <div class="card"><div class="ch"><h3>Configuração do canal</h3>
      <span class="pill warn">${feitosCfg}/5</span>
      <div class="push"><span class="sm2">Complete os cinco passos — clique em cada um para preencher.</span></div></div>
      <div class="cb cfgsteps">${passos.map(p => `
        <button class="${p.feito ? 'ok' : ''}" data-act="${p.act}"${p.v ? ` data-v="${p.v}"` : ''}>
          <span class="num">${p.feito ? ico('check', 12) : p.n}</span>
          <div><b>Passo ${p.n} · ${p.t}</b><i>${p.feito ? 'feito' : 'preencher'}</i></div>
        </button>`).join('')}</div></div>`;

  const secOquee = canalSecao !== 'oquee' ? '' : identidade + (c.notas ? `
    <div class="card"><div class="ch"><h3>Notas</h3>
      <div class="push"><button class="btn sm ghost" data-act="editar-oquee">${ico('edit',13)}Editar</button></div></div>
      <div class="cb" style="white-space:pre-wrap;font-size:13.5px;line-height:1.65">${esc(c.notas)}</div></div>` : '');

  const secMeta = canalSecao !== 'meta' ? '' : `
    <div class="card"><div class="ch"><h3>Meta do canal</h3>
      <div class="push"><button class="btn sm" data-act="editar-meta">${ico('edit',13)}Editar</button></div></div>
      <div class="cb ficha">
        <div><div class="fl">Meta 30 dias</div><div class="fv">${s.meta_30d ?? '—'} vendas</div></div>
        <div><div class="fl">Meta 90 dias</div><div class="fv">${s.meta_90d ?? '—'} vendas</div></div>
        <div><div class="fl">CAC-alvo</div><div class="fv">${s.cac_alvo != null ? 'R$ ' + Number(s.cac_alvo).toLocaleString('pt-BR') : '—'}</div></div>
        <div><div class="fl">D1</div><div class="fv">${s.data_abertura ? dt(s.data_abertura) : '—'}</div></div>
        <div><div class="fl">Dono</div><div class="fv">${esc(s.dono || '—')}</div></div>
      </div></div>` + medicao;

  const secRegras = canalSecao !== 'regras' ? '' : `
    <div class="card"><div class="ch"><h3>Regras do canal</h3>
      <div class="push"><button class="btn sm" data-act="editar-regras">${ico('edit',13)}Editar regras</button></div></div>
      ${c.regras ? `<div class="cb" style="white-space:pre-wrap;font-size:13.5px;line-height:1.7">${esc(c.regras)}</div>`
        : `<div class="cb">${vazio('lock', 'Regras não escritas',
            'Comissão, quem pode indicar, condições, SLA de contato, o que desclassifica. Regra que não está escrita vira discussão caso a caso.',
            { act:'editar-regras', label:'Escrever as regras' })}</div>`}</div>`;

  const secFluxo = canalSecao !== 'fluxo' ? '' : `
    <div class="card"><div class="ch"><h3>Fluxograma do canal</h3>
      <span class="pill dim">da indicação à ativação</span>
      <div class="push"><button class="btn sm" data-act="editar-fluxo">${ico('edit',13)}Editar fluxo</button></div></div>
      ${etapasFluxo.length ? `<div class="cb"><div class="fluxo">
          ${etapasFluxo.map((e2, n) => `${n ? '<div class="seta">↓</div>' : ''}
            <div class="passo"><span class="n">${n + 1}</span>${esc(e2)}</div>`).join('')}
        </div></div>`
        : `<div class="cb">${vazio('link', 'Fluxo não desenhado',
            'Escreva uma etapa por linha — "Indicador manda o contato", "Comercial liga em até 24h"… — e o desenho aparece aqui.',
            { act:'editar-fluxo', label:'Desenhar o fluxo' })}</div>`}</div>`;

  const secPlano = canalSecao !== 'plano' ? '' : gate + `
    <div class="bnav">${BLOCOS.map(botaoBloco).join('')}</div>

    <div class="card"><div class="ch"><h3>${esc(tituloBloco)}</h3>
      <span class="pill dim">${b ? `${b.feitos}/${b.itens}` : '0'}</span>
      <div class="push">
        <button class="btn sm ghost" data-act="aplicar-bloco">${ico('copy',13)}Trazer do modelo</button>
        <button class="btn sm" data-act="novo-item">${ico('plus',13)}Novo passo</button></div></div>
      <div class="cb" style="padding-bottom:0"><p class="sm2">${esc(descBloco)}</p></div>
      ${itens.length ? `<div style="margin-top:12px">${itens.map(linhaItem).join('')}</div>`
        : `<div class="cb">${vazio('check', 'Bloco vazio',
            'Traga os passos do modelo padrão ou escreva os desta operação. Um bloco vazio não é um bloco cumprido.',
            { act:'aplicar-bloco', label:'Trazer do modelo' })}</div>`}</div>`;

  /* O documento é o caminho preferido do Philipe para configurar o
     canal: ele anexa um HTML (gerado fora, ex. pelo Claude) e vai só
     trocando o arquivo. Se o HTML trouxer o bloco
     <script type="application/json" id="canal-config">, os campos do
     canal são preenchidos a partir dele no momento do anexo. */
  const secDoc = canalSecao !== 'doc' ? '' :
    (!('doc_html' in c)
      ? avisoSql('Falta a coluna <b>doc_html</b> em canais_venda.', 'sql/CORRECAO-19.sql')
      : c.doc_html ? `
    <div class="card"><div class="ch"><h3>Documento do canal</h3>
      <div class="push">
        <button class="btn sm ghost" data-act="doc-aba">${ico('out',13)}Nova aba</button>
        <button class="btn sm ghost" data-act="doc-subir">${ico('copy',13)}Trocar arquivo</button>
        <button class="btn sm ghost" data-act="doc-remover">${ico('trash',13)}Remover</button></div></div>
      <iframe class="quadro" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
        srcdoc="${esc(c.doc_html)}"></iframe></div>`
      : `<div class="card">${vazio('copy', 'Nenhum documento anexado',
          'Anexe o HTML do canal (playbook, regras, plano). Se o arquivo tiver o bloco canal-config, ' +
          'os campos da ficha são preenchidos automaticamente a partir dele.',
          { act:'doc-subir', label:'Anexar arquivo HTML' })}</div>`);

  return `<div class="volta" data-act="voltar">${ico('arrowL',14)}Todos os canais</div>
    <div class="head">
      <div><h2>${esc(s.nome)}</h2>
        <div class="sub">${esc((s.tipo || '').replace('_',' '))} · ${esc(NOME_ESTAGIO[s.estagio])}${
          s.dono ? ' · ' + esc(s.dono) : ''}${
          totPlano ? ` · ${pctPlano}% do plano` : ''}</div></div>
      <div class="push">
        ${dd('Estágio', 'estagio', ESTAGIOS.map(([v, t, d]) => ({ v, t, d })), s.estagio)}
        <button class="btn ghost" data-act="editar-canal">${ico('edit',15)}Editar canal</button>
        <button class="btn" data-act="aplicar">${ico('plus',15)}Aplicar plano</button></div></div>

    ${wizard}
    ${abas}
    ${secOquee}${secMeta}${canalSecao === 'engajamento' ? motor : ''}${secRegras}${secFluxo}${secPlano}${secDoc}`;
}

R.canais = {
  label: 'Canais de venda', curto: 'Canais', icone: 'target', titulo: 'Canais de venda',
  async dados() {
    const saude = await qOpcional('v_canal_saude', x => x.order('nome'));
    if (saude === null) return { semBanco: true };

    const permitidos = canaisDaArea();
    const ids = permitidos ? new Set(permitidos.map(c => c.id)) : null;
    canalCache.saude  = ids ? saude.filter(s => ids.has(s.id)) : saude;
    canalCache.blocos = (await qOpcional('v_canal_bloco')) || [];

    if (canalSel && !canalCache.saude.some(s => s.id === canalSel)) canalSel = null;

    if (canalSel) {
      const [itens, camps, rots, kpi, canalRow] = await Promise.all([
        q('acoes', x => x.eq('canal_id', canalSel).eq('recorrencia', 'nenhuma')
                         .not('bloco', 'is', null).order('prazo', { nullsFirst: false })),
        q('campanhas', x => x.eq('canal_id', canalSel).order('data_inicio', { ascending: false })),
        q('acoes', x => x.eq('canal_id', canalSel).neq('recorrencia', 'nenhuma').order('titulo')),
        qOpcional('v_financeiro_kpi', x => x.eq('canal_id', canalSel).order('periodo', { ascending: false }).limit(6)),
        // A linha crua do canal: regras, fluxograma e notas não passam pela view de saúde
        q('canais_venda', x => x.eq('id', canalSel))
      ]);
      canalCache.itens = itens; canalCache.camps = camps;
      canalCache.rots = rots;   canalCache.kpi = kpi || [];
      canalCache.canal = canalRow[0] || {};
    }
    return { semBanco: false };
  },

  render({ semBanco }) {
    if (semBanco) return `<div class="head"><div><h2>Canais de venda</h2>
        <div class="sub">O ciclo de vida do canal ainda não está no banco.</div></div></div>
      ${avisoSql('Faltam a tabela <b>canal_plano_modelo</b> e as visões de saúde do canal.',
                 'sql/CORRECAO-15.sql')}`;
    const s = canalSel && canalCache.saude.find(x => x.id === canalSel);
    return s ? canalFicha(s) : canalPipeline(canalCache.saude);
  },

  /* Arrastar o card entre as colunas muda o estágio — mesma regra do
     dropdown: muda sempre, e avisa se o gate ainda estava aberto. */
  pos() {
    if (canalSel) return;   // o arrasto só existe no quadro
    let drag = null;
    $$('.pipe .cnl').forEach(k => {
      k.draggable = true;
      k.ondragstart = e => { drag = k; canalArrastou = false; k.classList.add('drag');
        e.dataTransfer.effectAllowed = 'move'; };
      k.ondragend = () => { k.classList.remove('drag'); drag = null; };
    });
    $$('.pipe .col').forEach(c => {
      c.ondragover = e => { e.preventDefault(); if (drag) c.classList.add('sobre'); };
      c.ondragleave = () => c.classList.remove('sobre');
      c.ondrop = async e => {
        e.preventDefault(); c.classList.remove('sobre');
        if (!drag) return;
        canalArrastou = true;   // o clique que sobra do arrasto não deve abrir a ficha
        const id = drag.dataset.id; drag = null;
        await mudaEstagio(id, c.dataset.estagio);
      };
    });
  },

  acoes: {
    abrir(b) {
      if (canalArrastou) { canalArrastou = false; return; }
      canalSel = b.dataset.id; canalAba = 'estrutura'; canalSecao = 'oquee'; pinta();
    },
    voltar() { canalSel = null; pinta(); },
    aba(b)   { canalAba = b.dataset.v; pinta(); },
    secao(b) { canalSecao = b.dataset.v; pinta(); },

    /* Cada aba edita só o que é dela: formulário curto, sem rolar o
       formulário inteiro do canal atrás de um campo. */
    'editar-oquee'() {
      const c = canalCache.canal || {};
      form('O que é este canal', [
        { k:'publico', label:'Quem indica / de onde vem o lead', type:'textarea', value:c.publico,
          ph:'Base de ~7.000 clientes ativos', hint:'Com tamanho, não com adjetivo.' },
        { k:'mecanica', label:'O que o canal promete', type:'textarea', value:c.mecanica,
          ph:'R$ 50 de desconto na fatura para os dois lados, por indicação convertida',
          hint:'Uma frase que o indicador entende sem ler o regulamento.' },
        { k:'responsavel_id', label:'Dono do canal', type:'select', value:c.responsavel_id, opts:optUsuarios() },
        { k:'notas', label:'Notas', type:'textarea', value:c.notas,
          hint:'Histórico, decisões e aprendizados que não cabem nos campos.' }
      ], async d => { const ok = await grava('canais_venda', d, canalSel); if (ok) await recarregaBase(); return ok; },
      'Salvar');
    },
    'editar-meta'() {
      const c = canalCache.canal || {};
      form('Meta do canal', [
        { k:'meta_30d', label:'Meta de vendas — 30 dias', type:'number', value:c.meta_30d },
        { k:'meta_90d', label:'Meta de vendas — 90 dias (por mês)', type:'number', value:c.meta_90d },
        { k:'cac_alvo', label:'CAC-alvo (R$)', type:'number', step:'0.01', value:c.cac_alvo,
          hint:'Teto de custo por venda. É a régua contra o CAC real da tela de Financeiro.' },
        { k:'data_abertura', label:'D1 — data de abertura', type:'date', value:c.data_abertura,
          hint:'Âncora dos prazos do plano. Mudar aqui não move o que já foi gerado.' }
      ], async d => { const ok = await grava('canais_venda', d, canalSel); if (ok) await recarregaBase(); return ok; },
      'Salvar meta');
    },
    'editar-campanha'(b) {
      const c = canalCache.camps.find(x => x.id === b.dataset.id);
      if (c) formCampanha(c);
    },

    /* ── documento HTML do canal ─────────────────────────────────
       O arquivo é a fonte: anexou, a ficha obedece. O bloco opcional
       <script type="application/json" id="canal-config"> preenche os
       campos estruturados — só os desta lista, para um arquivo não
       poder trocar nome, estágio ou dono por acidente. */
    'doc-subir'() {
      const i = document.createElement('input');
      i.type = 'file'; i.accept = '.html,.htm,text/html';
      i.onchange = () => {
        const f = i.files[0]; if (!f) return;
        if (f.size > 4 * 1024 * 1024) {
          return toast('Arquivo acima de 4 MB. Provavelmente tem imagem em base64 — reduza antes.', { tipo:'bad' });
        }
        const fr = new FileReader();
        fr.onerror = () => toast('Não deu para ler o arquivo.', { tipo:'bad' });
        fr.onload = async () => {
          const bruto = String(fr.result);
          const patch = { doc_html: bruto };
          let preenchidos = 0;
          const m = bruto.match(/<script[^>]*id=["']canal-config["'][^>]*>([\s\S]*?)<\/script>/i);
          if (m) {
            try {
              const cfg = JSON.parse(m[1]);
              const TEXTO = ['publico', 'mecanica', 'regras', 'fluxograma', 'notas'];
              const NUMERO = ['meta_30d', 'meta_90d', 'cac_alvo'];
              TEXTO.forEach(k => { if (typeof cfg[k] === 'string' && cfg[k].trim()) { patch[k] = cfg[k]; preenchidos++; } });
              NUMERO.forEach(k => { if (cfg[k] != null && !isNaN(+cfg[k])) { patch[k] = +cfg[k]; preenchidos++; } });
              if (/^\d{4}-\d{2}-\d{2}$/.test(cfg.data_abertura || '')) { patch.data_abertura = cfg.data_abertura; preenchidos++; }
            } catch { toast('O bloco canal-config existe mas não é JSON válido — anexei só o documento.', { tipo:'info' }); }
          }
          const ok = await grava('canais_venda', patch, canalSel);
          if (!ok) return;
          await recarregaBase();
          toast(preenchidos ? `Documento anexado e ${preenchidos} campo(s) preenchido(s) a partir dele.`
                            : 'Documento anexado.');
          pinta();
        };
        fr.readAsText(f, 'utf-8');
      };
      i.click();
    },
    'doc-aba'() {
      const c = canalCache.canal || {}; if (!c.doc_html) return;
      const url = URL.createObjectURL(new Blob([c.doc_html], { type: 'text/html' }));
      open(url, '_blank');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    },
    'doc-remover'() {
      confirma('Remover documento', 'O arquivo anexado sai do canal. Os campos preenchidos a partir dele ficam como estão.',
        async () => {
          if (await grava('canais_venda', { doc_html: null }, canalSel)) { toast('Documento removido.'); pinta(); }
        });
    },
    'editar-rotina'(b) { R.rotinaSemanal.acoes['editar-rotina'](b); },

    'editar-regras'() {
      const c = canalCache.canal || {};
      form('Regras do canal', [
        { k:'regras', label:'As regras do jogo', type:'textarea', value:c.regras,
          ph:'Comissão: R$50 de desconto pros dois lados\nQuem pode indicar: qualquer cliente ativo\nSLA: contato em até 24h úteis\nDesclassifica: CPF já cadastrado…',
          hint:'Regra que não está escrita vira discussão caso a caso.' }
      ], async d => { const ok = await grava('canais_venda', d, canalSel); if (ok) await recarregaBase(); return ok; },
      'Salvar regras');
    },
    'editar-fluxo'() {
      const c = canalCache.canal || {};
      form('Fluxograma do canal', [
        { k:'fluxograma', label:'Uma etapa por linha', type:'textarea', value:c.fluxograma,
          ph:'Indicador manda o contato no WhatsApp\nComercial liga em até 24h\nProposta apresentada\nVenda no Bitrix (funil 0)\nAtivação no IXC\nBonificação aplicada nas duas faturas',
          hint:'A tela desenha as caixas e as setas na ordem das linhas.' }
      ], async d => { const ok = await grava('canais_venda', d, canalSel); if (ok) await recarregaBase(); return ok; },
      'Salvar fluxo');
    },

    novo() { formCanal({ area: area || 'ambos' }); },
    async 'editar-canal'() {
      const [r] = await q('canais_venda', x => x.eq('id', canalSel)); if (r) formCanal(r);
    },
    async editar(b) { const [r] = await q('canais_venda', x => x.eq('id', b.dataset.id)); if (r) formCanal(r); },
    duplicar(b) { duplicaCanal(b.dataset.id); },
    excluir(b)  { excluiCanal(b.dataset.id, b.dataset.t); },
    csv() { csv('canais', canalCache.saude); },

    /* Estágio é escolha do dono, não consequência automática do
       checklist: só ele sabe se o piloto de verdade começou. O que o
       sistema faz é não deixar passar batido que o gate não fechou. */
    async estagio(b) { await mudaEstagio(canalSel, b.dataset.v); },
    avancar() {
      const s = canalCache.saude.find(x => x.id === canalSel); if (!s) return;
      const i = ESTAGIOS.findIndex(e => e[0] === s.estagio);
      const prox = ESTAGIOS[Math.min(i + 1, ESTAGIOS.length - 2)];   // 'encerrado' nunca é o "próximo"
      if (!prox || prox[0] === s.estagio) return toast('Já está no último estágio.', { tipo:'info' });
      if (s.gate_ok) return R.canais.acoes.estagio({ dataset: { v: prox[0] } });
      confirma(`Avançar para ${prox[1]}?`,
        `O gate deste estágio ainda não fechou: <b>${esc(s.gate)}</b>.<br><br>
         Avançar assim é decisão sua — o sistema só não deixa isso passar em silêncio.`,
        () => R.canais.acoes.estagio({ dataset: { v: prox[0] } }), { perigo:false });
    },

    async aplicar()       { await aplicaPlano(null); },
    async 'aplicar-bloco'() { await aplicaPlano(canalAba); },

    'novo-item'() {
      const s = canalCache.saude.find(x => x.id === canalSel);
      form(`Novo passo · ${NOME_BLOCO[canalAba]}`, [
        { k:'titulo', label:'O que precisa existir', req:true,
          ph:'Ex.: Definir quem lança o desconto no IXC' },
        { k:'criterio', label:'Critério de pronto', type:'textarea',
          ph:'O que demonstra que ficou pronto — não "já mexi nisso".',
          hint:'Só marca quem consegue demonstrar funcionando.' },
        { k:'responsavel_id', label:'Responsável', type:'select', opts:optUsuarios(),
          value: s?.responsavel_id },
        { k:'prazo', label:'Prazo', type:'date' }
      ], d => grava('acoes', { ...d, tipo:'campanha', origem:'manual',
                               canal_id: canalSel, bloco: canalAba }));
    },
    async 'editar-item'(b) {
      const a = canalCache.itens.find(x => x.id === b.dataset.id); if (!a) return;
      form('Editar passo', [
        { k:'titulo', label:'O que precisa existir', req:true, value:a.titulo },
        { k:'criterio', label:'Critério de pronto', type:'textarea', value:a.criterio },
        { k:'prova', label:'Prova', value:a.prova, ph:'link, print, número',
          hint:'Onde está a demonstração de que ficou pronto.' },
        { k:'responsavel_id', label:'Responsável', type:'select', opts:optUsuarios(), value:a.responsavel_id },
        { k:'prazo', label:'Prazo', type:'date', value:a.prazo },
        { k:'urgente', type:'checkbox', label:'Urgente', cap:'Urgente — fura a fila do dia', value:a.urgente }
      ], d => grava('acoes', d, a.id));
    },

    /* Concluir pede a prova antes. É fricção de propósito: sem ela o
       critério de pronto vira enfeite e o checklist volta a ser
       "acho que está feito". Dá para pular — mas conscientemente. */
    async marcar(b) {
      const a = canalCache.itens.find(x => x.id === b.dataset.id); if (!a) return;
      if (a.status === 'concluida') {
        if (await grava('acoes', { status:'aberta' }, a.id)) { toast('Passo reaberto.'); pinta(); }
        return;
      }
      form('Marcar como pronto', [
        { k:'prova', label:'Prova', value:a.prova, ph:'link, print, número…',
          hint: a.criterio || 'O que demonstra que este passo ficou pronto.' }
      ], async d => {
        const ok = await grava('acoes', { prova:d.prova, status:'concluida' }, a.id);
        if (ok) toast('Passo concluído.');
        return ok;
      }, 'Concluir');
    },

    'nova-campanha'() { formCampanha({ canal_id: canalSel }); },
    'nova-rotina'()   { R.acoes.acoes.modelo(); },
    'ir-financeiro'() { vai('financeiro', area); }
  }
};

/* Usada pelo dropdown de estágio, pelo botão Avançar e pelo arrasto
   no quadro. Muda sempre — estágio é decisão do dono — mas não deixa
   um gate aberto passar em silêncio. */
async function mudaEstagio(id, v) {
  const s = canalCache.saude.find(x => x.id === id);
  if (!s || !v || s.estagio === v) return;
  if (!await grava('canais_venda', { estagio: v }, id)) return;
  await recarregaBase();
  if (!s.gate_ok && v !== 'encerrado' && ESTAGIOS.findIndex(e => e[0] === v)
      > ESTAGIOS.findIndex(e => e[0] === s.estagio)) {
    toast(`Avançou com o gate em aberto: ${s.gate.toLowerCase()}.`, { tipo:'info' });
  } else toast('Estágio atualizado.');
  pinta();
}

/* Chamada única para os dois botões: o de cima traz o plano inteiro,
   o do card traz só o bloco aberto. */
async function aplicaPlano(bloco) {
  const { data, error } = await sb.rpc('canal_aplicar_plano',
    { p_canal: canalSel, p_bloco: bloco });
  if (error) return toast(error.message, { tipo:'bad' });
  toast(data ? `${data} passo(s) trazido(s) do modelo.` : 'O modelo já estava aplicado por aqui.',
        { tipo: data ? 'ok' : 'info' });
  pinta();
}

/* Quadro estilo Trello. As listas moram no banco (producao_listas) e
   o cartão tem ordem própria — é o que o arrastar e soltar grava.
   Cada lista pode espelhar um status antigo (status_equivalente):
   mover o cartão para ela sincroniza o status, e é isso que mantém a
   capacidade da semana e os contadores do dashboard funcionando. */
let prodArrastou = false;   // suprime o clique que sobra depois do arrasto

R.producao = {
  label: 'Produção', curto: 'Produção', icone: 'film', titulo: 'Produção de conteúdo',
  filtro: { busca:'', membro:'', etiqueta:'' },
  async dados() {
    const [listas, itens, cap] = await Promise.all([
      qOpcional('producao_listas', x => x.order('ordem')),
      q('producao_conteudo', x => x.neq('status', 'arquivado').order('ordem')),
      q('v_capacidade_semana')
    ]);
    return { listas, itens: porCanalId(itens), cap };
  },
  render({ listas, itens, cap }) {
    const f = R.producao.filtro;
    const head = `<div class="head"><div><h2>Produção de conteúdo</h2>
        <div class="sub">Arraste os cartões entre as listas. Clique no cartão para abrir tudo:
          descrição, checklist, etiquetas, membros e comentários.</div></div>
        <div class="push">
          <button class="btn ghost" data-act="cap">${ico('users',15)}Capacidade</button>
          <button class="btn" data-act="add-lista">${ico('plus',15)}Lista</button></div></div>`;
    if (listas === null) return head +
      avisoSql('O quadro de produção (listas e cartões completos) ainda não existe no banco.', 'sql/CORRECAO-17.sql');

    R.producao._listas = listas;
    R.producao._cap = cap;
    const vivas = listas.filter(l => !l.arquivada);

    let cards = itens.filter(i => !i.arquivado);
    R.producao._itens = cards;
    if (f.busca)    cards = cards.filter(i => i.titulo.toLowerCase().includes(f.busca.toLowerCase()));
    if (f.membro)   cards = cards.filter(i => i.responsavel_id === f.membro || (i.membros || []).includes(f.membro));
    if (f.etiqueta) cards = cards.filter(i => (i.etiquetas || []).includes(f.etiqueta));
    const etiquetasUsadas = [...new Set(itens.flatMap(i => i.etiquetas || []))].sort();
    const ordena = l => l.sort((a, b) => (+a.ordem || 0) - (+b.ordem || 0) || (a.created_at > b.created_at ? 1 : -1));

    // Cartão órfão (lista arquivada ou apagada) não pode sumir calado
    const idsVivas = new Set(vivas.map(l => l.id));
    const orfaos = ordena(cards.filter(i => !i.lista_id || !idsVivas.has(i.lista_id)));

    const face = i => {
      const chk = i.checklist || [], feitos = chk.filter(c => c.ok).length;
      const atras = i.data_entrega && i.data_entrega < hoje() && i.status !== 'publicado';
      const membros = [...new Set([i.responsavel_id, ...(i.membros || [])].filter(Boolean))];
      return `<div class="pk" data-act="abre-cartao" data-id="${i.id}" data-card="${i.id}" data-o="${+i.ordem || 0}">
        ${i.capa ? `<div class="capa" style="background:${esc(i.capa)}"></div>` : ''}
        ${(i.etiquetas || []).length ? `<div class="ets">${i.etiquetas.map(t =>
          `<i style="background:${corTag(t)}" title="${esc(t)}"></i>`).join('')}</div>` : ''}
        <div class="t">${esc(i.titulo)}</div>
        <div class="bd">
          ${i.data_entrega ? `<span class="pill ${atras ? 'bad' : i.data_entrega === hoje() ? 'warn' : 'dim'}">${ico('clock',11)}${dt(i.data_entrega)}</span>` : ''}
          ${i.descricao ? `<span class="pill dim" title="Tem descrição">${ico('book',11)}</span>` : ''}
          ${chk.length ? `<span class="pill ${feitos === chk.length ? 'ok' : 'dim'}">${ico('check',11)}${feitos}/${chk.length}</span>` : ''}
          ${(i.comentarios || []).length ? `<span class="pill dim">${ico('inbox',11)}${i.comentarios.length}</span>` : ''}
          ${membros.length ? `<span class="avs">${membros.slice(0, 3).map(id =>
            avatar(cache.usuarios.find(u => u.id === id), 20)).join('')}${
            membros.length > 3 ? `<span class="mais">+${membros.length - 3}</span>` : ''}</span>` : ''}
        </div></div>`;
    };

    const colLista = l => {
      const doL = ordena(cards.filter(i => i.lista_id === l.id));
      return `<div class="tl" data-l="${l.id}">
        <div class="tlh">
          ${l.cor ? `<i class="dotl" style="background:${esc(l.cor)}"></i>` : ''}
          <b data-act="menu-lista" data-id="${l.id}" title="Opções da lista">${esc(l.nome)}</b>
          <span class="ct">${doL.length}</span>
          <button class="ib" data-act="menu-lista" data-id="${l.id}" title="Opções da lista"
            style="width:26px;height:26px">${ico('chevron',13)}</button>
        </div>
        <div class="tlc" data-lista="${l.id}">${doL.map(face).join('')}</div>
        <button class="tla" data-act="add-cartao" data-l="${l.id}">${ico('plus',13)}Adicionar cartão</button>
      </div>`;
    };

    return head + `
      <div class="filtros">
        <input data-act="f-busca" value="${esc(f.busca)}" placeholder="Buscar cartão…"
          style="width:190px;font-size:13px">
        ${dd('Membro', 'f-membro', [{ v:'', t:'Todo mundo', i:'users' },
          ...cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome }))], f.membro)}
        ${etiquetasUsadas.length ? dd('Etiqueta', 'f-etiqueta',
          [{ v:'', t:'Todas as etiquetas' }, ...etiquetasUsadas.map(t => ({ v:t, t }))], f.etiqueta) : ''}
      </div>
      <div class="trello" id="trello">
        ${vivas.map(colLista).join('')}
        ${orfaos.length ? `<div class="tl"><div class="tlh"><b>Sem lista</b><span class="ct">${orfaos.length}</span></div>
          <div class="tlc" data-lista="">${orfaos.map(face).join('')}</div></div>` : ''}
        <button class="tl nova" data-act="add-lista">${ico('plus',15)}Nova lista</button>
      </div>`;
  },
  pos() { prodDnD(); },
  acoes: {
    'f-busca'(el)    { R.producao.filtro.busca = el.value; pinta(); },
    'f-membro'(b)    { R.producao.filtro.membro = b.dataset.v; pinta(); },
    'f-etiqueta'(b)  { R.producao.filtro.etiqueta = b.dataset.v; pinta(); },
    'abre-cartao'(b) { if (prodArrastou) { prodArrastou = false; return; } abreCartaoProd(b.dataset.id); },

    'add-lista'() {
      form('Nova lista', [
        { k:'nome', label:'Nome da lista', req:true, ph:'Ex.: Aguardando aprovação' },
        { k:'cor', label:'Cor (opcional)', ph:'#f76602', hint:'Só o pontinho no título da lista.' }
      ], d => {
        if (d.cor && !/^#[0-9a-f]{6}$/i.test(d.cor)) { toast('Cor no formato #rrggbb.', { tipo:'bad' }); return false; }
        const max = Math.max(0, ...(R.producao._listas || []).map(l => +l.ordem || 0));
        return grava('producao_listas', { nome:d.nome, cor:d.cor, ordem:max + 1 });
      }, 'Criar lista');
    },

    'menu-lista'(b) {
      const listas = (R.producao._listas || []).filter(l => !l.arquivada);
      const l = listas.find(x => x.id === b.dataset.id); if (!l) return;
      const i = listas.indexOf(l);
      const naLista = (R.producao._itens || []).filter(c => c.lista_id === l.id);
      const p = popover(b, `<div class="pl">
        <div class="mi" data-m="ren">${ico('edit',15)} Renomear</div>
        ${i > 0 ? `<div class="mi" data-m="esq">${ico('arrowL',15)} Mover para a esquerda</div>` : ''}
        ${i < listas.length - 1 ? `<div class="mi" data-m="dir">${ico('arrowR',15)} Mover para a direita</div>` : ''}
        <div class="mi" data-m="arq">${ico('inbox',15)} Arquivar lista</div>
        <div class="mi" data-m="del" style="color:var(--bad)">${ico('trash',15)} Excluir lista</div></div>`, 'menu');
      p.onclick = async e => {
        const mi = e.target.closest('.mi'); if (!mi) return;
        p.remove();
        const m = mi.dataset.m;
        if (m === 'ren') form(`Renomear · ${l.nome}`, [
          { k:'nome', label:'Nome da lista', req:true, value:l.nome },
          { k:'cor', label:'Cor', value:l.cor || '', ph:'#f76602' }
        ], d => {
          if (d.cor && !/^#[0-9a-f]{6}$/i.test(d.cor)) { toast('Cor no formato #rrggbb.', { tipo:'bad' }); return false; }
          return grava('producao_listas', d, l.id);
        });
        if (m === 'esq' || m === 'dir') {
          const viz = listas[i + (m === 'dir' ? 1 : -1)]; if (!viz) return;
          await Promise.all([
            grava('producao_listas', { ordem: viz.ordem }, l.id),
            grava('producao_listas', { ordem: l.ordem }, viz.id)
          ]);
          pinta();
        }
        if (m === 'arq') confirma('Arquivar lista',
          `<p>"${esc(l.nome)}" sai do quadro. ${naLista.length
            ? `Os <b>${naLista.length} cartão(ões)</b> dela aparecem na coluna "Sem lista" até você movê-los.`
            : 'Ela está vazia.'}</p>`,
          () => grava('producao_listas', { arquivada:true }, l.id), { perigo:false });
        if (m === 'del') {
          if (naLista.length) return toast('Mova ou arquive os cartões antes de excluir a lista.', { tipo:'bad' });
          confirma('Excluir lista', `<p>"${esc(l.nome)}" some de vez. Ela está vazia, nada mais é afetado.</p>`,
