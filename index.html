      };
    },

    /* Composer do Trello: o botão vira caixa de texto ali mesmo.
       Enter cria e mantém a caixa aberta para emendar o próximo. */
    'add-cartao'(b) {
      const lid = b.dataset.l;
      const box = document.createElement('div');
      box.className = 'pk-add';
      box.innerHTML = `<textarea rows="2" placeholder="Título do cartão…"></textarea>
        <div style="display:flex;gap:6px;margin-top:7px">
          <button class="btn sm" data-s>Adicionar</button>
          <button class="btn sm ghost" data-c>Cancelar</button></div>`;
      b.style.display = 'none';
      b.parentNode.insertBefore(box, b);
      const ta = box.querySelector('textarea');
      const cancela = () => { box.remove(); b.style.display = ''; };
      const salvar = async () => {
        const t = ta.value.trim(); if (!t) return cancela();
        const l = (R.producao._listas || []).find(x => x.id === lid);
        const max = Math.max(0, ...(R.producao._itens || [])
          .filter(c => c.lista_id === lid).map(c => +c.ordem || 0));
        const d = { titulo:t, lista_id:lid, ordem:max + 1, responsavel_id:eu?.id || null };
        if (l?.status_equivalente) {
          d.status = l.status_equivalente;
          if (l.status_equivalente === 'publicado') d.publicado_em = hoje();
        }
        if (await grava('producao_conteudo', d)) pinta();
      };
      box.querySelector('[data-s]').onclick = salvar;
      box.querySelector('[data-c]').onclick = cancela;
      ta.onkeydown = e => {
        if (e.key === 'Enter') { e.preventDefault(); salvar(); }
        if (e.key === 'Escape') cancela();
      };
      ta.focus();
    },

    cap() {
      const capdata = R.producao._cap || [];
      modal({ titulo:'Capacidade da semana', ok:'Fechar', largura:640, onOk:() => true,
        corpo: `${capdata.length ? `<div class="t-scroll"><table><thead><tr>
          <th>Pessoa</th><th class="num">Capacidade</th><th class="num">Entregue</th><th class="num">Em aberto</th><th>Uso</th>
        </tr></thead><tbody>${capdata.map(c => {
          const p = c.capacidade ? Math.min(100, 100 * c.entregue / c.capacidade) : 0;
          const cls = c.saldo < 0 ? 'bad' : (c.capacidade && c.entregue >= c.capacidade) ? 'ok' : '';
          return `<tr><td><b>${esc(c.responsavel)}</b></td>
            <td class="num">${c.capacidade || '—'}</td><td class="num">${c.entregue}</td><td class="num">${c.em_aberto}</td>
            <td><div class="bar" style="max-width:130px"><i class="${cls}" style="width:${p}%"></i></div></td></tr>`;
        }).join('')}</tbody></table></div>`
        : '<p class="sm2">Sem time cadastrado ainda.</p>'}
        <button class="btn ghost" data-def style="margin-top:14px">${ico('users',15)}Definir capacidade de alguém</button>`
      }).mask.querySelector('[data-def]').onclick = () => form('Capacidade da semana', [
        { k:'responsavel_id', label:'Pessoa', type:'select', req:true,
          opts:cache.usuarios.filter(u => u.ativo).map(u => ({ v:u.id, t:u.nome })) },
        { k:'semana_inicio', label:'Semana (segunda-feira)', type:'date', value:seg() },
        { k:'capacidade_itens', label:'Quantos itens dá conta', type:'number', req:true, value:5 }
      ], async d => {
        const { error } = await sb.from('capacidade_producao').upsert(d, { onConflict:'responsavel_id,semana_inicio' });
        if (error) { toast(error.message, { tipo:'bad' }); return false; }
        toast('Capacidade definida.'); return true;
      });
    }
  }
};

/* ── arrastar e soltar ────────────────────────────────────────────
   O truque clássico: durante o dragover o próprio cartão é movido no
   DOM para a posição sob o mouse — o "fantasma" é o cartão real. No
   dragend a posição vira número: a ordem fica no meio do caminho
   entre os vizinhos, então mover um cartão nunca renumera os outros. */
function prodDnD() {
  const board = $('#trello'); if (!board) return;
  let drag = null;
  board.querySelectorAll('.pk').forEach(k => {
    k.draggable = true;
    k.ondragstart = e => { drag = k; prodArrastou = false; k.classList.add('drag');
      e.dataTransfer.effectAllowed = 'move'; };
    k.ondragend = async () => {
      k.classList.remove('drag');
      if (!drag) return;
      drag = null;
      const cont = k.closest('[data-lista]'); if (!cont) return;
      prodArrastou = true;
      const lid = cont.dataset.lista || null;
      const sibs = [...cont.querySelectorAll('.pk')];
      const i = sibs.indexOf(k);
      const antes  = i > 0 ? +sibs[i - 1].dataset.o : null;
      const depois = i < sibs.length - 1 ? +sibs[i + 1].dataset.o : null;
      const ordem = antes != null && depois != null ? (antes + depois) / 2
        : antes != null ? antes + 1 : depois != null ? depois - 1 : 1;
      const patch = { lista_id: lid, ordem };
      const l = (R.producao._listas || []).find(x => x.id === lid);
      if (l?.status_equivalente) {
        patch.status = l.status_equivalente;
        if (l.status_equivalente === 'publicado') patch.publicado_em = hoje();
      }
      if (await grava('producao_conteudo', patch, k.dataset.card)) pinta();
    };
  });
  board.querySelectorAll('[data-lista]').forEach(c => {
    c.ondragover = e => {
      e.preventDefault();
      if (!drag) return;
      const alvo = [...c.querySelectorAll('.pk:not(.drag)')].find(el =>
        e.clientY < el.getBoundingClientRect().top + el.offsetHeight / 2);
      if (alvo) c.insertBefore(drag, alvo); else c.appendChild(drag);
    };
    c.ondrop = e => e.preventDefault();
  });
}

/* ── o cartão aberto ──────────────────────────────────────────────
   Tudo salva na hora, como no Trello — sem botão "Salvar" geral.
   Fechar repinta o quadro para os badges refletirem o que mudou. */

  const listas = (R.producao._listas || []).filter(l => !l.arquivada);

  const mask = document.createElement('div');
  mask.className = 'mask';
  document.body.appendChild(mask);
  const fecha = () => { mask.remove(); document.removeEventListener('keydown', kd); pinta(); };
  const kd = e => { if (e.key === 'Escape') fecha(); };
  document.addEventListener('keydown', kd);
  mask.onclick = e => { if (e.target === mask) fecha(); };

  const salva = async (patch, redesenha = true) => {
    if (await grava('producao_conteudo', patch, i.id)) {
      Object.assign(i, patch);
      if (redesenha) desenha();
    }
  };

  function corpo() {
    const chk = i.checklist || [], feitos = chk.filter(c => c.ok).length;
    const pct = chk.length ? Math.round(100 * feitos / chk.length) : 0;
    const membros = i.membros || [];
    const coms = [...(i.comentarios || [])].reverse();
    return `
      ${i.capa ? `<div class="pc-capa" style="background:${esc(i.capa)}"></div>` : ''}
      <div class="mh" style="align-items:flex-start">
        <input class="pc-titulo" data-titulo value="${esc(i.titulo)}">
        <button class="ib" data-x>${ico('x',16)}</button></div>
      <div class="mb">

      <div class="g2" style="margin-bottom:14px">
        <div><label>Lista</label><select data-lista-sel>
          ${listas.map(l => `<option value="${l.id}"${l.id === i.lista_id ? ' selected' : ''}>${esc(l.nome)}</option>`).join('')}
        </select></div>
        <div><label>Entrega</label><input type="date" data-entrega value="${esc(i.data_entrega || '')}"></div>
      </div>
      <div class="g2" style="margin-bottom:14px">
        <div><label>Responsável</label><select data-resp>
          ${optUsuarios().map(o => `<option value="${esc(o.v)}"${String(o.v) === String(i.responsavel_id ?? '') ? ' selected' : ''}>${esc(o.t)}</option>`).join('')}
        </select></div>
        <div><label>Formato</label><input data-formato value="${esc(i.formato || '')}" placeholder="reel, carrossel, VSL…"></div>
      </div>

      <label>Capa</label>
      <div class="pc-cores">
        ${CORES.map(c => `<i data-capa="${c}" style="background:${c}" class="${i.capa === c ? 'on' : ''}"></i>`).join('')}
        <button class="btn sm ghost" data-capa="">Sem capa</button>
      </div>

      <label style="margin-top:14px">Etiquetas</label>
      <div class="pc-ets">
        ${(i.etiquetas || []).map(t => `<span class="tag" style="color:${corTag(t)};background:${corTag(t)}22">
          ${esc(t)}<b data-tira-et="${esc(t)}" title="Tirar">×</b></span>`).join('')}
        <input data-add-et placeholder="+ etiqueta (Enter)" style="width:150px;font-size:12.5px">
      </div>

      <label style="margin-top:14px">Membros</label>
      <div class="pc-membros">
        ${cache.usuarios.filter(u => u.ativo).map(u => `
          <span class="mb-chip ${membros.includes(u.id) ? 'on' : ''}" data-membro="${u.id}">
            ${avatar(u, 22)}${esc(u.nome.split(' ')[0])}</span>`).join('')}
      </div>

      <label style="margin-top:14px">Descrição</label>
      <textarea data-desc rows="3" placeholder="O que é este conteúdo, referências, roteiro…">${esc(i.descricao || '')}</textarea>

      <div style="display:flex;align-items:center;gap:10px;margin-top:16px">
        <label style="margin:0">Checklist</label>
        ${chk.length ? `<span class="sm2">${pct}%</span>
          <div class="bar" style="flex:1;max-width:180px"><i class="${pct === 100 ? 'ok' : ''}" style="width:${pct}%"></i></div>` : ''}
      </div>
      <div class="pc-chk">
        ${chk.map((c, n) => `<div class="item">
          <button class="tick ${c.ok ? 'done' : ''}" data-chk="${n}">${ico('check',11)}</button>

      </div>

      <div class="pc-com">
        <div class="nova"><textarea data-com-txt rows="2" placeholder="Escreva um comentário…"></textarea>

        ${coms.map((c, n) => {
          const u = cache.usuarios.find(x => x.id === c.autor_id);
          return `<div class="um">${avatar(u, 26)}
            <div class="g"><div class="qm"><b>${esc(u?.nome || '—')}</b>
              <span class="sm2">${c.em ? new Date(c.em).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : ''}</span>

    const $m = s => mask.querySelector(s), $$m = s => [...mask.querySelectorAll(s)];
    $$m('[data-x]').forEach(b => b.onclick = fecha);
    const tt = $m('[data-titulo]');
    tt.onchange = () => { const v = tt.value.trim(); if (v) salva({ titulo:v }, false); };
    $m('[data-lista-sel]').onchange = e => {
      const l = listas.find(x => x.id === e.target.value);
      const max = Math.max(0, ...(R.producao._itens || [])
        .filter(c => c.lista_id === l.id).map(c => +c.ordem || 0));
      const patch = { lista_id:l.id, ordem:max + 1 };
      if (l?.status_equivalente) {
        patch.status = l.status_equivalente;
        if (l.status_equivalente === 'publicado') patch.publicado_em = hoje();
      }
      salva(patch);
    };
    $m('[data-entrega]').onchange = e => salva({ data_entrega: e.target.value || null }, false);
    $m('[data-resp]').onchange = e => salva({ responsavel_id: e.target.value || null }, false);
    $m('[data-formato]').onchange = e => salva({ formato: e.target.value.trim() || null }, false);
    $m('[data-desc]').onchange = e => salva({ descricao: e.target.value.trim() || null }, false);
    $$m('[data-capa]').forEach(b => b.onclick = () => salva({ capa: b.dataset.capa || null }));
    $$m('[data-tira-et]').forEach(b => b.onclick = () =>
      salva({ etiquetas: (i.etiquetas || []).filter(t => t !== b.dataset.tiraEt) }));

    et.onkeydown = e => {
      if (e.key !== 'Enter') return;
      const v = et.value.trim().toLowerCase(); if (!v) return;
      salva({ etiquetas: [...new Set([...(i.etiquetas || []), v])] });
    };
    $$m('[data-membro]').forEach(b => b.onclick = () => {
      const id2 = b.dataset.membro, tem = (i.membros || []).includes(id2);
      salva({ membros: tem ? (i.membros || []).filter(x => x !== id2) : [...(i.membros || []), id2] });
    });
    $$m('[data-chk]').forEach(b => b.onclick = () => {
      const chk = [...(i.checklist || [])];
      chk[+b.dataset.chk] = { ...chk[+b.dataset.chk], ok: !chk[+b.dataset.chk].ok };
      salva({ checklist: chk });
    });
    $$m('[data-chk-del]').forEach(b => b.onclick = () =>
      salva({ checklist: (i.checklist || []).filter((_, n) => n !== +b.dataset.chkDel) }));
    const ca = $m('[data-chk-add]');
    ca.onkeydown = e => {
      if (e.key !== 'Enter') return;
      const v = ca.value.trim(); if (!v) return;
      salva({ checklist: [...(i.checklist || []), { t:v, ok:false }] });
    };
    $m('[data-com-add]').onclick = () => {
      const ta = $m('[data-com-txt]'), v = ta.value.trim(); if (!v) return;
      salva({ comentarios: [...(i.comentarios || []),
        { autor_id: eu?.id || null, texto: v, em: new Date().toISOString() }] });
    };
    $$m('[data-com-del]').forEach(b => b.onclick = () =>
      salva({ comentarios: (i.comentarios || []).filter((_, n) => n !== +b.dataset.comDel) }));
    $m('[data-arq]').onclick = () => confirma('Arquivar cartão',
      `<p>"${esc(i.titulo)}" sai do quadro sem apagar nada.</p>`,
      async () => { const ok = await grava('producao_conteudo', { arquivado:true }, i.id);
        if (ok) fecha(); return ok; }, { perigo:false });
    $m('[data-del]').onclick = () => confirma('Excluir cartão',
      `<p>"${esc(i.titulo)}" some de vez, com checklist e comentários.</p>`,
      async () => { const ok = await apaga('producao_conteudo', i.id); if (ok) fecha(); return ok; });
  }

  function desenha() {
    mask.innerHTML = `<div class="modal pcard" style="max-width:660px">${corpo()}</div>`;
    liga();
  }
  desenha();
}

/* ───────────────────────── BITRIX ────────────────────────────────
   O CRM é a fonte dos números de venda; este sistema é onde a meta
   vive. Enquanto não existe rotina no servidor, quem confere é você:
   a tela busca do Bitrix ao vivo, mostra lado a lado com o que está
   gravado na meta e só grava se você mandar.

   Três decisões que valem explicar:

   1. O webhook NÃO fica no código. Este arquivo está publicado no
      GitHub Pages; um webhook do Bitrix é acesso total ao CRM de quem
      abrir a página. Ele mora no localStorage deste navegador, como a
      chave do Supabase.
   2. As contas seguem a definição fechada, não o que é mais fácil:
      venda do mês = estoque em Agendamento + ganho no mês; venda da
      semana = passou pelo ME11 no período; ativo = ME13 — e ativo o
      número oficial continua sendo o do IXC.
   3. Filtro do Bitrix só funciona em POST com JSON. Em query string
      ele é ignorado em silêncio e devolve a base inteira — parece que
      funcionou e o número vem errado por dez vezes mais. */
const BX = {
  ME11: 'UF_CRM_1765977342',    // data de entrada em Agendamento
  ME13: 'UF_CRM_1766460217',    // data de ativação
  FUNIL: 0,                     // funil Comercial
  AGENDAMENTO: 'UC_VHZBMD'
};
const bxWebhook = () => (localStorage.getItem('bitrix-webhook') || '').trim();

async function bx(metodo, params = {}) {
  const base = bxWebhook();
  if (!base) throw new Error('Webhook do Bitrix não configurado.');
  const r = await fetch(base.replace(/\/*$/, '/') + metodo, {
    method: 'POST', headers: { 'Content-Type':'application/json' },
    body: JSON.stringify(params)
  });
  const j = await r.json().catch(() => ({ error:'resposta ilegível' }));
  if (j.error) {
    throw new Error(/FEATURE_NOT_AVAILABLE/i.test(j.error)
      ? 'O Bitrix respondeu que o REST não está liberado no plano/assinatura. Fale com o parceiro Bitrix.'
      : (j.error_description || j.error));
  }
  return j;
}

/* Só o total: o Bitrix devolve `total` já na primeira página, então
   contar não precisa baixar negócio nenhum. */
async function bxConta(filter) {
  const j = await bx('crm.deal.list', { filter, select:['ID'], start: 0 });
  return j.total || 0;
}

async function bxNegocios(filter, select = ['ID','TITLE','OPPORTUNITY','ASSIGNED_BY_ID'], teto = 1000) {
  const out = []; let start = 0;
  while (out.length < teto) {
    const j = await bx('crm.deal.list', { filter, select, start });
    const pg = j.result || [];
    out.push(...pg);
    if (j.next == null || !pg.length) break;
    start = j.next;
  }
  return out;
}

const bxSoma = ds => ds.reduce((s, d) => s + (Number(d.OPPORTUNITY) || 0), 0);

R.bitrix = {
  label: 'Validação Bitrix', curto: 'Bitrix', icone: 'db', titulo: 'Validação Bitrix',
  filtro: { mes: null },
  async dados() {
    const f = R.bitrix.filtro;
    const mes = f.mes || hoje().slice(0, 7);
    const [ano, m] = mes.split('-').map(Number);
    const ini = `${mes}-01`;
    const fimEx = new Date(ano, m, 1).toISOString().slice(0, 10);   // 1º do mês seguinte
    const semIni = seg();
    const semFimEx = new Date(new Date(semIni + 'T12:00:00').getTime() + 7 * 864e5)
      .toISOString().slice(0, 10);

    const metas = await q('v_metas_progresso',
      x => x.lte('periodo_inicio', new Date(ano, m, 0).toISOString().slice(0, 10))
            .gte('periodo_fim', ini));

    if (!bxWebhook()) return { mes, metas, semIni, sem: false };

    try {
      const doFunil = { CATEGORY_ID: BX.FUNIL };
      // Estoque atual em Agendamento — é fotografia, não tem recorte de mês
      const agenda = await bxNegocios({ ...doFunil, STAGE_ID: BX.AGENDAMENTO });
      const won = await bxNegocios({ ...doFunil, STAGE_ID:'WON',
        '>=CLOSEDATE': ini, '<CLOSEDATE': fimEx });
      const [semana, ativos] = await Promise.all([
        bxConta({ ...doFunil, [`>=${BX.ME11}`]: `${semIni}T00:00:00`,
                  [`<${BX.ME11}`]: `${semFimEx}T00:00:00` }),
        bxConta({ ...doFunil, [`>=${BX.ME13}`]: `${ini}T00:00:00`,
                  [`<${BX.ME13}`]: `${fimEx}T00:00:00` })
      ]);

      // Nome do responsável: um user.get por id distinto, que na prática
      // são os seis consultores — não vale a pena bater na base inteira
      const ids = [...new Set([...agenda, ...won].map(d => d.ASSIGNED_BY_ID).filter(Boolean))];
      const nomes = {};
      await Promise.all(ids.map(async id => {
        try {
          const u = (await bx('user.get', { ID: id })).result?.[0];
          nomes[id] = u ? [u.NAME, u.LAST_NAME].filter(Boolean).join(' ') || u.EMAIL : `#${id}`;
        } catch { nomes[id] = `#${id}`; }
      }));

      return { mes, metas, semIni, sem: true, agenda, won, semana, ativos, nomes,
               lido: new Date().toISOString() };
    } catch (e) {
      return { mes, metas, semIni, sem: true, erro: e.message };
    }
  },
  render(d) {
    const passo = n => { const [a, m] = d.mes.split('-').map(Number);
      const x = new Date(a, m - 1 + n, 1);
      return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2,'0')}`; };
    const rotuloMes = (() => { const [a, m] = d.mes.split('-').map(Number);
      const s = new Date(a, m - 1, 1).toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
      return s[0].toUpperCase() + s.slice(1); })();

    const cabeca = `<div class="head"><div><h2>Validação Bitrix</h2>
        <div class="sub">Os números do CRM ao vivo, na definição oficial da casa —
          para conferir a meta antes de fechar o mês.</div></div>
        <div class="push">
          <button class="btn ghost" data-act="webhook">${ico('key',15)}${bxWebhook() ? 'Trocar webhook' : 'Conectar'}</button>
          <button class="btn" data-act="atualizar">${ico('refresh',15)}Atualizar</button></div></div>`;

    if (!bxWebhook()) {
      return cabeca + `<div class="card">${vazio('db', 'Bitrix ainda não conectado',
        'Cole aqui o webhook REST de entrada do Bitrix. Ele fica só neste navegador — não vai para o repositório, ' +
        'porque webhook publicado é CRM aberto para quem achar a página.',
        { act:'webhook', label:'Conectar o Bitrix' })}</div>`;
    }

    if (d.erro) {
      return cabeca + `<div class="card"><div class="cb">
        <div class="err" style="display:block">Não deu para falar com o Bitrix: ${esc(d.erro)}</div>
        <p class="sm2" style="margin-top:12px">Confira o webhook em <b>Conectar</b>. Se ele estiver certo e o erro
          citar plano ou assinatura, o REST do portal é que está bloqueado — nesse caso nenhum número entra,
          e o jeito é conferir na tela do CRM.</p></div></div>`;
    }

    const estoque = d.agenda.length, ganhos = d.won.length;
    const vendasMes = estoque + ganhos;
    const faturamento = bxSoma(d.agenda) + bxSoma(d.won);

    // Por responsável: as duas pontas da mesma definição, lado a lado
    const porResp = {};
    d.agenda.forEach(x => { const k = x.ASSIGNED_BY_ID || 0;
      (porResp[k] ||= { ag:0, won:0, val:0 }).ag++; porResp[k].val += Number(x.OPPORTUNITY) || 0; });
    d.won.forEach(x => { const k = x.ASSIGNED_BY_ID || 0;
      (porResp[k] ||= { ag:0, won:0, val:0 }).won++; porResp[k].val += Number(x.OPPORTUNITY) || 0; });
    const linhas = Object.entries(porResp)
      .sort((a, b) => (b[1].ag + b[1].won) - (a[1].ag + a[1].won));

    /* De qual número do Bitrix cada indicador se alimenta. O que não
       está no mapa não tem espelho no CRM — e é melhor dizer isso do
       que oferecer um botão que grava um número parecido. */
    const espelho = {
      vendas:      { v: vendasMes,    t: 'Agendamento + ganhos do mês' },
      ativacoes:   { v: d.ativos,     t: 'ME13 no mês (conferir no IXC)' },
      faturamento: { v: faturamento,  t: 'Soma do valor dos mesmos negócios' },
      receita:     { v: faturamento,  t: 'Soma do valor dos mesmos negócios' }
    };

    return cabeca + `
      <div class="card"><div class="ch">
        <button class="ib" data-act="mes" data-v="${passo(-1)}">${ico('arrowL',16)}</button>
        <h3 style="min-width:190px;text-align:center">${rotuloMes}</h3>
        <button class="ib" data-act="mes" data-v="${passo(1)}">${ico('arrowR',16)}</button>
        <div class="push">
          <span class="pill ok">ao vivo</span>
          <span class="sm2">lido ${hora(d.lido)}</span></div></div></div>

      <div class="tiles stg">
        <div class="tile"><div class="ic">${ico('money',18)}</div><div class="n">${num(vendasMes)}</div>
          <div class="l">Vendas do mês</div><div class="h">${estoque} em agendamento · ${ganhos} ganhos</div></div>
        <div class="tile"><div class="ic">${ico('chart',18)}</div>
          <div class="n" style="font-size:22px">${brl(faturamento)}</div>
          <div class="l">Faturamento</div><div class="h">campo do CRM, digitado no card</div></div>
        <div class="tile"><div class="ic">${ico('clock',18)}</div><div class="n">${num(d.semana)}</div>
          <div class="l">Vendas da semana</div><div class="h">passou pelo ME11 desde ${dt(d.semIni)}</div></div>
        <div class="tile warn"><div class="ic">${ico('zap',18)}</div><div class="n">${num(d.ativos)}</div>
          <div class="l">Ativações (ME13)</div><div class="h">o número oficial é o do IXC</div></div>
      </div>

      <div class="card"><div class="ch"><h3>Por responsável</h3>
        <span class="push sm2">agendamento em estoque + ganhos de ${rotuloMes.toLowerCase()}</span></div>
        ${linhas.length ? `<div class="t-scroll"><table><thead><tr>
          <th>Responsável</th><th class="num">Agendamento</th><th class="num">Ganhos</th>
          <th class="num">Vendas</th><th class="num">Valor</th></tr></thead>
        <tbody>${linhas.map(([id, r]) => `<tr>
          <td><b>${esc(d.nomes[id] || 'sem responsável')}</b></td>
          <td class="num">${r.ag}</td><td class="num">${r.won}</td>
          <td class="num"><b>${r.ag + r.won}</b></td><td class="num">${brl(r.val)}</td>
        </tr>`).join('')}</tbody></table></div>`
        : `<div class="cb sm2">Nenhum negócio no funil comercial neste recorte.</div>`}</div>

      <div class="card"><div class="ch"><h3>Conferir contra as metas</h3>
        <span class="push sm2">${d.metas.length} meta(s) tocando este mês</span></div>
        ${d.metas.length ? `<div class="t-scroll"><table><thead><tr>
          <th>Canal</th><th>Indicador</th><th>Período</th><th class="num">Meta</th>
          <th class="num">Gravado</th><th class="num">Bitrix</th><th>Diferença</th><th></th>
        </tr></thead><tbody>${d.metas.map(m => {
          const e = espelho[m.indicador];
          const grav = Number(m.valor_realizado || 0);
          const dif = e ? e.v - grav : null;
          const geral = !m.canal || m.canal === '—';
          return `<tr>
            <td><b>${esc(m.canal || 'geral')}</b></td>
            <td class="mut">${esc(rotuloIndicador(m.indicador))}</td>
            <td class="mut">${dt(m.periodo_inicio)} → ${dt(m.periodo_fim)}</td>
            <td class="num">${num(m.valor_meta)}</td>
            <td class="num">${num(grav)}</td>
            <td class="num">${e ? `<b>${m.indicador === 'faturamento' || m.indicador === 'receita'
              ? brl(e.v) : num(e.v)}</b><div class="sm2">${esc(e.t)}</div>` : '<span class="mut">sem espelho</span>'}</td>
            <td>${e ? (Math.abs(dif) < 0.005
              ? '<span class="pill ok">bate</span>'
              : `<span class="pill ${Math.abs(dif) / Math.max(1, e.v) > 0.05 ? 'bad' : 'warn'}">${
                  dif > 0 ? '+' : ''}${num(Math.round(dif * 100) / 100)}</span>`) : '—'}</td>
            <td class="act">${e ? `<button class="btn sm ${Math.abs(dif) < 0.005 ? 'ghost' : ''}"
              data-act="aplicar" data-id="${m.id}" data-v="${e.v}"
              ${geral ? '' : 'title="Esta meta é de um canal; o Bitrix devolve o funil inteiro"'}>Usar o do Bitrix</button>` : ''}</td>
          </tr>`;
        }).join('')}</tbody></table></div>
        <div class="cb sm2" style="border-top:1px solid var(--line)">
          O Bitrix não sabe de qual canal veio o negócio — o número é do <b>funil comercial inteiro</b>.

          integração amarrar canal e origem do card.</div>`
        : `<div class="cb sm2">Nenhuma meta cobre este mês. Crie em <b>Metas e funil</b> para ter o que conferir.</div>`}
      </div>

      <div class="card"><div class="cb sm2">
        <b>Como cada número é feito:</b> venda do mês = estoque atual em <b>Agendamento</b> (${BX.AGENDAMENTO},
        funil ${BX.FUNIL}) + <b>Negócio Concluído</b> com fechamento no mês — não por ME11, que o reagendamento
        renova e puxa venda do mês anterior para dentro. Venda da semana = passou por <b>ME11</b> no período.
        Ativação = <b>ME13</b>, e sempre que divergir do IXC, o certo é o do IXC: a diferença é card não lançado
        no CRM.</div></div>`;
  },
  acoes: {
    mes(b) { R.bitrix.filtro.mes = b.dataset.v; pinta(); },
    atualizar() { pinta(); },
    webhook() {
      form('Webhook do Bitrix', [
        { k:'url', label:'URL do webhook de entrada', value: bxWebhook(),
          ph:'https://suaempresa.bitrix24.com.br/rest/1/xxxxxxxx/',
          hint:'Bitrix → Recursos para desenvolvedores → Webhook de entrada, com permissão de CRM.' }
      ], d => {
        const u = (d.url || '').trim();
        if (u && !/^https:\/\/.+\/rest\/\d+\/[^/]+\/?$/.test(u)) {
          toast('A URL não parece um webhook de entrada (…/rest/ID/token/).', { tipo:'bad' });
          return false;
        }
        if (u) localStorage.setItem('bitrix-webhook', u.replace(/\/*$/, '/'));
        else localStorage.removeItem('bitrix-webhook');
        toast(u ? 'Webhook salvo neste navegador.' : 'Webhook removido.');
        return true;
      }, 'Salvar');
    },
    async aplicar(b) {
      const v = Number(b.dataset.v);
      confirma('Gravar o número do Bitrix',
        `<p>O realizado desta meta passa a ser <b>${num(v)}</b>, vindo do CRM.</p>
         <p class="sm2" style="margin-top:10px">É o único lugar do sistema onde o realizado é escrito à mão —
         e mesmo aqui o número não é digitado, é copiado do Bitrix.</p>`,
        async () => {
          // atualizado_em não vai junto: o trigger do banco carimba sozinho
          const ok = await grava('metas', { valor_realizado: v }, b.dataset.id);
          if (ok) toast('Meta sincronizada.');
          return ok;
        }, { perigo:false });
    }
  }
};
