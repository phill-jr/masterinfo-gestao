<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);
        padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font:14px Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eceef3}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Placar Comercial MasterInfo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Inter+Tight:wght@600;700&display=swap">

<style>
:root{
  /* Identidade MasterInfo: neutros e laranja do proprio sistema (index.html),
     laranja da marca #F47216 vindo do simbolo em icone.svg. */
  --bg:#eceef3; --surf:#ffffff; --surf2:#f5f6f9; --surf3:#eceef3;
  --line:#e6e9ef; --line2:#d3d9e3;
  --ink:#111318; --ink2:#3d4351; --ink3:#767d8d;
  --marca:#F47216; --marca2:#ff8c33;
  --s1:#F47216; --s2:#2a78d6; --s3:#1baf7a; --s4:#4a3aa7; --s5:#e87ba4;
  --good:#059669; --warn:#b45309; --bad:#dc2626;
  --goodbg:#e3f5ee; --warnbg:#fdf0dc; --badbg:#fdeaea;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
  --disp:"Inter Tight",Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0b0e; --surf:#101217; --surf2:#161920; --surf3:#1c2029;
  --line:#232833; --line2:#2e3441;
  --ink:#e9ecf2; --ink2:#b3bac9; --ink3:#7d8496;
  --marca:#dd6714; --marca2:#ff8c33;
  --s1:#dd6714; --s2:#3987e5; --s3:#199e70; --s4:#9085e9; --s5:#d55181;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --goodbg:#10291f; --warnbg:#2e2310; --badbg:#2e1616;
}}
:root[data-theme="dark"]{
  --bg:#0a0b0e; --surf:#101217; --surf2:#161920; --surf3:#1c2029;
  --line:#232833; --line2:#2e3441;
  --ink:#e9ecf2; --ink2:#b3bac9; --ink3:#7d8496;
  --marca:#dd6714; --marca2:#ff8c33;
  --s1:#dd6714; --s2:#3987e5; --s3:#199e70; --s4:#9085e9; --s5:#d55181;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --goodbg:#10291f; --warnbg:#2e2310; --badbg:#2e1616;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0;font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:800;letter-spacing:-.02em;text-wrap:balance}
p,ul{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:4px}

/* ═══ moldura ═══ */
.topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surf);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.marca{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.marca b{font-family:var(--disp);font-weight:800;font-size:15px;white-space:nowrap}
.chip{font-family:var(--mono);font-size:11px;color:var(--ink2);background:var(--surf2);
  border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.btn{background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surf3);border-color:var(--line2)}
.btn.pri{background:var(--ink);color:var(--surf);border-color:var(--ink)}
.btn.on{background:var(--ink);color:var(--surf);border-color:var(--ink)}
.conta{font-family:var(--mono);font-size:12px;color:var(--ink2);min-width:46px;text-align:center}

.aviso{background:var(--warnbg);border-bottom:1px solid var(--line);padding:7px 16px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.aviso b.tg{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  background:var(--warn);color:#fff;padding:2px 7px;border-radius:4px}

/* ═══ palco 16:9 ═══ */
.envelope{padding:18px 16px 0}
.caixa{position:relative;width:100%;max-width:1280px;margin:0 auto}
.caixa::before{content:"";display:block;padding-top:56.25%}
.stage{position:absolute;inset:0;width:1280px;height:720px;transform-origin:top left;
  background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 2px 4px rgba(0,0,0,.05),0 18px 44px -22px rgba(0,0,0,.35)}

/* ═══ slide ═══ */
.slide{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;
  padding:40px 52px 34px;gap:18px;background:var(--surf)}
/* rodape: os dois leques encaixados, laranja e tinta */
.slide::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--marca) 0 56%,var(--ink) 56% 100%)}
.slide[hidden]{display:none!important}
.cab{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:16px;
  align-items:start;border-bottom:1px solid var(--line);padding-bottom:14px}
/* o simbolo da marca sao dois leques que se encaixam: a regua repete isso */
.cab::after{content:"";position:absolute;left:0;bottom:-1px;width:58px;height:2px;
  background:var(--marca);border-radius:1px}
.logo{height:24px;width:auto;align-self:center;opacity:.92}
.logoEsc{display:none}
.simb{width:26px;height:auto;flex:none}
.cab .n{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--ink3);letter-spacing:.09em;border:1px solid var(--line);
  border-radius:7px;padding:4px 9px;white-space:nowrap;margin-top:4px}
.cab h2{font-size:33px;line-height:1.1}
.cab .sub{color:var(--ink2);font-size:13.5px;margin-top:6px;max-width:88ch;line-height:1.45}
.corpo{min-height:0;display:grid;gap:18px;align-content:center}
.corpo.duplo{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);align-items:start}
.corpo.largo{grid-template-columns:1fr}
.pe{display:grid;gap:10px}
.tira{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;list-style:none;
  padding:12px 0 0;border-top:1px solid var(--line)}
.tira li{position:relative;padding-left:15px;font-size:12.5px;color:var(--ink2);line-height:1.45}
.tira li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;
  background:var(--s1)}
.tira li b{color:var(--ink);font-weight:600}
.sig{background:var(--surf2);border-left:3px solid var(--marca);border-radius:0 9px 9px 0;
  padding:10px 14px;display:flex;gap:12px;align-items:baseline}
.sig .r{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);white-space:nowrap;flex:none}
.sig p{font-size:14.5px;font-weight:600;line-height:1.35}

/* ═══ números ═══ */
.tiles{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--surf);padding:13px 15px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .rot{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3)}
.tile .val{font-family:var(--disp);font-weight:800;font-size:31px;line-height:1.02;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile .val.sm{font-size:23px}
.tile .pe2{font-size:11.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:3px 9px;
  font-variant-numeric:tabular-nums;line-height:1.3}
.tile.hero{grid-column:1/-1}
.tile.hero .val{font-size:56px}
.tile.vazio .val{color:var(--ink3);font-family:var(--mono);font-size:15px;font-weight:500;
  letter-spacing:0;line-height:1.3}
.empilha{display:grid;gap:10px;align-content:start}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}

.delta{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;
  display:inline-flex;gap:3px;white-space:nowrap}
.delta.up{background:var(--goodbg);color:var(--good)}
.delta.dn{background:var(--badbg);color:var(--bad)}
.delta.fl{background:var(--surf2);color:var(--ink2)}
.m3{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}

.falta{background:var(--surf2);border:1px dashed var(--line2);border-radius:10px;padding:13px 15px;
  display:flex;gap:11px;align-items:flex-start}
.falta .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--surf3);border:1px solid var(--line2);border-radius:5px;padding:2px 7px;flex:none;
  margin-top:1px}
.falta .t{font-size:12.5px;color:var(--ink2);line-height:1.45}
.falta .t b{color:var(--ink);font-weight:600}

/* ═══ gráficos ═══ */
.bloco{display:grid;gap:9px;align-content:start;min-width:0}
.bloco h3{font-family:var(--sans);font-weight:700;font-size:12.5px;letter-spacing:0;
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bloco h3 span{font-weight:400;color:var(--ink3);font-size:11.5px}
.barras{display:grid;gap:5px}
.linha{display:grid;grid-template-columns:minmax(74px,130px) 1fr auto;gap:11px;align-items:center}
.linha .nm{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trilho{display:block;background:var(--surf3);border-radius:4px;height:14px;overflow:hidden;min-width:18px}
.barra{display:block;height:100%;border-radius:0 4px 4px 0;min-width:3px}
.linha .vl{font-family:var(--mono);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right}
.emp{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surf3);gap:2px}
.emp>i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11.5px;color:var(--ink2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.nota{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}

/* ═══ funil ═══ */
.funil{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:20px 18px 14px}
.trem{display:flex;align-items:stretch}
.est{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 3px;min-width:0}
.est .et{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);text-align:center}
.est .qt{font-family:var(--disp);font-weight:800;font-size:28px;line-height:1;
  font-variant-numeric:tabular-nums}
.eixo{position:relative;height:13px;display:flex;align-items:center;width:100%}
.eixo::before{content:"";position:absolute;left:0;right:0;height:2px;background:var(--line2)}
.eixo.ini::before{left:50%}
.eixo.fim::before{right:50%}
.ponto{width:12px;height:12px;border-radius:50%;background:var(--s1);border:3px solid var(--surf2);
  box-shadow:0 0 0 1px var(--s1);margin:0 auto;z-index:2}
.dsc{font-family:var(--mono);font-size:9px;color:var(--ink3);text-align:center;margin-top:24px;
  line-height:1.35}
.taxa{position:absolute;top:100%;left:100%;transform:translate(-50%,7px);z-index:3;
  font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap;background:var(--surf);
  border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.taxa.pior{background:var(--badbg);border-color:var(--bad);color:var(--bad)}

/* ═══ tabela ═══ */
.tabwrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);font-weight:600;background:var(--surf2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:none}
td.n{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
tr.dest td{background:var(--surf2);font-weight:600}
.pin{display:inline-flex;gap:4px;font-family:var(--mono);font-size:10.5px;font-weight:600;
  padding:1px 7px;border-radius:5px}
.pin.g{background:var(--goodbg);color:var(--good)}
.pin.w{background:var(--warnbg);color:var(--warn)}
.pin.b{background:var(--badbg);color:var(--bad)}

/* ═══ decisões ═══ */
.dec{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
.cartao{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:16px;
  display:grid;gap:10px;align-content:start}
.cartao .ord{font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--ink3)}
.cartao h4{font-family:var(--sans);font-weight:700;font-size:15px;line-height:1.28}
.cartao dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
.cartao dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);padding-top:2px}
.cartao dd{margin:0;font-weight:500}

/* ═══ notas e controles ═══ */
.controles{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
.pontos{display:flex;gap:4px;flex-wrap:wrap;margin-right:auto}
.pt{width:20px;height:4px;border-radius:2px;background:var(--line2);border:none;padding:0;cursor:pointer}
.pt[aria-current="true"]{background:var(--ink)}
.notas{max-width:1280px;margin:0 auto;padding:0 16px 40px}
.notas .cx{background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:16px 18px}
.notas .r{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
.notas p{font-size:14px;line-height:1.6;color:var(--ink2)}
.notas p em{color:var(--ink);font-style:normal;font-weight:600}

/* ═══ apresentar ═══ */
:fullscreen .topo,:fullscreen .controles,:fullscreen .notas,:fullscreen .aviso{display:none}
:fullscreen .envelope{padding:0;height:100%;display:flex;align-items:center;justify-content:center}
:fullscreen .caixa{max-width:min(100vw,calc(100vh*16/9))}
:fullscreen .stage{border:none;border-radius:0;box-shadow:none}
:fullscreen{background:var(--bg)}

/* ═══ painel de dados ═══ */
.gaveta{position:fixed;inset:0;z-index:60;background:rgba(8,12,11,.55);display:flex;justify-content:flex-end}
.gaveta[hidden]{display:none!important}
.painel{background:var(--surf);width:min(560px,100%);height:100%;overflow-y:auto;
  border-left:1px solid var(--line);display:flex;flex-direction:column}
.painel .top{position:sticky;top:0;background:var(--surf);border-bottom:1px solid var(--line);
  padding:14px 18px;display:flex;align-items:center;gap:10px;z-index:2}
.painel .top h3{font-size:16px;margin-right:auto}
.painel .cont{padding:18px;display:grid;gap:16px}
.campo{display:grid;gap:5px}
.campo label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.dica{font-size:11.5px;color:var(--ink3);line-height:1.4}
input,select,textarea{background:var(--surf2);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;width:100%;font-size:13.5px}
textarea{font-family:var(--mono);font-size:12px;line-height:1.7;resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{border-color:var(--s1);outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 18%,transparent)}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px;margin:0;display:grid;gap:11px}
legend{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);padding:0 6px}

/* ═══ telefone: vira leitura ═══ */
@media (max-width:719px){
  .envelope{padding:14px 16px 0}
  .caixa::before{display:none}
  .caixa{max-width:none}
  .stage{position:static;width:auto;height:auto;transform:none!important;border-radius:11px}
  .slide{position:static;height:auto;padding:20px 16px 18px;gap:14px}
  .cab{grid-template-columns:1fr;gap:8px}
  .cab .n{margin-top:0;justify-self:start}
  .cab h2{font-size:23px}
  .corpo.duplo,.corpo.largo{grid-template-columns:1fr}
  .duas{grid-template-columns:1fr}
  .tile.hero .val{font-size:40px}
  .tile .val{font-size:26px}
  .tira{grid-template-columns:1fr;gap:9px}
  .dec{grid-template-columns:1fr}
  .trem{overflow-x:auto;padding-bottom:6px}
  .est{min-width:104px}
  .sig{flex-direction:column;gap:4px}
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logoCla{display:none}
  :root:not([data-theme="light"]) .logoEsc{display:block}}
:root[data-theme="dark"] .logoCla{display:none}
:root[data-theme="dark"] .logoEsc{display:block}
@media (max-width:719px){.logo{height:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.topo,.controles,.notas,.aviso{display:none}.envelope{padding:0}
  .caixa::before{display:none}.stage{position:static;width:auto;height:auto;transform:none!important;
  border:none;box-shadow:none}.slide{position:static;height:auto;break-after:page}}
</style>

</head>

function M(mes){
  const d=(exemplo?DEMO[mes]:store[mes])||{}, f=d.funil||{};
  const n=v=>ok(v)?Number(v):null;
  const div=(a,b)=>(ok(a)&&ok(b)&&Number(b)!==0)?Number(a)/Number(b):null;
  const vendas=n(d.vendas);
  const o={mes,faturamento:n(d.faturamento),vendas,cancelamentos:n(d.cancelamentos),
    cancelamentosPre:n(d.cancelamentosPre),baseAtiva:n(d.baseAtiva),ticket:n(d.ticket),
    investimento:n(d.investimento),cicloDias:n(d.cicloDias),ativacaoDias:n(d.ativacaoDias),
    funil:{leads:n(f.leads),atendidos:n(f.atendidos),viaveis:n(f.viaveis),
      propostas:n(f.propostas),vendas:n(f.vendas)??vendas},
    bairros:d.bairros||[],planos:d.planos||[],canais:d.canais||[],
    vendedores:d.vendedores||[],decisoes:d.decisoes||[]};
  o.liquido=(ok(o.vendas)&&ok(o.cancelamentos))?o.vendas-o.cancelamentos:null;
  o.cac=ok(n(d.cac))?n(d.cac):div(o.investimento,o.vendas);
  const cg=div(o.funil.vendas,o.funil.leads); o.conversao=cg===null?null:cg*100;
  o.inviabilidade=(ok(o.funil.atendidos)&&ok(o.funil.viaveis))
    ? (o.funil.atendidos-o.funil.viaveis)/o.funil.atendidos*100 : null;
  const ch=div(o.cancelamentos,o.baseAtiva); o.churn=ch===null?null:ch*100;
  o.jornada=(ok(o.cicloDias)&&ok(o.ativacaoDias))?o.cicloDias+o.ativacaoDias:null;
  return o;
}
function cmp(campo){
  const val=m=>campo.split('.').reduce((o,k)=>o?o[k]:null,M(m));
  const a=val(MESES[0]), b=val(MESES[1]);
  const tres=[MESES[1],MESES[2],MESES[3]].map(val).filter(ok);
  const media=tres.length?tres.reduce((s,x)=>s+x,0)/tres.length:null;
  return {a,b,media,dAbs:(ok(a)&&ok(b))?a-b:null,
    dPct:(ok(a)&&ok(b)&&b!==0)?(a-b)/Math.abs(b)*100:null, serie:MESES.map(val)};
}

function selo(c,{bomSeSobe=true,fmt=int}={}){
  if(!ok(c.dPct)) return '<span class="m3">sem mês anterior</span>';
  const sobe=c.dPct>0.05, desce=c.dPct<-0.05;
  const cls=(!sobe&&!desce)?'fl':((bomSeSobe?sobe:desce)?'up':'dn');
  const seta=(!sobe&&!desce)?'=':(sobe?'▲':'▼');
  if(fmt===pct) return `<span class="delta ${cls}">${seta} ${nf1.format(Math.abs(c.dAbs))} p.p.</span>
    <span class="m3">vs ${rotuloMes(MESES[1])}</span>`;
  return `<span class="delta ${cls}">${seta} ${nf1.format(Math.abs(c.dPct))}%</span>
    <span class="m3">${sobe?'+':desce?'−':''}${fmt(Math.abs(c.dAbs))} vs ${rotuloMes(MESES[1])}</span>`;
}
const media3=(c,fmt)=>ok(c.media)?`<span class="m3">média 3 m: ${fmt(c.media)}</span>`:'';
function tile(rot,valor,fmt,c,opts={}){
  const v=fmt(valor);
  const cls='tile'+(opts.hero?' hero':'')+(v===null?' vazio':'');
  if(v===null) return `<div class="${cls}"><div class="rot">${esc(rot)}</div>
    <div class="val">falta preencher</div><div class="pe2">${esc(opts.porque||'')}</div></div>`;
  return `<div class="${cls}"><div class="rot">${esc(rot)}</div>
    <div class="val${opts.sm?' sm':''}">${v}</div>
    <div class="pe2">${c?selo(c,Object.assign({fmt},opts))+media3(c,fmt):''}</div></div>`;
}
const falta=(o,p)=>`<div class="falta"><span class="tag">faltando</span>
  <div class="t"><b>${esc(o)}</b> — ${esc(p)}</div></div>`;
function barras(itens,cor){
  const max=Math.max(...itens.map(i=>i.v||0),1);
  return `<div class="barras">`+itens.map(i=>`<div class="linha" title="${esc(i.nome)}: ${esc(i.txt)}">
    <span class="nm">${esc(i.nome)}</span>
    <span class="trilho"><span class="barra" style="width:${Math.max(2,(i.v||0)/max*100)}%;
      background:${i.cor||cor}"></span></span>
    <span class="vl">${esc(i.txt)}</span></div>`).join('')+`</div>`;
}
function serieBarras(serie,fmt,cor){
  const v=serie.filter(ok); if(!v.length) return '<span class="m3">— sem dados —</span>';
  const mn=Math.min(...v), amp=(Math.max(...v)-mn)||1;
  return `<div class="barras">`+MESES.map((mes,i)=>{
    const x=serie[i];
    return `<div class="linha" title="${rotuloMes(mes)}: ${ok(x)?fmt(x):'sem dado'}">
      <span class="nm">${rotuloMes(mes)}${i===0?' (atual)':''}</span>
      <span class="trilho"><span class="barra" style="width:${ok(x)?((x-mn)/amp*82+18):0}%;
        background:${i===0?cor:'var(--line2)'}"></span></span>
      <span class="vl">${ok(x)?fmt(x):'—'}</span></div>`;
  }).reverse().join('')+`</div>
  <p class="nota">Escala cortada para a variação aparecer — a barra não começa no zero.</p>`;
}

function render(){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  let fala='';
  SLIDES.forEach((fn,i)=>{
    const s=document.createElement('section');
    s.className='slide'; s.hidden=i!==atual;
    let d;
    try{ d=fn(); }
    catch(e){ d={sec:'Erro',titulo:'Slide indisponível',sub:'',classe:'largo',
      corpo:`<div class="falta"><span class="tag">erro</span><div class="t">${esc(e.message)}</div></div>`,
      bullets:[],sig:'',fala:''}; }
    if(i===atual) fala=d.fala||'';
    s.innerHTML=`<div class="cab">
        <span class="n">${SIMBOLO}${i+1} / ${SLIDES.length} · ${esc(d.sec)}</span>
        <div><h2>${esc(d.titulo)}</h2>${d.sub?`<p class="sub">${esc(d.sub)}</p>`:''}</div>
        <img class="logo logoCla" src="${LOGO_CLARA}" alt="MasterInfo">
        <img class="logo logoEsc" src="${LOGO_ESCURA}" alt="MasterInfo"></div>
      <div class="corpo ${d.classe||'largo'}">${d.corpo}</div>
      <div class="pe">
        ${d.bullets&&d.bullets.length?`<ul class="tira">${d.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`:''}
        ${d.sig?`<div class="sig"><span class="r">O que isso significa</span><p>${d.sig}</p></div>`:''}
      </div>`;
    stage.appendChild(s);
  });
  document.getElementById('conta').textContent=(atual+1)+'/'+SLIDES.length;
  document.getElementById('chipJan').textContent=rotuloMes(MESES[0])+' · dias '+JAN.de+'–'+JAN.ate;
  document.getElementById('falaTxt').innerHTML=fala||'—';
  marcarHash();
  const p=document.getElementById('pontos');
  p.innerHTML=SLIDES.map((_,i)=>`<button class="pt" data-i="${i}" aria-current="${i===atual}"
    aria-label="Slide ${i+1}"></button>`).join('');
  p.querySelectorAll('.pt').forEach(b=>b.addEventListener('click',()=>{atual=+b.dataset.i;render();}));
  document.getElementById('avisoExemplo').hidden=!exemplo;
  document.getElementById('bExemplo').textContent=exemplo?'Dados reais':'Ver exemplo';
  document.getElementById('fonte').textContent=exemplo?'números fictícios de demonstração'
    :(db?'preenchimento manual, salvo para quem abrir o link':'preenchimento manual, só neste navegador');
  escala();
}
function escala(){
  const caixa=document.getElementById('caixa'), stage=document.getElementById('stage');
  if(!caixa||!stage) return;
  if(window.innerWidth<720){ stage.style.transform=''; return; }
  stage.style.transform='scale('+(caixa.clientWidth/1280)+')';
}
const vai=d=>{ atual=Math.max(0,Math.min(SLIDES.length-1,atual+d)); render(); };

/* #slide-N na URL: mesma convencao do painel semanal, da para mandar o link
   de um slide especifico. Dentro do artifact o hash pode nao aparecer na barra
   de enderecos; no arquivo solto funciona inteiro. */
function marcarHash(){
  try{ const alvo='#slide-'+(atual+1);
    if(location.hash!==alvo) history.replaceState(null,'',alvo);
  }catch(e){}
}
function lerHash(){
  try{ const m=String(location.hash||'').match(/^#slide-(\d+)$/);
    if(!m) return false;
    const i=Math.max(0,Math.min(SLIDES.length-1,parseInt(m[1],10)-1));
    if(i===atual) return false;
    atual=i; return true;
  }catch(e){ return false; }
}
window.addEventListener('hashchange',()=>{ if(lerHash()) render(); });

const CAMPOS=[['faturamento','Faturamento (R$)'],['vendas','Vendas realizadas'],
  ['cancelamentos','Cancelamentos — total'],['cancelamentosPre','Perdidos antes do cliente (ME11)'],
  ['baseAtiva','Base ativa no fim'],['ticket','Ticket médio (R$)'],
  ['investimento','Investimento (R$)'],['cicloDias','Ciclo de venda (dias)'],
  ['ativacaoDias','Tempo de ativação (dias)']];
const FUNIL=[['leads','Leads'],['atendidos','Atendidos'],['viaveis','Viáveis'],
  ['propostas','Propostas'],['vendas','Vendas']];
const numTxt=v=>(v===null||v===undefined)?'':String(v).replace('.',',');
function paraNum(s){ if(s==null) return null;
  const t=String(s).trim().replace(/\s|R\$|\./g,'').replace(',','.');
  if(t==='') return null; const n=Number(t); return Number.isNaN(n)?null:n; }
const linhas=(t,cs)=>String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
  const p=l.split(/\t|;/).map(x=>x.trim()); const o={};
  cs.forEach((c,i)=>{o[c]=i===0?(p[0]||''):paraNum(p[i]);}); return o;}).filter(o=>o[cs[0]]);
const paraTexto=(a,cs)=>(a||[]).map(o=>cs.map(c=>{
  const v=o[c]; return (v==null)?'':String(v).replace('.',',');}).join('; ')).join('\n');

/* Le o bloco do MANUAL-DADOS.md: CHAVE: valor, e secoes com uma linha por item.
   Tolerante de proposito — linha vazia, acento, ';' ou tabulacao, tudo passa. */
const ESCALARES={FATURAMENTO:'faturamento',VENDAS:'vendas',CANCELAMENTOS:'cancelamentos',
  PERDIDOS:'cancelamentosPre',BASE:'baseAtiva',TICKET:'ticket',INVESTIMENTO:'investimento',
  CICLO:'cicloDias',ATIVACAO:'ativacaoDias'};
const LISTAS={BAIRROS:['nome','casas','ativos','vendas','invCob','invAna'],
  PLANOS:['nome','vendas','valor'],CANAIS:['nome','investimento','leads','vendas'],
  VENDEDORES:['nome','leads','vendas','ciclo']};
const semAcento=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();

function lerBloco(txt){
  const d={funil:{},bairros:[],planos:[],canais:[],vendedores:[],decisoes:[]};
  let mes=null, secao=null, achou=0;
  String(txt||'').split('\n').forEach(bruta=>{
    const l=bruta.trim(); if(!l) return;
    const m=l.match(/^([A-Za-zÀ-ÿ_]+)\s*:\s*(.*)$/);
    if(m){
      const chave=semAcento(m[1]), val=m[2].trim();
      if(chave==='MES'){ mes=val||null; secao=null; return; }
      if(ESCALARES[chave]){ if(val!==''){ d[ESCALARES[chave]]=paraNum(val); achou++; } secao=null; return; }
      if(chave==='FUNIL'){
        const p=val.split(/\t|;/).map(x=>x.trim());
        ['leads','atendidos','viaveis','propostas','vendas'].forEach((k,i)=>{
          if(p[i]!==undefined&&p[i]!=='') { d.funil[k]=paraNum(p[i]); achou++; }});
        secao=null; return;
      }
      if(LISTAS[chave]||chave==='DECISOES'){ secao=chave; if(val==='') return; bruta=val; }
      else { secao=null; return; }
    }
    if(!secao) return;
    const linha=(m?bruta:l).trim(); if(!linha) return;
    const p=linha.split(/\t|;/).map(x=>x.trim());
    if(!p[0]) return;
    /* a linha-modelo do manual nao e dado */
    if(/^(nome|o que fazer)$/i.test(p[0])) return;
    if(secao==='DECISOES'){ d.decisoes.push({oque:p[0],quem:p[1]||'',prazo:p[2]||'',ind:p[3]||''}); }
    else { const cs=LISTAS[secao], o={};
      cs.forEach((c,i)=>{ o[c]= i===0 ? p[0] : paraNum(p[i]); }); d[secao.toLowerCase()==='bairros'?'bairros'
      :secao==='PLANOS'?'planos':secao==='CANAIS'?'canais':'vendedores'].push(o); }
    achou++;
  });
  d.decisoes=d.decisoes.slice(0,3);
  return {mes,d,achou};
}

      </div><span class="dica">Viáveis = atendidos que passaram na cobertura e na análise.</span></fieldset>
    <fieldset><legend>Bairros</legend><div class="campo">
      <label for="t_bairros">nome; casas passadas; ativos; vendas; inviáveis cobertura; inviáveis análise</label>
      <textarea id="t_bairros" spellcheck="false">${esc(paraTexto(d.bairros,['nome','casas','ativos','vendas','invCob','invAna']))}</textarea>
      <span class="dica">Pode colar da planilha: aceita tabulação ou ponto e vírgula.</span></div></fieldset>
    <fieldset><legend>Planos vendidos</legend><div class="campo"><label for="t_planos">nome; vendas; valor mensal</label>
      <textarea id="t_planos" spellcheck="false">${esc(paraTexto(d.planos,['nome','vendas','valor']))}</textarea></div></fieldset>
    <fieldset><legend>Canais</legend><div class="campo"><label for="t_canais">nome; investimento; leads; vendas</label>
      <textarea id="t_canais" spellcheck="false">${esc(paraTexto(d.canais,['nome','investimento','leads','vendas']))}</textarea>
      <span class="dica">Exige a origem gravada no Bitrix. Em branco, o slide 6 avisa.</span></div></fieldset>
    <fieldset><legend>Vendedores</legend><div class="campo"><label for="t_vend">nome; leads; vendas; ciclo em dias</label>
      <textarea id="t_vend" spellcheck="false">${esc(paraTexto(d.vendedores,['nome','leads','vendas','ciclo']))}</textarea></div></fieldset>
    <fieldset><legend>Decisões — no máximo 3</legend><div class="campo"><label for="t_dec">o que fazer; quem; prazo; indicador</label>
      <textarea id="t_dec" spellcheck="false">${esc((d.decisoes||[]).map(x=>[x.oque,x.quem,x.prazo,x.ind].map(v=>v||'').join('; ')).join('\n'))}</textarea></div></fieldset>
    <button class="btn pri" id="bSalvar" style="padding:10px">Salvar ${rotuloMes(mesEdit)}</button>
    ${podeEscrever?'':'<span class="dica">Você está como leitor: o que salvar fica só neste navegador.</span>'}`;
  document.getElementById('mesSel').addEventListener('change',e=>{coletar();mesEdit=e.target.value;abrirPainel();});
  document.getElementById('bAplicar').addEventListener('click',()=>{
    const r=lerBloco(document.getElementById('t_bloco').value);
    const alvo=(r.mes&&MESES.indexOf(r.mes)>=0)?r.mes:mesEdit;
    const ret=document.getElementById('retorno');
    if(!r.achou){ ret.textContent='Não encontrei nenhum valor nesse bloco. Confira o formato no manual.';
      return; }
    coletar();
    const base=Object.assign({},store[alvo]||{});
    Object.keys(r.d).forEach(k=>{
      const v=r.d[k];
      if(k==='funil'){ base.funil=Object.assign({},base.funil||{},v); }
      else if(Array.isArray(v)){ if(v.length) base[k]=v; }
      else if(v!==undefined) base[k]=v;
    });
    base.mes=alvo; store[alvo]=base; mesEdit=alvo;
    abrirPainel(); render();
    const r2=document.getElementById('retorno');
    if(r2) r2.textContent=r.achou+' valor(es) aplicados em '+rotuloMes(alvo)+'. Confira e clique em Salvar.';
  });
  document.getElementById('bSalvar').addEventListener('click',async()=>{
    coletar(); await salvar(mesEdit); render();
    const s=document.getElementById('salvo'); s.textContent='salvo';
    setTimeout(()=>{s.textContent='';},2200);});
  document.getElementById('gaveta').hidden=false;
}
function coletar(){
  if(!document.querySelector('[data-k]')) return;
  const d=Object.assign({},store[mesEdit]||{});
  CAMPOS.forEach(([k])=>{const el=document.querySelector(`[data-k="${k}"]`); if(el) d[k]=paraNum(el.value);});
  d.funil=d.funil||{};
  FUNIL.forEach(([k])=>{const el=document.querySelector(`[data-f="${k}"]`); if(el) d.funil[k]=paraNum(el.value);});
  const g=id=>(document.getElementById(id)||{}).value||'';
  d.bairros=linhas(g('t_bairros'),['nome','casas','ativos','vendas','invCob','invAna']);
  d.planos=linhas(g('t_planos'),['nome','vendas','valor']);
  d.canais=linhas(g('t_canais'),['nome','investimento','leads','vendas']);
  d.vendedores=linhas(g('t_vend'),['nome','leads','vendas','ciclo']);
  d.decisoes=String(g('t_dec')).split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(/\t|;/).map(x=>x.trim());
    return {oque:p[0]||'',quem:p[1]||'',prazo:p[2]||'',ind:p[3]||''};}).filter(x=>x.oque).slice(0,3);
  d.mes=mesEdit; store[mesEdit]=d;
}
async function salvar(mes){
  try{ localStorage.setItem(LS,JSON.stringify(store)); }catch(e){}
  if(!db||!podeEscrever) return;
  try{ await db.doc('dados/'+mes).set(store[mes]); }
  catch(e){ if(e&&e.code==='invalid_argument') podeEscrever=false; render(); }
}

/* ═══════════════ ligações ═══════════════ */
document.getElementById('bProx').addEventListener('click',()=>vai(1));
document.getElementById('bAnt').addEventListener('click',()=>vai(-1));
document.getElementById('bDados').addEventListener('click',abrirPainel);
document.getElementById('bFechar').addEventListener('click',()=>{
  coletar(); document.getElementById('gaveta').hidden=true; render();});
document.getElementById('gaveta').addEventListener('click',e=>{
  if(e.target.id==='gaveta'){coletar(); e.target.hidden=true; render();}});
document.getElementById('bExemplo').addEventListener('click',()=>{exemplo=!exemplo;render();});
document.getElementById('bSairEx').addEventListener('click',()=>{exemplo=false;render();});
document.getElementById('bNotas').addEventListener('click',e=>{
  const n=document.getElementById('notas'); n.hidden=!n.hidden;
  e.currentTarget.classList.toggle('on',!n.hidden);});
document.getElementById('bFull').addEventListener('click',()=>{
  const el=document.documentElement;
  if(document.fullscreenElement) document.exitFullscreen();
  else if(el.requestFullscreen) el.requestFullscreen().then(escala).catch(()=>{});});
document.addEventListener('fullscreenchange',()=>setTimeout(escala,60));
window.addEventListener('resize',escala);
document.addEventListener('keydown',e=>{
  if(!document.getElementById('gaveta').hidden) return;
  if(e.target.matches('input,textarea,select')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') { e.preventDefault(); vai(1); }
  if(e.key==='ArrowLeft'||e.key==='PageUp') vai(-1);
  if(e.key==='f'||e.key==='F') document.getElementById('bFull').click();
});

try{ const b=localStorage.getItem(LS); if(b) store=JSON.parse(b)||{}; }catch(e){ store={}; }
document.getElementById('notas').hidden=true;
lerHash();
render();

(async()=>{
  try{ const u=await window.claude?.use?.('user');
    if(u&&typeof u.can==='function'){ const p=await u.can('data.write'); if(p===false) podeEscrever=false; }
  }catch(e){}
  let d=null; try{ d=await window.claude?.use?.('db'); }catch(e){}
  if(!d) return; db=d;
  try{ db.collection('dados').onSnapshot(s=>{
    s.docs.forEach(doc=>{ if(doc.exists) store[doc.id]=doc.data(); }); render();},()=>{}); }catch(e){}
  render();
})();
</script>
